<body>
<header><span class="logo" role="img" aria-label="شعار الأكاديمية"></span><div><h1 id="title">متابعة ولي الأمر</h1><div class="sub" id="sub"></div></div></header>
<main id="main"><div class="msg">جارٍ التحميل…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>/* مكتبة الاتصال بإصدار ثابت يعمل على المتصفحات القديمة؛ إن حُجب مصدرها تُحمَّل من مصدر احتياطي */ window.supabase || document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.80.0/dist/umd/supabase.js"><\/script>');</script>
<script>
(function () {
  'use strict';
  var main = document.getElementById('main'), sub = document.getElementById('sub');
  // الدخول: بالرابط الخاص (?t=…)، أو بحساب ولي الأمر (رقم الهوية وكلمة المرور) فيُحفظ رمز الجلسة على هذا الجهاز
  var token = new URLSearchParams(location.search).get('t') || '', viaLogin = false;
  if (!token) { try { token = localStorage.getItem('parent_token') || ''; viaLogin = !!token; } catch (e) {} }
  var more = null;
  var cfg = window.APP_CONFIG || {}, sb = window.supabase && cfg.SUPABASE_URL ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
  var WEEK = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  var ORD = ['الأولى', 'الثانية', 'الثالثة', 'الرابعة', 'الخامسة', 'السادسة', 'السابعة', 'الثامنة', 'التاسعة', 'العاشرة', 'الحادية عشرة', 'الثانية عشرة'];
  var data = null, cur = 0, allAbs = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function today() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dmy(iso) { iso = String(iso || '').slice(0, 10); return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : ''; }
  function dayName(iso) { return WEEK[new Date(iso + 'T00:00').getDay()]; }
  function monthLabel(m) { return new Date(m + '-01T00:00').toLocaleDateString('ar-u-nu-latn', { month: 'long', year: 'numeric' }); }
  // دورة المواصلات كما في البرنامج: «نوفمبر 2026 (15/11 – 14/12)»؛ وإن طابقت الشهر الميلادي فاسمه وحده
  function cycleLabel(m) {
    var from = String(m.from || ''), to = String(m.to || ''), dm = function (iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(from) || !/^\d{4}-\d{2}-\d{2}$/.test(to)) return monthLabel(m.month);
    var end = new Date(Number(m.month.slice(0, 4)), Number(m.month.slice(5, 7)), 0).getDate();
    if (from === m.month + '-01' && to === m.month + '-' + pad(end)) return monthLabel(m.month);
    return monthLabel(m.month) + ' (⁧' + dm(from) + ' – ' + dm(to) + '⁩)';
  }
  function money(x) { return (Math.round(Number(x) * 100) / 100).toLocaleString('en') + ' ج.م'; }
  // فترة زمنية تُقرأ من اليمين: البداية ثم النهاية
  function range(f, t) { return '⁧' + f + ' – ' + t + '⁩'; }

  // اسم المعلم كما في جداول البرنامج: الأول واسم العائلة، والمركّب يبقى كاملًا
  function nameParts(full) {
    var w = String(full || '').trim().split(/\s+/), out = [];
    for (var i = 0; i < w.length; i++) {
      if (/^(عبد|عبدال|أبو|ابو|أبي|ابي|بن|ابن|آل|ال)$/.test(w[i]) && i + 1 < w.length) { out.push(w[i] + ' ' + w[i + 1]); i++; }
      else out.push(w[i]);
    }
    return out;
  }
  function shortName(full) {
    var words = String(full || '').trim().split(/\s+/), n = words.length, last = words[n - 1];
    if (n <= 2) return String(full || '').trim();
    var fam = /^(الله|الدين|الرحمن|الرحيم)$/.test(last) || /^(أبو|ابو|آل|بن|ابن|بني)$/.test(words[n - 2]) ? words[n - 2] + ' ' + last : last;
    var short = (nameParts(full)[0] || '') + ' ' + fam;
    return short.split(' ').length >= n ? String(full).trim() : short;
  }

  // مواعيد الشعبة: مرحلتها، وإن لم تُضف إلى مرحلة فآخر مرحلة (كما في البرنامج)
  function stageOf(cls) {
    var s = (data.bells && Array.isArray(data.bells.stages)) ? data.bells.stages : [];
    for (var i = 0; i < s.length; i++) if ((s[i].classes || []).indexOf(cls) > -1) return s[i];
    return s[s.length - 1] || null;
  }

  // أيقونات عناوين البطاقات
  var IC = {
    abs: '<path d="M8 2v3M16 2v3M3.5 9h17"/><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M9.5 13.5l5 5M14.5 13.5l-5 5"/>',
    bus: '<rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 21v-4M16 21v-4"/><circle cx="8" cy="14" r=".6"/><circle cx="16" cy="14" r=".6"/>',
    gr: '<path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h3M9 16l2 2 4-4"/>',
    wa: '<path d="M4 20l1.3-3.9A8 8 0 1112 20a8 8 0 01-4.1-1.1z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5"/>',
    tt: '<rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9h17M9 9v11.5M15 9v11.5M8 2v3M16 2v3"/>'
  };
  function h2(icon, text) { return '<h2><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">' + IC[icon] + '</svg></span>' + text + '</h2>'; }

  function absHtml(k) {
    var month = today().slice(0, 7), list = k.absences || [];
    var inMonth = list.filter(function (d) { return d.slice(0, 7) === month; }).length;
    var shown = allAbs ? list : list.slice(0, 8);
    return '<div class="card">' + h2('abs', 'الغياب') +
      '<div class="nums"><div class="num' + (inMonth ? ' bad' : '') + '"><b>' + inMonth + '</b><span>أيام غياب هذا الشهر</span></div>' +
      '<div class="num' + (list.length ? ' bad' : '') + '"><b>' + list.length + '</b><span>منذ بداية العام الدراسي</span></div></div>' +
      (list.length
        ? '<ul class="plain">' + shown.map(function (d) { return '<li><span>' + dayName(d) + '</span><span>' + dmy(d) + '</span></li>'; }).join('') + '</ul>' +
          (list.length > 8 ? '<button type="button" class="more" data-allabs>' + (allAbs ? 'عرض أقل' : 'عرض كل الأيام (' + list.length + ')') + '</button>' : '')
        : '<p class="muted" style="margin:0">' + (k.recorded_days ? 'لا غياب مسجّل منذ بداية العام الدراسي.' : 'لم يُسجَّل حضور بعد هذا العام.') + '</p>') +
      '</div>';
  }

  function busHtml(k) {
    var months = k.months || [];
    if (!k.bus && !months.length) return '';
    return '<div class="card c-bus">' + h2('bus', 'المواصلات') +
      (k.bus ? '<p style="margin:0 0 10px">نقطة التجمع: <b>' + esc(k.bus) + '</b></p>' : '<p class="muted" style="margin:0 0 10px">غير مشترك في المواصلات حاليًا.</p>') +
      (months.length
        ? months.map(function (m) {
            var left = m.due != null && Number(m.due) > Number(m.paid) ? Number(m.due) - Number(m.paid) : 0;
            return '<div class="month"><div class="top"><span>' + esc(cycleLabel(m)) + '</span>' +
              (left ? '<span class="tag part">المتبقي ' + money(left) + '</span>' : '<span class="tag ok">مسدَّد ' + money(m.paid) + '</span>') + '</div>' +
              (m.receipts || []).map(function (r) {
                return '<div class="rc">إيصال رقم ' + esc(r.no) + ' · ' + money(r.amount) + ' · ' + dmy(r.on) + '</div>';
              }).join('') + '</div>';
          }).join('')
        : '<p class="muted" style="margin:0">لا إيصالات هذا العام الدراسي بعد.</p>') +
      '</div>';
  }

  function ttHtml(k) {
    var tt = k.timetable || [];
    if (!tt.length) return '<div class="card">' + h2('tt', 'جدول الحصص') + '<p class="muted" style="margin:0">لم يُنشر جدول شعبة ' + esc(k.class_name) + ' بعد.</p></div>';
    var st = stageOf(k.class_name), rows = st ? st.rows || [] : [];
    var days = Array.isArray(data.days) && data.days.length ? data.days : WEEK.slice(0, 5);
    // اليوم الدراسي المفتوح افتراضيًا: اليوم، وإلا أول يوم بعده
    var wd = new Date().getDay(), openIdx = -1;
    for (var s = 0; s < 7 && openIdx < 0; s++) { var w = (wd + s) % 7, i = days.indexOf(WEEK[w]); if (i > -1) openIdx = i; }
    return '<div class="card">' + h2('tt', 'جدول حصص شعبة ' + esc(k.class_name)) +
      days.map(function (dname, di) {
        var lessons = tt.filter(function (x) { return x.day === di; });
        if (!lessons.length) return '';
        var maxP = Math.max.apply(null, lessons.map(function (x) { return x.period; }));
        var body = '', p = 0;
        if (rows.length) {
          rows.forEach(function (r) {
            if (r.k === 'p') {
              p++;
              if (p > maxP) return;
              var ls = lessons.filter(function (x) { return x.period === p; });
              body += '<div class="lesson"><div class="p">الحصة ' + (ORD[p - 1] || p) + '<br>' + range(r.f, r.t) + '</div><div>' +
                (ls.length ? ls.map(function (x) { return '<div class="s">' + esc(x.subject || '—') + '</div>' + (x.teacher ? '<div class="t">' + esc(shortName(x.teacher)) + '</div>' : ''); }).join('') : '<div class="t">—</div>') + '</div></div>';
            } else if (p > 0 && p < maxP) {
              body += '<div class="lesson brk"><div>' + range(r.f, r.t) + '</div><div>' + esc(r.l || (r.k === 'a' ? 'الطابور' : 'الاستراحة')) + '</div></div>';
            }
          });
        } else {
          for (p = 1; p <= maxP; p++) {
            var ls = lessons.filter(function (x) { return x.period === p; });
            body += '<div class="lesson"><div class="p">الحصة ' + (ORD[p - 1] || p) + '</div><div>' +
              (ls.length ? ls.map(function (x) { return '<div class="s">' + esc(x.subject || '—') + '</div>' + (x.teacher ? '<div class="t">' + esc(shortName(x.teacher)) + '</div>' : ''); }).join('') : '<div class="t">—</div>') + '</div></div>';
          }
        }
        return '<details class="day' + (WEEK[wd] === dname ? ' today' : '') + '"' + (di === openIdx ? ' open' : '') + '><summary>' + esc(dname) + '</summary>' + body + '</details>';
      }).join('') + '</div>';
  }

  function gradesHtml(k) {
    var m = more && (more.kids || []).filter(function (x) { return x.name === k.name; })[0], g = m ? m.grades || [] : [];
    if (!more) return '';
    if (!g.length) return '<div class="card">' + h2('gr', 'الدرجات') + '<p class="muted" style="margin:0">لم تُرصد درجات بعد.</p></div>';
    var terms = [];
    g.forEach(function (x) { if (terms.indexOf(x.term) < 0) terms.push(x.term); });
    return '<div class="card">' + h2('gr', 'الدرجات') + terms.map(function (t) {
      var subs = [];
      g.forEach(function (x) { if (x.term === t && subs.indexOf(x.subject) < 0) subs.push(x.subject); });
      return '<h3 style="color:var(--navy);margin:10px 0 6px;font-size:1rem">' + esc(t) + '</h3>' + subs.map(function (s) {
        var rows = g.filter(function (x) { return x.term === t && x.subject === s; }), tot = 0, max = 0;
        rows.forEach(function (x) { tot += Number(x.score); max += Number(x.max); });
        return '<details class="day"><summary>' + esc(s) + ' — ' + (Math.round(tot * 100) / 100) + ' من ' + max + '</summary><table class="gr" style="margin:6px 12px;width:calc(100% - 24px)"><tbody>' +
          rows.map(function (x) { return '<tr><td>' + esc(x.item) + '</td><td style="text-align:left"><b>' + esc(x.score) + '</b> / ' + esc(x.max) + '</td></tr>'; }).join('') + '</tbody></table></details>';
      }).join('');
    }).join('') + '</div>';
  }
  function msgsHtml() {
    var list = more ? more.messages || [] : [];
    if (!more || !list.length) return '';
    return '<div class="card">' + h2('wa', 'الرسائل الواردة من الأكاديمية') + list.slice(0, allMsgs ? 100 : 5).map(function (m) {
      return '<div class="wa"><div class="when">' + dmy(m.at) + ' · ' + new Date(m.at).toLocaleTimeString('ar-u-nu-latn', { hour: '2-digit', minute: '2-digit' }) + (m.title ? ' · ' + esc(m.title) : '') + '</div><div class="body">' + esc(m.body) + '</div></div>';
    }).join('') + (list.length > 5 ? '<button type="button" class="more" data-allmsgs>' + (allMsgs ? 'عرض أقل' : 'عرض كل الرسائل (' + list.length + ')') + '</button>' : '') + '</div>';
  }
  var allMsgs = false;

  function loginHtml(err) {
    return '<form class="card login" id="login"><h2>دخول ولي الأمر</h2><p class="muted" style="margin:0">ادخل برقم هويتك وكلمة المرور التي أرسلتها لك الأكاديمية، لتتابع كل أبنائك.</p>' +
      '<label for="lg-id">رقم الهوية</label><input id="lg-id" inputmode="numeric" autocomplete="username" required>' +
      '<label for="lg-pw">كلمة المرور</label><input id="lg-pw" type="password" autocomplete="current-password" required>' +
      (err ? '<p class="err" style="margin:10px 0 0">' + esc(err) + '</p>' : '') +
      '<button type="submit" class="btnp">دخول</button></form>';
  }
  main.addEventListener('submit', async function (e) {
    if (e.target.id !== 'login') return;
    e.preventDefault();
    var b = e.target.querySelector('button'); b.disabled = true; b.textContent = 'جارٍ الدخول…';
    var r = await sb.rpc('parent_login', { p_id: document.getElementById('lg-id').value, p_pass: document.getElementById('lg-pw').value });
    var d = r.data || {};
    if (r.error || d.error || !d.token) { main.innerHTML = loginHtml(d.error || 'تعذّر الدخول. حاول مرة أخرى.'); return; }
    token = d.token; viaLogin = true;
    try { localStorage.setItem('parent_token', token); } catch (x) {}
    load();
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('[data-logout]')) return;
    try { localStorage.removeItem('parent_token'); } catch (x) {}
    location.href = location.pathname;
  });

  var view = 'home';
  var VIEWS = [['home', 'الرئيسية', 'home'], ['abs', 'الحضور والغياب', 'cal'], ['grades', 'الدرجات', 'bars'], ['tt', 'جدول الحصص', 'clock'], ['bus', 'المواصلات', 'bus2'], ['papers', 'أوراق العمل', 'doc'], ['msgs', 'الرسائل', 'chat']];
  var SV = {
    home: '<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
    cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/>',
    bars: '<path d="M4 20h16M7 20v-8M11 20V8M15 20v-5M19 20V11"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    bus2: '<rect x="5" y="3.5" width="14" height="14" rx="3"/><path d="M5 11h14M8 20.5v-3M16 20.5v-3M8.5 14.5h.01M15.5 14.5h.01"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    out: '<path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4M10 16l-4-4 4-4M6 12h10"/>',
    info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16h.01"/>',
    doc: '<path d="M7 3.5h7l4 4V20a.5.5 0 01-.5.5h-10A.5.5 0 016 20V4a.5.5 0 01.5-.5z"/><path d="M14 3.5V8h4M9 12h6M9 15.5h6"/>'
  };
  function sv(k) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + SV[k] + '</svg>'; }
  function initials(n) { var w = String(n || '').trim().split(/\s+/).map(function (x) { return x.replace(/^ال(?=..)/, ''); }); return (w[0] || '').charAt(0) + ' ' + (w.length > 1 ? w[w.length - 1].charAt(0) : ''); }
  function schoolYear() { var d = new Date(), y = d.getFullYear(); return d.getMonth() >= 8 ? y + ' / ' + (y + 1) : (y - 1) + ' / ' + y; }

  function todayHtml(k) {
    var tt = k.timetable || [], days = Array.isArray(data.days) && data.days.length ? data.days : WEEK.slice(0, 5);
    var di = days.indexOf(WEEK[new Date().getDay()]), lessons = di < 0 ? [] : tt.filter(function (x) { return x.day === di; }).sort(function (a, b) { return a.period - b.period; });
    var st = stageOf(k.class_name), rows = st ? st.rows || [] : [], body = '', p = 0;
    var maxP = lessons.length ? lessons[lessons.length - 1].period : 0;
    var lrow = function (n, label, time, sj, tc) { return '<div class="lrow"><span class="no">' + n + '</span><div class="pn"><b>' + label + '</b>' + (time ? '<small>' + time + '</small>' : '') + '</div><div class="sj">' + sj + '</div><div class="tc">' + tc + '</div></div>'; };
    var one = function (pp, t) { var ls = lessons.filter(function (x) { return x.period === pp; }); return lrow(pp, 'الحصة ' + (ORD[pp - 1] || pp), t ? range(t.f, t.t) : '', ls.map(function (x) { return esc(x.subject || '—'); }).join('، ') || '—', ls.map(function (x) { return x.teacher ? 'أ. ' + esc(shortName(x.teacher)) : ''; }).join('، ')); };
    if (lessons.length && rows.length) rows.forEach(function (r) {
      if (r.k === 'p') { p++; if (p <= maxP) body += one(p, r); }
      else if (p > 0 && p < maxP) body += '<div class="lrow brk"><span class="no"></span><div class="pn"><b>' + esc(r.l || (r.k === 'a' ? 'الطابور' : 'الاستراحة')) + '</b><small>' + range(r.f, r.t) + '</small></div><div class="tc" style="text-align:right">' + esc(r.l || 'الاستراحة') + '</div><div></div></div>';
    });
    else for (p = 1; p <= maxP; p++) body += one(p, null);
    return '<div class="card today"><div class="th"><span class="ic">' + sv('clock') + '</span><div><b>جدول اليوم' + (di > -1 ? ' — ' + esc(days[di]) : '') + '</b><small>' + (lessons.length ? lessons.length + ' حصص دراسية' : 'لا حصص اليوم') + '</small></div>' +
      '<a data-go="tt">عرض الجدول الأسبوعي ←</a></div>' + (body || '<p class="muted" style="margin:0;padding:18px 22px">لا حصص اليوم.</p>') + '</div>';
  }
  function statsHtml(k) {
    var month = today().slice(0, 7), abs = k.absences || [], inMonth = abs.filter(function (d) { return d.slice(0, 7) === month; }).length;
    var m = more && (more.kids || []).filter(function (x) { return x.name === k.name; })[0], g = m ? m.grades || [] : [], tot = 0, max = 0;
    g.forEach(function (x) { tot += Number(x.score); max += Number(x.max); });
    var mo = (k.months || [])[0], left = mo && mo.due != null ? Math.max(0, Number(mo.due) - Number(mo.paid)) : 0;
    var rate = k.recorded_days ? Math.round((1 - abs.length / k.recorded_days) * 100) : null;
    var card = function (cls, ic, v, l, s, go) { return '<div class="st ' + cls + '" data-go="' + go + '"><span class="ico">' + sv(ic) + '</span><span class="go">←</span><span class="l">' + l + '</span><span class="n">' + v + '</span><span class="s">' + s + '</span></div>'; };
    return '<div class="stats4">' +
      card(inMonth ? 'c-red' : 'c-green', 'cal', inMonth, 'الغياب هذا الشهر', 'منذ بداية العام: ' + abs.length, 'abs') +
      card(rate != null && rate < 90 ? 'c-red' : 'c-green', 'check', rate == null ? '—' : rate + '%', 'نسبة الحضور', 'من ' + (k.recorded_days || 0) + ' يومًا مسجّلًا', 'abs') +
      card('c-gold', 'bars', max ? Math.round(tot / max * 100) + '%' : '—', 'الدرجات', max ? 'المجموع ' + (Math.round(tot * 100) / 100) + ' من ' + max : 'لم تُرصد درجات بعد', 'grades') +
      card(left ? 'c-red' : 'c-bus c-green', 'bus2', k.bus ? (left ? money(left) : 'مسدَّد') : '—', 'المواصلات', k.bus ? (mo ? cycleLabel(mo) : 'لا إيصالات بعد') : 'غير مشترك', 'bus') + '</div>';
  }

  // أوراق العمل المعتمدة لصف الطالب، مصنَّفة حسب الفصل الدراسي (supabase/paper_files.sql)
  var papers = null;
  function papersOf(k) { return (papers || []).filter(function (p) { return p.grade && String(k.class_name || '').indexOf(p.grade) > -1; }); }
  function papersHtml(k) {
    var list = papersOf(k), terms = {};
    if (!list.length) return '<div class="card"><p class="muted" style="margin:0">لا أوراق عمل منشورة لصف ' + esc(k.class_name || '') + ' بعد.</p></div>';
    list.forEach(function (p) { var t = p.term || 'أوراق العمل'; (terms[t] = terms[t] || []).push(p); });
    return Object.keys(terms).sort().map(function (t) {
      return '<div class="card"><h3 style="margin:0 0 10px">' + esc(t) + '</h3>' + terms[t].map(function (p) {
        return '<div class="lrow" style="cursor:pointer" data-paper="' + esc(p.id) + '"><span class="no">' + sv('doc') + '</span><div class="pn"><b>' + esc(p.subject || 'ورقة عمل') + '</b>' +
          '<small>' + esc(p.teacher || '') + ' · ' + new Date(p.at).toLocaleDateString('ar-u-nu-latn', { day: 'numeric', month: 'long' }) + '</small></div><div class="sj">فتح ←</div></div>';
      }).join('') + '</div>';
    }).join('');
  }
  async function openPaper(id) {
    var r = await sb.rpc('parent_paper_file', { p_token: token, p_id: id });
    if (r.error || !r.data || r.data.error) { alert('تعذر فتح الملف. حاول مرة أخرى.'); return; }
    var bin = atob(r.data.data), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: r.data.mime || 'application/octet-stream' })), a = document.createElement('a');
    a.href = url; a.download = r.data.name || 'ورقة عمل'; if (/pdf/.test(r.data.mime)) a.target = '_blank';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }

  function draw() {
    var kids = data.children || [];
    if (!kids.length) { main.innerHTML = '<div class="msg">لا يوجد أبناء مسجلون مرتبطون بهذا الحساب حاليًا.</div>'; return; }
    var k = kids[cur] || kids[0], first = String(k.name).split(/\s+/)[0];
    var nav = VIEWS.filter(function (v) { return (v[0] !== 'msgs' || (more && (more.messages || []).length)) && (v[0] !== 'papers' || papersOf(k).length); }).map(function (v) {
      return '<a data-go="' + v[0] + '"' + (view === v[0] ? ' class="on"' : '') + '>' + sv(v[2]) + v[1] + '</a>';
    }).join('');
    var title = { papers: 'أوراق العمل', abs: 'الحضور والغياب', grades: 'الدرجات', tt: 'جدول الحصص', bus: 'المواصلات', msgs: 'الرسائل' }[view];
    var body = view === 'abs' ? absHtml(k) : view === 'grades' ? (gradesHtml(k) || '<div class="card"><p class="muted" style="margin:0">الدرجات غير متاحة بعد.</p></div>')
      : view === 'tt' ? ttHtml(k) : view === 'bus' ? (busHtml(k) || '<div class="card"><p class="muted" style="margin:0">غير مشترك في المواصلات.</p></div>')
      : view === 'msgs' ? msgsHtml() : view === 'papers' ? papersHtml(k) : statsHtml(k) + todayHtml(k);
    var now = new Date(), dateTxt = now.toLocaleDateString('ar-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' });
    main.innerHTML = '<div class="layout"><aside class="side"><h3>' + (kids.length > 1 ? 'الأبناء' : 'الابن/الابنة') + '</h3>' +
        kids.map(function (x, i) {
          return '<button type="button" class="kidrow' + (i === cur ? ' on' : '') + '" data-kid="' + i + '" aria-pressed="' + (i === cur) + '"><span class="av">' + esc(initials(x.name)) + '</span><span class="nm"><b>' + esc(x.name.split(/\s+/).slice(0, 4).join(' ')) + '</b><small>' + esc(x.class_name || '—') + '</small></span><span class="chev">' + (i === cur ? '⌄' : '‹') + '</span></button>' +
            (i === cur ? '<nav>' + nav + '</nav>' : '');
        }).join('') + '<div class="help">تحتاج إلى مساعدة؟<b>تواصل مع إدارة الأكاديمية</b></div></aside><div>' +
      '<div class="banner"><span class="av">' + esc(initials(k.name)) + '</span><div class="who"><small>بيانات الطالب</small><b>' + esc(k.name) + '</b><span>الشعبة: ' + esc(k.class_name || '—') + '</span></div>' +
        '<div class="yr">العام الدراسي<b>' + schoolYear() + '</b></div></div>' +
      (view === 'home' ? '<div class="hello"><div><h2>مرحبًا بك</h2><p>إليك ملخص متابعة ' + esc(first) + ' خلال هذا الشهر</p></div><span class="chip">' + esc(dateTxt) + '</span></div>'
        : '<div class="hello"><div><h2>' + title + '</h2></div><a class="chip" data-go="home" style="cursor:pointer">→ الرئيسية</a></div>') +
      body + '<div class="note">' + sv('info').replace('<svg', '<svg style="width:18px;height:18px;fill:none;stroke:var(--gold-dark);stroke-width:1.8"') + 'البيانات كما سجّلتها الأكاديمية. لأي استفسار تواصل مع إدارة الأكاديمية.</div></div></div>';
  }

  main.addEventListener('click', function (e) {
    var b = e.target.closest('[data-kid]');
    if (b) { cur = +b.getAttribute('data-kid'); allAbs = false; view = 'home'; draw(); window.scrollTo(0, 0); return; }
    var g = e.target.closest('[data-go]');
    if (g) { view = g.getAttribute('data-go'); draw(); window.scrollTo(0, 0); return; }
    if (e.target.closest('[data-allabs]')) { allAbs = !allAbs; draw(); }
    if (e.target.closest('[data-allmsgs]')) { allMsgs = !allMsgs; draw(); }
    var pp = e.target.closest('[data-paper]');
    if (pp) openPaper(pp.getAttribute('data-paper'));
  });

  async function load() {
    if (!sb) { main.innerHTML = '<div class="msg err">لم يُضبط الاتصال بقاعدة البيانات.</div>'; return; }
    if (!/^[0-9a-f]{64}$/.test(token)) { main.innerHTML = loginHtml(); return; }
    var r = await sb.rpc('parent_view', { p_token: token });
    if (viaLogin && r.data && r.data.error) { try { localStorage.removeItem('parent_token'); } catch (x) {} main.innerHTML = loginHtml('انتهت الجلسة أو أُوقف الحساب. ادخل مرة أخرى.'); return; }
    if (r.error) { main.innerHTML = '<div class="msg err">تعذر جلب البيانات. حاول مرة أخرى بعد قليل.</div>'; return; }
    if (r.data && r.data.error) { main.innerHTML = '<div class="msg err">' + esc(r.data.error) + '</div>'; return; }
    data = r.data;
    var mo = await sb.rpc('parent_more', { p_token: token });
    more = mo.error || (mo.data && mo.data.error) ? null : mo.data; // قبل تشغيل parent_accounts.sql تبقى الشاشة كما كانت
    var pr = await sb.rpc('parent_papers', { p_token: token });
    papers = pr.error || !pr.data || pr.data.error ? [] : pr.data.papers || []; // قبل تشغيل paper_files.sql لا يظهر تبويب أوراق العمل
    if (viaLogin && !document.querySelector('[data-logout]')) document.querySelector('header').insertAdjacentHTML('beforeend', '<button type="button" class="out" data-logout><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg>خروج</button>');
    document.getElementById('title').textContent = data.school || 'متابعة ولي الأمر';
    document.title = 'متابعة ولي الأمر — ' + (data.school || '');
    sub.textContent = 'متابعة ولي الأمر · ' + new Date().toLocaleDateString('ar-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    draw();
  }
  load();
})();
</script>
</body>
</html>
