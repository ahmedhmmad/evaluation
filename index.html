<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية الركيزة الثالثة</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Montserrat:wght@600;700&display=swap">
<style id="page-css"></style>
<style id="app-css">
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1c2733;
    --muted: #64748b;
    --line: #e2e8f0;
    --primary: #0f766e;
    --primary-dark: #0b5a54;
    --primary-soft: #e6f4f2;
    --amber: #b45309;
    --amber-soft: #fef3c7;
    --blue: #1d4ed8;
    --blue-soft: #dbeafe;
    --green: #15803d;
    --green-soft: #dcfce7;
    --red: #b91c1c;
    --red-soft: #fee2e2;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  /* الهيكل: قائمة جانبية (يمين الصفحة) ومحتوى */
  #shell { display: flex; min-height: 100vh; }
  #side {
    width: 250px; flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; background: #0b3b37; color: #fff;
  }
  #side .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px; }
  #side .brand .logo { width: 46px; height: 46px; flex: none; border-radius: 50%; background: #fff; object-fit: cover; }
  #side .brand strong { display: block; font-size: 1.05rem; line-height: 1.3; }
  #side .brand small { opacity: .7; font-size: .8rem; }
  #side-nav { flex: 1; padding: 4px 10px 12px; }
  #side-nav h3 { margin: 16px 12px 4px; font-size: .75rem; font-weight: 700; opacity: .55; }
  #side-nav a {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 2px; border-radius: 8px;
    color: #dcefec; text-decoration: none; font-weight: 600;
  }
  #side-nav a:hover { background: rgba(255,255,255,.09); color: #fff; }
  #side-nav a.on { background: #fff; color: var(--primary-dark); }
  #side-nav a:focus-visible, .side-user .btn:focus-visible, #menu-btn:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  #side-nav svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .side-user { padding: 12px 16px 16px; border-top: 1px solid rgba(255,255,255,.14); font-size: .9rem; }
  .side-user .who { font-weight: 700; overflow-wrap: anywhere; }
  .side-user .role { opacity: .7; font-size: .8rem; margin-bottom: 8px; }
  .side-user .btn { width: 100%; background: transparent; color: #fff; border-color: rgba(255,255,255,.4); padding: 6px 12px; }
  .side-user .btn:hover { background: rgba(255,255,255,.12); }
  #content { flex: 1; min-width: 0; }
  .topbar { display: none; align-items: center; gap: 12px; background: var(--primary); color: #fff; padding: 10px 14px; position: sticky; top: 0; z-index: 10; }
  #menu-btn { background: none; border: 0; color: #fff; font-size: 1.6rem; line-height: 1; padding: 2px 8px; cursor: pointer; border-radius: 6px; }
  #scrim { display: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 24px 60px; }
  /* بدون قائمة: قبل الدخول وأثناء انتظار التفعيل */
  #shell.bare #side, #shell.bare #menu-btn { display: none; }
  #shell.bare .topbar { display: flex; justify-content: center; padding: 16px; font-size: 1.15rem; position: static; }

  .page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-head h1 { margin: 0; font-size: 1.45rem; }
  .page-head p { margin: 2px 0 0; color: var(--muted); }

  /* الرئيسية */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stats .card + .card { margin-top: 0; }
  .stat { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, box-shadow .15s; }
  .stat:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .stat .lbl { font-weight: 700; }
  .stat .num { font-size: 2rem; font-weight: 800; color: var(--primary); line-height: 1.2; }
  .stat .sub { color: var(--muted); font-size: .85rem; }
  .stat .num small { font-size: .5em; font-weight: 700; }
  .method-strip { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: -6px 0 16px; font-size: .92rem; }
  .method-strip > b { color: var(--muted); font-weight: 700; }
  .method-strip span { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .method-strip span b { color: var(--primary); }
  .method-strip span.zero { color: var(--muted); }
  .method-strip span.zero b { color: inherit; font-weight: 600; }
  #t-members .method-strip { margin: 12px 0 0; }
  div.stat:hover { border-color: var(--line); box-shadow: none; }
  .quick { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { text-decoration: none; display: inline-block; }
  a.btn:not(.primary):not(.link) { color: var(--ink); }
  .todo a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .todo a:last-child { border-bottom: 0; }
  .todo a:hover { color: var(--primary); }
  .todo .n { font-weight: 800; color: var(--amber); }

  @media (max-width: 900px) {
    .topbar { display: flex; }
    #side { position: fixed; top: 0; bottom: 0; right: 0; width: 270px; z-index: 30; transform: translateX(100%); transition: transform .2s; }
    #shell.open #side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
    #shell.open #scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
    main { padding: 16px 14px 60px; }
    .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat .num { font-size: 1.6rem; }
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { background: #f8fafc; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--red); border-color: #fecaca; }
  .btn.danger:hover { background: var(--red-soft); }
  .btn.link { border: 0; background: none; color: var(--primary); padding: 4px 0; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card + .card { margin-top: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .card .hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }
  input[type=text], input[type=search], input[type=email], input[type=password], textarea, select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    background: #fff;
    width: 100%;
  }
  select { width: auto; }
  textarea { min-height: 90px; resize: vertical; }
  label.field { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
  label.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
  label.check input { width: 18px; height: 18px; accent-color: var(--primary); }

  /* Auth */
  .auth { max-width: 420px; margin: 24px auto; }
  .auth .f { margin-bottom: 12px; }
  .auth .btn.primary { width: 100%; }
  .auth .switch { text-align: center; margin-top: 12px; }

  /* Teacher list */
  .teachers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .teachers .card + .card { margin-top: 0; }
  .teacher {
    text-align: start;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  .teacher:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .teacher .name { font-weight: 700; font-size: 1.05rem; }
  .teacher .subject { color: var(--muted); font-size: .9rem; }
  .teacher .foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .teacher .score { font-weight: 700; color: var(--primary); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 700;
  }
  .badge.new, .badge.pending { background: #eef2f6; color: var(--muted); }
  .badge.edit { background: var(--amber-soft); color: var(--amber); }
  .badge.review { background: var(--blue-soft); color: var(--blue); }
  .badge.approved { background: var(--primary-soft); color: var(--primary); }
  .badge.published { background: var(--green-soft); color: var(--green); }


  /* Evaluation view */
  .eval-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .eval-head h2 { margin: 0; font-size: 1.3rem; }
  .eval-head .sub { color: var(--muted); }

  .stepper { display: flex; list-style: none; padding: 0; margin: 0 0 16px; gap: 8px; }
  .stepper li {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .stepper .num {
    width: 30px; height: 30px; flex: none;
    border-radius: 50%;
    background: #eef2f6;
    display: grid; place-items: center;
    font-weight: 700;
  }
  .stepper .t { font-weight: 700; }
  .stepper .d { font-size: .8rem; }
  .stepper li.current { border-color: var(--primary); color: var(--ink); background: var(--primary-soft); }
  .stepper li.current .num { background: var(--primary); color: #fff; }
  .stepper li.done { color: var(--ink); }
  .stepper li.done .num { background: var(--green); color: #fff; }

  .progress-row { display: flex; justify-content: space-between; gap: 12px; }
  .save-state { color: var(--muted); font-size: .85rem; }
  .progress { height: 8px; background: #eef2f6; border-radius: 999px; overflow: hidden; margin: 6px 0 14px; }
  .progress > div { height: 100%; background: var(--primary); transition: width .2s; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .85rem; margin-bottom: 8px; }

  table.criteria, table.grid { width: 100%; border-collapse: collapse; }
  table.criteria th, table.criteria td, table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 10px 8px; vertical-align: middle; }
  table.criteria th, table.grid th { text-align: start; font-size: .85rem; color: var(--muted); background: #f8fafc; }
  table.criteria td.n { width: 36px; color: var(--muted); text-align: center; }
  table.criteria td.r { width: 1%; white-space: nowrap; }
  table.criteria tr.missing td { background: #fff7ed; }

  .rate { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rate label { position: relative; cursor: pointer; }
  .rate input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .rate span {
    display: grid; place-items: center;
    width: 38px; height: 36px;
    font-weight: 700;
    border-inline-start: 1px solid var(--line);
    background: #fff;
  }
  .rate label:first-child span { border-inline-start: 0; }
  .rate label:hover span { background: var(--primary-soft); }
  .rate input:checked + span { background: var(--primary); color: #fff; }
  .rate input:focus-visible + span { outline: 2px solid var(--primary-dark); outline-offset: -2px; }

  .pill { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 6px; font-weight: 700; background: var(--primary-soft); color: var(--primary); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .summary .box { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .summary .k { color: var(--muted); font-size: .85rem; }
  .summary .v { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

  .notes-block { margin-top: 16px; }
  .notes-block h3 { font-size: 1rem; margin: 0 0 6px; }
  .notes-block p { margin: 0; white-space: pre-wrap; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start; margin-top: 20px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--red-soft); color: var(--red); font-weight: 600; }
  .info { padding: 10px 12px; border-radius: 8px; background: var(--green-soft); color: var(--green); font-weight: 600; margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; }

  #toast {
    position: fixed; bottom: 20px; inset-inline: 16px; margin: 0 auto; max-width: 480px;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }

  /* Visit report */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .grid2 .day { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  input[type=date], input[type=number] { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: #fff; width: 100%; }
  .grid2 select { width: 100%; }
  .domain { border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; margin-top: 16px; background: #fff; }
  .domain h3 { margin: 0; font-size: 1rem; padding: 10px 14px; background: var(--primary-soft); border-bottom: 1px solid #cbd5e1; }
  .domain .body { padding: 12px 14px 14px; }
  .classes-pick { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .domain h3 .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; margin-inline-end: 6px; }
  details.bank { margin-top: 8px; }
  details.bank summary { cursor: pointer; color: var(--primary); font-weight: 700; font-size: .9rem; padding: 4px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; font-size: .9rem; text-align: start;
  }
  .chip:hover { border-color: var(--primary); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip-wrap { display: inline-flex; align-items: center; gap: 2px; }
  .chip-del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px 6px; }
  .chip-del:hover { color: var(--red); }
  .addstmt { display: flex; gap: 8px; margin-top: 10px; }
  .addstmt input { flex: 1; min-width: 0; }
  .visit-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: start; width: 100%; cursor: pointer; }
  .visit-row:hover { border-color: var(--primary); }
  .visit-row .name { font-weight: 700; }
  .visit-row .meta { color: var(--muted); font-size: .9rem; }
  .print-only { display: none; }



  /* ===== هوية التقارير المطبوعة (قالب مركزي واحد): عدّل القيم هنا فتتغير كل التقارير ===== */
  #print-sheet, .page-lh {
    --navy: #1B3A6B; --navy-dark: #0F2647; --navy-soft: #E3E9F2;
    --gold: #C5A46D; --gold-soft: #F3EBDD; --ivory: #FBF9F5;
    --body: #2B2B2B; --rule: #D9D9D9;
    --ok: #2E7D4F; --bad: #B23A3A; --warn: #C27C2C;
    --font-head: "Cairo", "Tajawal", "Segoe UI", Tahoma, sans-serif;
    --font-body: "IBM Plex Sans Arabic", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
    --font-en: "Montserrat", "Poppins", "Segoe UI", Arial, sans-serif;
    /* هوامش الصفحة التي تحملها الورقة عند الطباعة (صفر على الشاشة)؛ بها تمتد الترويسة إلى حافة الصفحة */
    --pad-x: 0mm; --pad-y: 0mm;
  }
  /* الورقة: عرض A4 ناقص هامشين 15mm. الأحجام بوحدة em ليُصغَّر الخط عند الحاجة فتبقى في صفحة واحدة */
  #print-sheet {
    position: fixed; top: 0; left: 0; visibility: hidden; pointer-events: none; z-index: -1;
    width: 180mm; background: #fff; color: var(--body); direction: rtl;
    font-family: var(--font-body); font-size: 10.5pt; line-height: 1.45;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  #print-sheet * { box-sizing: border-box; }
  /* العلامة المائية: الشعار في منتصف كل صفحة بشفافية خفيفة */
  #print-sheet .wm { position: fixed; top: 50%; left: 50%; width: 115mm; height: auto; transform: translate(-50%, -50%); opacity: .055; z-index: 2; }

  /* الترويسة */
  /* الصورة العريضة تمتد على عرض الورقة كله (تتجاوز هوامشها) وتحتها سطر باسم الأكاديمية والعام الدراسي */
  #print-sheet .rh, .page-lh .rh { margin-bottom: .8em; direction: rtl; }
  #print-sheet .rh-banner, .page-lh .rh-banner {
    display: block; max-width: none; height: auto; aspect-ratio: auto 1600 / 330;
    width: calc(100% + 2 * var(--pad-x)); margin: calc(-1 * var(--pad-y)) calc(-1 * var(--pad-x)) 0;
  }
  /* في الكشوف متعددة الصفحات تبقى الصورة داخل هوامش الصفحة لأنها تتكرر مع رأس الجدول */
  #print-sheet.ls .rh-banner { width: 100%; margin: 0; }
  #print-sheet .rh-line, .page-lh .rh-line {
    display: flex; justify-content: space-between; gap: 1em; padding: .35em 0 .3em;
    border-bottom: 1pt solid var(--gold); font-size: .9em; color: var(--navy);
  }
  #print-sheet .rh-line b, .page-lh .rh-line b { font-family: var(--font-head); color: var(--navy-dark); }

  /* كتلة عنوان التقرير وشريط معلوماته */
  #print-sheet .rt { text-align: center; margin-bottom: .9em; }
  #print-sheet .rt h1 { margin: 0 0 .25em; font-family: var(--font-head); font-size: 1.8em; font-weight: 800; color: var(--navy); line-height: 1.3; }
  #print-sheet .rt-lead { display: inline-block; margin: 0 0 .35em; padding: .05em 1.2em .15em; border-bottom: 2pt solid var(--gold); font-family: var(--font-head); font-size: 1.75em; font-weight: 800; color: var(--navy-dark); line-height: 1.35; }
  #print-sheet .rt-info { display: flex; flex-wrap: wrap; justify-content: center; gap: .15em 1.6em; padding: .35em 1em; background: var(--gold-soft); border-radius: .4em; font-size: .95em; }
  #print-sheet .rt-info b { color: var(--navy); font-weight: 600; }
  #print-sheet .rsec { margin: .9em 0 .45em; padding-inline-start: .6em; border-inline-start: 3pt solid var(--gold); font-family: var(--font-head); font-size: 1.28em; font-weight: 700; color: var(--navy); line-height: 1.3; }

  /* الجداول */
  #print-sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: .92em; }
  #print-sheet th, #print-sheet td { border: .5pt solid var(--rule); padding: .32em .55em; vertical-align: middle; text-align: start; overflow-wrap: anywhere; }
  #print-sheet thead { display: table-header-group; }
  #print-sheet thead th { background: var(--navy); color: #fff; font-weight: 700; text-align: center; }
  #print-sheet tr { break-inside: avoid; }
  #print-sheet td.c { text-align: center; }
  #print-sheet table.rz tbody tr:nth-child(even) td { background: var(--gold-soft); }
  #print-sheet tr.total td, #print-sheet table.rz tbody tr.total td { background: var(--navy-soft); font-weight: 700; }
  /* جدول بيانات (عنوان: قيمة) */
  #print-sheet table.rk th { background: var(--gold-soft); color: var(--navy-dark); font-weight: 600; width: 19%; }
  #print-sheet .pre { white-space: pre-wrap; }
  #print-sheet .rbox { margin-top: .7em; padding: .45em .7em; border: .5pt solid var(--rule); border-radius: .4em; break-inside: avoid; }

  #print-sheet.rc { font-size: 10pt; line-height: 1.35; padding-bottom: 6mm; }

  #print-sheet .rc-2 .rh-banner { margin-top: 0; }

  #print-sheet .rv-tag { position: absolute; z-index: 3; top: 5mm; inset-inline-start: 0; padding: .05em 1.3em .15em; border: 1pt solid var(--gold); border-radius: .4em; background: #fff; font-family: var(--font-head); font-size: 1.15em; font-weight: 800; color: var(--navy); }

  #print-sheet .rv-line .k { flex: none; color: var(--navy); font-weight: 600; }
  #print-sheet .rv-line .v { flex: 1; min-height: 1.35em; padding: 0 .5em; border-bottom: .75pt dotted #666; font-weight: 600; color: #000; }

  /* شريط الحساب: اشتراك الشهر، المدفوع، المتبقي */
  #print-sheet .rv-sum { display: grid; grid-template-columns: repeat(3, 1fr); flex: 1; border: .75pt solid var(--navy); border-radius: .4em; overflow: hidden; }
  #print-sheet .rv-end { display: flex; align-items: center; gap: 1.2em; margin-top: .7em; }

  #print-sheet .rv-stamp { flex: none; width: 5em; height: 5em; display: grid; place-items: center; border: .75pt dashed var(--gold); border-radius: 50%; color: #999; font-size: .9em; }
  /* كشوف الطلاب */

  .simset { border-top: 1px solid var(--line); padding: 10px 0; }

  @media print {

</style>

  async function loadAll() {
    S.ready = false;
    render();
    var p = await sb.from('profiles').select('*').eq('id', S.uid).maybeSingle();

    S.profile = p.data || null;
    S.teachers = []; S.users = []; S.settings = null; S.results = null;
    S.visits = []; S.statements = []; S.visitsMissing = false; S.defaultPw = ''; S.accountsMissing = false;
    S.students = []; S.studentsMissing = false; S.regMissing = false;
    S.tGroups = []; S.tMembers = []; S.tPay = {}; S.transportMissing = false;

    if (isStaff()) {
      var res = await Promise.all([
        sb.from('teachers').select('*').order('name'),
        sb.from('settings').select('*').eq('id', 1).maybeSingle(),
        isAdmin() ? sb.from('profiles').select('*').order('created_at') : Promise.resolve({ data: [] })
      ]);
      if (res[0].error) fail(res[0].error);
      S.teachers = res[0].data || [];
      S.settings = res[1].data || null;
      S.users = res[2].data || [];

      var vis = await Promise.all([
        sb.from('visits').select('*').order('visit_date', { ascending: false }),
        sb.from('statements').select('*').order('created_at')
      ]);
      // الجدولان غير موجودين إلى أن يُشغَّل الملف supabase/visits.sql
      if (isAdmin()) {
        // غير موجود إلى أن يُشغَّل الملف supabase/teacher_accounts.sql
        var ps = await sb.from('private_settings').select('*').eq('id', 1).maybeSingle();
        S.accountsMissing = !!ps.error;
        S.defaultPw = (ps.data && ps.data.default_password) || '';
        await loadStudents();
        await loadTransport();
      }
      S.visitsMissing = !!(vis[0].error || vis[1].error);
      S.visits = vis[0].data || [];
      S.statements = vis[1].data || [];
    } else if (isRegistrar()) {
      var cfg = await sb.from('settings').select('*').eq('id', 1).maybeSingle();
      S.settings = cfg.data || null;
      await loadStudents();
      await loadTransport();
    }
    S.ready = true;
    render();
  }

  // قاعدة البيانات تعيد ألف صف كحد أقصى في الطلب الواحد، فتُجلب الجداول الكبيرة على دفعات.
  // make: دالة تبني الاستعلام من جديد لكل دفعة. تعيد null عند الخطأ (الجدول غير موجود بعد)
  async function fetchAll(make) {
    var all = [], page = 1000;
    for (var from = 0; ; from += page) {
      var r = await make().range(from, from + page - 1);
      if (r.error) return null;
      all = all.concat(r.data || []);
      if (!r.data || r.data.length < page) return all;
    }
  }

  async function loadStudents() {
    // الجدول غير موجود إلى أن يُشغَّل الملف supabase/students.sql
    var all = await fetchAll(function () { return sb.from('students').select('*').order('full_name'); });
    S.studentsMissing = !all;
    S.students = all || [];
    // أعمدة التسجيل على مرحلتين غير موجودة إلى أن يُشغَّل الملف supabase/student_registration.sql
    S.regMissing = !!all && !!(await sb.from('students').select('status, details').limit(1)).error;
    // عمود «يحتاج مواصلات» أُضيف لاحقًا إلى الملف نفسه
    S.wantsMissing = !!all && !!(await sb.from('students').select('wants_transport').limit(1)).error;
  }

  async function loadTransport() {
    // الجداول غير موجودة إلى أن يُشغَّل الملف supabase/transport.sql
    var g = await sb.from('transport_groups').select('*').order('assembly_point');
    var m = g.error ? null : await fetchAll(function () { return sb.from('transport_members').select('*').order('joined_at'); });
    S.transportMissing = !m;
    // عمود التسميات البديلة أُضيف لاحقًا إلى supabase/transport.sql
    S.aliasMissing = !!m && !!(await sb.from('transport_groups').select('aliases').limit(1)).error;
    S.tGroups = g.data || [];
    S.tMembers = m || [];
    S.tPay = {};
    // أرشيف الإيصالات المحذوفة: جدوله يأتي من supabase/receipt_archive.sql، ويُجلب عند فتح شاشته
    S.archiveMissing = !!m && !!(await sb.from('transport_voided').select('id').limit(1)).error;
    // عمود إيقاف الاشتراك يأتي من supabase/transport_unsubscribe.sql
    S.leaveMissing = !!m && !!(await sb.from('transport_members').select('left_from').limit(1)).error;
    S.tVoided = null;
  }

  var loadingPay = {};
  async function loadPayments(month) {
    if (loadingPay[month]) return;
    loadingPay[month] = true;
    var rows = await fetchAll(function () { return sb.from('transport_payments').select('*').eq('month', month).order('student_id'); });
    loadingPay[month] = false;
    var map = {};
    (rows || []).forEach(function (p) { p.amount = Number(p.amount) || 0; map[p.student_id] = p; });
    S.tPay[month] = map;
    render();
  }

  async function saveNow(t) {

      notes: t.notes,
      approver_notes: t.approver_notes,
      approved_at: t.approved_at,
      published_at: t.published_at
    }).eq('id', t.id);
    if (r.error) { setSaveState('لم يتم الحفظ'); fail(r.error); return false; }
    setSaveState('تم الحفظ');
    return true;
  }

  function queueSave(t) {
    clearTimeout(saveTimer);
    dirty = t;
    setSaveState('جارٍ الحفظ…');
    saveTimer = setTimeout(function () { saveTimer = null; saveNow(t); }, 600);
  }

  function flush() {
    var a = true, b = true;

  // الصفحة الحالية كما يدل عليها العنوان (صفحات التفاصيل تتبع قائمتها)
  function activeKey() {
    var h = location.hash;
    if (isRegistrar()) return /^#\/classes/.test(h) ? 'classes' : 'students';
    if (!isStaff()) return 'results';
    if (h === '#/teachers' || /^#\/t\//.test(h)) return 'teachers';
    if (h === '#/visits' || /^#\/v\//.test(h)) return 'visits';
    if (h === '#/results' || /^#\/r\//.test(h)) return 'results';
    if (/^#\/transport/.test(h)) return 'transport';
    if (/^#\/classes/.test(h) && isAdmin()) return 'classes';
    var m = h.match(/^#\/(staff|students|admin|rooms)$/);
    return m && isAdmin() ? m[1] : 'home';
  }

  async function saveTeacherForm() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
    var t = ui.editTeacher !== 'new' ? find(ui.editTeacher) : null;
    var data = {
      name: g('tf-name'), subject: splitList(g('tf-subject')).join('، '), phone: g('tf-phone'),
      classes: Array.prototype.map.call(document.querySelectorAll('[name="tf-class"]:checked'), function (c) { return c.value; }).join('، '),
      qualification: g('tf-qualification'), hire_date: g('tf-hire') || null, details: g('tf-details')
    };
    var login = g('tf-login');
    if (login) {
      if (login.indexOf('@') < 0 && !/^[a-z0-9._-]{3,}$/i.test(login)) {
        return toast('اسم المستخدم: ثلاثة أحرف إنجليزية أو أرقام على الأقل، بدون مسافات.', true);
      }
      if (S.defaultPw.length < 6) return toast('احفظ كلمة المرور الافتراضية أولًا (6 أحرف على الأقل).', true);
    }

    if (t) {
      var up = await sb.from('teachers').update(data).eq('id', t.id);
      if (up.error) return fail(up.error);
      Object.assign(t, data);
    } else {
      var ins = await sb.from('teachers').insert(data).select().single();
      if (ins.error) return fail(ins.error);
      t = ins.data;
      t.ratings = t.ratings || {};
      S.teachers.push(t);
      S.teachers.sort(function (a, b) { return a.name.localeCompare(b.name, 'ar'); });
    }

    if (login && !t.user_id) {
      var acc = await sb.rpc('create_teacher_account', { p_teacher: t.id, p_login: toEmail(login), p_password: S.defaultPw });
      if (acc.error) {
        // بيانات المعلم حُفظت، والحساب لم يُنشأ: يبقى النموذج مفتوحًا لتصحيح اسم المستخدم
        ui.editTeacher = t.id;
        render();
        return fail(acc.error);
      }
      t.user_id = acc.data;
      t.login = toEmail(login);
      // ليظهر الحساب الجديد في قائمة المستخدمين
      var us = await sb.from('profiles').select('*').order('created_at');
      if (!us.error) S.users = us.data || [];
    }
    ui.editTeacher = null;
    render();
    toast('تم الحفظ');
  }

  function stVal(st, k) {

    for (var i = 0; i < ST_FIELDS.length; i++) if (ST_FIELDS[i].k === k) f = ST_FIELDS[i];
    if (!st) return null;

  // رقم المجاورة كان حقلًا مستقلًا ثم أُلغي: من سُجّل له رقم يُضم إلى أول عنوانه التفصيلي
  // (يظهر هكذا في الشاشة والمطبوع، ويُحفظ ضمن العنوان عند أول حفظ للطالب)
  function addressWithNeighborhood(st) {
    var address = st.address || '', n = String((st.details || {}).neighborhood || '').trim();
    if (!n) return address;
    var part = /مجاور/.test(n) ? n : 'المجاورة ' + n;
    if (norm(address).indexOf(norm(part)) > -1) return address;
    return part + (address ? ' - ' + address : '');
  }

  // تُبنى مرة واحدة عند فتح النموذج، ويعرضها المتصفح نفسه أثناء الكتابة فلا تُبطئ الإدخال
  function suggestionListsHtml() {
    return ST_FIELDS.filter(function (f) { return f.sug; }).map(function (f) {
      // تُعدّ الإجابات كما كُتبت أولًا، ثم تُوحَّد الصيغ المختلفة للقيم الفريدة القليلة فقط (القاهرة / القاهره)
      var raw = {}, count = {}, text = {};
      S.students.forEach(function (x) {
        var v = f.x ? (x.details || {})[f.k] : x[f.k];
        if (v) raw[v] = (raw[v] || 0) + 1;
      });
      Object.keys(raw).sort(function (a, b) { return raw[b] - raw[a]; }).forEach(function (v) {
        var clean = v.replace(/\s+/g, ' ').trim(), key = norm(clean);
        if (!key || clean.length > 40) return;
        if (!count[key]) text[key] = clean; // الصيغة الأكثر تكرارًا هي التي تُعرض
        count[key] = (count[key] || 0) + raw[v];
      });
      var list = Object.keys(count).sort(function (a, b) { return count[b] - count[a]; }).slice(0, 25).map(function (k) { return text[k]; });
      f.sug.forEach(function (v) { if (!count[norm(v)]) list.push(v); });
      return '<datalist id="dl-' + f.k + '">' + list.map(function (v) { return '<option value="' + esc(v) + '">'; }).join('') + '</datalist>';
    }).join('');
  }

        ? '<div class="table-wrap"><table class="grid"><thead><tr><th>م</th><th>الاسم</th><th>رقم الهوية</th><th>الحالة</th><th>الصف</th><th>الهاتف</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'

  /* ----- نسخ بيانات الأسرة من أخ مسجَّل -----
     الإخوة يشتركون في بيانات ولي الأمر والأسرة والسكن والمواصلات، فتُنسخ إلى النموذج بضغطة بدل إملائها من جديد */
  var FAMILY_SECTIONS = ['بيانات ولي الأمر', 'الأسرة والوضع الاجتماعي', 'السكن'];

  function familyFields() {
    var sec = '', out = [];
    ST_FIELDS.forEach(function (f) { if (f.sec) sec = f.sec; if (FAMILY_SECTIONS.indexOf(sec) > -1) out.push(f); });
    return out;
  }

  // اسم الأب والجد والعائلة: ما بعد الاسم الأول
  function familyName(x) {
    return norm(x.full_name).split(/\s+/).slice(1).join(' ');
  }

  // بالبحث: من يطابق الاسم أو الهوية أو الهاتف. بلا بحث: إخوة محتملون (الهاتف نفسه، أو هوية ولي الأمر، أو اسم الأب والعائلة)
  function siblingMatches(st, query) {
    var q = norm(query), digits = latinDigits(query || '').trim(), list;
    if (q) {
      list = S.students.filter(function (x) {
        return (!st || x.id !== st.id) && (norm(x.full_name + ' ' + (x.guardian_name || '')).indexOf(q) > -1 ||
          (/\d/.test(digits) && (String(x.national_id || '').indexOf(digits) > -1 || String(x.phone || '').indexOf(digits) > -1)));
      });
    } else {
      if (!st) return [];
      var fam = familyName(st), gid = (st.details || {}).guardian_id;
      list = S.students.filter(function (x) {
        return x.id !== st.id && ((st.phone && x.phone === st.phone) || (gid && (x.details || {}).guardian_id === gid) ||
          (fam.split(' ').length >= 2 && familyName(x) === fam));
      });
    }
    // المسجلون نهائيًا أولًا: بياناتهم روجعت
    return list.sort(function (a, b) { return (stStatus(a) === 'final' ? 0 : 1) - (stStatus(b) === 'final' ? 0 : 1); }).slice(0, 6);
  }

  function siblingListHtml(st) {
    var list = siblingMatches(st, ui.sibSearch);
    return list.map(function (x) {
      return '<div class="cand"><span><b>' + esc(x.full_name) + '</b><br><span class="meta">' + ST_STATUS[stStatus(x)] +
        (x.class_name ? ' · ' + esc(x.class_name) : '') + (x.guardian_name ? ' · ولي الأمر: ' + esc(x.guardian_name) : '') + '</span></span>' +
        '<button type="button" class="btn" data-sibcopy="' + x.id + '">انسخ بيانات الأسرة</button></div>';
    }).join('') || (ui.sibSearch.trim() ? '<div class="empty" style="padding:10px">لا يوجد طالب مطابق.</div>' : '');
  }

  function siblingBoxHtml(st) {
    var auto = siblingMatches(st, '').length;
    return '<details class="bank" id="sib-box" style="margin:8px 0 0"' + (auto ? ' open' : '') + '><summary>نسخ بيانات الأسرة من أخ مسجَّل<span id="sib-count">' + (auto ? ' — إخوة محتملون: ' + auto : '') + '</span></summary>' +
      '<p class="hint" style="margin:8px 0">ينسخ إلى هذا النموذج بيانات ولي الأمر والأسرة والسكن والمواصلات من أخيه. لا يُحفظ شيء قبل الضغط على «حفظ».</p>' +
      '<input type="search" id="sib-search" placeholder="ابحث عن الأخ بالاسم أو رقم الهوية أو هاتف ولي الأمر" aria-label="بحث عن أخ" value="' + esc(ui.sibSearch) + '">' +
      '<div id="sib-results">' + siblingListHtml(st) + '</div></details>';

  // الطالب كما هو مكتوب في النموذج الآن (للطالب الجديد الذي لم يُحفظ بعد): يكفي لاقتراح إخوته أثناء الكتابة

    var cur = ui.editStudent && ui.editStudent !== 'new' ? findStudent(ui.editStudent) : null;
    var val = function (k) { var el = document.getElementById('sf-' + k); return el ? el.value.trim() : ''; };

  // يُحدَّث صندوق الإخوة بحسب ما كُتب في النموذج (الاسم، هاتف ولي الأمر، هويته) ما دام البحث فارغًا
  function refreshSiblingBox() {
    var box = document.getElementById('sib-box');
    if (!box || ui.sibSearch.trim()) return;
    var draft = draftStudent(), n = siblingMatches(draft, '').length;
    document.getElementById('sib-results').innerHTML = siblingListHtml(draft);

  function copyFromSibling(id) {
    var sib = findStudent(id);
    if (!sib) return;
    // الحقل الفارغ عند الأخ لا يمسح ما كُتب هنا
    var copied = 0;
    familyFields().forEach(function (f) {
      var el = document.getElementById('sf-' + f.k), v = stVal(sib, f.k);
      if (!el || v === '' || v == null) return;
      // قيمة ليست بين خيارات القائمة (خيار أُلغي لاحقًا) تُضاف خيارًا حتى لا تضيع
      if (el.tagName === 'SELECT' && !Array.prototype.some.call(el.options, function (o) { return o.value === String(v); })) el.add(new Option(v, v));
      el.value = v;
      copied++;
    });
    var wants = document.getElementById('sf-wants'), ride = document.getElementById('sf-transport'), gid = transportGroupOf()[sib.id];
    if (ride && gid) ride.value = gid;
    if (wants && (gid || sib.wants_transport != null)) wants.value = gid || sib.wants_transport ? 'yes' : 'no';
    syncStudentDeps();
    if (!copied) return toast('ملف «' + sib.full_name + '» ليس فيه بيانات أسرة مُدخلة بعد، فلا شيء يُنسخ.', true);
    toast('نُسخ ' + copied + ' حقلًا من بيانات أسرة «' + sib.full_name + '» — راجعها ثم احفظ');
    var firstCopied = document.getElementById('sf-guardian_name');
    if (firstCopied) firstCopied.scrollIntoView({ block: 'center' });
  }

      originalAnswersHtml(st) + siblingBoxHtml(st) +
      '<div class="grid2" style="margin-top:4px">' + ST_FIELDS.map(function (f) { return studentFieldHtml(f, st); }).join('') + '</div>' + suggestionListsHtml() +
      (S.transportMissing ? '' :
        '<h2 style="margin-top:20px">المواصلات</h2>' +
        (S.wantsMissing ? '' :
          '<label class="field" for="sf-wants" style="margin-top:6px">هل يحتاج الطالب مواصلات؟</label>' +
          '<select id="sf-wants" style="width:100%;max-width:420px">' +
            '<option value="">لم يُحدَّد بعد</option>' +
            '<option value="yes"' + (wants === true ? ' selected' : '') + '>نعم</option>' +
            '<option value="no"' + (wants === false ? ' selected' : '') + '>لا</option></select>') +
        '<label class="field" for="sf-transport" style="margin-top:10px">نقطة التجمع</label>' +
        '<select id="sf-transport" style="width:100%;max-width:420px"><option value="">بدون مواصلات</option>' + S.tGroups.map(function (g) {
          return '<option value="' + g.id + '"' + (g.id === groupId ? ' selected' : '') + '>' + esc(g.assembly_point) +
            (g.pickup_time ? ' — ' + esc(g.pickup_time) : '') + '</option>';
        }).join('') + '</select>' +
        '<div class="day">' + (S.tGroups.length
          ? 'اختر أقرب نقطة تجمع لعنوان السكن مع ولي الأمر؛ يُضاف الطالب إلى مجموعتها عند الحفظ.'
          : 'لا توجد مجموعات مواصلات بعد؛ أنشئها من صفحة «المواصلات».') + '</div>') +
      '<h2 style="margin-top:20px">المستندات المستلمة</h2>' +
      '<div class="classes-pick" style="margin-top:6px">' + ST_DOCS.map(function (d) {
        return '<label class="check"><input type="checkbox" name="sf-doc" value="' + d[0] + '"' + (docs[d[0]] ? ' checked' : '') + '>' + d[1] + '</label>';
      }).join('') + '</div>' +
      '<label class="field" for="sf-docnote" style="margin-top:8px">مستندات أخرى أو ملاحظات</label>' +

        (final
          ? '<button type="submit" class="btn primary" data-mode="final">حفظ</button>' +
            '<button type="button" class="btn" data-stunfinal="' + st.id + '">إعادة إلى التسجيل المبدئي</button>'
          : '<button type="submit" class="btn primary" data-mode="final">حفظ واعتماد التسجيل النهائي</button>' +
            '<button type="submit" class="btn" data-mode="save" formnovalidate>حفظ دون اعتماد</button>') +
        (st ? '<button type="button" class="btn" data-stprofile="' + st.id + '">طباعة ملف الطالب</button>' : '') +
        '<button type="button" class="btn" data-stedit="">إلغاء</button>' +
      '</div></form>';
  }

  function renderStudents() {
    if (S.studentsMissing || S.regMissing) {
      app.innerHTML = tabs('students') + '<div class="card empty">لم تُجهَّز قاعدة البيانات لتسجيل الطلاب بعد.<br>' +
        'شغّل الملف <code dir="ltr">supabase/' + (S.studentsMissing ? 'students.sql ثم student_registration.sql' : 'student_registration.sql') + '</code> في محرر SQL ثم حدّث الصفحة.</div>';
      return;
    }
    var ed = ui.editStudent, st = ed && ed !== 'new' ? findStudent(ed) : null;
    // أثناء تعبئة النموذج لا تُرسم قائمة الطلاب تحته: رسم مئات الصفوف يؤخر فتح النموذج بلا فائدة
    if (ed && !ui.imp) {
      app.innerHTML = tabs('students') + studentFormHtml(st);
      syncStudentDeps();
      return;
    }
    var counts = {}, byStatus = { pending: 0, final: 0 };
    S.students.forEach(function (x) { counts[x.class_name || ''] = (counts[x.class_name || ''] || 0) + 1; byStatus[stStatus(x)]++; });
    var opt = function (value, label, current) { return '<option value="' + esc(value) + '"' + (current === value ? ' selected' : '') + '>' + label + '</option>'; };

    app.innerHTML = tabs('students') +
      (ui.imp ? importPreviewHtml() : ed ? studentFormHtml(st) :
        '<div class="toolbar">' +
          '<button type="button" class="btn primary" data-stedit="new">+ تسجيل طالب</button>' +
          (isAdmin() ? '<button type="button" class="btn" data-impopen>استيراد من Excel</button>' +
          '<button type="button" class="btn" data-imptemplate>تنزيل قالب Excel</button>' +
          '<input type="file" id="imp-file" accept=".xlsx,.xls,.csv" hidden>' : '') +
          '<button type="button" class="btn" data-stblank>طباعة استمارة ورقية فارغة</button>' +
        '</div>') +
      '<nav class="pills no-print" aria-label="حالة التسجيل">' + [['pending', 'تسجيل مبدئي', byStatus.pending], ['final', 'تسجيل نهائي', byStatus.final], ['', 'الكل', S.students.length]].map(function (p) {
        return '<button type="button" data-ststatus="' + p[0] + '"' + (ui.stStatus === p[0] ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + '>' + p[1] + ' <b>' + p[2] + '</b></button>';
      }).join('') + '</nav>' +
      '<div class="card"><div class="toolbar">' +
        '<input type="search" id="st-search" placeholder="ابحث بالاسم أو رقم الهوية" aria-label="بحث" value="' + esc(ui.stSearch) + '">' +

        '<select id="st-class" aria-label="الصف">' + opt('', 'كل الصفوف', ui.stClass) + opt('-', 'بدون صف (' + (counts[''] || 0) + ')', ui.stClass) +
          schoolClasses().map(function (c) { return opt(c, esc(c) + ' (' + (counts[c] || 0) + ')', ui.stClass); }).join('') + '</select>' +
        '<select id="st-flag" aria-label="معيار إضافي">' + opt('', 'كل الطلاب', ui.stFlag) +
          Object.keys(ST_FLAGS).map(function (k) { return opt(k, ST_FLAGS[k].label, ui.stFlag); }).join('') + '</select>' +
        '<button type="button" class="btn" data-stxlsx>تصدير Excel</button>' +
        '<button type="button" class="btn" data-stprint>تصدير PDF / طباعة</button>' +
      '</div><div id="st-table">' + studentsTableHtml() + '</div></div>';

  // mode: 'final' يعتمد التسجيل النهائي (بعد اكتمال البيانات والصف)، 'save' يحفظ فقط
  async function saveStudentForm(mode) {
    var st = ui.editStudent !== 'new' ? findStudent(ui.editStudent) : null, data = {};
    // الحقول الجديدة تُحفظ معًا في details؛ ما ليس في النموذج من قيمها السابقة يبقى
    data.details = Object.assign({}, st && st.details);
    ST_FIELDS.forEach(function (f) {
      var v = document.getElementById('sf-' + f.k).value.trim();
      v = f.type === 'date' ? (v || null) : f.type === 'number' ? (v === '' ? null : Number(v)) : f.num ? latinDigits(v) : v;
      if (f.x) data.details[f.k] = v; else data[f.k] = v;
    });
    if (data.details.housing !== 'يدفع') data.details.rent = '';
    delete data.details.neighborhood; // صار جزءًا من العنوان التفصيلي المحفوظ الآن
    data.memorizes_quran = data.quran_parts == null ? null : data.quran_parts > 0;
    data.documents = {};
    Array.prototype.forEach.call(app.querySelectorAll('[name="sf-doc"]:checked'), function (c) { data.documents[c.value] = true; });
    data.documents_note = document.getElementById('sf-docnote').value.trim();

    var wantsEl = document.getElementById('sf-wants'), rideEl = document.getElementById('sf-transport');
    if (wantsEl) data.wants_transport = rideEl.value || wantsEl.value === 'yes' ? true : wantsEl.value === 'no' ? false : null;

    if (!data.full_name) return toast('اكتب اسم الطالب.', true);
    var wasFinal = st && stStatus(st) === 'final';
    // شعبة ممتلئة أو لجنس آخر: تنبيه، والمتابعة ممكنة
    if (mode === 'final' && data.class_name && !confirmClass(data.class_name, st, data.gender)) return;
    if (mode === 'final' && !wasFinal) {
      var missing = ST_DOCS.filter(function (d) { return !data.documents[d[0]]; }).map(function (d) { return d[1]; });
      if (missing.length && !confirm('لم تُسجَّل هذه المستندات: ' + missing.join('، ') + '.\nهل تريد اعتماد التسجيل النهائي مع ذلك؟')) return;
      data.status = 'final';
      data.finalized_at = new Date().toISOString();
    } else if (!st) {
      data.status = 'pending';
    }

    var r = st
      ? await sb.from('students').update(data).eq('id', st.id)
      : await sb.from('students').insert(data).select().single();
    if (r.error) {
      return /duplicate|unique/i.test(r.error.message) ? toast('رقم الهوية مسجل نهائيًا لطالب آخر.', true) : fail(r.error);
    }
    if (st) Object.assign(st, data); else S.students.push(st = r.data);
    S.students.sort(function (a, b) { return a.full_name.localeCompare(b.full_name, 'ar'); });

    var pick = document.getElementById('sf-transport');
    if (pick) {
      var was = transportGroupOf()[st.id] || '', want = pick.value, tr = null;
      if (want && want !== was) {
        tr = await sb.from('transport_members').upsert(memberRow(st.id, want), { onConflict: 'student_id' });
      } else if (!want && was) {
        tr = await sb.from('transport_members').delete().eq('student_id', st.id);
      }
      if (tr && tr.error) {
        // بيانات الطالب حُفظت؛ المواصلات لم تتغير
        ui.editStudent = st.id;
        render();
        return fail(tr.error);
      }
      if (tr) {
        S.tMembers = S.tMembers.filter(function (m) { return m.student_id !== st.id; });
        if (want) S.tMembers.push({ student_id: st.id, group_id: want, share: null });
      }
    }
    ui.editStudent = null;
    render();
    toast(data.status === 'final' ? 'تم اعتماد التسجيل النهائي' : 'تم الحفظ');
  }

  /* ----- الاستيراد من Excel ----- */

  // مكتبة قراءة Excel تُحمَّل عند الحاجة فقط
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
      sc.onload = resolve;
      sc.onerror = function () { reject(new Error('تعذر تحميل مكتبة قراءة Excel')); };
      document.head.appendChild(sc);
    });
  }

  function parseYesNo(x) {
    x = norm(x);
    if (!x) return null;
    if (/^(نعم|yes|true|1|ايوه|اه)/.test(x)) return true;
    if (/^(لا|no|false|0)/.test(x)) return false;
    return null;
  }

  // يقبل 2015-03-21 أو 21/3/2015 (اليوم أولًا)، ويرفض السنوات غير المعقولة لطالب
  function parseDate(x) {
    x = latinDigits(x);
    var m = x.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/), y, mo, d;
    if (m) { y = m[1]; mo = m[2]; d = m[3]; }
    else if ((m = x.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) { d = m[1]; mo = m[2]; y = m[3]; }
    else return null;
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1990 || y > new Date().getFullYear() - 2) return null;
    return y + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2);
  }

  function parseOrphanOf(x) {
    x = norm(x);
    if (!x) return '';
    if (/اثنين|كلا|معا|ابوين|والدين/.test(x) || (/اب/.test(x) && /ام/.test(x))) return 'الاثنين معًا';
    if (/ام/.test(x)) return 'الأم';
    if (/اب/.test(x)) return 'الأب';
    return '';
  }

  function parseGender(x) {
    x = norm(x);
    return /^(ذكر|ولد|male|m$)/.test(x) ? 'ذكر' : /^(انثي|بنت|female|f$)/.test(x) ? 'أنثى' : '';
  }

  // Excel يحذف الصفر الأول من أرقام الجوال المخزّنة كأرقام
  function parsePhone(x) {
    x = latinDigits(x).replace(/[\s-]/g, '');
    // رقم فلسطيني 5xxxxxxxx أو مصري 1xxxxxxxxx
    return /^(5\d{8}|1[0125]\d{8})$/.test(x) ? '0' + x : x;
  }

  async function readImportFile(file) {
    try {
      await loadXlsx();
      var wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      var raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
      if (!raw.length) return toast('الملف لا يحتوي على بيانات.', true);

      // مطابقة عناوين الأعمدة مع حقول الاستمارة
      var headers = Object.keys(raw[0]), col = {}, used = {};
      ST_MATCH_ORDER.forEach(function (k) {
        if (col[k]) return;
        var f = stField(k);
        for (var i = 0; i < headers.length; i++) {
          var h = norm(headers[i]);
          if (!used[headers[i]] && f.match.some(function (w) { return h.indexOf(w) > -1; })) {
            col[k] = headers[i]; used[headers[i]] = true; break;
          }
        }
      });
      if (!col.full_name) return toast('لم يُعثر في الملف على عمود «اسم الطالب».', true);
      // ملفات ردود النماذج فيها طابع زمني لكل رد: يُعرَف به الرد عند إعادة الاستيراد
      var stamp = headers.filter(function (h) { return /timestamp|طابع زمني/.test(norm(h)); })[0];
      if (stamp) used[stamp] = true;

      var haveKey = {}, haveId = {};
      S.students.forEach(function (x) { if (x.form_key) haveKey[x.form_key] = true; if (x.national_id) haveId[x.national_id] = true; });

      var rows = [], flags = [], errors = [], seenId = {}, skipped = 0;
      raw.forEach(function (row, i) {
        var get = function (k) {
          var x = col[k] ? row[col[k]] : '';
          // خلايا التاريخ تصل ككائن Date (منتصف الليل UTC مع انحراف بسيط أحيانًا)
          if (x instanceof Date) return new Date(x.getTime() + 12 * 3600e3).toISOString().slice(0, 10);
          // تُحذف علامات الاتجاه غير المرئية التي تُلصق مع الأرقام المنسوخة
          return String(x).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '').trim();
        };
        var answers = {};
        IMPORT_FIELDS.forEach(function (f) { var a = get(f.k); if (a) answers[f.k] = a; });
        // رقم الهوية: أرقام فقط إن أمكن، وإلا النص كما كُتب ليُصحَّح عند المراجعة
        var idDigits = latinDigits(get('national_id')).replace(/[\s-]/g, '');
        var validId = /^\d{5,20}$/.test(idDigits);
        var ts = stamp ? row[stamp] : '';
        var parts = parseFloat(latinDigits(get('quran_parts')));
        var d = {
          full_name: get('full_name').replace(/\s+/g, ' '),
          national_id: validId ? idDigits : '',
          gender: parseGender(get('gender')),
          phone: parsePhone(get('phone')),
          whatsapp: parsePhone(get('whatsapp')),
          email: get('email'),
          birth_date: parseDate(get('birth_date')),
          address: get('address'),
          class_name: '',
          requested_class: get('class_name'),
          has_prev_certificate: parseYesNo(get('has_prev_certificate')),
          prev_grade: get('prev_grade'),
          guardian_name: get('guardian_name'),
          guardian_relation: get('guardian_relation'),
          guardian_job: get('guardian_job'),
          has_health_condition: parseYesNo(get('has_health_condition')),
          takes_medication: parseYesNo(get('takes_medication')),
          has_special_needs: parseYesNo(get('has_special_needs')),
          is_orphan: parseYesNo(get('is_orphan')),
          orphan_of: parseOrphanOf(get('orphan_of')),
          memorizes_quran: parseYesNo(get('memorizes_quran')),
          quran_parts: !isNaN(parts) && parts >= 0 && parts <= 30 ? parts : null,
          status: 'pending',
          form_key: ts instanceof Date ? ts.toISOString() : (ts === '' ? null : String(ts)),
          form_answers: answers
        };
        if (!d.is_orphan) d.orphan_of = '';
        if (!d.full_name && !Object.keys(answers).length) return; // صف فارغ
        if (!d.full_name) return errors.push('الصف ' + (i + 2) + ': اسم الطالب ناقص');
        // لا تُعدَّل بيانات من سبق استيراده: يُعرَف برد الاستمارة، أو برقم الهوية في الملفات الأخرى
        if (d.form_key ? haveKey[d.form_key] : (d.national_id && haveId[d.national_id])) return skipped++;
        // known: رقم هويته موجود في البرنامج (يُتخطى أو يُضاف بحسب خيار المعاينة). dup: تكرر رقمه داخل الملف نفسه
        flags.push({ known: !!(d.national_id && haveId[d.national_id]), dup: !!(d.national_id && seenId[d.national_id]) });
        if (d.national_id) seenId[d.national_id] = true;
        rows.push(d);
      });

      ui.imp = {
        file: file.name, rows: rows, flags: flags, skipKnown: true, errors: errors, skipped: skipped,
        mapped: IMPORT_FIELDS.filter(function (f) { return col[f.k]; }).map(function (f) { return f.k; }),
        unmapped: headers.filter(function (h) { return !used[h]; })
      };
      render();
    } catch (err) {
      toast('تعذر قراءة الملف: ' + err.message, true);
    }
  }

  // الصفوف التي ستُستورد فعلًا بحسب خيار «تخطي من رقم هويته موجود»
  function importRows() {
    var p = ui.imp;
    return p.rows.filter(function (r, i) { return !(p.skipKnown && p.flags[i].known); });
  }

  async function runImport() {
    var rows = importRows();
    for (var i = 0; i < rows.length; i += 100) {
      var r = await sb.from('students').insert(rows.slice(i, i + 100));
      if (r.error) { await loadStudents(); render(); return fail(r.error); }
    }
    await loadStudents();
    ui.imp = null;
    ui.stStatus = 'pending';
    render();
    toast('تم استيراد الطلاب (' + rows.length + ') بحالة تسجيل مبدئي');
  }

  async function downloadTemplate() {
    try {
      await loadXlsx();
      var ws = XLSX.utils.aoa_to_sheet([IMPORT_FIELDS.map(function (f) { return f.label; })]);
      ws['!cols'] = IMPORT_FIELDS.map(function () { return { wch: 26 }; });
      var wb = XLSX.utils.book_new();
      wb.Workbook = { Views: [{ RTL: true }] };
      XLSX.utils.book_append_sheet(wb, ws, 'الطلاب');
      XLSX.writeFile(wb, 'قالب-تسجيل-الطلاب.xlsx');
    } catch (err) {
      toast(err.message, true);
    }
  }

      if (!filteredStudents().length) return toast('لا يوجد طلاب مطابقون للطباعة.', true);
      printNow();
    } else if (e.target.closest('[data-impopen]')) {
      document.getElementById('imp-file').click();

      el.disabled = true;
      el.textContent = 'جارٍ الاستيراد…';
      runImport();
    }
  });

  /* ---------- الطلاب حسب الشعب (مدير النظام) ---------- */

  // الشعبة المفتوحة كما في العنوان: #/classes/<الاسم>
  function currentClass() {
    var m = location.hash.match(/^#\/classes\/(.+)$/);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (err) { return null; }
  }

  // طلاب الشعبة المسجلون نهائيًا، مرتبين بالاسم
  function classStudents(name) {
    return S.students.filter(function (x) { return stStatus(x) === 'final' && x.class_name === name; })
      .sort(function (a, b) { return a.full_name.localeCompare(b.full_name, 'ar'); });
  }

  function classTableHtml(name) {
    var q = norm(ui.clsSearch);
    var list = classStudents(name), shown = list.filter(function (x) {
      return !q || norm(x.full_name).indexOf(q) > -1 || String(x.national_id || '').indexOf(latinDigits(ui.clsSearch)) > -1;
    });
    var rows = shown.map(function (x) {
      return '<tr><td>' + (list.indexOf(x) + 1) + '</td><td><b>' + esc(x.full_name) + '</b></td>' +
        '<td dir="ltr" style="text-align:right">' + esc(x.national_id || '—') + '</td><td>' + esc(x.gender || '—') + '</td>' +
        '<td dir="ltr" style="text-align:right">' + esc(x.phone || '—') + '</td><td>' + esc(x.guardian_name || '—') + '</td>' +
        '<td class="no-print"><select data-cmove="' + x.id + '" aria-label="نقل ' + esc(x.full_name) + ' إلى شعبة أخرى">' +
          schoolClasses().map(function (c) { return '<option' + (c === name ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></td>' +
        '<td class="no-print" style="white-space:nowrap"><button type="button" class="btn" data-cprofile="' + x.id + '">ملف الطالب</button> ' +
        '<button type="button" class="btn" data-cedit="' + x.id + '">تعديل</button></td></tr>';
    }).join('');
    return rows
      ? '<div class="table-wrap"><table class="grid"><thead><tr><th>م</th><th>الاسم</th><th>رقم الهوية</th><th>الجنس</th><th>الهاتف</th><th>ولي الأمر</th>' +
        '<th class="no-print">الشعبة</th><th class="no-print"></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty">' + (list.length ? 'لا توجد نتائج مطابقة.' : 'لا يوجد طلاب مسجلون نهائيًا في هذه الشعبة بعد.') + '</div>';
  }

  function renderClasses() {
    if (S.studentsMissing || S.regMissing) return renderStudents();
    var name = currentClass(), classes = schoolClasses();
    var finals = S.students.filter(function (x) { return stStatus(x) === 'final'; });

    if (name && (classes.indexOf(name) > -1 || classStudents(name).length)) {
      var list = classStudents(name);
      var boys = list.filter(function (x) { return x.gender === 'ذكر'; }).length, girls = list.filter(function (x) { return x.gender === 'أنثى'; }).length;
      app.innerHTML = tabs('classes') +
        '<a class="btn link no-print" href="#/classes">→ العودة إلى الشعب</a>' +
        '<div class="eval-head"><div><h2>' + esc(name) + '</h2><div class="sub">عدد الطلاب: ' + list.length +
          (boys || girls ? ' · ذكور: ' + boys + ' · إناث: ' + girls : '') + '</div></div>' +
          '<div class="no-print"><button type="button" class="btn primary" data-cprint' + (list.length ? '' : ' disabled') + '>طباعة كشف الشعبة</button></div></div>' +
        '<div class="card"><div class="toolbar no-print"><input type="search" id="cls-search" placeholder="ابحث بالاسم أو رقم الهوية" aria-label="بحث" value="' + esc(ui.clsSearch) + '"></div>' +
        '<div id="cls-table">' + classTableHtml(name) + '</div></div>';
      return;
    }

    var counts = {};
    finals.forEach(function (x) { counts[x.class_name] = (counts[x.class_name] || 0) + 1; });
    // صفوف لم تعد في قائمة المدرسة لكن فيها طلاب تبقى ظاهرة
    var all = classes.concat(Object.keys(counts).filter(function (c) { return c && classes.indexOf(c) < 0; }));
    var pending = S.students.length - finals.length;
    app.innerHTML = tabs('classes') +
      '<div class="toolbar"><button type="button" class="btn" data-regbook' + (finals.length ? '' : ' disabled') + '>تصدير كشوف التسجيل (Excel)</button></div>' +
      '<p class="st-count">المسجلون نهائيًا: ' + finals.length + ' في ' + all.length + ' شعبة' +
        (pending ? ' · <a href="#/students">تسجيلات مبدئية بانتظار الاعتماد: ' + pending + '</a>' : '') + '</p>' +
      (all.length
        ? '<div class="stats">' + all.map(function (c) {
            var info = classInfo(c), n = counts[c] || 0, cap = info ? info.capacity : null;
            return '<a class="card stat" href="#/classes/' + encodeURIComponent(c) + '"><span class="lbl">' + esc(c) + '</span>' +
              '<span class="num"' + (cap != null && n > cap ? ' style="color:var(--red)"' : '') + '>' + n + (cap != null ? ' <small>/ ' + cap + '</small>' : '') + '</span>' +
              '<span class="sub">' + (info && info.gender ? CLASS_GENDERS[info.gender] + ' · ' : '') +
                (cap == null ? 'مسجلون نهائيًا' : n > cap ? 'تجاوز السعة بـ ' + (n - cap) : n === cap ? 'ممتلئة' : 'المتاح ' + (cap - n)) + '</span></a>';
          }).join('') + '</div>'
        : '<div class="card empty">لم تُعرَّف شعب المدرسة بعد. يعرّفها مدير النظام من «إعداد الفصول».</div>');
  }

  /* ---------- مواصلات الطلاب (مدير النظام) ---------- */

  function findGroup(id) {
    for (var i = 0; i < S.tGroups.length; i++) if (S.tGroups[i].id === id) return S.tGroups[i];
    return null;
  }

  function currentGroup() {
    var m = location.hash.match(/^#\/transport\/(.+)$/);
    return m && isAdmin() ? findGroup(m[1]) : null;
  }

  function membersOf(gid) {
    return S.tMembers.filter(function (m) { return m.group_id === gid && findStudent(m.student_id); });
  }

  // left_from: أول شهر لا يشترك فيه الطالب (أُوقف اشتراكه ابتداءً منه). قبله يبقى في كشوف الأشهر ودفعاتها
  // صف العضوية عند الإضافة إلى مجموعة أو النقل إليها: مشترك من جديد (إن كان عمود الإيقاف موجودًا)
  function memberRow(studentId, groupId) {
    var row = { student_id: studentId, group_id: groupId, share: null };
    if (!S.leaveMissing) row.left_from = null;
    return row;
  }

  function subscribedIn(m, month) {
    return !m.left_from || month < m.left_from;
  }

  // من يُطلب منه اشتراك الشهر المعروض: المشترك فيه، ومن أُوقف لكن له دفعة مسجلة عن هذا الشهر (حتى لا تختفي)
  function owesThisMonth(m) {
    return subscribedIn(m, ui.tMonth) || ((S.tPay[ui.tMonth] || {})[m.student_id] || {}).amount > 0;
  }

  async function setSubscription(sid, stop) {
    if (S.leaveMissing) return toast('شغّل الملف supabase/transport_unsubscribe.sql في محرر SQL أولًا، ثم حدّث الصفحة', true);
    var x = findStudent(sid), m = S.tMembers.filter(function (k) { return k.student_id === sid; })[0];
    if (!x || !m) return;
    if (stop) {
      if (((S.tPay[ui.tMonth] || {})[sid] || {}).amount > 0) {
        return alert('للطالب «' + x.full_name + '» دفعة مسجلة عن ' + monthLabel(ui.tMonth) + '.\nاحذف إيصالها أولًا إن كان لن يشترك هذا الشهر، أو اختر الشهر التالي من أعلى الصفحة ثم أوقف الاشتراك ابتداءً منه.');
      }
      if (!confirm('إيقاف اشتراك «' + x.full_name + '» في المواصلات ابتداءً من ' + monthLabel(ui.tMonth) + '؟\n\nلن يُطلب منه اشتراك هذا الشهر وما بعده. الأشهر السابقة ودفعاتها تبقى كما هي.')) return;
    }
    var value = stop ? ui.tMonth : null;
    var r = await sb.from('transport_members').update({ left_from: value }).eq('student_id', sid);
    if (r.error) return fail(r.error);
    m.left_from = value;
    render();
    toast(stop ? 'أُوقف الاشتراك ابتداءً من ' + monthLabel(ui.tMonth) : 'أُعيد الاشتراك');
  }

  // حصة الطالب: المحددة له، وإلا اشتراك المجموعة
  // رسوم المواصلات الشهرية تُحسب للأسرة: الطالب الأول بمبلغ، وكل أخ بعده بمبلغ أقل
  var DEFAULT_FEES = { first: 700, next: 600 };

  function transportFees() {
    var f = classConfig().fees || {};
    var num = function (v, d) { return v == null || v === '' || isNaN(Number(v)) ? d : Number(v); };
    return { first: num(f.first, DEFAULT_FEES.first), next: num(f.next, DEFAULT_FEES.next) };
  }

  // ترتيب كل مشترك في المواصلات بين إخوته المشتركين: { studentId: { rank, size, family } } (family: معرّف الأسرة).
  // الإخوة: من يشتركون في هوية ولي الأمر، أو هاتفه، أو اسم الأب والجد والعائلة. الأول هو الأكبر سنًّا.
  // تُحسب مرة لكل رسم للشاشة ثم تُنسى، لأن بيانات الطلاب قد تتغير
  var famCache = null;
  function familyInfo() {
    if (famCache) return famCache;
    var byId = {}, parent = {}, keyOwner = {};
    S.students.forEach(function (x) { byId[x.id] = x; });
    var ids = [];
    S.tMembers.forEach(function (m) { if (byId[m.student_id] && !parent[m.student_id] && owesThisMonth(m)) { parent[m.student_id] = m.student_id; ids.push(m.student_id); } });
    var root = function (id) { while (parent[id] !== id) { parent[id] = parent[parent[id]]; id = parent[id]; } return id; };
    ids.forEach(function (id) {
      var x = byId[id], keys = [], gid = String((x.details || {}).guardian_id || '').trim(), phone = String(x.phone || '').replace(/\D/g, ''), fam = familyName(x);
      if (gid.length >= 5) keys.push('g:' + gid);
      if (phone.length >= 8) keys.push('p:' + phone.slice(-10));
      if (fam.split(' ').length >= 3) keys.push('n:' + fam);
      keys.forEach(function (k) {
        if (keyOwner[k]) parent[root(id)] = root(keyOwner[k]); else keyOwner[k] = id;
      });
    });
    var families = {};
    ids.forEach(function (id) { var r = root(id); (families[r] || (families[r] = [])).push(byId[id]); });
    var info = {};
    Object.keys(families).forEach(function (r) {
      var list = families[r].sort(function (a, b) {
        return String(a.birth_date || '9999').localeCompare(String(b.birth_date || '9999')) || a.full_name.localeCompare(b.full_name, 'ar');
      });
      list.forEach(function (x, i) { info[x.id] = { rank: i + 1, size: list.length, family: r }; });
    });
    famCache = info;
    Promise.resolve().then(function () { famCache = null; });
    return info;
  }

  // حصة الطالب الشهرية: المحددة له يدويًا، وإلا رسوم الأسرة بحسب ترتيبه بين إخوته المشتركين
  function shareOf(m) {
    if (m.share != null && m.share !== '') return Number(m.share);
    var fees = transportFees(), fam = familyInfo()[m.student_id];
    return fam && fam.rank > 1 ? fees.next : fees.first;
  }

  // «الأخ الثاني من 3» لمن له إخوة مشتركون
  function familyNote(studentId) {
    var fam = familyInfo()[studentId];
    if (!fam || fam.size < 2) return '';
    var words = ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس'];
    return 'أسرة من ' + fam.size + ' مشتركين — ' + (words[fam.rank - 1] || fam.rank);
  }

  // المبالغ بالجنيه المصري
  function money(x) {
    return (Math.round(x * 100) / 100).toLocaleString('en') + ' ج.م';
  }

  function thisMonth() {
    return todayISO().slice(0, 7);
  }

  function monthLabel(m) {
    return new Date(m + '-01T00:00').toLocaleDateString('ar-u-nu-latn', { month: 'long', year: 'numeric' });
  }

  // المطلوب والمحصَّل لمجموعة في الشهر المعروض
  function groupTotals(g) {
    var pay = S.tPay[ui.tMonth] || {}, due = 0, paid = 0, n = 0;
    membersOf(g.id).filter(owesThisMonth).forEach(function (m) { n++; due += shareOf(m, g); paid += pay[m.student_id] ? pay[m.student_id].amount : 0; });
    return { n: n, due: due, paid: paid };
  }

  function groupFormHtml(g) {
    var val = function (k) { return esc(g && g[k] != null ? g[k] : ''); };
    var f = function (id, label, inner, wide) {
      return '<div' + (wide ? ' style="grid-column:1/-1"' : '') + '><label class="field" for="' + id + '">' + label + '</label>' + inner + '</div>';
    };
    return '<form class="card" id="group-form"><h2>' + (g ? 'تعديل المجموعة' : 'مجموعة مواصلات جديدة') + '</h2>' +
      '<div class="grid2" style="margin-top:12px">' +
        f('gf-point', 'نقطة التجمع <span class="req">*</span>', '<input type="text" id="gf-point" required placeholder="مثال: دوار المدينة" value="' + val('assembly_point') + '">') +
        f('gf-time', 'وقت التجمع', '<input type="time" id="gf-time" value="' + val('pickup_time') + '">') +
        f('gf-sup', 'المشرف المرافق', '<input type="text" id="gf-sup" list="gf-sup-list" value="' + val('supervisor_name') + '">' +
          '<datalist id="gf-sup-list">' + S.teachers.map(function (t) { return '<option value="' + esc(t.name) + '">'; }).join('') + '</datalist>') +
        f('gf-phone', 'هاتف المشرف', '<input type="text" id="gf-phone" dir="ltr" inputmode="tel" style="text-align:right" value="' + val('supervisor_phone') + '">') +
        f('gf-notes', 'ملاحظات', '<input type="text" id="gf-notes" value="' + val('notes') + '">') +
      '</div><div class="actions"><button type="submit" class="btn primary">حفظ</button>' +
      '<button type="button" class="btn" data-gedit="">إلغاء</button></div></form>';
  }

  // مرشحون للإضافة: طلاب ليسوا في هذه المجموعة، بالبحث في الاسم أو الهوية أو العنوان أو الصف
  function candidatesHtml(g) {
    var q = norm(ui.tSearch), inGroup = {};
    S.tMembers.forEach(function (m) { inGroup[m.student_id] = m.group_id; });
    var list = S.students.filter(function (x) {
      if (inGroup[x.id] === g.id) return false;
      return !q || norm(x.full_name + ' ' + x.address + ' ' + x.class_name).indexOf(q) > -1 || x.national_id.indexOf(latinDigits(ui.tSearch)) > -1;
    });
    // غير الملتحقين بأي مجموعة أولًا
    list.sort(function (a, b) { return (inGroup[a.id] ? 1 : 0) - (inGroup[b.id] ? 1 : 0); });
    var LIMIT = 30;
    return (list.slice(0, LIMIT).map(function (x) {
      var other = inGroup[x.id] && findGroup(inGroup[x.id]);
      return '<div class="cand"><span><b>' + esc(x.full_name) + '</b><br><span class="meta">' + esc(x.class_name || 'بدون صف') +
        (x.address ? ' · ' + esc(x.address) : '') + (other ? ' · في مجموعة «' + esc(other.assembly_point) + '»' : '') + '</span></span>' +
        '<button type="button" class="btn" data-madd="' + x.id + '">' + (other ? 'نقل إلى هنا' : 'إضافة') + '</button></div>';
    }).join('') || '<div class="empty">' + (S.students.length ? 'لا يوجد طلاب مطابقون.' : 'سجّل الطلاب أولًا من تبويب «تسجيل الطلاب».') + '</div>') +
      (list.length > LIMIT ? '<p class="st-count" style="margin-top:8px">يُعرض أول ' + LIMIT + ' من ' + list.length + '؛ اكتب في البحث لتضييق القائمة.</p>' : '');
  }

  function membersTableHtml(g) {
    var pay = S.tPay[ui.tMonth] || {}, members = membersOf(g.id), due = 0, paid = 0;
    members.sort(function (a, b) { return findStudent(a.student_id).full_name.localeCompare(findStudent(b.student_id).full_name, 'ar'); });
    var rows = members.map(function (m, i) {
      var x = findStudent(m.student_id);
      if (!owesThisMonth(m)) {
        return '<tr style="color:var(--muted)"><td>' + (i + 1) + '</td><td><b>' + esc(x.full_name) + '</b><br><span class="meta" style="font-size:.85rem">' + esc(x.class_name || 'بدون صف') + '</span></td>' +
          '<td dir="ltr" style="text-align:right">' + esc(x.whatsapp || x.phone || '—') + '</td><td colspan="3">اشتراكه متوقف منذ ' + monthLabel(m.left_from) + '</td>' +
          '<td><span class="badge pending">متوقف</span></td>' +
          '<td class="no-print" style="white-space:nowrap"><button type="button" class="btn" data-mresume="' + x.id + '">إعادة الاشتراك</button> ' +
          '<button type="button" class="btn" data-mdel="' + x.id + '">إزالة من المجموعة</button></td></tr>';
      }
      var sh = shareOf(m, g), rec = pay[x.id] || {}, p = rec.amount || 0;
      var method = rec.method || 'cash';
      due += sh; paid += p;
      var badge = sh > 0 && p >= sh ? ['paid', 'مدفوع'] : p > 0 ? ['part', 'جزئي'] : sh > 0 ? ['unpaid', 'غير مدفوع'] : ['pending', '—'];
      var famNote = familyNote(x.id);
      return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(x.full_name) + '</b><br><span class="meta" style="color:var(--muted);font-size:.85rem">' + esc(x.class_name || 'بدون صف') + (famNote ? ' · ' + famNote : '') + '</span></td>' +
        '<td dir="ltr" style="text-align:right">' + esc(x.whatsapp || x.phone || '—') + '</td>' +
        '<td><input type="number" min="0" step="any" data-mshare="' + x.id + '" aria-label="حصة ' + esc(x.full_name) + '" placeholder="' + shareOf({ student_id: x.id, share: null }) + '" value="' + (m.share != null ? esc(m.share) : '') + '"></td>' +
        '<td><input type="number" min="0" step="any" data-mpaid="' + x.id + '" aria-label="المدفوع من ' + esc(x.full_name) + '" value="' + (p || '') + '"></td>' +
        '<td><select data-mmethod="' + x.id + '" aria-label="طريقة دفع ' + esc(x.full_name) + '">' + Object.keys(PAY_METHODS).map(function (k) {
          return '<option value="' + k + '"' + (k === method ? ' selected' : '') + '>' + PAY_METHODS[k] + '</option>';
        }).join('') + '</select>' +
        payNoteInput(x.id, method, rec) + '</td>' +
        '<td><span class="badge ' + badge[0] + '">' + badge[1] + '</span></td>' +
        '<td class="no-print" style="white-space:nowrap">' + (p > 0 ? '<button type="button" class="btn" data-mreceipt="' + x.id + '">إيصال</button> <button type="button" class="btn danger" data-mvoid="' + x.id + '">حذف الإيصال</button> ' : '') + (sh > p ? '<button type="button" class="btn" data-mfull="' + x.id + '">دفع كامل</button> ' : '') +
        (p > 0 ? '' : '<button type="button" class="btn" data-mstop="' + x.id + '">إيقاف الاشتراك</button> ') +
        '<button type="button" class="btn" data-mdel="' + x.id + '">إزالة من المجموعة</button></td></tr>';
    }).join('');
    return rows
      ? '<div class="table-wrap"><table class="grid"><thead><tr><th>م</th><th>الطالب</th><th>واتساب ولي الأمر</th><th>الحصة (ج.م)</th><th>المدفوع (ج.م)</th><th>طريقة الدفع</th><th>الحالة</th><th class="no-print"></th></tr></thead>' +
        '<tbody>' + rows + '</tbody><tfoot><tr><td colspan="3">المجموع</td><td>' + money(due) + '</td><td>' + money(paid) + '</td>' +
        '<td colspan="3">المتبقي: ' + money(Math.max(0, due - paid)) + '</td></tr></tfoot></table></div>' + groupMethodsHtml(g)
      : '<div class="empty">لا يوجد طلاب في هذه المجموعة بعد.</div>';
  }

  // تفصيل وسائل الدفع لنقطة تجمع
  function groupMethodsHtml(g) {
    return methodStripHtml(payTotals(payRows().filter(function (r) { return r.g === g; })));
  }


  /* ----- دفعات المواصلات: كل مشترك مع حصته وما دفعه في الشهر المعروض ----- */

  var PAY_STATUS = { paid: 'مدفوع', part: 'جزئي', unpaid: 'غير مدفوع' };

  function plainNum(v) {
    return (Math.round(v * 100) / 100).toLocaleString('en');
  }

  // ترتيب الشعب كما عُرّفت في الإعدادات؛ غير المعرّفة في الآخر
  function classRank(name) {
    var i = schoolClasses().indexOf(name);
    return i < 0 ? 9999 : i;
  }

  function payRows() {
    var pay = S.tPay[ui.tMonth] || {};
    return S.tMembers.map(function (m) {
      var x = findStudent(m.student_id), g = findGroup(m.group_id);
      if (!x || !g || !owesThisMonth(m)) return null;
      var rec = pay[x.id] || {}, share = shareOf(m, g), paid = rec.amount || 0;
      return { x: x, g: g, rec: rec, share: share, paid: paid, left: Math.max(0, share - paid),
        status: share > 0 && paid >= share ? 'paid' : paid > 0 ? 'part' : share > 0 ? 'unpaid' : 'none' };
    }).filter(Boolean).sort(function (a, b) {
      return classRank(a.x.class_name) - classRank(b.x.class_name) || String(a.x.class_name).localeCompare(b.x.class_name, 'ar') ||
        a.x.full_name.localeCompare(b.x.full_name, 'ar');
    });
  }

  // تصفية شاشة «دفعات الطلاب»: الشعبة والبحث، ثم الحالة (anyStatus: تُتجاهل الحالة لحساب أعداد كل حالة)
  function payFiltered(rows, anyStatus) {
    var q = norm(ui.tpSearch), cls = ui.tpClass;
    return rows.filter(function (r) {
      if (cls === '-' ? r.x.class_name : cls && r.x.class_name !== cls) return false;
      if (!anyStatus && ui.tpStatus && r.status !== ui.tpStatus) return false;
      return !q || norm(r.x.full_name + ' ' + r.g.assembly_point).indexOf(q) > -1;
    });
  }

  function payTotals(rows) {
    // by / byCount: المحصَّل وعدد الدفعات لكل وسيلة دفع
    var t = { n: rows.length, due: 0, paid: 0, left: 0, owing: 0, by: {}, byCount: {} };
    Object.keys(PAY_METHODS).forEach(function (k) { t.by[k] = 0; t.byCount[k] = 0; });
    rows.forEach(function (r) {
      t.due += r.share; t.paid += r.paid; t.left += r.left;
      if (r.left > 0) t.owing++;
      if (r.paid > 0) { var k = PAY_METHODS[r.rec.method] ? r.rec.method : 'cash'; t.by[k] += r.paid; t.byCount[k]++; }
    });
    return t;
  }

  // شريط تفصيل المحصَّل حسب وسيلة الدفع (للشاشات)
  function methodStripHtml(t) {
    return '<div class="method-strip"><b>تفصيل المحصَّل:</b>' + Object.keys(PAY_METHODS).map(function (k) {
      return '<span' + (t.by[k] ? '' : ' class="zero"') + '>' + PAY_METHODS[k] + ' <b>' + plainNum(t.by[k]) + '</b> ج.م' + (t.byCount[k] ? ' (' + t.byCount[k] + ')' : '') + '</span>';
    }).join('') + '</div>';
  }

  // النص نفسه للتقارير المطبوعة
  function methodLine(t) {
    return Object.keys(PAY_METHODS).map(function (k) { return PAY_METHODS[k] + ': ' + plainNum(t.by[k]) + (t.byCount[k] ? ' (' + t.byCount[k] + ')' : ''); }).join(' · ');
  }

  // مجموع كل شعبة، بترتيب الشعب
  function payByClass(rows) {
    var map = {}, list = [];
    rows.forEach(function (r) {
      var name = r.x.class_name || '';
      if (!map[name]) list.push(map[name] = { name: name, rows: [] });
      map[name].rows.push(r);
    });
    list.forEach(function (c) { c.t = payTotals(c.rows); });
    return list;
  }

  // ما يُصدَّر أو يُطبع الآن: مجموعة بعينها، أو ما تعرضه شاشة الدفعات بتصفيتها، أو المدرسة كلها
  function payScope() {
    var g = currentGroup(), all = payRows(), info = [['الشهر', monthLabel(ui.tMonth)]];
    if (g) {
      info.push(['نقطة التجمع', g.assembly_point]);
      return { rows: all.filter(function (r) { return r.g === g; }), info: info, name: g.assembly_point, group: g };
    }
    if (location.hash !== '#/transport/payments') return { rows: all, info: info.concat([['النطاق', 'كل المدرسة']]), name: 'كل المدرسة', whole: true };
    var cls = ui.tpClass, name = cls === '-' ? 'بدون شعبة' : cls || 'كل المدرسة';
    info.push(cls ? ['الشعبة', name] : ['النطاق', name]);
    if (ui.tpStatus) info.push(['الحالة', PAY_STATUS[ui.tpStatus]]);
    if (ui.tpSearch.trim()) info.push(['بحث', ui.tpSearch.trim()]);
    return { rows: payFiltered(all), info: info, name: name + (ui.tpStatus ? ' - ' + PAY_STATUS[ui.tpStatus] : ''),
      oneClass: !!cls, whole: !cls && !ui.tpStatus && !ui.tpSearch.trim() };
  }

  function transportNav(view) {
    var item = function (key, hash, label) {
      return '<button type="button" data-tgo="' + hash + '"' + (view === key ? ' class="on" aria-current="page"' : '') + '>' + label + '</button>';
    };
    return '<nav class="pills" style="margin:0" aria-label="أقسام المواصلات">' + item('groups', '#/transport', 'نقاط التجمع') +
      item('desk', '#/transport/receipt', 'إصدار إيصال') + item('pay', '#/transport/payments', 'دفعات الطلاب') + item('classes', '#/transport/classes', 'ملخص الشعب') + item('archive', '#/transport/archive', 'أرشيف الإيصالات') + '</nav>';
  }

  function payStatsHtml(t, firstSub) {
    var card = function (lbl, num, sub, color) {
      return '<div class="card stat"><span class="lbl">' + lbl + '</span><span class="num"' + (color ? ' style="color:' + color + '"' : '') + '>' + num +
        '</span><span class="sub">' + sub + '</span></div>';
    };
    var cash = function (v) { return plainNum(v) + ' <small>ج.م</small>'; };
    return '<div class="stats">' +
      card('الطلاب المشتركون', t.n, firstSub || monthLabel(ui.tMonth)) +
      card('المطلوب', cash(t.due), 'مجموع اشتراكات الشهر') +
      card('المحصَّل', cash(t.paid), (t.due ? Math.round(t.paid / t.due * 100) : 0) + '% من المطلوب', 'var(--green)') +
      card('المتبقي', cash(t.left), t.owing ? 'لم يسددوا كامل الاشتراك: ' + t.owing : 'لا متأخرات', t.left ? 'var(--red)' : '') + '</div>' +
      (t.by ? methodStripHtml(t) : '');
  }

  var EXPORT_BTNS = '<button type="button" class="btn" data-tpx="xlsx">تصدير Excel</button>' +
    '<button type="button" class="btn" data-tpx="pdf">تصدير PDF / طباعة</button>';

  // محتوى شاشة «دفعات الطلاب» تحت شريط التصفية: الأرقام، الحالات، الجدول
  function payBodyHtml() {
    var all = payRows(), scoped = payFiltered(all, true), rows = payFiltered(all);

  /* ----- إصدار إيصال: يُكتب رقم هوية الطالب فتظهر بياناته ومبلغ اشتراكه، ثم تُسجَّل الدفعة ويُطبع الإيصال ----- */

  // برقم الهوية كاملًا يُعثر على الطالب مباشرة؛ وإلا فبجزء من الرقم أو من الاسم
  function deskMatches(query) {
    var digits = latinDigits(query).replace(/[\s-]/g, ''), n = norm(query);
    if (!n) return [];
    var exact = S.students.filter(function (x) { return x.national_id && x.national_id === digits; });
    if (exact.length) return exact;
    var numeric = /^\d+$/.test(digits);
    return S.students.filter(function (x) {
      return numeric ? digits.length >= 4 && String(x.national_id || '').indexOf(digits) > -1 : norm(x.full_name).indexOf(n) > -1;
    }).slice(0, 8);
  }
