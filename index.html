<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المدرسة</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1c2733;
    --muted: #64748b;
    --line: #e2e8f0;
    --primary: #0f766e;
    --primary-dark: #0b5a54;
    --primary-soft: #e6f4f2;
    --amber: #b45309;
    --amber-soft: #fef3c7;
    --blue: #1d4ed8;
    --blue-soft: #dbeafe;
    --green: #15803d;
    --green-soft: #dcfce7;
    --red: #b91c1c;
    --red-soft: #fee2e2;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  /* الهيكل: قائمة جانبية (يمين الصفحة) ومحتوى */
  #shell { display: flex; min-height: 100vh; }
  #side {
    width: 250px; flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; background: #0b3b37; color: #fff;
  }
  #side .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px; }
  #side .brand .logo {
    width: 38px; height: 38px; flex: none; border-radius: 10px; background: #fff; color: var(--primary-dark);
    display: grid; place-items: center; font-weight: 800; font-size: 1.2rem;
  }
  #side .brand strong { display: block; font-size: 1.05rem; line-height: 1.3; }
  #side .brand small { opacity: .7; font-size: .8rem; }
  #side-nav { flex: 1; padding: 4px 10px 12px; }
  #side-nav h3 { margin: 16px 12px 4px; font-size: .75rem; font-weight: 700; opacity: .55; }
  #side-nav a {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 2px; border-radius: 8px;
    color: #dcefec; text-decoration: none; font-weight: 600;
  }
  #side-nav a:hover { background: rgba(255,255,255,.09); color: #fff; }
  #side-nav a.on { background: #fff; color: var(--primary-dark); }
  #side-nav a:focus-visible, .side-user .btn:focus-visible, #menu-btn:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  #side-nav svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .side-user { padding: 12px 16px 16px; border-top: 1px solid rgba(255,255,255,.14); font-size: .9rem; }
  .side-user .who { font-weight: 700; overflow-wrap: anywhere; }
  .side-user .role { opacity: .7; font-size: .8rem; margin-bottom: 8px; }
  .side-user .btn { width: 100%; background: transparent; color: #fff; border-color: rgba(255,255,255,.4); padding: 6px 12px; }
  .side-user .btn:hover { background: rgba(255,255,255,.12); }
  #content { flex: 1; min-width: 0; }
  .topbar { display: none; align-items: center; gap: 12px; background: var(--primary); color: #fff; padding: 10px 14px; position: sticky; top: 0; z-index: 10; }
  #menu-btn { background: none; border: 0; color: #fff; font-size: 1.6rem; line-height: 1; padding: 2px 8px; cursor: pointer; border-radius: 6px; }
  #scrim { display: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 24px 60px; }
  /* بدون قائمة: قبل الدخول وأثناء انتظار التفعيل */
  #shell.bare #side, #shell.bare #menu-btn { display: none; }
  #shell.bare .topbar { display: flex; justify-content: center; padding: 16px; font-size: 1.15rem; position: static; }

  .page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-head h1 { margin: 0; font-size: 1.45rem; }
  .page-head p { margin: 2px 0 0; color: var(--muted); }

  /* الرئيسية */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stats .card + .card { margin-top: 0; }
  .stat { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, box-shadow .15s; }
  .stat:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .stat .lbl { font-weight: 700; }
  .stat .num { font-size: 2rem; font-weight: 800; color: var(--primary); line-height: 1.2; }
  .stat .sub { color: var(--muted); font-size: .85rem; }
  .quick { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { text-decoration: none; display: inline-block; }
  a.btn:not(.primary):not(.link) { color: var(--ink); }
  .todo a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .todo a:last-child { border-bottom: 0; }
  .todo a:hover { color: var(--primary); }
  .todo .n { font-weight: 800; color: var(--amber); }

  @media (max-width: 900px) {
    .topbar { display: flex; }
    #side { position: fixed; top: 0; bottom: 0; right: 0; width: 270px; z-index: 30; transform: translateX(100%); transition: transform .2s; }
    #shell.open #side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
    #shell.open #scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
    main { padding: 16px 14px 60px; }
    .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat .num { font-size: 1.6rem; }
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { background: #f8fafc; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--red); border-color: #fecaca; }
  .btn.danger:hover { background: var(--red-soft); }
  .btn.link { border: 0; background: none; color: var(--primary); padding: 4px 0; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card + .card { margin-top: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .card .hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }
  input[type=text], input[type=search], input[type=email], input[type=password], textarea, select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    background: #fff;
    width: 100%;
  }
  select { width: auto; }
  textarea { min-height: 90px; resize: vertical; }
  label.field { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
  label.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
  label.check input { width: 18px; height: 18px; accent-color: var(--primary); }

  /* Auth */
  .auth { max-width: 420px; margin: 24px auto; }
  .auth .f { margin-bottom: 12px; }
  .auth .btn.primary { width: 100%; }
  .auth .switch { text-align: center; margin-top: 12px; }

  /* Teacher list */
  .teachers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .teachers .card + .card { margin-top: 0; }
  .teacher {
    text-align: start;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  .teacher:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .teacher .name { font-weight: 700; font-size: 1.05rem; }
  .teacher .subject { color: var(--muted); font-size: .9rem; }
  .teacher .foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .teacher .score { font-weight: 700; color: var(--primary); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 700;
  }
  .badge.new, .badge.pending { background: #eef2f6; color: var(--muted); }
  .badge.edit { background: var(--amber-soft); color: var(--amber); }
  .badge.review { background: var(--blue-soft); color: var(--blue); }
  .badge.approved { background: var(--primary-soft); color: var(--primary); }
  .badge.published { background: var(--green-soft); color: var(--green); }


  /* Evaluation view */
  .eval-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .eval-head h2 { margin: 0; font-size: 1.3rem; }
  .eval-head .sub { color: var(--muted); }

  .stepper { display: flex; list-style: none; padding: 0; margin: 0 0 16px; gap: 8px; }
  .stepper li {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .stepper .num {
    width: 30px; height: 30px; flex: none;
    border-radius: 50%;
    background: #eef2f6;
    display: grid; place-items: center;
    font-weight: 700;
  }
  .stepper .t { font-weight: 700; }
  .stepper .d { font-size: .8rem; }
  .stepper li.current { border-color: var(--primary); color: var(--ink); background: var(--primary-soft); }
  .stepper li.current .num { background: var(--primary); color: #fff; }
  .stepper li.done { color: var(--ink); }
  .stepper li.done .num { background: var(--green); color: #fff; }

  .progress-row { display: flex; justify-content: space-between; gap: 12px; }
  .save-state { color: var(--muted); font-size: .85rem; }
  .progress { height: 8px; background: #eef2f6; border-radius: 999px; overflow: hidden; margin: 6px 0 14px; }
  .progress > div { height: 100%; background: var(--primary); transition: width .2s; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .85rem; margin-bottom: 8px; }

  table.criteria, table.grid { width: 100%; border-collapse: collapse; }
  table.criteria th, table.criteria td, table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 10px 8px; vertical-align: middle; }
  table.criteria th, table.grid th { text-align: start; font-size: .85rem; color: var(--muted); background: #f8fafc; }
  table.criteria td.n { width: 36px; color: var(--muted); text-align: center; }
  table.criteria td.r { width: 1%; white-space: nowrap; }
  table.criteria tr.missing td { background: #fff7ed; }

  .rate { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rate label { position: relative; cursor: pointer; }
  .rate input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .rate span {
    display: grid; place-items: center;
    width: 38px; height: 36px;
    font-weight: 700;
    border-inline-start: 1px solid var(--line);
    background: #fff;
  }
  .rate label:first-child span { border-inline-start: 0; }
  .rate label:hover span { background: var(--primary-soft); }
  .rate input:checked + span { background: var(--primary); color: #fff; }
  .rate input:focus-visible + span { outline: 2px solid var(--primary-dark); outline-offset: -2px; }

  .pill { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 6px; font-weight: 700; background: var(--primary-soft); color: var(--primary); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .summary .box { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .summary .k { color: var(--muted); font-size: .85rem; }
  .summary .v { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

  .notes-block { margin-top: 16px; }
  .notes-block h3 { font-size: 1rem; margin: 0 0 6px; }
  .notes-block p { margin: 0; white-space: pre-wrap; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start; margin-top: 20px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--red-soft); color: var(--red); font-weight: 600; }
  .info { padding: 10px 12px; border-radius: 8px; background: var(--green-soft); color: var(--green); font-weight: 600; margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; }

  #toast {
    position: fixed; bottom: 20px; inset-inline: 16px; margin: 0 auto; max-width: 480px;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }

  /* Visit report */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .grid2 .day { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  input[type=date], input[type=number] { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: #fff; width: 100%; }
  .grid2 select { width: 100%; }
  .domain { border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; margin-top: 16px; background: #fff; }
  .domain h3 { margin: 0; font-size: 1rem; padding: 10px 14px; background: var(--primary-soft); border-bottom: 1px solid #cbd5e1; }
  .domain .body { padding: 12px 14px 14px; }
  .classes-pick { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .domain h3 .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; margin-inline-end: 6px; }
  details.bank { margin-top: 8px; }
  details.bank summary { cursor: pointer; color: var(--primary); font-weight: 700; font-size: .9rem; padding: 4px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; font-size: .9rem; text-align: start;
  }
  .chip:hover { border-color: var(--primary); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip-wrap { display: inline-flex; align-items: center; gap: 2px; }
  .chip-del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px 6px; }
  .chip-del:hover { color: var(--red); }
  .addstmt { display: flex; gap: 8px; margin-top: 10px; }
  .addstmt input { flex: 1; min-width: 0; }
  .visit-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: start; width: 100%; cursor: pointer; }
  .visit-row:hover { border-color: var(--primary); }
  .visit-row .name { font-weight: 700; }
  .visit-row .meta { color: var(--muted); font-size: .9rem; }
  .print-only { display: none; }

  /* ورقة الطباعة: نفس تصميم النموذج الورقي (A4، صفحة واحدة). الأحجام بوحدة em ليُصغَّر الخط عند الحاجة */
  #print-sheet {
    position: fixed; top: 0; left: 0; visibility: hidden; pointer-events: none; z-index: -1;
    width: 184.6mm; /* A4 ناقص هامشين 12.7mm */
    background: #fff; color: #000;
    font-family: Arial, "Times New Roman", sans-serif; font-size: 12pt; line-height: 1.35;
  }
  #print-sheet .ps-title { text-align: center; font-weight: bold; font-size: 1.167em; margin-bottom: .5em; }
  #print-sheet .ps-h { font-weight: bold; font-size: 1.167em; margin: .5em 0 .3em; padding-inline-start: 1em; }
  #print-sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #print-sheet td, #print-sheet th { border: 1px solid #000; padding: .2em .45em; vertical-align: middle; text-align: start; font-weight: normal; }
  #print-sheet .ps-basic td { height: 1.9em; }
  #print-sheet .ps-domains th { font-weight: bold; font-size: 1.167em; text-align: center; height: 2.6em; }
  #print-sheet .ps-domains td { height: 3em; }
  #print-sheet .ps-domains td.c { text-align: center; font-size: 1.167em; }
  #print-sheet .ps-domains td.c.n { font-weight: bold; }
  #print-sheet .ps-text { white-space: pre-wrap; }
  #print-sheet tr.ps-gap td { height: 1em; border-left: 0; border-right: 0; padding: 0; }
  #print-sheet td.ps-notes { height: 5.5em; vertical-align: top; }
  #print-sheet td.ps-notes b { font-size: 1.167em; }
  #print-sheet .ps-rec { margin-top: .8em; min-height: 4.5em; padding: 0 .45em; }
  #print-sheet .ps-signs { display: flex; justify-content: space-between; gap: 1em; margin-top: 1.4em; padding: 0 .45em; }
  #print-sheet .ps-signs div { flex: 1; }
  #print-sheet .ps-signs div:nth-child(2) { text-align: center; }
  #print-sheet .ps-signs div:nth-child(3) { text-align: end; }
  #print-sheet .ps-signs span { display: block; margin-top: .5em; }
  #print-sheet .ps-signs.two div:nth-child(2) { text-align: end; }

  /* ورقة التقييم: نفس تصميم الشاشة (بطاقات الملخص وجدول البنود) مع درجة واضحة في خانة مستقلة */
  #print-sheet.pe { font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; color: #1c2733; line-height: 1.4;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print-sheet .pe-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1em; margin-bottom: .6em; }
  #print-sheet .pe-head .nm { font-size: 1.45em; font-weight: 700; }
  #print-sheet .pe-head .sub { color: #64748b; }
  #print-sheet .pe-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7em; margin-bottom: .7em; }
  #print-sheet .pe-summary > div { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: .6em; padding: .35em; text-align: center; }
  #print-sheet .pe-summary .k { color: #64748b; font-size: .85em; }
  #print-sheet .pe-summary .v { font-size: 1.5em; font-weight: 800; color: #0f766e; line-height: 1.2; }
  #print-sheet .pe-table th, #print-sheet .pe-table td { border: 1px solid #cbd5e1; padding: .22em .5em; line-height: 1.3; }
  #print-sheet .pe-table th { background: #f1f5f9; color: #475569; font-weight: 700; font-size: .9em; }
  #print-sheet .pe-table td.n { text-align: center; color: #64748b; }
  #print-sheet .pe-table th.r, #print-sheet .pe-table td.r { text-align: center; }
  #print-sheet .pe-table td.r { background: #e6f4f2; white-space: nowrap; padding: .1em .3em; }
  #print-sheet .pe-table td.r b { font-size: 1.45em; font-weight: 800; color: #0b5a54; }
  #print-sheet .pe-legend { margin-top: .4em; font-size: .85em; color: #475569; display: flex; flex-wrap: wrap; gap: .2em 1.2em; }
  #print-sheet .pe-legend b { color: #0b5a54; }
  #print-sheet .pe-notes { margin-top: .6em; }
  #print-sheet .pe-notes b { display: block; margin-bottom: .15em; }
  #print-sheet .pe-notes div { white-space: pre-wrap; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: .5em; padding: .3em .6em; }
  #print-sheet .pe-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 2em; margin-top: 1.2em; }
  #print-sheet .pe-signs div { border-top: 2px solid #0f766e; padding-top: .4em; }
  #print-sheet .pe-signs b { display: block; }
  #print-sheet .pe-signs span { display: block; margin-top: .55em; color: #475569; }

  /* Transport */
  .tgroup { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; }
  .tgroup:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .tgroup .name { font-weight: 700; font-size: 1.05rem; }
  .tgroup .meta { color: var(--muted); font-size: .9rem; }
  .tgroup .money { display: flex; justify-content: space-between; font-size: .9rem; margin-top: 4px; }
  .tgroup .progress { display: block; margin: 2px 0 0; }
  table.grid input[type=number] { width: 90px; padding: 6px 8px; }
  table.grid tfoot td { font-weight: 700; background: #f8fafc; }
  .badge.paid { background: var(--green-soft); color: var(--green); }
  .badge.part { background: var(--amber-soft); color: var(--amber); }
  .badge.unpaid { background: var(--red-soft); color: var(--red); }
  .cand { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .cand:last-child { border-bottom: 0; }
  .cand .meta { color: var(--muted); font-size: .85rem; }

  table.grid td .mnote { display: block; margin-top: 6px; width: 150px; padding: 6px 8px; }

  .formhint { margin-top: 4px; font-size: .85rem; color: var(--amber); background: var(--amber-soft); border-radius: 6px; padding: 2px 8px; overflow-wrap: anywhere; }

  /* ملف الطالب المطبوع */

  /* ---------- البيانات ---------- */

  async function loadAll() {
    S.ready = false;
    render();
    var p = await sb.from('profiles').select('*').eq('id', S.uid).maybeSingle();
    if (p.error) fail(p.error);
    S.profile = p.data || null;
    S.teachers = []; S.users = []; S.settings = null; S.results = null;
    S.visits = []; S.statements = []; S.visitsMissing = false; S.defaultPw = ''; S.accountsMissing = false;
    S.students = []; S.studentsMissing = false; S.regMissing = false;
    S.tGroups = []; S.tMembers = []; S.tPay = {}; S.transportMissing = false;

    if (isStaff()) {
      var res = await Promise.all([
        sb.from('teachers').select('*').order('name'),
        sb.from('settings').select('*').eq('id', 1).maybeSingle(),
        isAdmin() ? sb.from('profiles').select('*').order('created_at') : Promise.resolve({ data: [] })
      ]);
      if (res[0].error) fail(res[0].error);
      S.teachers = res[0].data || [];
      S.settings = res[1].data || null;
      S.users = res[2].data || [];

      var vis = await Promise.all([
        sb.from('visits').select('*').order('visit_date', { ascending: false }),
        sb.from('statements').select('*').order('created_at')
      ]);
      // الجدولان غير موجودين إلى أن يُشغَّل الملف supabase/visits.sql
      if (isAdmin()) {
        // غير موجود إلى أن يُشغَّل الملف supabase/teacher_accounts.sql
        var ps = await sb.from('private_settings').select('*').eq('id', 1).maybeSingle();
        S.accountsMissing = !!ps.error;
        S.defaultPw = (ps.data && ps.data.default_password) || '';
        await loadStudents();
        await loadTransport();
      }
      S.visitsMissing = !!(vis[0].error || vis[1].error);
      S.visits = vis[0].data || [];
      S.statements = vis[1].data || [];
    }
    S.ready = true;
    render();
  }

  // قاعدة البيانات تعيد ألف صف كحد أقصى في الطلب الواحد، فتُجلب الجداول الكبيرة على دفعات.
  // make: دالة تبني الاستعلام من جديد لكل دفعة. تعيد null عند الخطأ (الجدول غير موجود بعد)
  async function fetchAll(make) {
    var all = [], page = 1000;
    for (var from = 0; ; from += page) {
      var r = await make().range(from, from + page - 1);
      if (r.error) return null;
      all = all.concat(r.data || []);
      if (!r.data || r.data.length < page) return all;
    }
  }

  async function loadStudents() {
    // الجدول غير موجود إلى أن يُشغَّل الملف supabase/students.sql
    var all = await fetchAll(function () { return sb.from('students').select('*').order('full_name'); });
    S.studentsMissing = !all;
    S.students = all || [];
    // أعمدة التسجيل على مرحلتين غير موجودة إلى أن يُشغَّل الملف supabase/student_registration.sql
    S.regMissing = !!all && !!(await sb.from('students').select('status').limit(1)).error;
    // عمود «يحتاج مواصلات» أُضيف لاحقًا إلى الملف نفسه
    S.wantsMissing = !!all && !!(await sb.from('students').select('wants_transport').limit(1)).error;
  }

  async function loadTransport() {
    // الجداول غير موجودة إلى أن يُشغَّل الملف supabase/transport.sql
    var g = await sb.from('transport_groups').select('*').order('assembly_point');
    var m = g.error ? null : await fetchAll(function () { return sb.from('transport_members').select('*').order('joined_at'); });
    S.transportMissing = !m;
    // عمود التسميات البديلة أُضيف لاحقًا إلى supabase/transport.sql
    S.aliasMissing = !!m && !!(await sb.from('transport_groups').select('aliases').limit(1)).error;
    S.tGroups = g.data || [];
    S.tMembers = m || [];
    S.tPay = {};
  }

  // مدفوعات الشهر تُجلب عند أول عرض له ثم تُحفظ: { studentId: صف الدفعة }
  var loadingPay = {};
  async function loadPayments(month) {
    if (loadingPay[month]) return;
    loadingPay[month] = true;
    var rows = await fetchAll(function () { return sb.from('transport_payments').select('*').eq('month', month).order('student_id'); });
    loadingPay[month] = false;
    var map = {};
    (rows || []).forEach(function (p) { p.amount = Number(p.amount) || 0; map[p.student_id] = p; });
    S.tPay[month] = map;
    render();
  }

  var loadingResults = false;
  async function loadResults() {
    if (loadingResults) return;
    loadingResults = true;
    var r = await sb.rpc('get_results');
    loadingResults = false;
    if (r.error) fail(r.error);
    S.results = (r.data && r.data.results) || [];
    if (!isStaff() && r.data && r.data.settings) S.settings = r.data.settings;
    render();
  }

  // الحفظ التلقائي أثناء التحرير
  var saveTimer = null, dirty = null;

  function setSaveState(text) {
    var el = document.getElementById('save-state');
    if (el) el.textContent = text;
  }

  async function saveNow(t) {
    var r = await sb.from('teachers').update({
      status: t.status,
      ratings: t.ratings,
      notes: t.notes,
      approver_notes: t.approver_notes,
      approved_at: t.approved_at,
      published_at: t.published_at
    }).eq('id', t.id);
    if (r.error) { setSaveState('لم يتم الحفظ'); fail(r.error); return false; }
    setSaveState('تم الحفظ');
    return true;
  }

  function queueSave(t) {
    clearTimeout(saveTimer);
    dirty = t;
    setSaveState('جارٍ الحفظ…');
    saveTimer = setTimeout(function () { saveTimer = null; saveNow(t); }, 600);
  }

  function flush() {
    var a = true, b = true;
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; a = saveNow(dirty); }
    if (visitTimer) { clearTimeout(visitTimer); visitTimer = null; b = saveVisit(visitDirty); }
    return Promise.all([a, b]);
  }

  var visitTimer = null, visitDirty = null;

  async function saveVisit(v) {
    var r = await sb.from('visits').update({
      visit_date: v.visit_date,
      subject: v.subject,
      class_section: v.class_section,
      period: v.period,
      lesson_title: v.lesson_title,
      visit_number: v.visit_number,
      strengths: v.strengths,
      development: v.development,
      recommendations: v.recommendations,
      supervisor_name: v.supervisor_name,
      principal_name: v.principal_name
    }).eq('id', v.id);
    if (r.error) { setSaveState('لم يتم الحفظ'); fail(r.error); return false; }
    setSaveState('تم الحفظ');
    return true;
  }

  function queueVisit(v) {
    clearTimeout(visitTimer);
    visitDirty = v;
    setSaveState('جارٍ الحفظ…');
    visitTimer = setTimeout(function () { visitTimer = null; saveVisit(v); }, 600);
  }

  function activeKey() {
    var h = location.hash;
    if (!isStaff()) return 'results';
    if (h === '#/teachers' || /^#\/t\//.test(h)) return 'teachers';
    if (h === '#/visits' || /^#\/v\//.test(h)) return 'visits';

  async function saveTeacherForm() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
    var t = ui.editTeacher !== 'new' ? find(ui.editTeacher) : null;
    var data = {
      name: g('tf-name'), subject: splitList(g('tf-subject')).join('، '), phone: g('tf-phone'),
      classes: Array.prototype.map.call(document.querySelectorAll('[name="tf-class"]:checked'), function (c) { return c.value; }).join('، '),
      qualification: g('tf-qualification'), hire_date: g('tf-hire') || null, details: g('tf-details')
    };
    var login = g('tf-login');
    if (login) {
      if (login.indexOf('@') < 0 && !/^[a-z0-9._-]{3,}$/i.test(login)) {
        return toast('اسم المستخدم: ثلاثة أحرف إنجليزية أو أرقام على الأقل، بدون مسافات.', true);
      }
      if (S.defaultPw.length < 6) return toast('احفظ كلمة المرور الافتراضية أولًا (6 أحرف على الأقل).', true);
    }

    if (t) {
      var up = await sb.from('teachers').update(data).eq('id', t.id);
      if (up.error) return fail(up.error);
      Object.assign(t, data);
    } else {
      var ins = await sb.from('teachers').insert(data).select().single();
      if (ins.error) return fail(ins.error);
      t = ins.data;
      t.ratings = t.ratings || {};
      S.teachers.push(t);
      S.teachers.sort(function (a, b) { return a.name.localeCompare(b.name, 'ar'); });
    }

    if (login && !t.user_id) {
      var acc = await sb.rpc('create_teacher_account', { p_teacher: t.id, p_login: toEmail(login), p_password: S.defaultPw });
      if (acc.error) {
        // بيانات المعلم حُفظت، والحساب لم يُنشأ: يبقى النموذج مفتوحًا لتصحيح اسم المستخدم
        ui.editTeacher = t.id;
        render();
        return fail(acc.error);
      }
      t.user_id = acc.data;
      t.login = toEmail(login);
      // ليظهر الحساب الجديد في قائمة المستخدمين
      var us = await sb.from('profiles').select('*').order('created_at');
      if (!us.error) S.users = us.data || [];
    }
    ui.editTeacher = null;
    render();
    toast('تم الحفظ');
  }

  async function saveClasses(list) {
    var r = await sb.from('settings').update({ classes: list }).eq('id', 1);
    if (r.error) return fail(r.error);
    (S.settings || (S.settings = {})).classes = list;
    render();
    var box = document.getElementById('new-class');
    if (box) box.focus();
  }

  function addClass() {
    var name = document.getElementById('new-class').value.trim();
    if (!name) return;
    if (schoolClasses().indexOf(name) > -1) return toast('هذا الصف موجود مسبقًا.', true);
    saveClasses(schoolClasses().concat([name]));
  }

  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'new-class' && isAdmin()) { e.preventDefault(); addClass(); }
  });

  document.addEventListener('click', async function (e) {
    if (!isAdmin()) return;
    var el, t;
    if (e.target.closest('[data-addclass]')) return addClass();
    if ((el = e.target.closest('[data-delclass]'))) {
      var gone = el.getAttribute('data-delclass');
      return saveClasses(schoolClasses().filter(function (c) { return c !== gone; }));
    }
    if ((el = e.target.closest('[data-tedit]'))) {
      ui.editTeacher = el.getAttribute('data-tedit') || null;
      render();
      var first = document.getElementById('tf-name');
      if (first) { first.focus(); first.scrollIntoView({ block: 'center' }); }
    } else if ((el = e.target.closest('[data-treset]'))) {
      t = find(el.getAttribute('data-treset'));
      if (S.defaultPw.length < 6) return toast('احفظ كلمة المرور الافتراضية أولًا (6 أحرف على الأقل).', true);
      if (!confirm('إعادة كلمة مرور «' + t.name + '» إلى الكلمة الافتراضية؟')) return;
      var r = await sb.rpc('reset_teacher_password', { p_teacher: t.id, p_password: S.defaultPw });
      if (r.error) return fail(r.error);
      toast('تمت إعادة تعيين كلمة المرور');
    } else if ((el = e.target.closest('[data-tdel]'))) {
      t = find(el.getAttribute('data-tdel'));
      if (!confirm('هل تريد حذف «' + t.name + '» مع تقييمه وتقارير زياراته وحسابه نهائيًا؟')) return;
      var d = await sb.from('teachers').delete().eq('id', t.id);
      if (d.error) return fail(d.error);
      S.teachers = S.teachers.filter(function (x) { return x.id !== t.id; });
      S.visits = S.visits.filter(function (x) { return x.teacher_id !== t.id; });
      if (ui.editTeacher === t.id) ui.editTeacher = null;
      render();
    }
  });

  /* ---------- الطلاب (مدير النظام) ---------- */

  // حقول استمارة التسجيل. match: كلمات تُعرَف بها أعمدة ملف Excel (بعد توحيد الحروف)
  var ST_FIELDS = [
    { k: 'full_name', label: 'اسم الطالب رباعي', req: true, match: ['اسم الطالب'] },
    { k: 'national_id', label: 'رقم هوية الطالب', req: true, ltr: true, num: true, match: ['هويه'] },

    { k: 'birth_date', label: 'تاريخ الميلاد', type: 'date', req: true, match: ['الميلاد'] },
    { k: 'phone', label: 'رقم الهاتف الأساسي', req: true, ltr: true, num: true, match: ['الهاتف', 'الجوال'] },
    { k: 'whatsapp', label: 'رقم الواتساب', req: true, ltr: true, num: true, match: ['واتس'] },

    { k: 'has_prev_certificate', label: 'هل حصل على شهادة العام السابق؟', type: 'yn', req: true, match: ['شهاده'] },
    { k: 'prev_grade', label: 'التقدير في العام السابق', dep: 'has_prev_certificate', list: ['ممتاز', 'جيد جدًا', 'جيد', 'مقبول', 'ضعيف'], match: ['التقدير'] },
    { k: 'guardian_name', label: 'اسم ولي الأمر بالكامل', match: ['اسم ولي'] },
    { k: 'guardian_relation', label: 'صلة القرابة بالطالب', match: ['صله', 'القرابه'] },
    { k: 'guardian_job', label: 'مهنة ولي الأمر', match: ['مهنه'] },
    { k: 'has_health_condition', label: 'هل يعاني الطالب من أي حالة صحية؟', type: 'yn', req: true, match: ['صحيه'] },
    { k: 'takes_medication', label: 'هل يتناول الطالب أي أدوية بشكل منتظم؟', type: 'yn', req: true, match: ['ادويه'] },
    { k: 'has_special_needs', label: 'هل لدى الطالب أي احتياجات تعليمية خاصة أو صعوبات في التعلم؟', type: 'yn', req: true, match: ['احتياجات', 'صعوبات'] },
    { k: 'is_orphan', label: 'هل الطفل يتيم؟', type: 'yn', req: true, match: ['يتيم'] },
    { k: 'orphan_of', label: 'في حالة أن الطفل يتيم: يتيم الأب أم الأم أم الاثنين معًا؟', type: 'select', options: ['الأب', 'الأم', 'الاثنين معًا'], dep: 'is_orphan', match: ['في حاله'] },
    { k: 'memorizes_quran', label: 'هل الطفل يحفظ شيئًا من القرآن؟', type: 'yn', req: true, match: ['يحفظ', 'القران'] },
    { k: 'quran_parts', label: 'ما عدد الأجزاء التي يحفظها الطفل؟', type: 'number', dep: 'memorizes_quran', match: ['الاجزاء'] }
  ];
  // عند مطابقة عناوين الأعمدة: الحقول الأخص أولًا (عنوان «في حالة أن الطفل يتيم…» يحتوي كلمة «يتيم» أيضًا)
  var ST_MATCH_ORDER = ['orphan_of', 'quran_parts', 'guardian_name'].concat(ST_FIELDS.map(function (f) { return f.k; }));

  // المستندات التي يُحضرها ولي الأمر عند مراجعة التسجيل في المدرسة
  var ST_DOCS = [
    ['birth', 'شهادة الميلاد'],
    ['guardian_id', 'صورة هوية أو إقامة ولي الأمر'],
    ['certificate', 'شهادة العام السابق'],
    ['photos', 'صور شخصية']
  ];

  var ST_STATUS = { pending: 'تسجيل مبدئي', final: 'تسجيل نهائي' };

  function stStatus(x) { return x.status === 'final' ? 'final' : 'pending'; }

  function stField(k) {
    for (var i = 0; i < ST_FIELDS.length; i++) if (ST_FIELDS[i].k === k) return ST_FIELDS[i];
  }

  function findStudent(id) {
    for (var i = 0; i < S.students.length; i++) if (S.students[i].id === id) return S.students[i];
    return null;
  }

  // توحيد الكتابة العربية للمقارنة: بلا تشكيل، وبهمزات وتاء مربوطة موحّدة
  function norm(x) {
    return String(x == null ? '' : x)
      .replace(/[ً-ْـ*؟?:]/g, '')
      .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
      .replace(/\s+/g, ' ').trim().toLowerCase();
  }

  function latinDigits(x) {
    return String(x == null ? '' : x).replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).trim();
  }

  function yesNo(v) { return v === true ? 'نعم' : v === false ? 'لا' : ''; }

  function studentFieldHtml(f, st) {
    var v = st ? st[f.k] : null, id = 'sf-' + f.k, inner;
    var star = f.req || f.dep ? ' <span class="req">*</span>' : '';
    if (f.type === 'yn') {
      inner = '<div class="yn" role="radiogroup" aria-label="' + f.label + '">' +
        [['yes', 'نعم', true], ['no', 'لا', false]].map(function (o) {
          return '<label class="check"><input type="radio" name="' + id + '" value="' + o[0] + '"' + (v === o[2] ? ' checked' : '') + ' required>' + o[1] + '</label>';
        }).join('') + '</div>';
    } else if (f.type === 'class') {
      inner = '<select id="' + id + '" required>' + optionsHtml(schoolClasses(), v || '') + '</select>' +
        '<div class="day">' + (schoolClasses().length ? 'يُحدَّد عند اعتماد التسجيل النهائي.' : 'عرّف صفوف المدرسة أولًا من «الإعدادات والمستخدمون».') + '</div>';
    } else if (f.type === 'select') {
      inner = '<select id="' + id + '"' + (f.req ? ' required' : '') + '>' + optionsHtml(f.options.slice(), v || '') + '</select>';
    } else {
      inner = '<input type="' + (f.type || 'text') + '" id="' + id + '"' + (f.req ? ' required' : '') +
        (f.ltr ? ' dir="ltr" style="text-align:right"' : '') + (f.num ? ' inputmode="numeric"' : '') +
        (f.type === 'number' ? ' min="0" max="30" step="0.5"' : '') +
        (f.list ? ' list="' + id + '-list"' : '') + ' value="' + esc(v == null ? '' : v) + '">' +
        (f.list ? '<datalist id="' + id + '-list">' + f.list.map(function (o) { return '<option value="' + o + '">'; }).join('') + '</datalist>' : '');
    }
    // ما كتبه ولي الأمر في الاستمارة، إن اختلف عن القيمة الحالية (للمراجعة مع المستندات)
    var raw = st && st.form_answers ? st.form_answers[f.k] : '';
    var cur = f.type === 'yn' ? yesNo(v) : (v == null ? '' : String(v));
    var hint = raw && norm(raw) !== norm(cur) ? '<div class="formhint">في الاستمارة: ' + esc(raw) + '</div>' : '';
    return '<div' + (f.wide ? ' style="grid-column:1/-1"' : '') + (f.dep ? ' data-dep="' + f.dep + '"' : '') + '>' +
      '<label class="field"' + (f.type === 'yn' ? '' : ' for="' + id + '"') + '>' + f.label + star + '</label>' + inner + hint + '</div>';
  }

  // الحقول التابعة (التقدير، نوع اليتم، عدد الأجزاء) تظهر وتصبح مطلوبة عند الإجابة بنعم
  function syncStudentDeps() {
    var deps = app.querySelectorAll('#student-form [data-dep]');
    for (var i = 0; i < deps.length; i++) {
      var yes = app.querySelector('[name="sf-' + deps[i].getAttribute('data-dep') + '"][value="yes"]');
      var on = !!(yes && yes.checked), input = deps[i].querySelector('input, select');

      input.required = on;
    }

  // معايير إضافية لتصفية الطلاب (وللطباعة). extra: عمود إضافي يظهر في الكشف المطبوع
  var ST_FLAGS = {
    orphan: { label: 'الأيتام', test: function (x) { return x.is_orphan === true; }, extra: ['يتيم', function (x) { return x.orphan_of; }] },
    health: { label: 'لديهم حالة صحية', test: function (x) { return x.has_health_condition === true; } },
    meds: { label: 'يتناولون أدوية بانتظام', test: function (x) { return x.takes_medication === true; } },
    needs: { label: 'احتياجات تعليمية خاصة أو صعوبات تعلم', test: function (x) { return x.has_special_needs === true; } },
    quran: { label: 'يحفظون من القرآن', test: function (x) { return x.memorizes_quran === true; }, extra: ['عدد الأجزاء', function (x) { return x.quran_parts; }] },
    nocert: { label: 'بدون شهادة العام السابق', test: function (x) { return x.has_prev_certificate === false; } },

    notransport: { label: 'غير مشتركين في المواصلات', test: function (x, groupOf) { return !groupOf[x.id]; } },
    wantsride: { label: 'يحتاجون مواصلات بلا نقطة تجمع', test: function (x, groupOf) { return x.wants_transport === true && !groupOf[x.id]; } },
    noride: { label: 'لا يحتاجون مواصلات', test: function (x) { return x.wants_transport === false; } },
    rideunknown: { label: 'لم يُحدَّد احتياجهم للمواصلات', test: function (x, groupOf) { return x.wants_transport == null && !groupOf[x.id]; } }
  };

  function transportGroupOf() {
    var map = {};
    S.tMembers.forEach(function (m) { map[m.student_id] = m.group_id; });
    return map;
  }

  // الطلاب المطابقون للبحث والحالة والصف والمعيار المختار
  function filteredStudents() {
    var q = norm(ui.stSearch), cls = ui.stClass, flag = ST_FLAGS[ui.stFlag], groupOf = flag ? transportGroupOf() : null;
    return S.students.filter(function (x) {
      if (ui.stStatus && stStatus(x) !== ui.stStatus) return false;
      if (cls === '-' ? x.class_name : cls && x.class_name !== cls) return false;
      if (flag && !flag.test(x, groupOf)) return false;
      return !q || norm(x.full_name).indexOf(q) > -1 || String(x.national_id || '').indexOf(latinDigits(ui.stSearch)) > -1;
    });
  }

  // كشف مطبوع بكل الطلاب المطابقين (قد يمتد لأكثر من صفحة، ويتكرر رأس الجدول)

      list.map(function (x, i) {

      }).join('') + '</tbody></table>';
  }

  // ملف الطالب المطبوع: كل بياناته في صفحة واحدة
  var pendingProfile = null;

  function buildProfileSheet(x) {

  // mode: 'final' يعتمد التسجيل النهائي (بعد اكتمال البيانات والصف)، 'save' يحفظ فقط
  async function saveStudentForm(mode) {
    var st = ui.editStudent !== 'new' ? findStudent(ui.editStudent) : null, data = {};
    ST_FIELDS.forEach(function (f) {
      if (f.type === 'yn') {
        var c = app.querySelector('[name="sf-' + f.k + '"]:checked');
        data[f.k] = c ? c.value === 'yes' : null;
      } else {
        var v = document.getElementById('sf-' + f.k).value.trim();
        data[f.k] = f.type === 'date' ? (v || null) : f.type === 'number' ? (v === '' ? null : Number(v)) : f.num ? latinDigits(v) : v;
      }
    });
    // الحقول التابعة تُفرَّغ عند الإجابة بلا
    if (!data.has_prev_certificate) data.prev_grade = '';
    if (!data.is_orphan) data.orphan_of = '';
    if (!data.memorizes_quran) data.quran_parts = null;
    data.documents = {};
    Array.prototype.forEach.call(app.querySelectorAll('[name="sf-doc"]:checked'), function (c) { data.documents[c.value] = true; });
    data.documents_note = document.getElementById('sf-docnote').value.trim();

    var wantsEl = document.getElementById('sf-wants'), rideEl = document.getElementById('sf-transport');
    if (wantsEl) data.wants_transport = rideEl.value || wantsEl.value === 'yes' ? true : wantsEl.value === 'no' ? false : null;

    if (!data.full_name) return toast('اكتب اسم الطالب.', true);
    var wasFinal = st && stStatus(st) === 'final';
    if (mode === 'final' && !wasFinal) {
      var missing = ST_DOCS.filter(function (d) { return !data.documents[d[0]]; }).map(function (d) { return d[1]; });
      if (missing.length && !confirm('لم تُسجَّل هذه المستندات: ' + missing.join('، ') + '.\nهل تريد اعتماد التسجيل النهائي مع ذلك؟')) return;
      data.status = 'final';
      data.finalized_at = new Date().toISOString();
    } else if (!st) {
      data.status = 'pending';
    }

    var r = st
      ? await sb.from('students').update(data).eq('id', st.id)
      : await sb.from('students').insert(data).select().single();
    if (r.error) {
      return /duplicate|unique/i.test(r.error.message) ? toast('رقم الهوية مسجل نهائيًا لطالب آخر.', true) : fail(r.error);
    }
    if (st) Object.assign(st, data); else S.students.push(st = r.data);
    S.students.sort(function (a, b) { return a.full_name.localeCompare(b.full_name, 'ar'); });

    var pick = document.getElementById('sf-transport');
    if (pick) {
      var was = transportGroupOf()[st.id] || '', want = pick.value, tr = null;
      if (want && want !== was) {
        tr = await sb.from('transport_members').upsert({ student_id: st.id, group_id: want, share: null }, { onConflict: 'student_id' });
      } else if (!want && was) {
        tr = await sb.from('transport_members').delete().eq('student_id', st.id);
      }
      if (tr && tr.error) {
        // بيانات الطالب حُفظت؛ المواصلات لم تتغير
        ui.editStudent = st.id;
        render();
        return fail(tr.error);
      }
      if (tr) {
        S.tMembers = S.tMembers.filter(function (m) { return m.student_id !== st.id; });
        if (want) S.tMembers.push({ student_id: st.id, group_id: want, share: null });
      }
    }
    ui.editStudent = null;
    render();
    toast(data.status === 'final' ? 'تم اعتماد التسجيل النهائي' : 'تم الحفظ');
  }

  /* ----- الاستيراد من Excel ----- */

  // مكتبة قراءة Excel تُحمَّل عند الحاجة فقط
  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
      sc.onload = resolve;
      sc.onerror = function () { reject(new Error('تعذر تحميل مكتبة قراءة Excel')); };
      document.head.appendChild(sc);
    });
  }

  function parseYesNo(x) {
    x = norm(x);
    if (!x) return null;
    if (/^(نعم|yes|true|1|ايوه|اه)/.test(x)) return true;
    if (/^(لا|no|false|0)/.test(x)) return false;
    return null;
  }

  // يقبل 2015-03-21 أو 21/3/2015 (اليوم أولًا)، ويرفض السنوات غير المعقولة لطالب
  function parseDate(x) {
    x = latinDigits(x);
    var m = x.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/), y, mo, d;
    if (m) { y = m[1]; mo = m[2]; d = m[3]; }
    else if ((m = x.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) { d = m[1]; mo = m[2]; y = m[3]; }
    else return null;
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || y < 1990 || y > new Date().getFullYear() - 2) return null;
    return y + '-' + ('0' + mo).slice(-2) + '-' + ('0' + d).slice(-2);
  }

  function parseOrphanOf(x) {
    x = norm(x);
    if (!x) return '';
    if (/اثنين|كلا|معا|ابوين|والدين/.test(x) || (/اب/.test(x) && /ام/.test(x))) return 'الاثنين معًا';
    if (/ام/.test(x)) return 'الأم';
    if (/اب/.test(x)) return 'الأب';
    return '';
  }

  function parseGender(x) {
    x = norm(x);
    return /^(ذكر|ولد|male|m$)/.test(x) ? 'ذكر' : /^(انثي|بنت|female|f$)/.test(x) ? 'أنثى' : '';
  }

  // Excel يحذف الصفر الأول من أرقام الجوال المخزّنة كأرقام
  function parsePhone(x) {
    x = latinDigits(x).replace(/[\s-]/g, '');
    // رقم فلسطيني 5xxxxxxxx أو مصري 1xxxxxxxxx
    return /^(5\d{8}|1[0125]\d{8})$/.test(x) ? '0' + x : x;
  }

  async function readImportFile(file) {
    try {
      await loadXlsx();
      var wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
      var raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
      if (!raw.length) return toast('الملف لا يحتوي على بيانات.', true);

      // مطابقة عناوين الأعمدة مع حقول الاستمارة
      var headers = Object.keys(raw[0]), col = {}, used = {};
      ST_MATCH_ORDER.forEach(function (k) {
        if (col[k]) return;
        var f = stField(k);
        for (var i = 0; i < headers.length; i++) {
          var h = norm(headers[i]);
          if (!used[headers[i]] && f.match.some(function (w) { return h.indexOf(w) > -1; })) {
            col[k] = headers[i]; used[headers[i]] = true; break;
          }
        }
      });
      if (!col.full_name) return toast('لم يُعثر في الملف على عمود «اسم الطالب».', true);
      // ملفات ردود النماذج فيها طابع زمني لكل رد: يُعرَف به الرد عند إعادة الاستيراد
      var stamp = headers.filter(function (h) { return /timestamp|طابع زمني/.test(norm(h)); })[0];
      if (stamp) used[stamp] = true;

      var haveKey = {}, haveId = {};
      S.students.forEach(function (x) { if (x.form_key) haveKey[x.form_key] = true; if (x.national_id) haveId[x.national_id] = true; });

      var rows = [], errors = [], seenId = {}, skipped = 0, dupIds = 0, noId = 0;
      raw.forEach(function (row, i) {
        var get = function (k) {
          var x = col[k] ? row[col[k]] : '';
          // خلايا التاريخ تصل ككائن Date (منتصف الليل UTC مع انحراف بسيط أحيانًا)
          if (x instanceof Date) return new Date(x.getTime() + 12 * 3600e3).toISOString().slice(0, 10);
          // تُحذف علامات الاتجاه غير المرئية التي تُلصق مع الأرقام المنسوخة
          return String(x).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, '').trim();
        };
        var answers = {};
        ST_FIELDS.forEach(function (f) { var a = get(f.k); if (a) answers[f.k] = a; });
        // رقم الهوية: أرقام فقط إن أمكن، وإلا النص كما كُتب ليُصحَّح عند المراجعة
        var idDigits = latinDigits(get('national_id')).replace(/[\s-]/g, '');
        var validId = /^\d{5,20}$/.test(idDigits);
        var ts = stamp ? row[stamp] : '';
        var parts = parseFloat(latinDigits(get('quran_parts')));
        var d = {
          full_name: get('full_name').replace(/\s+/g, ' '),
          national_id: validId ? idDigits : '',
          gender: parseGender(get('gender')),
          phone: parsePhone(get('phone')),
          whatsapp: parsePhone(get('whatsapp')),
          email: get('email'),
          birth_date: parseDate(get('birth_date')),
          address: get('address'),
          class_name: '',
          requested_class: get('class_name'),
          has_prev_certificate: parseYesNo(get('has_prev_certificate')),
          prev_grade: get('prev_grade'),
          guardian_name: get('guardian_name'),
          guardian_relation: get('guardian_relation'),
          guardian_job: get('guardian_job'),
          has_health_condition: parseYesNo(get('has_health_condition')),
          takes_medication: parseYesNo(get('takes_medication')),
          has_special_needs: parseYesNo(get('has_special_needs')),
          is_orphan: parseYesNo(get('is_orphan')),
          orphan_of: parseOrphanOf(get('orphan_of')),
          memorizes_quran: parseYesNo(get('memorizes_quran')),
          quran_parts: !isNaN(parts) && parts >= 0 && parts <= 30 ? parts : null,
          status: 'pending',
          form_key: ts instanceof Date ? ts.toISOString() : (ts === '' ? null : String(ts)),
          form_answers: answers
        };
        if (!d.is_orphan) d.orphan_of = '';
        if (!d.full_name && !Object.keys(answers).length) return; // صف فارغ
        if (!d.full_name) return errors.push('الصف ' + (i + 2) + ': اسم الطالب ناقص');
        // لا تُعدَّل بيانات من سبق استيراده: يُعرَف برد الاستمارة، أو برقم الهوية في الملفات الأخرى
        if (d.form_key ? haveKey[d.form_key] : (d.national_id && haveId[d.national_id])) return skipped++;
        if (!d.national_id) noId++;
        else if (seenId[d.national_id] || haveId[d.national_id]) dupIds++;
        seenId[d.national_id] = true;
        rows.push(d);
      });

      ui.imp = {
        file: file.name, rows: rows, errors: errors, skipped: skipped, dupIds: dupIds, noId: noId,
        mapped: ST_FIELDS.filter(function (f) { return col[f.k]; }).map(function (f) { return f.k; }),
        unmapped: headers.filter(function (h) { return !used[h]; })
      };
      render();
    } catch (err) {
      toast('تعذر قراءة الملف: ' + err.message, true);
    }
  }

  async function runImport() {
    var rows = ui.imp.rows;
    for (var i = 0; i < rows.length; i += 100) {
      var r = await sb.from('students').insert(rows.slice(i, i + 100));
      if (r.error) { await loadStudents(); render(); return fail(r.error); }
    }
    await loadStudents();
    ui.imp = null;
    ui.stStatus = 'pending';
    render();
    toast('تم استيراد الطلاب (' + rows.length + ') بحالة تسجيل مبدئي');
  }

  async function downloadTemplate() {
    try {
      await loadXlsx();
      var ws = XLSX.utils.aoa_to_sheet([ST_FIELDS.map(function (f) { return f.label; })]);
      ws['!cols'] = ST_FIELDS.map(function () { return { wch: 26 }; });
      var wb = XLSX.utils.book_new();
      wb.Workbook = { Views: [{ RTL: true }] };
      XLSX.utils.book_append_sheet(wb, ws, 'الطلاب');
      XLSX.writeFile(wb, 'قالب-تسجيل-الطلاب.xlsx');
    } catch (err) {
      toast(err.message, true);
    }
  }

  document.addEventListener('click', async function (e) {
    if (!isAdmin() || location.hash !== '#/students') return;
    var el, st, r;
    if ((el = e.target.closest('[data-stedit]'))) {
      ui.editStudent = el.getAttribute('data-stedit') || null;
      render();
      var first = document.getElementById('sf-full_name');
      if (first) { first.focus(); window.scrollTo(0, 0); }
    } else if ((el = e.target.closest('[data-stprofile]'))) {
      pendingProfile = findStudent(el.getAttribute('data-stprofile'));
      printNow();
    } else if ((el = e.target.closest('[data-stunfinal]'))) {
      st = findStudent(el.getAttribute('data-stunfinal'));
      if (!confirm('إعادة تسجيل «' + st.full_name + '» إلى الحالة المبدئية؟')) return;
      r = await sb.from('students').update({ status: 'pending', finalized_at: null }).eq('id', st.id);
      if (r.error) return fail(r.error);
      st.status = 'pending'; st.finalized_at = null;
      render();
    } else if ((el = e.target.closest('[data-stdel]'))) {
      st = findStudent(el.getAttribute('data-stdel'));
      if (!confirm('هل تريد حذف الطالب «' + st.full_name + '» نهائيًا؟')) return;
      r = await sb.from('students').delete().eq('id', st.id);
      if (r.error) return fail(r.error);
      S.students = S.students.filter(function (x) { return x.id !== st.id; });
      S.tMembers = S.tMembers.filter(function (m) { return m.student_id !== st.id; });
      render();
    } else if (e.target.closest('[data-stprint]')) {
      if (!filteredStudents().length) return toast('لا يوجد طلاب مطابقون للطباعة.', true);
      printNow();
    } else if (e.target.closest('[data-impopen]')) {
      document.getElementById('imp-file').click();
    } else if (e.target.closest('[data-imptemplate]')) {
      downloadTemplate();
    } else if (e.target.closest('[data-impcancel]')) {
      ui.imp = null;
      render();
    } else if ((el = e.target.closest('[data-impgo]'))) {
      el.disabled = true;
      el.textContent = 'جارٍ الاستيراد…';
      runImport();
    }
  });

  app.addEventListener('change', async function (e) {
    if (!isAdmin() || location.hash !== '#/students') return;
    var el = e.target;
    if (el.id === 'imp-file') {
      if (el.files[0]) readImportFile(el.files[0]);

  app.addEventListener('input', function (e) {
    if (e.target.id !== 'st-search' || !isAdmin()) return;
    ui.stSearch = e.target.value;
    document.getElementById('st-table').innerHTML = studentsTableHtml();
  });

  /* ---------- مواصلات الطلاب (مدير النظام) ---------- */

  function findGroup(id) {
    for (var i = 0; i < S.tGroups.length; i++) if (S.tGroups[i].id === id) return S.tGroups[i];
    return null;
  }

  function currentGroup() {
    var m = location.hash.match(/^#\/transport\/(.+)$/);
    return m && isAdmin() ? findGroup(m[1]) : null;
  }

  function membersOf(gid) {
    return S.tMembers.filter(function (m) { return m.group_id === gid && findStudent(m.student_id); });
  }

  // حصة الطالب: المحددة له، وإلا اشتراك المجموعة
  function shareOf(m, g) {
    return m.share != null && m.share !== '' ? Number(m.share) : Number(g.fee) || 0;
  }

  // المبالغ بالجنيه المصري
  function money(x) {
    return (Math.round(x * 100) / 100).toLocaleString('en') + ' ج.م';
  }

  function thisMonth() {
    return todayISO().slice(0, 7);
  }

  function monthLabel(m) {
    return new Date(m + '-01T00:00').toLocaleDateString('ar', { month: 'long', year: 'numeric' });
  }

  // المطلوب والمحصَّل لمجموعة في الشهر المعروض
  function groupTotals(g) {
    var pay = S.tPay[ui.tMonth] || {}, due = 0, paid = 0, n = 0;
    membersOf(g.id).forEach(function (m) { n++; due += shareOf(m, g); paid += pay[m.student_id] ? pay[m.student_id].amount : 0; });
    return { n: n, due: due, paid: paid };
  }

  function groupFormHtml(g) {
    var val = function (k) { return esc(g && g[k] != null ? g[k] : ''); };
    var f = function (id, label, inner, wide) {
      return '<div' + (wide ? ' style="grid-column:1/-1"' : '') + '><label class="field" for="' + id + '">' + label + '</label>' + inner + '</div>';
    };
    return '<form class="card" id="group-form"><h2>' + (g ? 'تعديل المجموعة' : 'مجموعة مواصلات جديدة') + '</h2>' +
      '<div class="grid2" style="margin-top:12px">' +
        f('gf-point', 'نقطة التجمع <span class="req">*</span>', '<input type="text" id="gf-point" required placeholder="مثال: دوار المدينة" value="' + val('assembly_point') + '">') +
        f('gf-time', 'وقت التجمع', '<input type="time" id="gf-time" value="' + val('pickup_time') + '">') +
        f('gf-sup', 'المشرف المرافق', '<input type="text" id="gf-sup" list="gf-sup-list" value="' + val('supervisor_name') + '">' +
          '<datalist id="gf-sup-list">' + S.teachers.map(function (t) { return '<option value="' + esc(t.name) + '">'; }).join('') + '</datalist>') +
        f('gf-phone', 'هاتف المشرف', '<input type="text" id="gf-phone" dir="ltr" inputmode="tel" style="text-align:right" value="' + val('supervisor_phone') + '">') +
        f('gf-fee', 'اشتراك الطالب الشهري (بالجنيه المصري)', '<input type="number" id="gf-fee" min="0" step="any" value="' + val('fee') + '">' +
          '<div class="day">حصة كل طالب من أجرة المواصلات شهريًا؛ يمكن تعديلها لطالب بعينه داخل المجموعة.</div>') +
        f('gf-notes', 'ملاحظات', '<input type="text" id="gf-notes" value="' + val('notes') + '">') +
      '</div><div class="actions"><button type="submit" class="btn primary">حفظ</button>' +
      '<button type="button" class="btn" data-gedit="">إلغاء</button></div></form>';
  }

  // مرشحون للإضافة: طلاب ليسوا في هذه المجموعة، بالبحث في الاسم أو الهوية أو العنوان أو الصف
  function candidatesHtml(g) {
    var q = norm(ui.tSearch), inGroup = {};
    S.tMembers.forEach(function (m) { inGroup[m.student_id] = m.group_id; });
    var list = S.students.filter(function (x) {
      if (inGroup[x.id] === g.id) return false;
      return !q || norm(x.full_name + ' ' + x.address + ' ' + x.class_name).indexOf(q) > -1 || x.national_id.indexOf(latinDigits(ui.tSearch)) > -1;
    });
    // غير الملتحقين بأي مجموعة أولًا
    list.sort(function (a, b) { return (inGroup[a.id] ? 1 : 0) - (inGroup[b.id] ? 1 : 0); });
    var LIMIT = 30;
    return (list.slice(0, LIMIT).map(function (x) {
      var other = inGroup[x.id] && findGroup(inGroup[x.id]);
      return '<div class="cand"><span><b>' + esc(x.full_name) + '</b><br><span class="meta">' + esc(x.class_name || 'بدون صف') +
        (x.address ? ' · ' + esc(x.address) : '') + (other ? ' · في مجموعة «' + esc(other.assembly_point) + '»' : '') + '</span></span>' +
        '<button type="button" class="btn" data-madd="' + x.id + '">' + (other ? 'نقل إلى هنا' : 'إضافة') + '</button></div>';
    }).join('') || '<div class="empty">' + (S.students.length ? 'لا يوجد طلاب مطابقون.' : 'سجّل الطلاب أولًا من تبويب «تسجيل الطلاب».') + '</div>') +
      (list.length > LIMIT ? '<p class="st-count" style="margin-top:8px">يُعرض أول ' + LIMIT + ' من ' + list.length + '؛ اكتب في البحث لتضييق القائمة.</p>' : '');
  }

  function membersTableHtml(g) {
    var pay = S.tPay[ui.tMonth] || {}, members = membersOf(g.id), due = 0, paid = 0;
    members.sort(function (a, b) { return findStudent(a.student_id).full_name.localeCompare(findStudent(b.student_id).full_name, 'ar'); });
    var rows = members.map(function (m, i) {
      var x = findStudent(m.student_id), sh = shareOf(m, g), rec = pay[x.id] || {}, p = rec.amount || 0;
      var method = rec.method || 'cash';
      due += sh; paid += p;
      var badge = sh > 0 && p >= sh ? ['paid', 'مدفوع'] : p > 0 ? ['part', 'جزئي'] : sh > 0 ? ['unpaid', 'غير مدفوع'] : ['pending', '—'];
      return '<tr><td>' + (i + 1) + '</td><td><b>' + esc(x.full_name) + '</b><br><span class="meta" style="color:var(--muted);font-size:.85rem">' + esc(x.class_name || 'بدون صف') + '</span></td>' +
        '<td dir="ltr" style="text-align:right">' + esc(x.whatsapp || x.phone || '—') + '</td>' +
        '<td><input type="number" min="0" step="any" data-mshare="' + x.id + '" aria-label="حصة ' + esc(x.full_name) + '" placeholder="' + (Number(g.fee) || 0) + '" value="' + (m.share != null ? esc(m.share) : '') + '"></td>' +
        '<td><input type="number" min="0" step="any" data-mpaid="' + x.id + '" aria-label="المدفوع من ' + esc(x.full_name) + '" value="' + (p || '') + '"></td>' +
        '<td><select data-mmethod="' + x.id + '" aria-label="طريقة دفع ' + esc(x.full_name) + '">' + Object.keys(PAY_METHODS).map(function (k) {
          return '<option value="' + k + '"' + (k === method ? ' selected' : '') + '>' + PAY_METHODS[k] + '</option>';
        }).join('') + '</select>' +
        (method === 'other' ? '<input type="text" class="mnote" data-mnote="' + x.id + '" placeholder="حدّد طريقة الدفع" aria-label="طريقة الدفع الأخرى" value="' + esc(rec.method_note || '') + '">' : '') + '</td>' +
        '<td><span class="badge ' + badge[0] + '">' + badge[1] + '</span></td>' +
        '<td class="no-print" style="white-space:nowrap">' + (p > 0 ? '<button type="button" class="btn" data-mreceipt="' + x.id + '">إيصال</button> ' : '') + (sh > p ? '<button type="button" class="btn" data-mfull="' + x.id + '">دفع كامل</button> ' : '') +
        '<button type="button" class="btn danger" data-mdel="' + x.id + '">إزالة</button></td></tr>';
    }).join('');
    return rows
      ? '<div class="table-wrap"><table class="grid"><thead><tr><th>م</th><th>الطالب</th><th>واتساب ولي الأمر</th><th>الحصة (ج.م)</th><th>المدفوع (ج.م)</th><th>طريقة الدفع</th><th>الحالة</th><th class="no-print"></th></tr></thead>' +
        '<tbody>' + rows + '</tbody><tfoot><tr><td colspan="3">المجموع</td><td>' + money(due) + '</td><td>' + money(paid) + '</td>' +
        '<td colspan="3">المتبقي: ' + money(Math.max(0, due - paid)) + '</td></tr></tfoot></table></div>'
      : '<div class="empty">لا يوجد طلاب في هذه المجموعة بعد.</div>';
  }

    if (S.studentsMissing || S.transportMissing) {
      app.innerHTML = tabs('transport') + '<div class="card empty">لم تُجهَّز قاعدة البيانات للمواصلات بعد.<br>' +
        'شغّل الملف <code dir="ltr">supabase/' + (S.studentsMissing ? 'students.sql ثم transport.sql' : 'transport.sql') + '</code> في محرر SQL ثم حدّث الصفحة.</div>';

          '<button type="button" class="btn danger" data-gdel="' + g.id + '">حذف المجموعة</button></div></div>' +
        (editing ? groupFormHtml(g) : '') +
        '<div class="card"><div class="toolbar" style="align-items:center"><h2 style="margin:0;flex:1">الطلاب (' + tot.n + ') — ' + monthLabel(ui.tMonth) + '</h2>' +
          '<span class="no-print" style="display:flex;gap:8px;align-items:center">' + monthPick + '</span></div>' +
          '<div id="t-members">' + membersTableHtml(g) + '</div></div>' +
        '<div class="card no-print"><h2>إضافة طلاب إلى المجموعة</h2>' +
          '<input type="search" id="t-search" placeholder="ابحث بالاسم أو رقم الهوية أو العنوان أو الصف" aria-label="بحث عن طالب" style="margin:8px 0" value="' + esc(ui.tSearch) + '">' +
          '<div id="t-cands">' + candidatesHtml(g) + '</div></div>';
      return;
    }

    var all = { n: 0, due: 0, paid: 0 };
    var cards = S.tGroups.map(function (x) {
      var t = groupTotals(x);
      all.n += t.n; all.due += t.due; all.paid += t.paid;
      return '<a class="card tgroup" href="#/transport/' + x.id + '">' +
        '<span class="name">' + esc(x.assembly_point) + '</span>' +
        '<span class="meta">المشرف: ' + esc(x.supervisor_name || '—') + (x.pickup_time ? ' · ' + esc(x.pickup_time) : '') + '</span>' +
        '<span class="meta">عدد الطلاب: ' + t.n + ' · الاشتراك ' + money(Number(x.fee) || 0) + '</span>' +
        '<span class="money"><span>المحصَّل: <b>' + money(t.paid) + '</b></span><span>المطلوب: ' + money(t.due) + '</span></span>' +
        '<span class="progress"><span style="display:block;height:100%;background:var(--primary);width:' + (t.due ? Math.min(100, t.paid / t.due * 100) : 0) + '%"></span></span></a>';
    }).join('');

    app.innerHTML = tabs('transport') +
      (ui.editGroup === 'new' ? groupFormHtml(null) :
        '<div class="toolbar" style="align-items:center"><button type="button" class="btn primary" data-gedit="new">+ مجموعة جديدة</button>' +
        '<button type="button" class="btn" data-clopen>اقتراح نقاط التجمع من العناوين</button>' +
        '<span style="flex:1"></span>' + monthPick + '</div>') +
      (cards
        ? '<p class="st-count">' + monthLabel(ui.tMonth) + ' — المجموعات: ' + S.tGroups.length + ' · الطلاب: ' + all.n + ' · المحصَّل ' + money(all.paid) + ' من ' + money(all.due) + '</p>' +
          '<div class="teachers">' + cards + '</div>'
        : '<div class="card empty">لا توجد مجموعات مواصلات بعد. أنشئ مجموعة لكل نقطة تجمع.</div>');
  }

  async function saveGroupForm() {
    var g = ui.editGroup !== 'new' ? findGroup(ui.editGroup) : null;
    var v = function (id) { return document.getElementById(id).value.trim(); };
    var data = {
      assembly_point: v('gf-point'), pickup_time: v('gf-time'), supervisor_name: v('gf-sup'),
      supervisor_phone: latinDigits(v('gf-phone')), fee: Number(v('gf-fee')) || 0, notes: v('gf-notes')
    };
    if (g) {
      var up = await sb.from('transport_groups').update(data).eq('id', g.id);
      if (up.error) return fail(up.error);
      Object.assign(g, data);
      ui.editGroup = null;
      render();
    } else {
