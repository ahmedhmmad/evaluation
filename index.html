<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم المعلمين</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1c2733;
    --muted: #64748b;
    --line: #e2e8f0;
    --primary: #0f766e;
    --primary-dark: #0b5a54;
    --primary-soft: #e6f4f2;
    --amber: #b45309;
    --amber-soft: #fef3c7;
    --blue: #1d4ed8;
    --blue-soft: #dbeafe;
    --green: #15803d;
    --green-soft: #dcfce7;
    --red: #b91c1c;
    --red-soft: #fee2e2;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  header.app {
    background: var(--primary);
    color: #fff;
    padding: 16px;
  }
  header.app .inner, main {
    max-width: 1000px;
    margin: 0 auto;
  }
  header.app .inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header.app h1 { margin: 0; font-size: 1.3rem; }
  header.app p { margin: 2px 0 0; opacity: .85; font-size: .9rem; }
  .userbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .9rem; }
  .userbar .who { opacity: .9; }
  .userbar .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); padding: 4px 12px; }
  .userbar .btn:hover { background: rgba(255,255,255,.15); }
  main { padding: 20px 16px 60px; }

  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  nav.tabs a {
    padding: 8px 14px;
    text-decoration: none;
    color: var(--muted);
    font-weight: 700;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
  }
  nav.tabs a:hover { color: var(--ink); }
  nav.tabs a.on { color: var(--primary); border-bottom-color: var(--primary); }

  button, input, textarea, select { font: inherit; color: inherit; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { background: #f8fafc; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--red); border-color: #fecaca; }
  .btn.danger:hover { background: var(--red-soft); }
  .btn.link { border: 0; background: none; color: var(--primary); padding: 4px 0; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card + .card { margin-top: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .card .hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }
  input[type=text], input[type=search], input[type=email], input[type=password], textarea, select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    background: #fff;
    width: 100%;
  }
  select { width: auto; }
  textarea { min-height: 90px; resize: vertical; }
  label.field { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
  label.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
  label.check input { width: 18px; height: 18px; accent-color: var(--primary); }

  /* Auth */
  .auth { max-width: 420px; margin: 24px auto; }
  .auth .f { margin-bottom: 12px; }
  .auth .btn.primary { width: 100%; }
  .auth .switch { text-align: center; margin-top: 12px; }

  /* Teacher list */
  .teachers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .teachers .card + .card { margin-top: 0; }
  .teacher {
    text-align: start;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  .teacher:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .teacher .name { font-weight: 700; font-size: 1.05rem; }
  .teacher .subject { color: var(--muted); font-size: .9rem; }
  .teacher .foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .teacher .score { font-weight: 700; color: var(--primary); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 700;
  }
  .badge.new, .badge.pending { background: #eef2f6; color: var(--muted); }
  .badge.edit { background: var(--amber-soft); color: var(--amber); }
  .badge.review { background: var(--blue-soft); color: var(--blue); }
  .badge.approved { background: var(--primary-soft); color: var(--primary); }
  .badge.published { background: var(--green-soft); color: var(--green); }

  .add-form { display: none; margin-bottom: 16px; }
  .add-form.open { display: block; }
  .add-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

  /* Evaluation view */
  .eval-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .eval-head h2 { margin: 0; font-size: 1.3rem; }
  .eval-head .sub { color: var(--muted); }

  .stepper { display: flex; list-style: none; padding: 0; margin: 0 0 16px; gap: 8px; }
  .stepper li {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .stepper .num {
    width: 30px; height: 30px; flex: none;
    border-radius: 50%;
    background: #eef2f6;
    display: grid; place-items: center;
    font-weight: 700;
  }
  .stepper .t { font-weight: 700; }
  .stepper .d { font-size: .8rem; }
  .stepper li.current { border-color: var(--primary); color: var(--ink); background: var(--primary-soft); }
  .stepper li.current .num { background: var(--primary); color: #fff; }
  .stepper li.done { color: var(--ink); }
  .stepper li.done .num { background: var(--green); color: #fff; }

  .progress-row { display: flex; justify-content: space-between; gap: 12px; }
  .save-state { color: var(--muted); font-size: .85rem; }
  .progress { height: 8px; background: #eef2f6; border-radius: 999px; overflow: hidden; margin: 6px 0 14px; }
  .progress > div { height: 100%; background: var(--primary); transition: width .2s; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .85rem; margin-bottom: 8px; }

  table.criteria, table.grid { width: 100%; border-collapse: collapse; }
  table.criteria th, table.criteria td, table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 10px 8px; vertical-align: middle; }
  table.criteria th, table.grid th { text-align: start; font-size: .85rem; color: var(--muted); background: #f8fafc; }
  table.criteria td.n { width: 36px; color: var(--muted); text-align: center; }
  table.criteria td.r { width: 1%; white-space: nowrap; }
  table.criteria tr.missing td { background: #fff7ed; }

  .rate { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rate label { position: relative; cursor: pointer; }
  .rate input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .rate span {
    display: grid; place-items: center;
    width: 38px; height: 36px;
    font-weight: 700;
    border-inline-start: 1px solid var(--line);
    background: #fff;
  }
  .rate label:first-child span { border-inline-start: 0; }
  .rate label:hover span { background: var(--primary-soft); }
  .rate input:checked + span { background: var(--primary); color: #fff; }
  .rate input:focus-visible + span { outline: 2px solid var(--primary-dark); outline-offset: -2px; }

  .pill { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 6px; font-weight: 700; background: var(--primary-soft); color: var(--primary); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .summary .box { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .summary .k { color: var(--muted); font-size: .85rem; }
  .summary .v { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

  .notes-block { margin-top: 16px; }
  .notes-block h3 { font-size: 1rem; margin: 0 0 6px; }
  .notes-block p { margin: 0; white-space: pre-wrap; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start; margin-top: 20px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--red-soft); color: var(--red); font-weight: 600; }
  .info { padding: 10px 12px; border-radius: 8px; background: var(--green-soft); color: var(--green); font-weight: 600; margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; }

  #toast {
    position: fixed; bottom: 20px; inset-inline: 16px; margin: 0 auto; max-width: 480px;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }

  /* Visit report */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .grid2 .day { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  input[type=date], input[type=number] { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: #fff; width: 100%; }
  .grid2 select { width: 100%; }
  .domain { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .domain:last-child { border-bottom: 0; padding-bottom: 0; }
  .domain h3 { margin: 0 0 6px; font-size: 1rem; }
  .domain h3 .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-size: .85rem; margin-inline-end: 6px; }
  details.bank { margin-top: 8px; }
  details.bank summary { cursor: pointer; color: var(--primary); font-weight: 700; font-size: .9rem; padding: 4px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; font-size: .9rem; text-align: start;
  }
  .chip:hover { border-color: var(--primary); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip-wrap { display: inline-flex; align-items: center; gap: 2px; }
  .chip-del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px 6px; }
  .chip-del:hover { color: var(--red); }
  .addstmt { display: flex; gap: 8px; margin-top: 10px; }
  .addstmt input { flex: 1; min-width: 0; }
  .visit-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: start; width: 100%; cursor: pointer; }
  .visit-row:hover { border-color: var(--primary); }
  .visit-row .name { font-weight: 700; }
  .visit-row .meta { color: var(--muted); font-size: .9rem; }
  .print-only { display: none; }

  /* ورقة الطباعة: نفس تصميم النموذج الورقي (A4، صفحة واحدة). الأحجام بوحدة em ليُصغَّر الخط عند الحاجة */
  #print-sheet {
    position: fixed; top: 0; left: 0; visibility: hidden; pointer-events: none; z-index: -1;
    width: 184.6mm; /* A4 ناقص هامشين 12.7mm */
    background: #fff; color: #000;
    font-family: Arial, "Times New Roman", sans-serif; font-size: 12pt; line-height: 1.35;
  }
  #print-sheet .ps-title { text-align: center; font-weight: bold; font-size: 1.167em; margin-bottom: .5em; }
  #print-sheet .ps-h { font-weight: bold; font-size: 1.167em; margin: .5em 0 .3em; padding-inline-start: 1em; }
  #print-sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #print-sheet td, #print-sheet th { border: 1px solid #000; padding: .2em .45em; vertical-align: middle; text-align: start; font-weight: normal; }
  #print-sheet .ps-basic td { height: 1.9em; }
  #print-sheet .ps-domains th { font-weight: bold; font-size: 1.167em; text-align: center; height: 2.6em; }
  #print-sheet .ps-domains td { height: 3em; }
  #print-sheet .ps-domains td.c { text-align: center; font-size: 1.167em; }
  #print-sheet .ps-domains td.c.n { font-weight: bold; }
  #print-sheet .ps-text { white-space: pre-wrap; }
  #print-sheet tr.ps-gap td { height: 1em; border-left: 0; border-right: 0; padding: 0; }
  #print-sheet td.ps-notes { height: 5.5em; vertical-align: top; }
  #print-sheet td.ps-notes b { font-size: 1.167em; }
  #print-sheet .ps-rec { margin-top: .8em; min-height: 4.5em; padding: 0 .45em; }
  #print-sheet .ps-signs { display: flex; justify-content: space-between; gap: 1em; margin-top: 1.4em; padding: 0 .45em; }
  #print-sheet .ps-signs div { flex: 1; }
  #print-sheet .ps-signs div:nth-child(2) { text-align: center; }
  #print-sheet .ps-signs div:nth-child(3) { text-align: end; }
  #print-sheet .ps-signs span { display: block; margin-top: .5em; }
  #print-sheet .ps-signs.two div:nth-child(2) { text-align: end; }

  /* ورقة التقييم: نفس تصميم الشاشة (بطاقات الملخص وجدول البنود) مع درجة واضحة في خانة مستقلة */
  #print-sheet.pe { font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; color: #1c2733; line-height: 1.4;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #print-sheet .pe-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1em; margin-bottom: .6em; }
  #print-sheet .pe-head .nm { font-size: 1.45em; font-weight: 700; }
  #print-sheet .pe-head .sub { color: #64748b; }
  #print-sheet .pe-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7em; margin-bottom: .7em; }
  #print-sheet .pe-summary > div { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: .6em; padding: .35em; text-align: center; }
  #print-sheet .pe-summary .k { color: #64748b; font-size: .85em; }
  #print-sheet .pe-summary .v { font-size: 1.5em; font-weight: 800; color: #0f766e; line-height: 1.2; }
  #print-sheet .pe-table th, #print-sheet .pe-table td { border: 1px solid #cbd5e1; padding: .22em .5em; line-height: 1.3; }
  #print-sheet .pe-table th { background: #f1f5f9; color: #475569; font-weight: 700; font-size: .9em; }
  #print-sheet .pe-table td.n { text-align: center; color: #64748b; }
  #print-sheet .pe-table th.r, #print-sheet .pe-table td.r { text-align: center; }
  #print-sheet .pe-table td.r { background: #e6f4f2; white-space: nowrap; padding: .1em .3em; }
  #print-sheet .pe-table td.r b { font-size: 1.45em; font-weight: 800; color: #0b5a54; }
  #print-sheet .pe-table td.r small { font-size: .8em; color: #0b5a54; margin-inline-start: .35em; }
  #print-sheet .pe-notes { margin-top: .6em; }
  #print-sheet .pe-notes b { display: block; margin-bottom: .15em; }
  #print-sheet .pe-notes div { white-space: pre-wrap; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: .5em; padding: .3em .6em; }
  #print-sheet .pe-signs { display: grid; grid-template-columns: 1fr 1fr; gap: 2em; margin-top: 1.2em; }
  #print-sheet .pe-signs div { border-top: 2px solid #0f766e; padding-top: .4em; }
  #print-sheet .pe-signs b { display: block; }
  #print-sheet .pe-signs span { display: block; margin-top: .55em; color: #475569; }

  @media (max-width: 640px) {
    .grid2 { grid-template-columns: 1fr; }
    .add-form .row { grid-template-columns: 1fr; }
    .stepper .d { display: none; }
    /* على الهاتف: نص البند في سطر، وأزرار التقييم بعرض كامل تحته */
    table.criteria.edit thead { display: none; }
    table.criteria.edit tr { display: grid; grid-template-columns: 30px 1fr; border-bottom: 1px solid var(--line); }
    table.criteria.edit td { border-bottom: 0; }
    table.criteria.edit td.n { width: auto; }
    table.criteria.edit td.r { grid-column: 1 / -1; width: auto; padding-top: 0; }
    .rate { display: flex; }
    .rate label { flex: 1; }
    .rate span { width: 100%; height: 44px; }
    .eval-head h2 { font-size: 1.15rem; }
    main { padding: 16px 12px 60px; }
  }
  @page { size: A4; margin: 12.7mm; }
  @media print {
    body { background: #fff; }
    header.app, .no-print, .stepper, nav.tabs, #toast { display: none !important; }
    main { padding: 0; max-width: none; }
    .card { border: 0; padding: 0; }
    .print-only { display: block; }
    textarea, details.bank { display: none !important; }
    body.print-sheet > *:not(#print-sheet) { display: none !important; }
    body.print-sheet #print-sheet { position: static; visibility: visible; }
    input, select { border: 0 !important; padding: 0 !important; background: none !important; appearance: none; }
    .card h2 { border-bottom: 1px solid #000; padding-bottom: 4px; margin-top: 14px; }
    .domain { break-inside: avoid; padding: 8px 0; }
  }
</style>
</head>
<body>
<header class="app">
  <div class="inner">
    <div>
      <h1>تقييم المعلمين</h1>
      <p>نموذج التقييم الأدائي والكفايات الشخصية</p>
    </div>
    <div class="userbar" id="userbar"></div>
  </div>
</header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-sheet" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';

  // البنود مأخوذة من «نموذج تقييم معلم»
  var CRITERIA = [
    'المهارة في إعداد وتحضير وتنفيذ خطط الدروس الصفية',
    'يضع أهدافًا تعليمية محددة وقابلة للقياس',
    'يضع أنشطة متنوعة لتحديد الاحتياجات التعليمية لمختلف التلاميذ',
    'يراعي ما لدى الطلاب من معارف وخبرات سابقة في تخطيط الدروس',
    'يصمم أساليب مختلفة ومناسبة لتقويم أداء التلاميذ',
    'يدير وقت التدريس داخل الصف إدارة فعالة',
    'التمكن من المادة العلمية والقدرة على تحقيق الأهداف',
    'يظهر عمليًا امتلاكه لمهارات الإدارة الصفية',
    'يؤكد على ضمان مشاركة الطلاب في أنشطة التعلم بغض النظر عما بينهم من فروق من حيث النوع ومستوى التحصيل الدراسي والاحتياجات الخاصة وغير ذلك',
    'يشارك الطلاب في تصميم بيئة التعلم ويشجعهم على ذلك',
    'يستخدم الموارد التعليمية المختلفة استخدامًا فعالًا في شرح المفاهيم والمهارات المتعلقة بالمستوى التعليمي',
    'يوظف معطيات تكنولوجيا التعليم في زيادة فرص الاكتشاف ومعالجة المعلومات والتعلم بالممارسة',
    'يستخدم أسئلة كاشفة (عميقة) وأسئلة مفتوحة (غير محددة الإجابة) إلى الطلاب لتشجيعهم على التفكير',
    'يستخدم استراتيجيات تدريس متنوعة لزيادة المشاركة الطلابية النشطة في التعلم',
    'يؤكد في تدريسه على تنمية المهارات الاجتماعية ومهارات العمل التعاوني لدى الطلاب',

  async function loadAll() {
    S.ready = false;
    render();
    var p = await sb.from('profiles').select('*').eq('id', S.uid).maybeSingle();
    if (p.error) fail(p.error);
    S.profile = p.data || null;
    S.teachers = []; S.users = []; S.settings = null; S.results = null;
    S.visits = []; S.statements = []; S.visitsMissing = false;

    if (isStaff()) {
      var res = await Promise.all([
        sb.from('teachers').select('*').order('name'),
        sb.from('settings').select('*').eq('id', 1).maybeSingle(),
        isAdmin() ? sb.from('profiles').select('*').order('created_at') : Promise.resolve({ data: [] })
      ]);
      if (res[0].error) fail(res[0].error);
      S.teachers = res[0].data || [];
      S.settings = res[1].data || null;
      S.users = res[2].data || [];

      var vis = await Promise.all([
        sb.from('visits').select('*').order('visit_date', { ascending: false }),
        sb.from('statements').select('*').order('created_at')
      ]);
      // الجدولان غير موجودين إلى أن يُشغَّل الملف supabase/visits.sql
      S.visitsMissing = !!(vis[0].error || vis[1].error);
      S.visits = vis[0].data || [];
      S.statements = vis[1].data || [];
    }
    S.ready = true;
    render();
  }

  // الحفظ التلقائي أثناء التحرير
  var saveTimer = null, dirty = null;

  function setSaveState(text) {
    var el = document.getElementById('save-state');
    if (el) el.textContent = text;
  }

  async function saveNow(t) {
    var r = await sb.from('teachers').update({
      status: t.status,
      ratings: t.ratings,
      notes: t.notes,
      approver_notes: t.approver_notes,
      approved_at: t.approved_at,
      published_at: t.published_at
    }).eq('id', t.id);
    if (r.error) { setSaveState('لم يتم الحفظ'); fail(r.error); return false; }
    setSaveState('تم الحفظ');
    return true;
  }

  function queueSave(t) {
    clearTimeout(saveTimer);
    dirty = t;
    setSaveState('جارٍ الحفظ…');
    saveTimer = setTimeout(function () { saveTimer = null; saveNow(t); }, 600);
  }

  function flush() {
    var a = true, b = true;
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; a = saveNow(dirty); }
    if (visitTimer) { clearTimeout(visitTimer); visitTimer = null; b = saveVisit(visitDirty); }
    return Promise.all([a, b]);
  }

  var visitTimer = null, visitDirty = null;

  async function saveVisit(v) {
    var r = await sb.from('visits').update({
      visit_date: v.visit_date,
      subject: v.subject,
      class_section: v.class_section,
      period: v.period,
      lesson_title: v.lesson_title,
      visit_number: v.visit_number,
      strengths: v.strengths,
      development: v.development,
      recommendations: v.recommendations,
      supervisor_name: v.supervisor_name,
      principal_name: v.principal_name
    }).eq('id', v.id);
    if (r.error) { setSaveState('لم يتم الحفظ'); fail(r.error); return false; }
    setSaveState('تم الحفظ');
    return true;
  }

  function queueVisit(v) {

  /* ---------- التقييم ---------- */

  function stepper(t) {
    var cur = stepIndex(t.status);
    var allDone = t.status === 'published';
    return '<ol class="stepper">' + STEPS.map(function (s, i) {
      var cls = allDone || i < cur ? 'done' : (i === cur ? 'current' : '');
      return '<li class="' + cls + '"' + (cls === 'current' ? ' aria-current="step"' : '') + '>' +
        '<span class="num">' + (cls === 'done' ? '✓' : i + 1) + '</span>' +
        '<span><span class="t">' + s.title + '</span><br><span class="d">' + s.desc + '</span></span></li>';
    }).join('') + '</ol>';
  }

  function summary(sum) {
    var pct = Math.round(sum / MAX * 100);
    return '<div class="summary">' +
      '<div class="box"><div class="k">المجموع</div><div class="v">' + sum + ' / ' + MAX + '</div></div>' +
      '<div class="box"><div class="k">النسبة</div><div class="v">' + pct + '%</div></div>' +
      '<div class="box"><div class="k">التقدير</div><div class="v">' + grade(pct) + '</div></div>' +
      '</div>';
  }

  function readOnlyTable(ratings) {
    return '<div class="table-wrap"><table class="criteria"><thead><tr><th>م</th><th>التقييم الأدائي والكفايات الشخصية</th><th>التقييم</th></tr></thead><tbody>' +
      CRITERIA.map(function (c, i) {
        return '<tr><td class="n">' + (i + 1) + '</td><td>' + c + '</td><td class="r"><span class="pill">' + (ratings[i] || '—') + '</span></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function notesBlock(title, text) {
    return text ? '<div class="notes-block"><h3>' + title + '</h3><p>' + esc(text) + '</p></div>' : '';
  }

  function editStep(t) {
    var done = ratedCount(t);
    var rows = CRITERIA.map(function (c, i) {
      var opts = SCALE.slice().reverse().map(function (s) {
        return '<label title="' + s.label + '"><input type="radio" name="c' + i + '" value="' + s.v + '"' +
          (t.ratings[i] === s.v ? ' checked' : '') + ' aria-label="' + s.v + ' - ' + s.label + '"><span>' + s.v + '</span></label>';
      }).join('');
      var missing = ui.error && !t.ratings[i] ? ' class="missing"' : '';
      return '<tr' + missing + '><td class="n">' + (i + 1) + '</td><td>' + c + '</td>' +
        '<td class="r"><span class="rate" role="radiogroup" aria-label="تقييم البند ' + (i + 1) + '">' + opts + '</span></td></tr>';
    }).join('');

    return '<div class="card">' +
      '<div class="progress-row"><span id="progress-text">تم تقييم ' + done + ' من ' + CRITERIA.length + ' بندًا</span>' +
      '<span class="save-state" id="save-state"></span></div>' +
      '<div class="progress"><div id="progress-bar" style="width:' + (done / CRITERIA.length * 100) + '%"></div></div>' +
      '<div class="legend">' + SCALE.map(function (s) { return '<span><b>' + s.v + '</b> = ' + s.label + '</span>'; }).join('') + '</div>' +
      '<div class="table-wrap"><table class="criteria edit"><thead><tr><th>م</th><th>التقييم الأدائي والكفايات الشخصية</th><th>التقييم</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="notes-block"><label class="field" for="notes">ملاحظات المشرف</label>' +
      '<textarea id="notes" placeholder="نقاط القوة، فرص التحسين، التوصيات...">' + esc(t.notes) + '</textarea></div>' +
      (ui.error ? '<div class="msg" role="alert">' + ui.error + '</div>' : '') +
      '<div class="actions">' +
        '<button type="button" class="btn primary" data-act="submit">إرسال للاعتماد</button>' +
        '<button type="button" class="btn" data-act="back">حفظ كمسودة</button>' +
      '</div></div>';
  }

  function reviewStep(t) {
    return '<div class="card">' + summary(total(t)) + readOnlyTable(t.ratings) +
      notesBlock('ملاحظات المشرف', t.notes) +
      '<div class="notes-block"><label class="field" for="approver-notes">ملاحظات الاعتماد</label>' +
      '<textarea id="approver-notes" placeholder="ملاحظات المعتمِد (اختياري)">' + esc(t.approver_notes) + '</textarea></div>' +
      '<div class="actions">' +
        '<button type="button" class="btn primary" data-act="approve">اعتماد التقييم</button>' +
        '<button type="button" class="btn" data-act="return">إعادة للتحرير</button>' +
      '</div></div>';
  }

  function publishStep(t) {
    var published = t.status === 'published';
    return '<div class="card">' +
      '<div class="info no-print">' + (published
        ? 'تم نشر التقييم بتاريخ ' + fmtDate(t.published_at) + (t.visible ? '' : ' (مخفي عن المشاهدين)')
        : 'تم اعتماد التقييم بتاريخ ' + fmtDate(t.approved_at) + ' وهو جاهز للنشر.') + '</div>' +
      summary(total(t)) + readOnlyTable(t.ratings) +
      notesBlock('ملاحظات المشرف', t.notes) +
      notesBlock('ملاحظات الاعتماد', t.approver_notes) +
      '<div class="actions no-print">' +
        (published
          ? '<button type="button" class="btn primary" data-act="print">طباعة</button>' +
            '<button type="button" class="btn" data-act="reopen">إعادة فتح للتحرير</button>'
          : '<button type="button" class="btn primary" data-act="publish">نشر التقييم</button>' +
            '<button type="button" class="btn" data-act="return">إعادة للتحرير</button>') +
      '</div></div>';
  }

  function renderEval(t) {
    var body = t.status === 'review' ? reviewStep(t)
      : (t.status === 'approved' || t.status === 'published') ? publishStep(t)
      : editStep(t);

    app.innerHTML =
      '<button type="button" class="btn link no-print" data-act="back">→ العودة إلى قائمة المعلمين</button>' +
      '<div class="eval-head">' +
        '<div><h2>' + esc(t.name) + '</h2><div class="sub">التخصص: ' + esc(t.subject || '—') + '</div></div>' +
        '<div class="no-print"><span class="badge ' + t.status + '">' + STATUS[t.status] + '</span> ' +
        '<button type="button" class="btn danger" data-act="delete">حذف المعلم</button></div>' +
      '</div>' +
      stepper(t) + body;
  }

  /* ---------- النتائج المنشورة (ما يراه المشاهدون) ---------- */

  function renderResults(id) {
    if (S.results === null) {
      app.innerHTML = tabs('results') + '<div class="card empty">جارٍ التحميل…</div>';
      loadResults();
      return;
    }
    var r = null;
    if (id) S.results.forEach(function (x) { if (x.id === id) r = x; });

    if (r) {
      app.innerHTML =
        '<a class="btn link no-print" href="#/results">→ العودة إلى النتائج</a>' +
        '<div class="eval-head"><div><h2>' + esc(r.name) + '</h2><div class="sub">التخصص: ' + esc(r.subject || '—') +
        ' · تاريخ النشر: ' + fmtDate(r.published_at) + '</div></div>' +
        '<div class="no-print"><button type="button" class="btn" data-act="print">طباعة</button></div></div>' +
        '<div class="card">' +
          (r.total != null ? summary(r.total) : '') +
          (r.ratings ? readOnlyTable(r.ratings) : '') +
          notesBlock('ملاحظات المشرف', r.notes) +
          notesBlock('ملاحظات الاعتماد', r.approver_notes) +
          (r.total == null && !r.ratings && !r.notes && !r.approver_notes ? '<div class="empty">لا توجد تفاصيل متاحة للعرض.</div>' : '') +
        '</div>';
      return;
    }

    var cards = S.results.map(function (x) {
      return '<a class="card teacher" href="#/r/' + x.id + '" style="text-decoration:none;color:inherit">' +
        '<span class="name">' + esc(x.name) + '</span>' +
        '<span class="subject">' + esc(x.subject || '—') + '</span>' +
        '<span class="foot"><span class="badge published">' + fmtDate(x.published_at) + '</span>' +
        (x.total != null ? '<span class="score">' + x.total + ' / ' + MAX + '</span>' : '') + '</span></a>';
    }).join('');

    app.innerHTML = tabs('results') +
      (isStaff() ? '<p class="hint" style="color:var(--muted);margin-top:0">هذه الصفحة تعرض ما يراه أصحاب حسابات «مشاهد».</p>' : '') +
      (cards ? '<div class="teachers">' + cards + '</div>' : '<div class="card empty">لا توجد نتائج منشورة.</div>');
  }

  /* ---------- الإدارة (مدير النظام) ---------- */

  function renderAdmin() {
    var s = S.settings || {};
    var checks = VISIBILITY.map(function (v) {
      return '<label class="check"><input type="checkbox" data-setting="' + v.key + '"' + (s[v.key] ? ' checked' : '') + '>' + v.label + '</label>';
    }).join('');

    var published = S.teachers.filter(function (t) { return t.status === 'published'; });
    var vis = published.length ? published.map(function (t) {
      return '<label class="check"><input type="checkbox" data-visible="' + t.id + '"' + (t.visible ? ' checked' : '') + '>' +
        esc(t.name) + ' <span style="color:var(--muted)">— ' + esc(t.subject || '—') + '</span></label>';
    }).join('') : '<div class="hint">لا توجد تقييمات منشورة بعد.</div>';

    var users = S.users.map(function (u) {
      var self = u.id === S.uid;
      var opts = Object.keys(ROLES).map(function (k) {
        return '<option value="' + k + '"' + (u.role === k ? ' selected' : '') + '>' + ROLES[k] + '</option>';
      }).join('');
      return '<tr><td>' + esc(u.full_name || '—') + '</td><td dir="ltr" style="text-align:right">' + esc(displayName(u.email)) + '</td>' +
        '<td><select data-role="' + u.id + '" aria-label="صلاحية ' + esc(u.email) + '"' + (self ? ' disabled title="لا يمكنك تغيير صلاحيتك"' : '') + '>' + opts + '</select></td></tr>';
    }).join('');

    app.innerHTML = tabs('admin') +
      '<div class="card"><h2>ما يراه المشاهدون</h2>' +
        '<p class="hint">يُطبَّق على جميع حسابات «مشاهد» في التقييمات المنشورة.</p>' + checks + '</div>' +
      '<div class="card"><h2>التقييمات الظاهرة للمشاهدين</h2>' +
        '<p class="hint">أزل العلامة لإخفاء تقييم منشور عن المشاهدين.</p>' + vis + '</div>' +
      '<div class="card"><h2>المستخدمون والصلاحيات</h2>' +
        '<p class="hint">الحسابات الجديدة تبقى «بانتظار التفعيل» إلى أن تحدد صلاحيتها.</p>' +
        '<div class="table-wrap"><table class="grid"><thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الصلاحية</th></tr></thead><tbody>' + users + '</tbody></table></div></div>';
  }

  /* ---------- التوجيه ---------- */

  function currentTeacher() {
    if (!S.ready || !isStaff()) return null;
    var m = location.hash.match(/^#\/t\/(.+)$/);
    return m ? find(m[1]) : null;
  }

  function render() {
    renderUserbar();
    if (!sb) return renderSetup();
    if (!S.uid) return renderAuth();
    if (!S.ready) { app.innerHTML = '<div class="card empty">جارٍ التحميل…</div>'; return; }
    if (role() === 'pending') return renderPending();

    var h = location.hash;
    var r = h.match(/^#\/r\/(.+)$/);
    if (!isStaff()) return renderResults(r && r[1]);

    var t = currentTeacher();
    if (t) return renderEval(t);
    var v = currentVisit();
    if (v) return renderVisit(v);
    if (h === '#/visits' || /^#\/v\//.test(h)) return renderVisits();
    if (h === '#/admin' && isAdmin()) return renderAdmin();
    if (h === '#/results' || r) return renderResults(r && r[1]);
    renderList();
  }

  function go(hash) {
    ui.error = '';
    if (location.hash === hash) render(); else location.hash = hash;
  }

  async function setStatus(t, status) {
    var prev = { status: t.status, approved_at: t.approved_at, published_at: t.published_at };
    t.status = status;
    if (status === 'approved') t.approved_at = new Date().toISOString();
    if (status === 'published') t.published_at = new Date().toISOString();
    if (status === 'edit') { t.approved_at = null; t.published_at = null; }
    ui.error = '';
    await flush();
    if (!(await saveNow(t))) Object.assign(t, prev);
    render();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', function () {
    ui.error = '';
    flush();
    if (location.hash === '#/results') S.results = null;
    render();
    window.scrollTo(0, 0);
  });

  /* ---------- الأحداث ---------- */

  document.addEventListener('click', async function (e) {
    var open = e.target.closest('[data-open]');
    if (open) { go('#/t/' + open.getAttribute('data-open')); return; }

    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var t = currentTeacher();

    if (act === 'signout') {
      await flush();
      await sb.auth.signOut();
    } else if (act === 'auth-mode') {
      ui.authMode = ui.authMode === 'login' ? 'signup' : 'login';
      ui.authErr = ''; ui.authMsg = '';
      render();
    } else if (act === 'reload') {
      loadAll();
    } else if (act === 'print') {
      window.print();
    } else if (act === 'toggle-add') {
      ui.addOpen = !ui.addOpen;
      render();
      if (ui.addOpen) document.getElementById('add-name').focus();
    } else if (act === 'back') {
      await flush();
      go('#/');
    } else if (!t) {
      return;
    } else if (act === 'submit') {
      var left = CRITERIA.length - ratedCount(t);
      if (left > 0) {
        ui.error = 'يجب تقييم جميع البنود قبل الإرسال للاعتماد (متبقٍ ' + left + ').';
        render();
        var first = app.querySelector('tr.missing');
        if (first) first.scrollIntoView({ block: 'center' });
        return;
      }
      setStatus(t, 'review');
    } else if (act === 'approve') {
      setStatus(t, 'approved');
    } else if (act === 'return') {
      setStatus(t, 'edit');
    } else if (act === 'publish') {
      if (confirm('هل تريد نشر تقييم «' + t.name + '»؟')) setStatus(t, 'published');
    } else if (act === 'reopen') {
      if (confirm('سيتم إلغاء النشر والاعتماد وإعادة التقييم إلى مرحلة التحرير. هل تريد المتابعة؟')) setStatus(t, 'edit');
    } else if (act === 'delete') {
      if (!confirm('هل تريد حذف «' + t.name + '» وتقييمه نهائيًا؟')) return;
      clearTimeout(saveTimer); saveTimer = null;
      var d = await sb.from('teachers').delete().eq('id', t.id);
      if (d.error) return fail(d.error);
      S.teachers = S.teachers.filter(function (x) { return x.id !== t.id; });
      go('#/');
    }
  });

  app.addEventListener('change', async function (e) {
    var el = e.target, r;

    if (el.hasAttribute('data-setting') && isAdmin()) {
      var patch = {};
      patch[el.getAttribute('data-setting')] = el.checked;
      r = await sb.from('settings').update(patch).eq('id', 1);
      if (r.error) { el.checked = !el.checked; return fail(r.error); }
      Object.assign(S.settings || (S.settings = {}), patch);
      toast('تم الحفظ');
    } else if (el.hasAttribute('data-visible') && isAdmin()) {
      var vt = find(el.getAttribute('data-visible'));
      r = await sb.from('teachers').update({ visible: el.checked }).eq('id', vt.id);
      if (r.error) { el.checked = !el.checked; return fail(r.error); }
      vt.visible = el.checked;
      toast('تم الحفظ');
    } else if (el.hasAttribute('data-role') && isAdmin()) {
      var u = null, uidAttr = el.getAttribute('data-role');
      S.users.forEach(function (x) { if (x.id === uidAttr) u = x; });
      r = await sb.from('profiles').update({ role: el.value }).eq('id', u.id);
      if (r.error) { el.value = u.role; return fail(r.error); }
      u.role = el.value;
      toast('تم الحفظ');
    } else if (el.type === 'radio') {
      var t = currentTeacher();
      if (!t) return;
      t.ratings[Number(el.name.slice(1))] = Number(el.value);
      if (t.status === 'new') t.status = 'edit';
      queueSave(t);
      var done = ratedCount(t);
      document.getElementById('progress-text').textContent = 'تم تقييم ' + done + ' من ' + CRITERIA.length + ' بندًا';
      document.getElementById('progress-bar').style.width = (done / CRITERIA.length * 100) + '%';
      var row = el.closest('tr');
      if (row) row.classList.remove('missing');
    }
  });

  app.addEventListener('input', function (e) {
    var t = currentTeacher();
    if (e.target.id === 'search') {
      ui.search = e.target.value;
      render();
      var s = document.getElementById('search');
      s.focus();
      s.setSelectionRange(s.value.length, s.value.length);
    } else if (t && e.target.id === 'notes') {
      t.notes = e.target.value;
      if (t.status === 'new') t.status = 'edit';
      queueSave(t);
    } else if (t && e.target.id === 'approver-notes') {
      t.approver_notes = e.target.value;
      queueSave(t);
    }
  });

  app.addEventListener('submit', async function (e) {
    e.preventDefault();

    if (e.target.id === 'add-form') {
      var name = document.getElementById('add-name').value.trim();
      if (!name) return;
      var ins = await sb.from('teachers')
        .insert({ name: name, subject: document.getElementById('add-subject').value.trim() })
        .select().single();
      if (ins.error) return fail(ins.error);
      S.teachers.push(ins.data);
      ui.addOpen = false;
      render();
    } else if (e.target.id === 'auth-form') {
      var email = document.getElementById('au-email').value.trim();
      var pass = document.getElementById('au-pass').value;
      var signup = ui.authMode === 'signup';
      if (!signup && email.indexOf('@') < 0) email = email.toLowerCase() + USER_SUFFIX;
      var fullName = signup ? document.getElementById('au-name').value.trim() : '';
      ui.busy = true; ui.authErr = ''; ui.authMsg = '';
      render();
      var res = signup
        ? await sb.auth.signUp({
            email: email, password: pass,
            options: { data: { full_name: fullName }, emailRedirectTo: location.origin + location.pathname }
          })
        : await sb.auth.signInWithPassword({ email: email, password: pass });
      ui.busy = false;
      if (res.error) {
        ui.authErr = signup ? 'تعذر إنشاء الحساب: ' + res.error.message : 'بيانات الدخول غير صحيحة.';
      } else if (signup && !res.data.session) {
        ui.authMode = 'login';
        ui.authMsg = 'تم إنشاء الحساب. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.';
      }
      if (!S.uid) render();
    }
  });

  /* ---------- تقرير الزيارة الإشرافية ---------- */

  function findVisit(id) {
    for (var i = 0; i < S.visits.length; i++) if (S.visits[i].id === id) return S.visits[i];
    return null;
  }

  function currentVisit() {
    if (!S.ready || !isStaff()) return null;
    var m = location.hash.match(/^#\/v\/(.+)$/);
    return m ? findVisit(m[1]) : null;
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function dayName(iso) {
    return iso ? new Date(iso + 'T00:00').toLocaleDateString('ar', { weekday: 'long' }) : '';
  }

  // مفاتيح الحقول: d0..d6 لنقاط القوة في كل مجال، ثم development و recommendations
  function getField(v, key) {
    return (key.charAt(0) === 'd' && key.length === 2 ? v.strengths[key.slice(1)] : v[key]) || '';
  }

  function setField(v, key, val) {
    if (key.charAt(0) === 'd' && key.length === 2) v.strengths[key.slice(1)] = val; else v[key] = val;
  }

  function lines(text) {
    return text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
  }

  function chipsHtml(v, key) {
    var have = lines(getField(v, key));
    var builtin = key.charAt(0) === 'd' && key.length === 2 ? DOMAINS[Number(key.slice(1))].bank : BANK[key];
    var chip = function (text) {
      var on = have.indexOf(text) > -1;
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-chip="' + key + '" data-text="' + esc(text) +
        '" aria-pressed="' + on + '">' + esc(text) + '</button>';
    };
    var custom = S.statements.filter(function (x) { return x.field === key; }).map(function (x) {
      return '<span class="chip-wrap">' + chip(x.body) +
        '<button type="button" class="chip-del" data-delstmt="' + x.id + '" data-key="' + key + '" title="حذف العبارة من القائمة" aria-label="حذف العبارة من القائمة">×</button></span>';
    }).join('');
    return '<div class="chips">' + builtin.map(chip).join('') + custom + '</div>' +
      '<div class="addstmt"><input type="text" data-newstmt="' + key + '" placeholder="اكتب عبارة جديدة لإضافتها إلى القائمة" aria-label="عبارة جديدة">' +
      '<button type="button" class="btn" data-addstmt="' + key + '">إضافة</button></div>';
  }

  function fieldBlock(v, key, label) {
    return '<label class="field" for="f-' + key + '">' + label + '</label>' +
      '<textarea id="f-' + key + '" data-vfield="' + key + '" placeholder="اختر من العبارات المقترحة أو اكتب مباشرة">' + esc(getField(v, key)) + '</textarea>' +
      '<details class="bank"><summary>عبارات مقترحة</summary><div id="chips-' + key + '">' + chipsHtml(v, key) + '</div></details>';
  }

  function refreshChips(v, key) {
    var box = document.getElementById('chips-' + key);
    if (box) box.innerHTML = chipsHtml(v, key);
  }

  function renderVisits() {
    if (S.visitsMissing) {
      app.innerHTML = tabs('visits') + '<div class="card empty">لم تُجهَّز قاعدة البيانات لتقارير الزيارات بعد.<br>' +
        'شغّل الملف <code dir="ltr">supabase/visits.sql</code> في محرر SQL ثم حدّث الصفحة.</div>';
      return;
    }
    var options = S.teachers.map(function (t) {
      return '<option value="' + t.id + '">' + esc(t.name) + (t.subject ? ' — ' + esc(t.subject) : '') + '</option>';
    }).join('');

    var rows = S.visits.map(function (v) {
      var t = find(v.teacher_id);
      return '<button type="button" class="card visit-row" data-openv="' + v.id + '">' +
        '<span><span class="name">' + esc(t ? t.name : '—') + '</span><br>' +
        '<span class="meta">' + esc(v.lesson_title || 'بدون عنوان درس') + ' · ' + esc(v.subject || '—') + '</span></span>' +
        '<span class="meta" style="text-align:end">' + fmtDate(v.visit_date + 'T00:00') + '<br>الزيارة رقم ' + v.visit_number + '</span></button>';
    }).join('');

    app.innerHTML = tabs('visits') +
      (S.teachers.length
        ? '<div class="toolbar"><select id="visit-teacher" aria-label="المعلم" style="flex:1;min-width:180px">' + options + '</select>' +
          '<button type="button" class="btn primary" data-newvisit>+ تقرير زيارة جديد</button></div>'
        : '') +
      (rows || '<div class="card empty">' + (S.teachers.length ? 'لا توجد تقارير زيارات بعد.' : 'أضف معلمًا أولًا من تبويب «المعلمون».') + '</div>');
  }

  function renderVisit(v) {
    var t = find(v.teacher_id);
    var basic = function (label, inner) { return '<div><label class="field">' + label + '</label>' + inner + '</div>'; };
    var periods = '<option value=""></option>' + PERIODS.map(function (p) {
      return '<option' + (v.period === p ? ' selected' : '') + '>' + p + '</option>';
    }).join('');

    app.innerHTML =
      '<a class="btn link no-print" href="#/visits">→ العودة إلى الزيارات الإشرافية</a>' +
      '<div class="eval-head">' +
        '<div><h2>تقرير زيارة إشرافية صفية</h2><div class="sub">نموذج الإشراف الميداني المعتمد</div></div>' +
        '<div class="no-print"><span class="save-state" id="save-state"></span> ' +
        '<button type="button" class="btn primary" data-act="print">طباعة</button> ' +
        '<button type="button" class="btn danger" data-delvisit>حذف التقرير</button></div>' +
      '</div>' +

      '<div class="card"><h2>أولًا: البيانات الأساسية</h2><div class="grid2" style="margin-top:12px">' +
        basic('اليوم / التاريخ', '<input type="date" data-vbasic="visit_date" aria-label="التاريخ" value="' + esc(v.visit_date) + '">' +
          '<div class="day" id="visit-day">' + dayName(v.visit_date) + '</div>') +
        basic('اسم المعلم', '<input type="text" value="' + esc(t ? t.name : '') + '" readonly aria-label="اسم المعلم">') +
        basic('المبحث / المادة', '<input type="text" data-vbasic="subject" aria-label="المبحث" value="' + esc(v.subject) + '">') +
        basic('الصف والشعبة', '<input type="text" data-vbasic="class_section" aria-label="الصف والشعبة" placeholder="مثال: السابع (أ)" value="' + esc(v.class_section) + '">') +
        basic('الحصة', '<select data-vbasic="period" aria-label="الحصة">' + periods + '</select>') +
        basic('رقم الزيارة', '<input type="number" min="1" data-vbasic="visit_number" aria-label="رقم الزيارة" value="' + esc(v.visit_number) + '">') +
        '<div style="grid-column:1/-1"><label class="field">عنوان الدرس</label>' +
          '<input type="text" data-vbasic="lesson_title" aria-label="عنوان الدرس" value="' + esc(v.lesson_title) + '"></div>' +
      '</div></div>' +

      '<div class="card"><h2>ثانيًا: مجالات التقييم والملاحظات الصفية</h2>' +
        '<p class="hint no-print">لكل مجال: اختر من العبارات المقترحة أو اكتب أبرز نقاط القوة والتميز.</p>' +
        DOMAINS.map(function (d, i) {
          return '<div class="domain"><h3><span class="n">' + (i + 1) + '</span>' + d.title + '</h3>' +
            fieldBlock(v, 'd' + i, 'أبرز نقاط القوة والتميز') + '</div>';
        }).join('') +
      '</div>' +

      '<div class="card"><h2>الملاحظات ومجالات التطوير والتنمية المهنية المطلوبة</h2>' +
        fieldBlock(v, 'development', 'الملاحظات ومجالات التطوير') + '</div>' +

      '<div class="card"><h2>التوصيات / الإجراء التطويري</h2>' +
        fieldBlock(v, 'recommendations', 'التوصيات') + '</div>' +

      '<div class="card no-print"><h2>التوقيعات</h2><div class="grid2" style="margin-top:12px">' +
        basic('اسم المشرف التربوي', '<input type="text" data-vbasic="supervisor_name" aria-label="اسم المشرف التربوي" value="' + esc(v.supervisor_name) + '">') +
        basic('اسم مدير/ة المدرسة', '<input type="text" data-vbasic="principal_name" aria-label="اسم مدير المدرسة" value="' + esc(v.principal_name) + '">') +
      '</div></div>';
  }

  /* ورقة الطباعة بتصميم النموذج الورقي، وتُصغَّر لتبقى في صفحة A4 واحدة */

  var sheet = document.getElementById('print-sheet');

  function buildVisitSheet(v) {
    var t = find(v.teacher_id);
    var dots = '..............................';
    var d = v.visit_date ? v.visit_date.split('-') : null;
    var date = d ? dayName(v.visit_date) + ' ' + d[2] + '/' + d[1] + '/' + d[0] : '';
    var text = function (key) { return '<div class="ps-text">' + esc(lines(getField(v, key)).join('\n')) + '</div>'; };

    sheet.className = '';
    sheet.innerHTML =
      '<div class="ps-title">تقرير زيارة إشرافية صفية<br>نموذج الإشراف الميداني المعتمد</div>' +
      '<div class="ps-h">أولاً: البيانات الأساسية</div>' +
      '<table class="ps-basic"><colgroup><col style="width:16%"><col style="width:34%"><col style="width:16%"><col style="width:34%"></colgroup>' +
        '<tr><td>اليوم / التاريخ</td><td>' + esc(date) + '</td><td>اسم المعلم</td><td>' + esc(t ? t.name : '') + '</td></tr>' +
        '<tr><td>المبحث / المادة</td><td>' + esc(v.subject) + '</td><td>الصف والشعبة</td><td>' + esc(v.class_section) + '</td></tr>' +
        '<tr><td>الحصة</td><td>' + esc(v.period) + '</td><td>رقم الزيارة</td><td>' + esc(v.visit_number) + '</td></tr>' +
        '<tr><td>عنوان الدرس</td><td colspan="3">' + esc(v.lesson_title) + '</td></tr>' +
      '</table>' +
      '<div class="ps-h">ثانياً: مجالات التقييم والملاحظات الصفية</div>' +
      '<table class="ps-domains"><colgroup><col style="width:6%"><col style="width:25%"><col style="width:69%"></colgroup>' +
        '<tr><th>م</th><th>مؤشرات الأداء والمعايير الإشرافية</th><th>أبرز نقاط القوة والتميز</th></tr>' +
        DOMAINS.map(function (dm, i) {
          return '<tr><td class="c n">' + (i + 1) + '</td><td class="c">' + dm.title + '</td><td>' + text('d' + i) + '</td></tr>';
        }).join('') +
        '<tr class="ps-gap"><td colspan="3"></td></tr>' +
        '<tr><td colspan="3" class="ps-notes"><b>الملاحظات ومجالات التطوير والتنمية المهنية المطلوبة:</b>' + text('development') + '</td></tr>' +
      '</table>' +
      '<div class="ps-rec"><b>التوصيات / الإجراء التطويري:</b>' + text('recommendations') + '</div>' +
      '<div class="ps-signs">' +
        '<div>توقيع المعلم (بالعلم والاطلاع)<span>الاسم: ' + esc((t && t.name) || dots) + '</span></div>' +
        '<div>توقيع المشرف التربوي<span>الاسم: ' + esc(v.supervisor_name || dots) + '</span></div>' +
        '<div>توقيع مدير/ة المدرسة<span>الاسم: ' + esc(v.principal_name || dots) + '</span></div>' +
      '</div>';

    fitSheet();
  }

  // يُصغَّر الخط إلى أن تتسع الورقة في صفحة A4 واحدة
  function fitSheet() {
    // المساحة المتاحة بعد الهوامش، مع هامش أمان صغير
    var maxPx = (297 - 2 * 12.7 - 4) * 96 / 25.4;
    var size = 12;
    sheet.style.fontSize = size + 'pt';
    while (sheet.offsetHeight > maxPx && size > 6) {
      size -= 0.25;
      sheet.style.fontSize = size + 'pt';
    }
  }

  // ورقة التقييم المطبوعة: نفس تصميم الشاشة، في صفحة واحدة، مع خانة واضحة للدرجة وتوقيعين.
  // o: معلم (للمشرف) أو نتيجة منشورة (للمشاهد، وقد تكون بعض حقولها محجوبة)
  function buildEvalSheet(o) {
    var dots = '..............................';
    var label = {};
    SCALE.forEach(function (x) { label[x.v] = x.label; });
    var sum = o.total != null ? o.total : (o.ratings ? total(o) : null);
    var pct = sum != null ? Math.round(sum / MAX * 100) : null;
    var principal = S.visits.filter(function (x) { return x.principal_name; })[0];
    var supervisor = isStaff() && S.profile ? S.profile.full_name : '';
    var notes = function (title, text) {
      return text ? '<div class="pe-notes"><b>' + title + '</b><div>' + esc(text) + '</div></div>' : '';
    };

    sheet.className = 'pe';
    sheet.innerHTML =
      '<div class="pe-head"><div><div class="nm">' + esc(o.name) + '</div><div class="sub">التخصص: ' + esc(o.subject || '—') + '</div></div>' +
        '<div class="sub">' + (o.published_at ? 'تاريخ النشر: ' + fmtDate(o.published_at) : '') + '</div></div>' +
      (sum != null
        ? '<div class="pe-summary">' +
            '<div><div class="k">المجموع</div><div class="v">' + sum + ' / ' + MAX + '</div></div>' +
            '<div><div class="k">النسبة</div><div class="v">' + pct + '%</div></div>' +
            '<div><div class="k">التقدير</div><div class="v">' + grade(pct) + '</div></div></div>'
        : '') +
      (o.ratings
        ? '<table class="pe-table"><colgroup><col style="width:5%"><col style="width:77%"><col style="width:18%"></colgroup>' +
          '<tr><th>م</th><th>التقييم الأدائي والكفايات الشخصية</th><th class="r">التقييم (من 5)</th></tr>' +
          CRITERIA.map(function (c, i) {
            var r = o.ratings[i];
            return '<tr><td class="n">' + (i + 1) + '</td><td>' + c + '</td>' +
              '<td class="r">' + (r ? '<b>' + r + '</b><small>' + label[r] + '</small>' : '—') + '</td></tr>';
          }).join('') + '</table>'
        : '') +
      notes('ملاحظات المشرف', o.notes) +
      notes('ملاحظات الاعتماد', o.approver_notes) +
      '<div class="pe-signs">' +
        '<div><b>المشرف التربوي</b><span>الاسم: ' + esc(supervisor || dots) + '</span><span>التوقيع: ' + dots + '</span></div>' +
        '<div><b>مدير/ة المدرسة</b><span>الاسم: ' + esc((principal && principal.principal_name) || dots) + '</span><span>التوقيع: ' + dots + '</span></div>' +
      '</div>';

    fitSheet();
  }

  function currentResult() {
    var m = location.hash.match(/^#\/r\/(.+)$/);
    if (!m || !S.results) return null;
    for (var i = 0; i < S.results.length; i++) if (S.results[i].id === m[1]) return S.results[i];
    return null;
  }

  window.addEventListener('beforeprint', function () {
    var v = currentVisit(), o = currentTeacher() || currentResult();
    if (v) buildVisitSheet(v);
    else if (o) buildEvalSheet(o);
    else return;
    document.body.classList.add('print-sheet');
  });

  window.addEventListener('afterprint', function () {
    document.body.classList.remove('print-sheet');
  });

  async function createVisit(teacherId) {
    var t = find(teacherId);
    if (!t) return;
    var mine = S.visits.filter(function (x) { return x.teacher_id === teacherId; });
    var withPrincipal = S.visits.filter(function (x) { return x.principal_name; })[0];
    var maxNo = mine.reduce(function (m, x) { return Math.max(m, x.visit_number || 0); }, 0);
    // تُعبأ البيانات الأساسية تلقائيًا قدر الإمكان
    var ins = await sb.from('visits').insert({
      teacher_id: teacherId,
      visit_date: todayISO(),
      subject: t.subject || '',
      class_section: mine.length ? mine[0].class_section : '',
      visit_number: maxNo + 1,
      supervisor_name: (S.profile && S.profile.full_name) || '',
      principal_name: withPrincipal ? withPrincipal.principal_name : ''
    }).select().single();
    if (ins.error) return fail(ins.error);
    var v = ins.data;
    v.strengths = v.strengths || {};
    S.visits.unshift(v);
    go('#/v/' + v.id);
  }

  document.addEventListener('click', async function (e) {
    var el;
    if ((el = e.target.closest('[data-openv]'))) return go('#/v/' + el.getAttribute('data-openv'));
    if (e.target.closest('[data-newvisit]')) return createVisit(document.getElementById('visit-teacher').value);

    var v = currentVisit();
    if (!v) return;

    if (e.target.closest('[data-delvisit]')) {
      if (!confirm('هل تريد حذف هذا التقرير نهائيًا؟')) return;
      clearTimeout(visitTimer); visitTimer = null;
      var d = await sb.from('visits').delete().eq('id', v.id);
      if (d.error) return fail(d.error);
      S.visits = S.visits.filter(function (x) { return x.id !== v.id; });
      return go('#/visits');
    }

    if ((el = e.target.closest('[data-chip]'))) {
      var key = el.getAttribute('data-chip'), text = el.getAttribute('data-text');
      var cur = lines(getField(v, key));
      var at = cur.indexOf(text);
      if (at > -1) cur.splice(at, 1); else cur.push(text);
      setField(v, key, cur.join('\n'));
      document.getElementById('f-' + key).value = getField(v, key);
      el.classList.toggle('on', at < 0);
      el.setAttribute('aria-pressed', at < 0);
      return queueVisit(v);
    }

    if ((el = e.target.closest('[data-addstmt]'))) return addStatement(v, el.getAttribute('data-addstmt'));

    if ((el = e.target.closest('[data-delstmt]'))) {
      if (!confirm('هل تريد حذف هذه العبارة من القائمة المقترحة؟ (لن تُحذف من التقارير المحفوظة)')) return;
      var sid = el.getAttribute('data-delstmt');
      var r = await sb.from('statements').delete().eq('id', sid);
      if (r.error) return fail(r.error);
      S.statements = S.statements.filter(function (x) { return x.id !== sid; });
      refreshChips(v, el.getAttribute('data-key'));
    }
  });

  async function addStatement(v, key) {
    var input = app.querySelector('[data-newstmt="' + key + '"]');
    var text = input.value.trim();
    if (!text) return input.focus();
    var builtin = key.charAt(0) === 'd' && key.length === 2 ? DOMAINS[Number(key.slice(1))].bank : BANK[key];
    var known = builtin.indexOf(text) > -1 ||
      S.statements.some(function (x) { return x.field === key && x.body === text; });
    if (!known) {
      var ins = await sb.from('statements').insert({ field: key, body: text }).select().single();
      if (ins.error) return fail(ins.error);
      S.statements.push(ins.data);
    }
    var cur = lines(getField(v, key));
    if (cur.indexOf(text) < 0) cur.push(text);
    setField(v, key, cur.join('\n'));
    document.getElementById('f-' + key).value = getField(v, key);
    refreshChips(v, key);
    queueVisit(v);
  }

  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target.hasAttribute('data-newstmt')) return;
    e.preventDefault();
    var v = currentVisit();
    if (v) addStatement(v, e.target.getAttribute('data-newstmt'));
  });

  app.addEventListener('input', function (e) {
    var v = currentVisit(), el = e.target;
    if (!v) return;
    if (el.hasAttribute('data-vfield')) {
      var key = el.getAttribute('data-vfield');
      setField(v, key, el.value);
      refreshChips(v, key);
      queueVisit(v);
    } else if (el.hasAttribute('data-vbasic')) {
      var col = el.getAttribute('data-vbasic');
      if (col === 'visit_date' && !el.value) return;
      v[col] = col === 'visit_number' ? Math.max(1, parseInt(el.value, 10) || 1) : el.value;
      if (col === 'visit_date') document.getElementById('visit-day').textContent = dayName(v.visit_date);
      var sign = document.getElementById('sign-' + col);
      if (sign) sign.textContent = el.value;
      queueVisit(v);
    }
  });

  /* ---------- البدء ---------- */

  if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase) {
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange(function (event, session) {
      // لا تُستدعى دوال Supabase مباشرة داخل هذا المستمع
      setTimeout(function () {
        var uid = session && session.user ? session.user.id : null;
        if (uid && uid === S.uid) return; // تجديد الجلسة فقط
        S.uid = uid;
        S.email = uid ? session.user.email : '';
        S.profile = null;
        if (uid) loadAll(); else { S.ready = false; render(); }
      }, 0);
    });
  }
  render();
})();
</script>
</body>
</html>
