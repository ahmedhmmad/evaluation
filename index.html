<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية الركيزة الثالثة</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Montserrat:wght@600;700&display=swap">
<style id="page-css"></style>
<style id="app-css">
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1c2733;
    --muted: #64748b;
    --line: #e2e8f0;
    --primary: #0f766e;
    --primary-dark: #0b5a54;
    --primary-soft: #e6f4f2;
    --amber: #b45309;
    --amber-soft: #fef3c7;
    --blue: #1d4ed8;
    --blue-soft: #dbeafe;
    --green: #15803d;
    --green-soft: #dcfce7;
    --red: #b91c1c;
    --red-soft: #fee2e2;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  /* الهيكل: قائمة جانبية (يمين الصفحة) ومحتوى */
  #shell { display: flex; min-height: 100vh; }
  #side {
    width: 250px; flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; background: #0b3b37; color: #fff;
  }
  #side .brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px; }
  #side .brand .logo { width: 46px; height: 46px; flex: none; border-radius: 50%; background: #fff; object-fit: cover; }
  #side .brand strong { display: block; font-size: 1.05rem; line-height: 1.3; }
  #side .brand small { opacity: .7; font-size: .8rem; }
  #side-nav { flex: 1; padding: 4px 10px 12px; }
  #side-nav h3 { margin: 16px 12px 4px; font-size: .75rem; font-weight: 700; opacity: .55; }
  #side-nav a {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 2px; border-radius: 8px;
    color: #dcefec; text-decoration: none; font-weight: 600;
  }
  #side-nav a:hover { background: rgba(255,255,255,.09); color: #fff; }
  #side-nav a.on { background: #fff; color: var(--primary-dark); }
  #side-nav a:focus-visible, .side-user .btn:focus-visible, #menu-btn:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  #side-nav svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .side-user { padding: 12px 16px 16px; border-top: 1px solid rgba(255,255,255,.14); font-size: .9rem; }
  .side-user .who { font-weight: 700; overflow-wrap: anywhere; }
  .side-user .role { opacity: .7; font-size: .8rem; margin-bottom: 8px; }
  .side-user .btn { width: 100%; background: transparent; color: #fff; border-color: rgba(255,255,255,.4); padding: 6px 12px; }
  .side-user .btn:hover { background: rgba(255,255,255,.12); }
  #content { flex: 1; min-width: 0; }
  .topbar { display: none; align-items: center; gap: 12px; background: var(--primary); color: #fff; padding: 10px 14px; position: sticky; top: 0; z-index: 10; }
  #menu-btn { background: none; border: 0; color: #fff; font-size: 1.6rem; line-height: 1; padding: 2px 8px; cursor: pointer; border-radius: 6px; }
  #scrim { display: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 24px 60px; }
  /* بدون قائمة: قبل الدخول وأثناء انتظار التفعيل */
  #shell.bare #side, #shell.bare #menu-btn { display: none; }
  #shell.bare .topbar { display: flex; justify-content: center; padding: 16px; font-size: 1.15rem; position: static; }

  .page-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .page-head h1 { margin: 0; font-size: 1.45rem; }
  .page-head p { margin: 2px 0 0; color: var(--muted); }

  /* الرئيسية */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stats .card + .card { margin-top: 0; }
  .stat { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, box-shadow .15s; }
  .stat:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .stat .lbl { font-weight: 700; }
  .stat .num { font-size: 2rem; font-weight: 800; color: var(--primary); line-height: 1.2; }
  .stat .sub { color: var(--muted); font-size: .85rem; }
  .stat .num small { font-size: .5em; font-weight: 700; }
  .method-strip { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: -6px 0 16px; font-size: .92rem; }
  .method-strip > b { color: var(--muted); font-weight: 700; }
  .method-strip span { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .method-strip span b { color: var(--primary); }
  .method-strip span.zero { color: var(--muted); }
  .method-strip span.zero b { color: inherit; font-weight: 600; }
  #t-members .method-strip { margin: 12px 0 0; }
  .method-strip span.refunded { border-color: var(--red); color: var(--red); }
  .method-strip span.refunded b { color: inherit; }
  .refund-box { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--red); border-radius: 10px; background: var(--red-soft); }
  .refund-box .hint { margin: 0 0 10px; color: inherit; }
  div.stat:hover { border-color: var(--line); box-shadow: none; }
  .quick { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { text-decoration: none; display: inline-block; }
  a.btn:not(.primary):not(.link) { color: var(--ink); }
  .todo a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .todo a:last-child { border-bottom: 0; }
  .todo a:hover { color: var(--primary); }
  .todo .n { font-weight: 800; color: var(--amber); }

  @media (max-width: 900px) {
    .topbar { display: flex; }
    #side { position: fixed; top: 0; bottom: 0; right: 0; width: 270px; z-index: 30; transform: translateX(100%); transition: transform .2s; }
    #shell.open #side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
    #shell.open #scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
    main { padding: 16px 14px 60px; }
    .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat .num { font-size: 1.6rem; }
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { background: #f8fafc; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--red); border-color: #fecaca; }
  .btn.danger:hover { background: var(--red-soft); }
  .btn.link { border: 0; background: none; color: var(--primary); padding: 4px 0; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card + .card { margin-top: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .card .hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }
  input[type=text], input[type=search], input[type=email], input[type=password], textarea, select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    background: #fff;
    width: 100%;
  }
  select { width: auto; }
  textarea { min-height: 90px; resize: vertical; }
  label.field { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
  label.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
  label.check input { width: 18px; height: 18px; accent-color: var(--primary); }

  /* Auth */
  .auth { max-width: 420px; margin: 24px auto; }
  .auth .f { margin-bottom: 12px; }
  .auth .btn.primary { width: 100%; }
  .auth .switch { text-align: center; margin-top: 12px; }

  /* Teacher list */
  .teachers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .teachers .card + .card { margin-top: 0; }
  .teacher {
    text-align: start;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  .teacher:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .teacher .name { font-weight: 700; font-size: 1.05rem; }
  .teacher .subject { color: var(--muted); font-size: .9rem; }
  .teacher .foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .teacher .score { font-weight: 700; color: var(--primary); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 700;
  }
  .badge.new, .badge.pending { background: #eef2f6; color: var(--muted); }
  .badge.edit { background: var(--amber-soft); color: var(--amber); }
  .badge.review { background: var(--blue-soft); color: var(--blue); }
  .badge.approved { background: var(--primary-soft); color: var(--primary); }
  .badge.published { background: var(--green-soft); color: var(--green); }


  /* Evaluation view */
  .eval-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .eval-head h2 { margin: 0; font-size: 1.3rem; }
  .eval-head .sub { color: var(--muted); }

  .stepper { display: flex; list-style: none; padding: 0; margin: 0 0 16px; gap: 8px; }
  .stepper li {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .stepper .num {
    width: 30px; height: 30px; flex: none;
    border-radius: 50%;
    background: #eef2f6;
    display: grid; place-items: center;
    font-weight: 700;
  }
  .stepper .t { font-weight: 700; }
  .stepper .d { font-size: .8rem; }
  .stepper li.current { border-color: var(--primary); color: var(--ink); background: var(--primary-soft); }
  .stepper li.current .num { background: var(--primary); color: #fff; }
  .stepper li.done { color: var(--ink); }
  .stepper li.done .num { background: var(--green); color: #fff; }

  .progress-row { display: flex; justify-content: space-between; gap: 12px; }
  .save-state { color: var(--muted); font-size: .85rem; }
  .progress { height: 8px; background: #eef2f6; border-radius: 999px; overflow: hidden; margin: 6px 0 14px; }
  .progress > div { height: 100%; background: var(--primary); transition: width .2s; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .85rem; margin-bottom: 8px; }

  table.criteria, table.grid { width: 100%; border-collapse: collapse; }
  table.criteria th, table.criteria td, table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 10px 8px; vertical-align: middle; }
  table.criteria th, table.grid th { text-align: start; font-size: .85rem; color: var(--muted); background: #f8fafc; }
  table.criteria td.n { width: 36px; color: var(--muted); text-align: center; }
  table.criteria td.r { width: 1%; white-space: nowrap; }
  table.criteria tr.missing td { background: #fff7ed; }

  .rate { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rate label { position: relative; cursor: pointer; }
  .rate input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .rate span {
    display: grid; place-items: center;
    width: 38px; height: 36px;
    font-weight: 700;
    border-inline-start: 1px solid var(--line);
    background: #fff;
  }
  .rate label:first-child span { border-inline-start: 0; }
  .rate label:hover span { background: var(--primary-soft); }
  .rate input:checked + span { background: var(--primary); color: #fff; }
  .rate input:focus-visible + span { outline: 2px solid var(--primary-dark); outline-offset: -2px; }

  .pill { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 6px; font-weight: 700; background: var(--primary-soft); color: var(--primary); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .summary .box { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .summary .k { color: var(--muted); font-size: .85rem; }
  .summary .v { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

  .notes-block { margin-top: 16px; }
  .notes-block h3 { font-size: 1rem; margin: 0 0 6px; }
  .notes-block p { margin: 0; white-space: pre-wrap; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start; margin-top: 20px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--red-soft); color: var(--red); font-weight: 600; }
  .info { padding: 10px 12px; border-radius: 8px; background: var(--green-soft); color: var(--green); font-weight: 600; margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; }

  #toast {
    position: fixed; bottom: 20px; inset-inline: 16px; margin: 0 auto; max-width: 480px;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }

  /* Visit report */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  .grid2 .day { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  input[type=date], input[type=number] { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: #fff; width: 100%; }
  .grid2 select { width: 100%; }
  .domain { border: 1px solid #cbd5e1; border-radius: 10px; overflow: hidden; margin-top: 16px; background: #fff; }
  .domain h3 { margin: 0; font-size: 1rem; padding: 10px 14px; background: var(--primary-soft); border-bottom: 1px solid #cbd5e1; }
  .domain .body { padding: 12px 14px 14px; }
  .classes-pick { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .domain h3 .n { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; font-size: .85rem; margin-inline-end: 6px; }
  details.bank { margin-top: 8px; }
  details.bank summary { cursor: pointer; color: var(--primary); font-weight: 700; font-size: .9rem; padding: 4px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 12px; cursor: pointer; font-size: .9rem; text-align: start;
  }
  .chip:hover { border-color: var(--primary); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .chip-wrap { display: inline-flex; align-items: center; gap: 2px; }
  .chip-del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 4px 6px; }
  .chip-del:hover { color: var(--red); }
  .addstmt { display: flex; gap: 8px; margin-top: 10px; }
  .addstmt input { flex: 1; min-width: 0; }
  .visit-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; text-align: start; width: 100%; cursor: pointer; }
  .visit-row:hover { border-color: var(--primary); }
  .visit-row .name { font-weight: 700; }
  .visit-row .meta { color: var(--muted); font-size: .9rem; }
  .print-only { display: none; }



  /* ===== هوية التقارير المطبوعة (قالب مركزي واحد): عدّل القيم هنا فتتغير كل التقارير ===== */
  #print-sheet, .page-lh {
    --navy: #1B3A6B; --navy-dark: #0F2647; --navy-soft: #E3E9F2;
    --gold: #C5A46D; --gold-soft: #F3EBDD; --ivory: #FBF9F5;
    --body: #2B2B2B; --rule: #D9D9D9;
    --ok: #2E7D4F; --bad: #B23A3A; --warn: #C27C2C;
    --font-head: "Cairo", "Tajawal", "Segoe UI", Tahoma, sans-serif;
    --font-body: "IBM Plex Sans Arabic", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
    --font-en: "Montserrat", "Poppins", "Segoe UI", Arial, sans-serif;
    /* هوامش الصفحة التي تحملها الورقة عند الطباعة (صفر على الشاشة)؛ بها تمتد الترويسة إلى حافة الصفحة */
    --pad-x: 0mm; --pad-y: 0mm;
  }
  /* الورقة: عرض A4 ناقص هامشين 15mm. الأحجام بوحدة em ليُصغَّر الخط عند الحاجة فتبقى في صفحة واحدة */
  #print-sheet {
    position: fixed; top: 0; left: 0; visibility: hidden; pointer-events: none; z-index: -1;
    width: 180mm; background: #fff; color: var(--body); direction: rtl;
    font-family: var(--font-body); font-size: 10.5pt; line-height: 1.45;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  #print-sheet * { box-sizing: border-box; }
  /* العلامة المائية: الشعار في منتصف كل صفحة بشفافية خفيفة */
  #print-sheet .wm { position: fixed; top: 50%; left: 50%; width: 115mm; height: auto; transform: translate(-50%, -50%); opacity: .055; z-index: 2; }

  /* الترويسة */
  /* الصورة العريضة تمتد على عرض الورقة كله (تتجاوز هوامشها) وتحتها سطر باسم الأكاديمية والعام الدراسي */
  #print-sheet .rh, .page-lh .rh { margin-bottom: .8em; direction: rtl; }
  #print-sheet .rh-banner, .page-lh .rh-banner {
    display: block; max-width: none; height: auto; aspect-ratio: auto 1600 / 330;
    width: calc(100% + 2 * var(--pad-x)); margin: calc(-1 * var(--pad-y)) calc(-1 * var(--pad-x)) 0;
  }
  /* في الكشوف متعددة الصفحات تبقى الصورة داخل هوامش الصفحة لأنها تتكرر مع رأس الجدول */
  #print-sheet.ls .rh-banner { width: 100%; margin: 0; }
  #print-sheet .rh-line, .page-lh .rh-line {
    display: flex; justify-content: space-between; gap: 1em; padding: .35em 0 .3em;
    border-bottom: 1pt solid var(--gold); font-size: .9em; color: var(--navy);
  }
  #print-sheet .rh-line b, .page-lh .rh-line b { font-family: var(--font-head); color: var(--navy-dark); }

  /* كتلة عنوان التقرير وشريط معلوماته */
  #print-sheet .rt { text-align: center; margin-bottom: .9em; }
  #print-sheet .rt h1 { margin: 0 0 .25em; font-family: var(--font-head); font-size: 1.8em; font-weight: 800; color: var(--navy); line-height: 1.3; }
  #print-sheet .rt-lead { display: inline-block; margin: 0 0 .35em; padding: .05em 1.2em .15em; border-bottom: 2pt solid var(--gold); font-family: var(--font-head); font-size: 1.75em; font-weight: 800; color: var(--navy-dark); line-height: 1.35; }
  #print-sheet .rt-info { display: flex; flex-wrap: wrap; justify-content: center; gap: .15em 1.6em; padding: .35em 1em; background: var(--gold-soft); border-radius: .4em; font-size: .95em; }
  #print-sheet .rt-info b { color: var(--navy); font-weight: 600; }
  #print-sheet .rsec { margin: .9em 0 .45em; padding-inline-start: .6em; border-inline-start: 3pt solid var(--gold); font-family: var(--font-head); font-size: 1.28em; font-weight: 700; color: var(--navy); line-height: 1.3; }

  /* الجداول */
  #print-sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: .92em; }
  #print-sheet.tight th, #print-sheet.tight td { white-space: normal !important; }
  #print-sheet.tight2 th, #print-sheet.tight2 td { overflow-wrap: anywhere; }
  #print-sheet th, #print-sheet td { border: .5pt solid var(--rule); padding: .32em .55em; vertical-align: middle; text-align: start; overflow-wrap: break-word; } /* لا تُكسر الكلمة إلا إن لم تتسع في عمودها: «anywhere» كان يضيّق الأعمدة فتنقسم الكلمات حرفًا حرفًا */
  #print-sheet thead { display: table-header-group; }
  #print-sheet thead th { background: var(--navy); color: #fff; font-weight: 700; text-align: center; }
  #print-sheet tr { break-inside: avoid; }

    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2.2em - 1px), #c9ced8 calc(2.2em - 1px), #c9ced8 2.2em); }

  /* إيصال المواصلات */

  #print-sheet .rv-tag { position: absolute; z-index: 3; top: 5mm; inset-inline-start: 0; padding: .05em 1.3em .15em; border: 1pt solid var(--gold); border-radius: .4em; background: #fff; font-family: var(--font-head); font-size: 1.15em; font-weight: 800; color: var(--navy); }

  #print-sheet .rv-top small, #print-sheet .rv-line .e { font-family: var(--font-en); font-size: .72em; font-weight: 600; color: #777; }

  #print-sheet .rv-no i { font-style: normal; font-weight: 600; }
  #print-sheet .rv-title { text-align: center; padding: .25em 1.6em .35em; border: 1pt solid var(--navy); border-radius: .5em; background: var(--navy); color: #fff; }

  #print-sheet .rv-title span { display: block; font-family: var(--font-en); font-size: .68em; font-weight: 700; letter-spacing: .14em; color: var(--gold); }
  #print-sheet .rv-amt { justify-self: end; display: flex; align-items: stretch; border: 1pt solid var(--navy); border-radius: .4em; overflow: hidden; }
  #print-sheet .rv-amt > * { display: flex; align-items: center; gap: .3em; padding: .25em .6em; }
  #print-sheet .rv-amt span { background: var(--navy); color: #fff; font-weight: 600; }

  #print-sheet .rv-amt i { font-style: normal; font-weight: 600; color: var(--navy); border-inline-start: .5pt solid var(--navy); }
  /* سطور البيان: العنوان، ثم القيمة فوق خط منقّط يمتد إلى آخر السطر، ثم المقابل الإنجليزي */
  #print-sheet .rv-body { padding: .1em .2em; }
  #print-sheet .rv-line { display: flex; align-items: baseline; gap: .5em; margin: .8em 0; }
  #print-sheet .rv-line.ref .v { direction: ltr; text-align: right; font-family: var(--font-en); letter-spacing: .04em; }

  #print-sheet .rv-line .e { flex: none; direction: ltr; }
  #print-sheet .rv-two { display: flex; gap: 1.2em; }
  #print-sheet .rv-two { margin: .8em 0; }

  #print-sheet .rv-ms { flex: 1; display: flex; flex-wrap: wrap; gap: 0 1.4em; padding: 0 .5em; }
  /* شريط الحساب: اشتراك الشهر، المدفوع، المتبقي */
  #print-sheet .rv-sum { display: grid; grid-template-columns: repeat(3, 1fr); flex: 1; border: .75pt solid var(--navy); border-radius: .4em; overflow: hidden; }
  #print-sheet .rv-end { display: flex; align-items: center; gap: 1.2em; margin-top: .7em; }
  #print-sheet .rv-sum > div { display: flex; justify-content: space-between; gap: .5em; padding: .22em .7em; }
  #print-sheet .rv-sum > div + div { border-inline-start: .5pt solid var(--navy); }
  #print-sheet .rv-sum span { color: var(--navy); }
  #print-sheet .rv-stamp { flex: none; width: 5em; height: 5em; display: grid; place-items: center; border: .75pt dashed var(--gold); border-radius: 50%; color: #999; font-size: .9em; }
  /* كشوف الطلاب */
  #print-sheet.ls table { table-layout: auto; }
  #print-sheet td.ls-head { border: 0; padding: 0 0 .3em; background: #fff; font-size: 1.087em; }
  #print-sheet td.pg-space { border: 0; padding: 0; background: none; height: 0; }
  #print-sheet table.newpage { break-before: page; }
  #print-sheet.one-page table.newpage { break-before: auto; }
  /* الاستمارة الورقية الفارغة: خانات عالية للكتابة باليد */
  /* ارتفاع الخانة ثابت بالمليمتر: تصغير الخط ليتسع الكل في صفحة لا يضيّق مكان الكتابة */
  #print-sheet table.bf th, #print-sheet table.bf td { height: 5.8mm; padding: 0 .5em; line-height: 1.2; }
  #print-sheet.bfp .rh { margin-bottom: .4em; }
  #print-sheet.bfp .rt { margin-bottom: .5em; }

  #print-sheet table.bf th { width: auto; font-size: .92em; line-height: 1.25; }
  #print-sheet td.bf-sec { height: auto; padding: .2em .7em; background: var(--navy); color: #fff; font-family: var(--font-head); font-weight: 700; }
  #print-sheet .bf-o { display: inline-block; margin-inline-end: 1em; white-space: nowrap; }
  /* ملف الطالب */
  #print-sheet .pf-doc { display: inline-block; margin-inline-end: 1.6em; }

  #print-sheet.pf .rsec { margin: .5em 0 .25em; font-size: 1.12em; }

  #print-sheet.pf .rt { margin-bottom: .5em; }
  #print-sheet.pf .rt h1 { font-size: 1.25em; margin-bottom: 0; }

  #print-sheet.pf .rbox { margin-top: 0; padding: .3em .7em; }
  #print-sheet.pf .rs { margin-top: .7em; }
  #print-sheet.pf .rs .stamp { flex-basis: 5.6em; height: 5.6em; }

  /* Transport */
  .tgroup { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; }
  .tgroup:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .tgroup .name { font-weight: 700; font-size: 1.05rem; }
  .tgroup .meta { color: var(--muted); font-size: .9rem; }
  .tgroup .money { display: flex; justify-content: space-between; font-size: .9rem; margin-top: 4px; }
  .tgroup .progress { display: block; margin: 2px 0 0; }
  table.grid input[type=number] { width: 90px; padding: 6px 8px; }
  table.grid tfoot td { font-weight: 700; background: #f8fafc; }
  .badge.paid { background: var(--green-soft); color: var(--green); }
  .badge.part { background: var(--amber-soft); color: var(--amber); }
  .rsv, #print-sheet .rsv { color: #b45309; font-weight: 800; margin-inline-start: 3px; }
  .badge.exempt { background: #ede9fe; color: #6d28d9; }
  .badge.unpaid { background: var(--red-soft); color: var(--red); }
  .cand { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }

  table.grid td .mnote { display: block; margin-top: 6px; width: 150px; padding: 6px 8px; }

  .form-sec { grid-column: 1 / -1; margin: 14px 0 0; padding: 6px 12px; font-size: 1rem; background: var(--primary-soft); color: var(--primary-dark); border-radius: 8px; }

  .formhint { margin-top: 4px; font-size: .85rem; color: var(--amber); background: var(--amber-soft); border-radius: 6px; padding: 2px 8px; overflow-wrap: anywhere; }




  .simset { border-top: 1px solid var(--line); padding: 10px 0; }
  .simset:first-of-type { border-top: 0; }
  .simset label.check { display: inline-flex; margin-inline-end: 18px; }

  nav.pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  nav.pills button {
    font: inherit; cursor: pointer; padding: 7px 16px; border-radius: 999px; font-weight: 700;

  table.grid.pay td { padding: 8px 6px; }

  @media (max-width: 640px) {

  @media print {

  }
</style>

<script>
(function () {
  'use strict';

  // البنود مأخوذة من «نموذج تقييم معلم»

  // يُزاد مع كل نشر: به يُعرف هل الصفحة المفتوحة هي الأحدث أم نسخة قديمة من ذاكرة المتصفح

  async function doSync(quiet) {
    if (!S.ready) return false;
    if (!canStudents()) { await flush(); await loadAll(); return true; }
    if (!quiet && (ui.editStudent != null || ui.editTeacher != null)) {
      toast('احفظ النموذج المفتوح أو أغلقه أولًا، ثم زامن', true);
      return false;
    }
    var KEYS = ['settings', 'students', 'studentsMissing', 'regMissing', 'wantsMissing', 'tGroups', 'tMembers', 'tPay', 'tFirstPaid', 'tRefunds', 'tVoided',
      'transportMissing', 'aliasMissing', 'archiveMissing', 'issuerMissing', 'busMissing', 'exemptMissing', 'dueMissing', 'refundMissing', 'leaveMissing'];
    var keep = {};
    KEYS.forEach(function (k) { keep[k] = S[k]; });
    if (!quiet) toast('جارٍ مزامنة البيانات…');
    document.body.classList.add('syncing');
    try {
      await flush();
      var cfg = await sb.from('settings').select('*').eq('id', 1).maybeSingle();
      if (cfg.error) throw new Error(cfg.error.message);
      S.settings = cfg.data || null;
      // عدد الصفوف في القاعدة يُقارن بما جُلب: الجلب على دفعات، فإن نقص شيء أُعيد مرة ثم يُعدّ فشلًا
      var complete = async function (table, load, size) {
        for (var attempt = 0; attempt < 2; attempt++) {
          await load();
          var c = await sb.from(table).select('*', { count: 'exact', head: true });
          if (c.error || typeof c.count !== 'number' || c.count === size()) return;
        }
        throw new Error('لم تكتمل بيانات الجدول ' + table);
      };
      await complete('students', loadStudents, function () { return S.students.length; });
      if (S.studentsMissing && !keep.studentsMissing) throw new Error('تعذر جلب الطلاب');
      await complete('transport_members', loadTransport, function () { return S.tMembers.length; });
      if (S.transportMissing && !keep.transportMissing) throw new Error('تعذر جلب المواصلات');
      if (ui.tMonth && !S.transportMissing) {
        var month = ui.tMonth;
        var rows = await fetchAll(function () { return sb.from('transport_payments').select('*').eq('month', month).order('student_id'); });
        if (!rows) throw new Error('تعذر جلب دفعات المواصلات');
        var map = {};
        rows.forEach(function (p) { p.amount = Number(p.amount) || 0; map[p.student_id] = p; });
        S.tPay[month] = map;
      }
    } catch (err) {
      KEYS.forEach(function (k) { S[k] = keep[k]; });
      document.body.classList.remove('syncing');
      toast('تعذرت المزامنة، والبيانات المعروضة لم تتغير. تحقق من الاتصال ثم أعد المحاولة. (' + err.message + ')', true);
      return false;
    }
    document.body.classList.remove('syncing');
    S.syncedAt = new Date();
    S.attDay = {}; // سجلات الحضور تُجلب من جديد عند فتحها
    render();
    if (!quiet) toast('تمت المزامنة — الطلاب: ' + S.students.length + ' · المشتركون في المواصلات: ' + S.tMembers.length);
    return true;
  }

  // قاعدة البيانات تعيد ألف صف كحد أقصى في الطلب الواحد، فتُجلب الجداول الكبيرة على دفعات.
  // make: دالة تبني الاستعلام من جديد لكل دفعة. تعيد null عند الخطأ (الجدول غير موجود بعد)
  async function fetchAll(make) {
    var all = [], page = 1000;
    for (var from = 0; ; from += page) {
      var r = await make().range(from, from + page - 1);
      if (r.error) return null;
      all = all.concat(r.data || []);
      if (!r.data || r.data.length < page) return all;
    }
  }

  async function loadStudents() {
    // الجدول غير موجود إلى أن يُشغَّل الملف supabase/students.sql
    var all = await fetchAll(function () { return sb.from('students').select('*').order('full_name').order('id'); });
    S.studentsMissing = !all;
    S.students = all || [];
    // أعمدة التسجيل على مرحلتين غير موجودة إلى أن يُشغَّل الملف supabase/student_registration.sql
    S.regMissing = !!all && !!(await sb.from('students').select('status, details').limit(1)).error;
    // عمود «يحتاج مواصلات» أُضيف لاحقًا إلى الملف نفسه
    S.wantsMissing = !!all && !!(await sb.from('students').select('wants_transport').limit(1)).error;
  }

  async function loadTransport() {
    // الجداول غير موجودة إلى أن يُشغَّل الملف supabase/transport.sql
    var g = await sb.from('transport_groups').select('*').order('assembly_point');
    var m = g.error ? null : await fetchAll(function () { return sb.from('transport_members').select('*').order('joined_at').order('student_id'); });
    S.transportMissing = !m;
    // عمود التسميات البديلة أُضيف لاحقًا إلى supabase/transport.sql
    S.aliasMissing = !!m && !!(await sb.from('transport_groups').select('aliases').limit(1)).error;
    S.tGroups = g.data || [];
    S.tMembers = m || [];
    S.tPay = {};
    // أرشيف الإيصالات المحذوفة: جدوله يأتي من supabase/receipt_archive.sql، ويُجلب عند فتح شاشته
    S.archiveMissing = !!m && !!(await sb.from('transport_voided').select('id').limit(1)).error;
    // أول شهر دفع عنه كل طالب: به يبدأ اشتراكه الفعلي. اختيار نقطة التجمع وحده لا يُنشئ مطالبة
    S.tFirstPaid = {};
    var paidRows = m ? await fetchAll(function () { return sb.from('transport_payments').select('student_id, month, amount').order('month').order('student_id'); }) : null;
    (paidRows || []).forEach(function (p) {
      if (Number(p.amount) > 0 && (!S.tFirstPaid[p.student_id] || p.month < S.tFirstPaid[p.student_id])) S.tFirstPaid[p.student_id] = p.month;
    });
    // من سجّل الدفعة ومتى: عمودان يأتيان من supabase/transport_issuer.sql
    S.issuerMissing = !!m && !!(await sb.from('transport_payments').select('issued_by').limit(1)).error;
    // سجل المستردات: جدوله يأتي من supabase/transport_refunds.sql
    var refunds = m ? await fetchAll(function () { return sb.from('transport_refunds').select('*').order('created_at', { ascending: false }); }) : null;
    S.refundMissing = !!m && !refunds;
    S.tRefunds = (refunds || []).sort(function (a, b) { return String(b.created_at || '').localeCompare(String(a.created_at || '')); });
    // عمود إيقاف الاشتراك يأتي من supabase/transport_unsubscribe.sql
    S.leaveMissing = !!m && !!(await sb.from('transport_members').select('left_from').limit(1)).error;
    // بيانات الباص ونقطة الركوب والمهلة والتعليق: أعمدتها تأتي من supabase/transport_buses.sql
    S.busMissing = !!m && !!(await sb.from('transport_members').select('pickup, grace_until, suspended_month').limit(1)).error;
    // الإعفاء بالأشهر: أعمدته من supabase/reserve_and_exempt.sql
    S.exemptMissing = !!m && !!(await sb.from('transport_members').select('exempt_from').limit(1)).error;
    // المبلغ المطلوب وقت إصدار الإيصال: عمود من supabase/receipts_due.sql
    S.dueMissing = !!m && !!(await sb.from('transport_payments').select('due').limit(1)).error;
    S.tVoided = null;
  }

  // مدفوعات الشهر تُجلب عند أول عرض له ثم تُحفظ: { studentId: صف الدفعة }
  var loadingPay = {};
  async function loadPayments(month) {
    if (loadingPay[month]) return;
    loadingPay[month] = true;
    var rows = await fetchAll(function () { return sb.from('transport_payments').select('*').eq('month', month).order('student_id'); });
    loadingPay[month] = false;
    var map = {};
    (rows || []).forEach(function (p) { p.amount = Number(p.amount) || 0; map[p.student_id] = p; });
    S.tPay[month] = map;
    render();
  }

  async function loadResults() {
    if (loadingResults) return;
    loadingResults = true;
    var r = await sb.rpc('get_results');
    loadingResults = false;
    if (r.error) fail(r.error);
    S.results = (r.data && r.data.results) || [];
    if (!isStaff() && r.data && r.data.settings) S.settings = r.data.settings;
    render();
  }

  // الحفظ التلقائي أثناء التحرير
  var saveTimer = null, dirty = null;

  function setSaveState(text) {
    var el = document.getElementById('save-state');
    if (el) el.textContent = text;
  }

  async function saveNow(t) {
    var r = await sb.from('teachers').update({
      status: t.status,
      ratings: t.ratings,
      notes: t.notes,
      approver_notes: t.approver_notes,
      approved_at: t.approved_at,
      published_at: t.published_at
    }).eq('id', t.id);
    if (r.error) { setSaveState('لم يتم الحفظ'); fail(r.error); return false; }
    setSaveState('تم الحفظ');
    return true;
  }

  function queueSave(t) {
    clearTimeout(saveTimer);
    dirty = t;
    setSaveState('جارٍ الحفظ…');
    saveTimer = setTimeout(function () { saveTimer = null; saveNow(t); }, 600);
  }

  function flush() {
    var a = true, b = true;
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; a = saveNow(dirty); }
    if (visitTimer) { clearTimeout(visitTimer); visitTimer = null; b = saveVisit(visitDirty); }
    return Promise.all([a, b]);
  }

  var visitTimer = null, visitDirty = null;

  async function saveVisit(v) {
    var r = await sb.from('visits').update({
      visit_date: v.visit_date,
      subject: v.subject,

    }).eq('id', v.id);
    if (r.error) { setSaveState('لم يتم الحفظ'); fail(r.error); return false; }
    setSaveState('تم الحفظ');
    return true;
  }

  function queueVisit(v) {
    clearTimeout(visitTimer);

  // الصفحة الحالية كما يدل عليها العنوان (صفحات التفاصيل تتبع قائمتها)
  function activeKey() {
    var h = location.hash;
    if (isRegistrar()) return /^#\/classes/.test(h) ? 'classes' : h === '#/attendance' ? 'attendance' : h === '#/reports' ? 'reports' : 'students';
    if (!isStaff()) return 'results';
    if (h === '#/teachers' || /^#\/t\//.test(h)) return 'teachers';
    if (h === '#/visits' || /^#\/v\//.test(h)) return 'visits';
    if (h === '#/results' || /^#\/r\//.test(h)) return 'results';
    if (/^#\/transport/.test(h)) return 'transport';
    if (/^#\/classes/.test(h) && canView()) return 'classes';
    var m = h.match(/^#\/(staff|students|admin|rooms|attendance|reports)$/);
    return m && canView() ? m[1] : 'home';
  }

  /* ---------- بيانات العاملين (مدير النظام) ----------
     جدول teachers يضم كل العاملين، ولكل واحد فئة. التقييم والزيارات الإشرافية لهيئة التدريس والمحفظين فقط */

  var STAFF_CATS = ['إدارية', 'هيئة تدريس', 'محفظون', 'خدمات مساندة', 'خدمات معاونة'];
  var TEACHING_CATS = ['هيئة تدريس', 'محفظون'];

  function staffCat(t) { return t && STAFF_CATS.indexOf(t.category) > -1 ? t.category : 'هيئة تدريس'; }
  function evalTeachers() { return S.teachers.filter(function (t) { return TEACHING_CATS.indexOf(staffCat(t)) > -1; }); }

  // الفئة من نص حر في كشف مستورد
  function parseStaffCat(v) {
    var n = norm(v);
    if (/محفظ/.test(n)) return 'محفظون';
    if (/ادار/.test(n)) return 'إدارية';
    if (/مساند/.test(n)) return 'خدمات مساندة';
    if (/معاون/.test(n)) return 'خدمات معاونة';
    if (/تدريس|معلم/.test(n)) return 'هيئة تدريس';
    return '';
  }

  // استيراد العاملين من Excel أو CSV: الأعمدة بعناوينها (الاسم، المسمى الوظيفي، الفئة، رقم الجوال، رقم الواتساب)
  async function readStaffFile(file) {
    try {
      await loadXlsx();
      var wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
      var aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
      var hi = -1, col = {};
      for (var i = 0; i < Math.min(aoa.length, 15) && hi < 0; i++) {
        aoa[i].forEach(function (h, j) {
          var n = norm(String(h));
          if (/^الاسم|اسم الموظف|اسم العامل/.test(n) && col.name == null) col.name = j;
          else if (/مسمي|وظيف/.test(n) && col.job == null) col.job = j;
          else if (/فئه|التصنيف/.test(n) && col.cat == null) col.cat = j;
          else if (/واتس/.test(n) && col.wa == null) col.wa = j;
          else if (/جوال|هاتف|موبايل/.test(n) && col.phone == null) col.phone = j;
        });
        if (col.name != null) hi = i;
      }
      if (hi < 0) throw new Error('لم يُعثر على عمود «الاسم» في الملف');
      var cell = function (r, k) { return col[k] == null ? '' : String(r[col[k]] == null ? '' : r[col[k]]).replace(/\s+/g, ' ').trim(); };
      var phone = function (v) { return latinDigits(v).replace(/[^0-9+]/g, ''); };
      var rows = aoa.slice(hi + 1).map(function (r) {
        var name = cell(r, 'name');
        if (!name || /^\d+$/.test(name)) return null;
        var hit = S.teachers.filter(function (t) { return norm(t.name) === norm(name); })[0] || null;
        return { name: name, job: cell(r, 'job'), cat: parseStaffCat(cell(r, 'cat')) || 'هيئة تدريس', phone: phone(cell(r, 'phone')), wa: phone(cell(r, 'wa')), match: hit };
      }).filter(Boolean);
      if (!rows.length) throw new Error('لا توجد صفوف بأسماء في الملف');
      ui.staffImp = { file: file.name, rows: rows, busy: false };
      render();
      window.scrollTo(0, 0);
    } catch (err) {
      toast(err.message, true);
    }
  }

  async function saveStaffImport() {
    var imp = ui.staffImp, done = 0, failed = [];
    imp.busy = true;
    render();
    for (var i = 0; i < imp.rows.length; i++) {
      var r = imp.rows[i], teaching = TEACHING_CATS.indexOf(r.cat) > -1;
      var data = { name: r.name, category: r.cat, job_title: r.job, phone: r.phone, whatsapp: r.wa };
      var res;
      if (r.match) {
        if (teaching && !r.match.subject && r.job) data.subject = r.job;
        res = await sb.from('teachers').update(data).eq('id', r.match.id);
        if (!res.error) Object.assign(r.match, data);
      } else {
        data.subject = teaching ? r.job : '';
        res = await sb.from('teachers').insert(data).select().single();
        if (!res.error) { res.data.ratings = res.data.ratings || {}; S.teachers.push(res.data); }
      }
      if (res.error) failed.push(r.name); else done++;
    }
    S.teachers.sort(function (a, b) { return a.name.localeCompare(b.name, 'ar'); });
    ui.staffImp = null;
    render();
    if (failed.length) alert('حُفظ ' + done + '، وتعذّر: ' + failed.join('، ')); else toast('حُفظ ' + done + ' عاملًا');
  }

  // هيئة التدريس إلى «تسجيل الغياب من المعلمين» (روابط الغياب وبوت الواتساب): من ليس فيه بالاسم ولا بالرقم
  async function staffToAbsence() {
    var r = await sb.from('attendance_tokens').select('*');
    if (r.error) return alert('تسجيل الغياب من المعلمين غير مفعَّل بعد: شغّل الملف supabase/attendance_links.sql في محرر SQL.');
    var have = r.data || [], last = function (p) { return latinDigits(String(p || '')).replace(/\D/g, '').slice(-9); };
    var list = S.teachers.filter(function (t) {
      if (staffCat(t) !== 'هيئة تدريس') return false;
      var num = last(t.whatsapp || t.phone);
      return !have.some(function (h) { return norm(h.name) === norm(t.name) || (num.length >= 8 && last(h.phone) === num); });
    });
    if (!list.length) return toast('كل هيئة التدريس مضافون إلى تسجيل الغياب');
    if (!confirm('إضافة ' + list.length + ' من هيئة التدريس إلى «تسجيل الغياب من المعلمين»؟\nيُستخدم رقم الواتساب، وإن لم يوجد فرقم الجوال:\n\n' + list.map(function (t) { return t.name; }).join('\n'))) return;
    var rows = list.map(function (t) { return { name: t.name, phone: latinDigits(String(t.whatsapp || t.phone || '')).replace(/[^0-9+]/g, '') }; });
    var ins = await sb.from('attendance_tokens').insert(rows);
    if (ins.error) return fail(ins.error);
    S.attLinks = null; // تُجلب من جديد عند فتح شاشة الحضور
    toast('أُضيف ' + rows.length + ' إلى تسجيل الغياب — روابطهم في «الحضور والغياب»');
  }

  async function saveTeacherForm() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
    var t = ui.editTeacher !== 'new' ? find(ui.editTeacher) : null;
    var data = {
      name: g('tf-name'), subject: splitList(g('tf-subject')).join('، '), phone: g('tf-phone'),
      classes: Array.prototype.map.call(document.querySelectorAll('[name="tf-class"]:checked'), function (c) { return c.value; }).join('، '),
      qualification: g('tf-qualification'), hire_date: g('tf-hire') || null, details: g('tf-details')
    };
    if (!S.staffMissing) {
      data.category = g('tf-cat') || 'هيئة تدريس';
      data.job_title = g('tf-job');
      data.whatsapp = latinDigits(g('tf-wa')).replace(/[^0-9+]/g, '');
    }
    var login = g('tf-login'), role = g('tf-role');
    // الشعب والمباحث لهيئة التدريس والمحفظين فقط
    if (data.category && TEACHING_CATS.indexOf(data.category) < 0) { data.classes = ''; data.subject = ''; }
    if (login) {
      if (login.indexOf('@') < 0 && !/^[a-z0-9._-]{3,}$/i.test(login)) {
        return toast('اسم المستخدم: ثلاثة أحرف إنجليزية أو أرقام على الأقل، بدون مسافات.', true);
      }
      if (S.defaultPw.length < 6) return toast('احفظ كلمة المرور الافتراضية أولًا (6 أحرف على الأقل).', true);
    }

    if (t) {
      var up = await sb.from('teachers').update(data).eq('id', t.id);
      if (up.error) return fail(up.error);
      Object.assign(t, data);
    } else {
      var ins = await sb.from('teachers').insert(data).select().single();
      if (ins.error) return fail(ins.error);
      t = ins.data;
      t.ratings = t.ratings || {};
      S.teachers.push(t);
      S.teachers.sort(function (a, b) { return a.name.localeCompare(b.name, 'ar'); });
    }

    if (login && !t.user_id) {
      var acc = await sb.rpc('create_teacher_account', { p_teacher: t.id, p_login: toEmail(login), p_password: S.defaultPw });
      if (acc.error) {
        // بيانات المعلم حُفظت، والحساب لم يُنشأ: يبقى النموذج مفتوحًا لتصحيح اسم المستخدم
        ui.editTeacher = t.id;
        render();
        return fail(acc.error);
      }
      // غير هيئة التدريس: صلاحية الحساب كما اختيرت بدل «معلم»
      if (TEACHING_CATS.indexOf(staffCat(t)) < 0) {
        var pr = await sb.from('profiles').update({ role: role || 'viewer' }).eq('id', acc.data);
        if (pr.error) toast('أُنشئ الحساب بصلاحية معلم؛ غيّرها من «الإعدادات والمستخدمون»', true);
      }
      t.user_id = acc.data;
      t.login = toEmail(login);
      // ليظهر الحساب الجديد في قائمة المستخدمين
      var us = await sb.from('profiles').select('*').order('created_at');
      if (!us.error) S.users = us.data || [];
    }
    ui.editTeacher = null;
    render();
    toast('تم الحفظ');
  }

  // الحقول التابعة (قيمة الإيجار) تظهر وتصبح مطلوبة عند القيمة المحددة للحقل الذي تتبعه

  // معايير إضافية لتصفية الطلاب (وللطباعة). extra: عمود إضافي يظهر في الكشف المطبوع
  var ST_FLAGS = {
    orphan: { label: 'أيتام الأب (شهيد أو متوفى)',
      test: function (x) { var f = stVal(x, 'father_status'); return f === 'شهيد' || f === 'متوفى' || (!f && x.is_orphan === true); },
      extra: ['وجود الأب', function (x) { return stVal(x, 'father_status') || x.orphan_of; }] },
    martyr: { label: 'من أسرهم شهيد درجة أولى', test: function (x) { var m = stVal(x, 'martyr'); return !!m && m !== 'لا'; }, extra: ['الشهيد', function (x) { return stVal(x, 'martyr'); }] },
    injury: { label: 'لديهم إصابة حرب', test: function (x) { return saidYes(stVal(x, 'war_injury')); }, extra: ['الإصابة', function (x) { return stVal(x, 'war_injury'); }] },
    health: { label: 'لديهم مشكلة مرضية', test: function (x) { var t = stVal(x, 'illness'); return t ? saidYes(t) : x.has_health_condition === true; }, extra: ['المشكلة', function (x) { return stVal(x, 'illness'); }] },
    needs: { label: 'إعاقة أو حالة خاصة', test: function (x) { var t = stVal(x, 'disability'); return t ? saidYes(t) : x.has_special_needs === true; }, extra: ['الحالة', function (x) { return stVal(x, 'disability'); }] },
    hard: { label: 'وضع مادي صعب أو صعب جدًا', test: function (x) { var f = stVal(x, 'financial'); return f === 'صعب' || f === 'صعب جدا'; }, extra: ['الوضع المادي', function (x) { return stVal(x, 'financial'); }] },
    quran: { label: 'يحفظون من القرآن', test: function (x) { return Number(x.quran_parts) > 0; }, extra: ['عدد الأجزاء', function (x) { return x.quran_parts; }] },
    transport: { label: 'مشتركون في المواصلات', test: function (x, groupOf) { return !!groupOf[x.id]; },
      extra: ['الباص', function (x, groupOf) { var g = findGroup(groupOf[x.id]); return g ? g.assembly_point : ''; }] },
    notransport: { label: 'غير مشتركين في المواصلات', test: function (x, groupOf) { return !groupOf[x.id]; } },
    wantsride: { label: 'يحتاجون مواصلات بلا نقطة تجمع', test: function (x, groupOf) { return x.wants_transport === true && !groupOf[x.id]; } },
    noride: { label: 'لا يحتاجون مواصلات', test: function (x) { return x.wants_transport === false; } },
    scanned: { label: 'من استمارة مصوّرة (تحتاج مراجعة)', test: function (x) { return !!(x.details || {}).scan; },
      extra: ['غير مؤكد', function (x) { return ((x.details || {}).scan.unsure || []).length; }] },
    rideunknown: { label: 'لم يُحدَّد احتياجهم للمواصلات', test: function (x, groupOf) { return x.wants_transport == null && !groupOf[x.id]; } }
  };

  function transportGroupOf() {
    var map = {};
    S.tMembers.forEach(function (m) { map[m.student_id] = m.group_id; });
    return map;
  }

  // الطلاب المطابقون للبحث والحالة والصف والمعيار المختار
  function filteredStudents() {
    var q = norm(ui.stSearch), cls = ui.stClass, flag = ST_FLAGS[ui.stFlag], groupOf = flag ? transportGroupOf() : null;
    return S.students.filter(function (x) {
      if (ui.stStatus && stStatus(x) !== ui.stStatus) return false;
      if (cls === '-' ? x.class_name : cls && x.class_name !== cls) return false;
      if (flag && !flag.test(x, groupOf)) return false;
      return !q || norm(x.full_name).indexOf(q) > -1 || String(x.national_id || '').indexOf(latinDigits(ui.stSearch)) > -1;
    });
  }


  // ملف الطالب المطبوع: كل بياناته في صفحة واحدة
  var pendingProfile = null;

      (rows

        : '<div class="empty">' + (S.students.length ? 'لا توجد نتائج مطابقة.' : 'لا يوجد طلاب مسجلون بعد.') + '</div>');

  /* ----- نسخ بيانات الأسرة من أخ مسجَّل -----
     الإخوة يشتركون في بيانات ولي الأمر والأسرة والسكن والمواصلات، فتُنسخ إلى النموذج بضغطة بدل إملائها من جديد */
  var FAMILY_SECTIONS = ['بيانات ولي الأمر', 'الأسرة والوضع الاجتماعي', 'السكن'];

  function familyFields() {
    var sec = '', out = [];
    ST_FIELDS.forEach(function (f) { if (f.sec) sec = f.sec; if (FAMILY_SECTIONS.indexOf(sec) > -1) out.push(f); });
    return out;
  }

  // اسم الأب والجد والعائلة: ما بعد الاسم الأول
  function familyName(x) {
    return norm(x.full_name).split(/\s+/).slice(1).join(' ');
  }

  // بالبحث: من يطابق الاسم أو الهوية أو الهاتف. بلا بحث: إخوة محتملون (الهاتف نفسه، أو هوية ولي الأمر، أو اسم الأب والعائلة)
  function siblingMatches(st, query) {
    var q = norm(query), digits = latinDigits(query || '').trim(), list;
    if (q) {
      list = S.students.filter(function (x) {
        return (!st || x.id !== st.id) && (norm(x.full_name + ' ' + (x.guardian_name || '')).indexOf(q) > -1 ||
          (/\d/.test(digits) && (String(x.national_id || '').indexOf(digits) > -1 || String(x.phone || '').indexOf(digits) > -1)));
      });
    } else {
      if (!st) return [];
      var fam = familyName(st), gid = (st.details || {}).guardian_id;
      list = S.students.filter(function (x) {
        return x.id !== st.id && ((st.phone && x.phone === st.phone) || (gid && (x.details || {}).guardian_id === gid) ||
          (fam.split(' ').length >= 2 && familyName(x) === fam));
      });
    }
    // المسجلون نهائيًا أولًا: بياناتهم روجعت
    return list.sort(function (a, b) { return (stStatus(a) === 'final' ? 0 : 1) - (stStatus(b) === 'final' ? 0 : 1); }).slice(0, 6);
  }

  function siblingListHtml(st) {
    var list = siblingMatches(st, ui.sibSearch);
    return list.map(function (x) {
      return '<div class="cand"><span><b>' + esc(x.full_name) + '</b>' + rsvMark(x) + '<br><span class="meta">' + ST_STATUS[stStatus(x)] +
        (x.class_name ? ' · ' + esc(x.class_name) : '') + (x.guardian_name ? ' · ولي الأمر: ' + esc(x.guardian_name) : '') + '</span></span>' +
        '<button type="button" class="btn" data-sibcopy="' + x.id + '">انسخ بيانات الأسرة</button></div>';
    }).join('') || (ui.sibSearch.trim() ? '<div class="empty" style="padding:10px">لا يوجد طالب مطابق.</div>' : '');
  }

  function siblingBoxHtml(st) {
    var auto = siblingMatches(st, '').length;
    return '<details class="bank" id="sib-box" style="margin:8px 0 0"' + (auto ? ' open' : '') + '><summary>نسخ بيانات الأسرة من أخ مسجَّل<span id="sib-count">' + (auto ? ' — إخوة محتملون: ' + auto : '') + '</span></summary>' +
      '<p class="hint" style="margin:8px 0">ينسخ إلى هذا النموذج بيانات ولي الأمر والأسرة والسكن والمواصلات من أخيه. لا يُحفظ شيء قبل الضغط على «حفظ».</p>' +
      '<input type="search" id="sib-search" placeholder="ابحث عن الأخ بالاسم أو رقم الهوية أو هاتف ولي الأمر" aria-label="بحث عن أخ" value="' + esc(ui.sibSearch) + '">' +
      '<div id="sib-results">' + siblingListHtml(st) + '</div></details>';
  }

  // الطالب كما هو مكتوب في النموذج الآن (للطالب الجديد الذي لم يُحفظ بعد): يكفي لاقتراح إخوته أثناء الكتابة
  function draftStudent() {
    var cur = ui.editStudent && ui.editStudent !== 'new' ? findStudent(ui.editStudent) : null;
    var val = function (k) { var el = document.getElementById('sf-' + k); return el ? el.value.trim() : ''; };
    return { id: cur ? cur.id : '', full_name: val('full_name'), phone: latinDigits(val('phone')), details: { guardian_id: latinDigits(val('guardian_id')) } };
  }

  // يُحدَّث صندوق الإخوة بحسب ما كُتب في النموذج (الاسم، هاتف ولي الأمر، هويته) ما دام البحث فارغًا
  function refreshSiblingBox() {
    var box = document.getElementById('sib-box');
    if (!box || ui.sibSearch.trim()) return;
    var draft = draftStudent(), n = siblingMatches(draft, '').length;
    document.getElementById('sib-results').innerHTML = siblingListHtml(draft);
    document.getElementById('sib-count').textContent = n ? ' — إخوة محتملون: ' + n : '';
    if (n) box.open = true;
  }

  function copyFromSibling(id) {
    var sib = findStudent(id);
    if (!sib) return;
    // الحقل الفارغ عند الأخ لا يمسح ما كُتب هنا
    var copied = 0;
    familyFields().forEach(function (f) {
      var el = document.getElementById('sf-' + f.k), v = stVal(sib, f.k);
      if (!el || v === '' || v == null) return;
      // قيمة ليست بين خيارات القائمة (خيار أُلغي لاحقًا) تُضاف خيارًا حتى لا تضيع
      if (el.tagName === 'SELECT' && !Array.prototype.some.call(el.options, function (o) { return o.value === String(v); })) el.add(new Option(v, v));
      el.value = v;
      copied++;
    });
    var wants = document.getElementById('sf-wants'), ride = document.getElementById('sf-transport'), gid = transportGroupOf()[sib.id];
    if (ride && gid) ride.value = gid;
    if (wants && (gid || sib.wants_transport != null)) wants.value = gid || sib.wants_transport ? 'yes' : 'no';
    syncStudentDeps();
    if (!copied) return toast('ملف «' + sib.full_name + '» ليس فيه بيانات أسرة مُدخلة بعد، فلا شيء يُنسخ.', true);
    toast('نُسخ ' + copied + ' حقلًا من بيانات أسرة «' + sib.full_name + '» — راجعها ثم احفظ');
    var firstCopied = document.getElementById('sf-guardian_name');
    if (firstCopied) firstCopied.scrollIntoView({ block: 'center' });
  }

        (final
          ? '<button type="submit" class="btn primary" data-mode="final">حفظ</button>' +
            '<button type="button" class="btn" data-stunfinal="' + st.id + '">إعادة إلى التسجيل المبدئي</button>'
          : '<button type="submit" class="btn primary" data-mode="final">حفظ واعتماد التسجيل النهائي</button>' +
            '<button type="submit" class="btn" data-mode="save" formnovalidate>' + (st && stStatus(st) === 'reserve' ? 'حفظ (يبقى احتياطًا)' : 'حفظ دون اعتماد') + '</button>' +
            (st && stStatus(st) === 'reserve'
              ? '<button type="button" class="btn" data-stunfinal="' + st.id + '">إعادة إلى التسجيل المبدئي</button>'
              : '<button type="submit" class="btn" data-mode="reserve" formnovalidate title="قائمة الانتظار: لا يُحتسب في الشعب">تسجيل احتياط</button>')) +
        (st ? '<button type="button" class="btn" data-stprofile="' + st.id + '">طباعة ملف الطالب</button>' : '') +
        '<button type="button" class="btn" data-stedit="">إلغاء</button>' +
      '</div></form>';
  }

  /* ---------- إدخال الطلاب من استمارات ورقية مصوّرة ----------
     تُرفع صورة الاستمارة المعبأة بخط اليد (أو ملف PDF فيه عدة استمارات)، فتقرؤها خدمة read-registration-form
     (Supabase Edge Function تستدعي نموذجًا يقرأ الصور على DeepInfra)، ويُنشأ لكل استمارة تسجيل مبدئي موسوم «من استمارة مصوّرة» ليُراجَع على الورقة.
     لا يُعتمد شيء نهائيًا من هنا. إن لم تكن الخدمة مفعّلة يمكن نسخ التعليمات ولصق الناتج يدويًا */

  var SCAN_SKIP = { class_name: 1, placement: 1, filled_by: 1 };

  // نماذج القراءة المقترحة على DeepInfra (يمكن كتابة اسم أي نموذج آخر يقبل الصور). الاختيار لمدير النظام، ويُحفظ في هذا المتصفح
  var SCAN_MODELS = ['google/gemini-3.1-pro', 'anthropic/claude-opus-5-5', 'anthropic/claude-sonnet-5-5', 'anthropic/claude-haiku-4-5',
    'Qwen/Qwen3-VL-30B-A3B-Instruct', 'meta-llama/Llama-4-Scout-17B-16E-Instruct', 'google/gemma-3-27b-it', 'mistralai/Mistral-Small-3.2-24B-Instruct-2506'];

  function scanModel() {
    if (!isAdmin()) return '';
    try { return localStorage.getItem('scan-model') || ''; } catch (err) { return ''; }
  }

  function setScanModel(value) {
    try { localStorage.setItem('scan-model', value.trim()); } catch (err) { /* التخزين المحلي غير متاح */ }
  }

  // ما قُرئ من استمارة، خانة خانة (للمقارنة بين النماذج وللتحقق قبل فتح السجل)
  function scanReadingHtml(form) {
    var unsure = Array.isArray(form.unsure) ? form.unsure : [], rows = scanFields().filter(function (f) { return String(form[f.k] == null ? '' : form[f.k]).trim(); });
    return '<details class="bank" style="margin:6px 0 0"><summary>عرض القراءة (' + rows.length + ' خانة)</summary><div class="orig-answers">' + rows.map(function (f) {
      return '<div><b>' + f.label + (unsure.indexOf(f.k) > -1 ? ' <span class="badge part">غير مؤكدة</span>' : '') + '</b><span>' + esc(form[f.k]) + '</span></div>';
    }).join('') + '</div></details>';
  }

  // حقول الاستمارة الورقية كما تُرسل للقراءة: المفتاح، العنوان المطبوع، النوع، الخيارات
  function scanFields() {
    var list = ST_FIELDS.filter(function (f) { return !SCAN_SKIP[f.k]; }).map(function (f) {
      var o = { k: f.k, label: f.p || f.label };
      if (f.type === 'date' || f.type === 'number') o.type = f.type;
      if (f.type === 'select') o.options = f.options.slice();
      return o;
    });
    list.push({ k: 'wants_transport', label: 'يحتاج الطالب مواصلات؟', options: ['نعم', 'لا'] });
    return list;
  }

  // مكتبة عرض صفحات PDF تُحمَّل عند الحاجة فقط
  function loadPdfJs() {
    if (window.pdfjsLib) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      sc.onload = function () {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve();
      };
      sc.onerror = function () { reject(new Error('تعذر تحميل مكتبة قراءة PDF')); };
      document.head.appendChild(sc);
    });
  }

  var SCAN_MAX_SIDE = 2200; // أطول ضلع للصورة المرسلة (بكسل): يكفي لقراءة الخط ولا يثقل الإرسال

  function canvasPayload(canvas) {
    return { media_type: 'image/jpeg', data: canvas.toDataURL('image/jpeg', 0.85).split(',')[1] };
  }

  // صور الملف المرسلة للقراءة، صورة لكل صفحة: الصورة تُصغَّر (صور الهواتف كبيرة) وتُحوَّل إلى JPEG،
  // وملف PDF تُرسم صفحاته صورًا هنا في المتصفح لأن خدمة القراءة تقبل الصور فقط
  async function scanFilePages(file) {
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      if (file.size > 40 * 1024 * 1024) throw new Error('ملف PDF أكبر من 40 ميغابايت؛ قسّمه إلى ملفات أصغر');
      await loadPdfJs();
      var doc = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      if (doc.numPages > 60) throw new Error('في الملف ' + doc.numPages + ' صفحة؛ الحد 60 صفحة في الملف الواحد');
      var pages = [];
      for (var n = 1; n <= doc.numPages; n++) {
        var page = await doc.getPage(n), base = page.getViewport({ scale: 1 });
        var view = page.getViewport({ scale: SCAN_MAX_SIDE / Math.max(base.width, base.height) });
        var pc = document.createElement('canvas');
        pc.width = Math.round(view.width);
        pc.height = Math.round(view.height);
        await page.render({ canvasContext: pc.getContext('2d'), viewport: view }).promise;
        pages.push(canvasPayload(pc));
      }
      return pages;
    }
    if (!/^image\//.test(file.type)) throw new Error('نوع الملف غير مدعوم (صورة أو PDF فقط)');
    return [await new Promise(function (resolve, reject) {
      var img = new Image(), url = URL.createObjectURL(file);
      img.onload = function () {
        var scale = Math.min(1, SCAN_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvasPayload(canvas));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('تعذر فتح الصورة')); };
      img.src = url;
    })];
  }

  // سجل طالب مبدئي من استمارة مقروءة. يعيد { state: saved | dup | error, name, note, id }
  async function saveScannedForm(form, fileName, model) {
    var text = function (k) { return String(form[k] == null ? '' : form[k]).replace(/\s+/g, ' ').trim(); };
    var data = { status: 'pending', class_name: '', details: {} };
    ST_FIELDS.forEach(function (f) {
      if (SCAN_SKIP[f.k]) return;
      var v = text(f.k);
      if (f.type === 'date') v = /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
      else if (f.type === 'number') { v = parseFloat(latinDigits(v)); v = isNaN(v) ? null : v; }
      else if (f.num) v = latinDigits(v).replace(/[\s-]/g, '');
      if (f.x) data.details[f.k] = v; else data[f.k] = v;
    });
    var name = data.full_name || '';
    if (!name) return { state: 'error', name: '(بلا اسم)', note: 'لم يُقرأ اسم الطالب' };
    var same = data.national_id ? S.students.filter(function (x) { return x.national_id === data.national_id; })[0] : null;
    if (same && stStatus(same) === 'final') {
      return { state: 'dup', name: same.full_name, note: 'رقم الهوية ' + data.national_id + ' مسجَّل نهائيًا — لم يُغيَّر سجله', id: same.id };
    }
    if (same) return mergeScannedForm(same, data, form, fileName, model);
    data.requested_class = text('enroll_grade');
    data.memorizes_quran = data.quran_parts == null ? null : data.quran_parts > 0;
    if (!S.wantsMissing) { var w = text('wants_transport'); data.wants_transport = w === 'نعم' ? true : w === 'لا' ? false : null; }
    var keys = {};
    ST_FIELDS.forEach(function (f) { keys[f.k] = true; });
    // scan: علامة أن السجل من استمارة مصوّرة ولم يُراجَع، مع الحقول التي لم تُقرأ بثقة
    data.details.scan = {
      at: new Date().toISOString(), by: (S.profile && S.profile.full_name) || displayName(S.email), file: fileName, model: model || '',
      unsure: (Array.isArray(form.unsure) ? form.unsure : []).filter(function (k) { return keys[k]; })
    };
    var r = await sb.from('students').insert(data).select().single();
    if (r.error) return { state: 'error', name: name, note: r.error.message };
    S.students.push(r.data);
    S.students.sort(function (a, b) { return a.full_name.localeCompare(b.full_name, 'ar'); });
    return { state: 'saved', name: name, id: r.data.id, note: data.details.scan.unsure.length ? 'حقول غير مؤكدة القراءة: ' + data.details.scan.unsure.length : '' };
  }

  // الاستمارة لطالب له تسجيل مبدئي (من الاستمارة الإلكترونية مثلًا): لا يُنشأ سجل ثانٍ، بل يُكمَّل سجله.
  // الخانات الفارغة عنده تُملأ من الورقة. ما له قيمة مسجَّلة لا يُستبدل (قد تكون قراءة الخط خاطئة)،
  // وتُحفظ قراءة الورقة المختلفة في scan.read لتظهر بجانب الحقل عند المراجعة
  async function mergeScannedForm(same, data, form, fileName, model) {
    var patch = {}, details = Object.assign({}, same.details), read = {}, filled = 0, differ = 0;
    var empty = function (v) { return v == null || v === ''; };
    ST_FIELDS.forEach(function (f) {
      if (SCAN_SKIP[f.k]) return;
      var v = f.x ? data.details[f.k] : data[f.k], cur = f.x ? (same.details || {})[f.k] : same[f.k];
      if (empty(v)) return;
      if (empty(cur)) { if (f.x) details[f.k] = v; else patch[f.k] = v; filled++; }
      else if (norm(String(cur)) !== norm(String(v))) { read[f.k] = v; differ++; }
    });
    var wants = String(form.wants_transport || '').trim();
    if (!S.wantsMissing && same.wants_transport == null && (wants === 'نعم' || wants === 'لا')) patch.wants_transport = wants === 'نعم';
    if ('quran_parts' in patch) patch.memorizes_quran = patch.quran_parts > 0;
    var known = {};
    ST_FIELDS.forEach(function (f) { known[f.k] = true; });
    details.scan = {
      at: new Date().toISOString(), by: (S.profile && S.profile.full_name) || displayName(S.email), file: fileName, model: model || '', read: read,
      unsure: (Array.isArray(form.unsure) ? form.unsure : []).filter(function (k) { return known[k]; })
    };
    patch.details = details;
    var r = await sb.from('students').update(patch).eq('id', same.id);
    if (r.error) return { state: 'error', name: same.full_name, note: r.error.message, id: same.id };
    Object.assign(same, patch);
    return { state: 'merged', name: same.full_name, id: same.id,
      note: 'له تسجيل مبدئي سابق: مُلئت ' + filled + ' خانة فارغة من الورقة' + (differ ? '، و' + differ + ' خانة قراءتها تختلف عن المسجَّل (تظهر عند المراجعة ولم تُستبدل)' : '') };
  }

  // dry: قراءة تجريبية تُعرض ولا تُحفظ
  async function saveScannedForms(item, forms, dry) {
    for (var i = 0; i < forms.length; i++) {
      var form = forms[i] || {};
      var res = dry ? { state: 'preview', name: String(form.full_name || '(بلا اسم)'), note: 'قراءة تجريبية — لم يُحفظ شيء' } : await saveScannedForm(form, item.name, item.model);
      res.form = form;
      item.results.push(res);
    }
  }

  async function runScanQueue(files) {
    var scan = ui.scan;
    if (!scan || scan.running) return;
    var chosen = scanModel(), dry = !!scan.dry;
    var items = Array.prototype.map.call(files, function (f) { return { file: f, name: f.name, status: 'wait', msg: '', results: [], model: '' }; });
    scan.items = scan.items.concat(items);
    scan.running = true;
    render();
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (ui.scan !== scan) return; // أُغلقت الشاشة
      item.status = 'busy';
      render();
      try {
        var pages = await scanFilePages(item.file);
        for (var p = 0; p < pages.length; p++) {
          if (ui.scan !== scan) return;
          if (pages.length > 1) { item.msg = 'الصفحة ' + (p + 1) + ' من ' + pages.length; render(); }
          var request = { file: pages[p], fields: scanFields() };
          if (chosen) request.model = chosen;
          var r = await sb.functions.invoke('read-registration-form', { body: request });
          if (r.error || !r.data || r.data.error) {
            var why = (r.data && r.data.error) || (r.error && r.error.message) || '';
            // الخدمة غير منشورة أو بلا مفتاح: تُعرض الطريقة اليدوية
            if (!r.data || /not found|404|API_KEY|Failed to send/i.test(why)) scan.manual = true;
            // رسالة المتصفح عند غياب الخدمة عن الخادم غامضة، فتُشرح
            if (/Failed to send|not found/i.test(why)) why = 'خدمة القراءة غير منشورة على الخادم بعد. شغّل «Deploy Supabase functions» من تبويب Actions في GitHub بعد إضافة السرّين، أو استخدم الطريقة اليدوية أدناه.';
            else if (/API_KEY is not set/i.test(why)) why = 'خدمة القراءة منشورة لكن مفتاح DeepInfra لم يصلها. أعد تشغيل «Deploy Supabase functions» من تبويب Actions.';
            throw new Error((pages.length > 1 ? 'الصفحة ' + (p + 1) + ': ' : '') + (why || 'تعذر الاتصال بخدمة القراءة'));
          }
          item.model = r.data.model || chosen || '';
          await saveScannedForms(item, Array.isArray(r.data.forms) ? r.data.forms : [], dry);
        }
        item.status = 'done';
        item.msg = item.results.length ? '' : 'لم يُعثر في الملف على استمارة معبأة';
      } catch (err) {
        item.status = 'error';
        item.msg = err.message;
      }
      item.file = null;
      render();
    }
    scan.running = false;
    render();
  }

  // تعليمات تُنسخ إلى محادثة مع مساعد ذكاء اصطناعي يقرأ الصور، مع إرفاق صورة الاستمارة، عند عدم توفر خدمة القراءة الآلية
  function scanPromptText() {
    var fields = scanFields();
    return 'في المرفق استمارة تسجيل مدرسية عربية مطبوعة عبّأها ولي الأمر بخط اليد. انسخ ما كُتب بجانب كل عنوان مطبوع.\n' +
      '- انسخ المكتوب كما هو دون تصحيح أو تخمين. الخانة الفارغة قيمتها نص فارغ.\n' +
      '- الأرقام (الهوية، الهاتف، الأعداد) بأرقام 0-9 دون مسافات. التواريخ بصيغة YYYY-MM-DD (ولي الأمر يكتب يوم/شهر/سنة).\n' +
      '- الحقل الذي له خيارات: أعد الخيار المؤشَّر أو المطابق لما كُتب حرفيًا من القائمة، أو نصًّا فارغًا.\n' +
      '- unsure: مفاتيح الحقول التي لم تتأكد من قراءة خطها (أعطِ أفضل قراءة لها مع ذلك).\n' +
      '- إن كان في المرفق أكثر من استمارة فلكل استمارة عنصر في forms.\n\n' +
      'أجب بـ JSON فقط بهذا الشكل دون أي شرح:\n{"forms":[{' + fields.slice(0, 3).map(function (f) { return '"' + f.k + '":"…"'; }).join(',') + ',…,"unsure":["…"]}]}\n\n' +
      'الحقول (المفتاح: العنوان المطبوع):\n' + fields.map(function (f) {
        return f.k + ': ' + f.label + (f.type === 'date' ? ' (تاريخ)' : f.type === 'number' ? ' (رقم)' : '') + (f.options ? ' — الخيارات: ' + f.options.join(' | ') : '');
      }).join('\n');
  }

  async function saveScanPaste() {
    var box = document.getElementById('scan-paste'), raw = box.value, a = raw.indexOf('{'), b = raw.lastIndexOf('}'), parsed = null;
    try { parsed = JSON.parse(raw.slice(a, b + 1)); } catch (err) { parsed = null; }
    var forms = parsed && (Array.isArray(parsed.forms) ? parsed.forms : parsed.full_name != null ? [parsed] : null);
    if (!forms) return toast('النص الملصوق ليس ناتجًا صالحًا. الصق إجابة المساعد كاملة (تبدأ بـ { وتنتهي بـ }).', true);
    var item = { name: 'لصق يدوي', status: 'busy', msg: '', results: [], model: '' };
    ui.scan.items.push(item);
    await saveScannedForms(item, forms, !!ui.scan.dry);
    item.status = 'done';
    item.msg = item.results.length ? '' : 'لا استمارات في النص الملصوق';
    render();
  }

  function scanScreenHtml() {
    var scan = ui.scan, saved = 0;
    scan.items.forEach(function (it) { it.results.forEach(function (r) { if (r.state === 'saved' || r.state === 'merged') saved++; }); });
    var STATE = { wait: ['pending', 'بانتظار الدور'], busy: ['edit', 'تُقرأ الآن…'], done: ['published', 'تمت القراءة'], error: ['unpaid', 'تعذّرت'] };
    var items = scan.items.map(function (it) {
      return '<div class="scan-item"><div class="toolbar" style="align-items:center;margin:0"><b style="flex:1;overflow-wrap:anywhere">' + esc(it.name) +
        (it.model ? ' <span dir="ltr" style="font-weight:400;color:var(--muted);font-size:.85rem">' + esc(it.model) + '</span>' : '') + '</b>' +
        '<span class="badge ' + STATE[it.status][0] + '">' + STATE[it.status][1] + '</span></div>' +
        (it.msg ? '<div class="formhint">' + esc(it.msg) + '</div>' : '') +
        it.results.map(function (r) {
          return '<div class="cand"><span><b>' + esc(r.name) + '</b> <span class="badge ' + (r.state === 'saved' || r.state === 'merged' ? 'paid' : r.state === 'dup' ? 'part' : r.state === 'preview' ? 'pending' : 'unpaid') + '">' +
            (r.state === 'saved' ? 'أُضيف تسجيلًا مبدئيًا' : r.state === 'merged' ? 'أُكمل تسجيله المبدئي' : r.state === 'dup' ? 'مسجَّل نهائيًا' : r.state === 'preview' ? 'تجربة' : 'لم يُضف') + '</span>' +
            (r.note ? '<br><span class="meta">' + esc(r.note) + '</span>' : '') + (r.form ? scanReadingHtml(r.form) : '') + '</span>' +
            (r.id ? '<button type="button" class="btn' + (r.state === 'saved' || r.state === 'merged' ? ' primary' : '') + '" data-stedit="' + r.id + '">' + (r.state === 'dup' || r.state === 'error' ? 'فتح السجل' : 'مراجعة') + '</button>' : '') + '</div>';
        }).join('') + '</div>';
    }).join('');
    return '<button type="button" class="btn link" data-scanclose>→ العودة إلى تسجيل الطلاب</button>' +
      '<div class="card"><h2>إدخال من استمارات مصوّرة</h2>' +
        '<p class="hint">صوّر الاستمارة الورقية المعبأة (أو امسحها بالماسح) وارفعها. تُقرأ الخانات آليًا ويُنشأ لكل استمارة <b>تسجيل مبدئي</b> موسوم «مصوّرة» يحتاج مراجعة على الورقة، ولا يُعتمد شيء نهائيًا. الحقول التي لم يُقرأ خطها بثقة تُعلَّم عند المراجعة.</p>' +
        '<ul class="imp-list" style="margin-bottom:12px"><li>صورة واضحة مستقيمة للورقة كاملة، بإضاءة جيدة. صورة لكل استمارة، أو ملف PDF من الماسح كل صفحة فيه استمارة (حتى 60 صفحة).</li>' +
          '<li>صورة الاستمارة ببياناتها تُرسل إلى خدمة قراءة خارجية (نموذج ذكاء اصطناعي على DeepInfra) عبر حساب الأكاديمية. لا تُحفظ الصورة في البرنامج.</li>' +
