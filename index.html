  /* ----- حذف إيصال وأرشيف الإيصالات المحذوفة -----
     الحذف يلغي أثر الدفعة (يعود اشتراك الشهر مستحقًّا) ويحفظ نسخة من الإيصال في جدول transport_voided
     مع من حذفه ومتى ولماذا (supabase/receipt_archive.sql) */

  var ARCHIVE_SQL_MSG = 'شغّل الملف supabase/receipt_archive.sql في محرر SQL أولًا، ثم حدّث الصفحة';

  async function voidReceipt(sid) {
    if (S.archiveMissing) return toast(ARCHIVE_SQL_MSG, true);
    var x = findStudent(sid), rec = (S.tPay[ui.tMonth] || {})[sid];
    if (!x || !rec || !(rec.amount > 0)) return;
    var reason = prompt('حذف الإيصال رقم ' + (rec.receipt_no != null ? rec.receipt_no : '—') + ' للطالب «' + x.full_name + '» بمبلغ ' + money(rec.amount) + ' عن ' + monthLabel(ui.tMonth) + '.\n' +
      'يُلغى أثر الدفعة ويُحفظ الإيصال في أرشيف الإيصالات.\n\nاكتب سبب الحذف:', '');
    if (reason == null) return;
    reason = reason.trim();
    if (!reason) return toast('لا يُحذف الإيصال دون كتابة السبب.', true);
    var m = S.tMembers.filter(function (k) { return k.student_id === sid; })[0], g = m && findGroup(m.group_id);
    var copy = {
      receipt_no: rec.receipt_no != null ? rec.receipt_no : null, student_id: sid, student_name: x.full_name, class_name: x.class_name || '',
      assembly_point: g ? g.assembly_point : '', month: ui.tMonth, amount: rec.amount, method: rec.method || 'cash', method_note: rec.method_note || '',
      paid_on: rec.paid_on || null, reason: reason, voided_by: (S.profile && S.profile.full_name) || displayName(S.email), voided_at: new Date().toISOString()
    };
    // النسخة أولًا ثم حذف الدفعة: إن تعذّر الحذف تُسحب النسخة فلا يبقى إيصال في المكانين
    var ins = await sb.from('transport_voided').insert(copy).select().single();
    if (ins.error) return fail(ins.error);
    var del = await sb.from('transport_payments').delete().eq('student_id', sid).eq('month', ui.tMonth);
    if (del.error) {
      if (ins.data) await sb.from('transport_voided').delete().eq('id', ins.data.id);
      return fail(del.error);
    }
    delete S.tPay[ui.tMonth][sid];
    S.tVoided = null;
    refreshPay();
    var desk = document.getElementById('rc-body');
    if (desk) desk.innerHTML = deskBodyHtml();
    toast('حُذف الإيصال وحُفظ في أرشيف الإيصالات');
  }

  var loadingVoided = false;
  async function loadVoided() {
    if (loadingVoided) return;
    loadingVoided = true;
    var rows = await fetchAll(function () { return sb.from('transport_voided').select('*').order('voided_at', { ascending: false }); });
    loadingVoided = false;
    S.archiveMissing = !rows;
    S.tVoided = (rows || []).sort(function (a, b) { return String(b.voided_at).localeCompare(String(a.voided_at)); });
    render();
  }

  async function exportVoidedXlsx() {
    var list = S.tVoided || [];
    if (!list.length) return toast('لا توجد إيصالات محذوفة للتصدير', true);
    try {
      await loadXlsx();
      var aoa = [[schoolName()], ['أرشيف الإيصالات المحذوفة — ' + dmy(todayISO())], [],
        ['م', 'رقم الإيصال', 'اسم الطالب', 'الشعبة', 'نقطة التجمع', 'عن شهر', 'المبلغ (ج.م)', 'طريقة الدفع', 'تاريخ السداد', 'تاريخ الحذف', 'حذفه', 'السبب']];
      list.forEach(function (v, i) {
        aoa.push([i + 1, v.receipt_no != null ? v.receipt_no : '', v.student_name, v.class_name, v.assembly_point, v.month, Number(v.amount) || 0,
          payMethodLabel(v), dmy(v.paid_on), dmy(v.voided_at), v.voided_by, v.reason]);

      var ws = XLSX.utils.aoa_to_sheet(aoa), wb = XLSX.utils.book_new();

    } catch (err) {
      toast(err.message, true);
    }
  }

  async function exportPayXlsx() {
    var sc = payScope();
    if (!sc.rows.length) return toast('لا توجد دفعات للتصدير', true);
    try {
      await loadXlsx();
      var wb = XLSX.utils.book_new(), used = {};
      wb.Workbook = { Views: [{ RTL: true }] };
      // اسم الورقة: 31 حرفًا على الأكثر، بلا رموز يرفضها Excel، وغير مكرر
      var sheetName = function (text) {
        var base = String(text).replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 28) || 'ورقة', name = base, n = 2;
        while (used[name]) name = base + ' ' + n++;
        used[name] = true;
        return name;
      };
      var add = function (title, aoa, widths) {
        var ws = XLSX.utils.aoa_to_sheet(aoa);
        ws['!cols'] = widths.map(function (w) { return { wch: w }; });
        XLSX.utils.book_append_sheet(wb, ws, sheetName(title));
      };
      var methodNames = Object.keys(PAY_METHODS).map(function (k) { return PAY_METHODS[k] + ' (ج.م)'; });
      var methodAmounts = function (t) { return Object.keys(PAY_METHODS).map(function (k) { return t.by[k]; }); };
      var top = function (title) { return [[schoolName()], ['دفعات المواصلات — ' + monthLabel(ui.tMonth) + ' — ' + title], []]; };
      var detail = function (title, rows) {
        var t = payTotals(rows);
        add(title, top(title).concat(
          [['م', 'اسم الطالب', 'الشعبة', 'نقطة التجمع', 'هاتف ولي الأمر', 'الحصة (ج.م)', 'المدفوع (ج.م)', 'المتبقي (ج.م)', 'الحالة', 'طريقة الدفع', 'تاريخ السداد', 'رقم الإيصال']],
          rows.map(function (r, i) {
            return [i + 1, r.x.full_name, r.x.class_name || '', r.g.assembly_point, String(r.x.whatsapp || r.x.phone || ''), r.share, r.paid, r.left,
              PAY_STATUS[r.status] || '', r.paid ? payMethodLabel(r.rec) : '', r.paid ? dmy(r.rec.paid_on) : '', r.paid && r.rec.receipt_no != null ? r.rec.receipt_no : ''];
          }),
          [['', 'المجموع', '', '', '', t.due, t.paid, t.left, '', '', '', '']], [[]], [['', 'تفصيل المحصَّل حسب وسيلة الدفع']],
          Object.keys(PAY_METHODS).map(function (k) { return ['', PAY_METHODS[k], '', '', '', '', t.by[k], '', t.byCount[k] ? 'عدد الدفعات: ' + t.byCount[k] : '']; })),
          [5, 32, 14, 24, 16, 12, 13, 13, 16, 14, 13, 11]);
      };
      if (sc.whole) {
        var list = payByClass(sc.rows), sum = payTotals(sc.rows);
        var pct = function (t) { return t.due ? Math.round(t.paid / t.due * 100) + '%' : ''; };
        add('ملخص الشعب', top('ملخص الشعب').concat(
          [['م', 'الشعبة', 'المشتركون', 'المطلوب (ج.م)', 'المحصَّل (ج.م)'].concat(methodNames, ['المتبقي (ج.م)', 'نسبة التحصيل', 'لم يسددوا'])],
          list.map(function (c, i) { return [i + 1, c.name || 'بدون شعبة', c.t.n, c.t.due, c.t.paid].concat(methodAmounts(c.t), [c.t.left, pct(c.t), c.t.owing]); }),
          [['', 'المجموع', sum.n, sum.due, sum.paid].concat(methodAmounts(sum), [sum.left, pct(sum), sum.owing])]), [5, 22, 12, 14, 14, 12, 12, 14, 12, 14, 13, 12]);
        detail('كل المدرسة', sc.rows);
        list.forEach(function (c) { detail(c.name || 'بدون شعبة', c.rows); });
      } else {
        detail(sc.name, sc.rows);
      }
      XLSX.writeFile(wb, ('دفعات-المواصلات-' + sc.name + '-' + ui.tMonth).replace(/[\\\/:*?"<>|]/g, ' ').replace(/\s+/g, '-') + '.xlsx');
    } catch (err) {
      toast(err.message, true);
    }
  }

  var PAY_METHODS = { cash: 'نقدًا', instapay: 'إنستاباي', vodafone: 'فودافون كاش', other: 'أخرى' };

  // الدفع الإلكتروني (إنستاباي، فودافون كاش) له رقم دفع يُسجَّل ويظهر في الإيصال
  function hasPayRef(method) { return method === 'instapay' || method === 'vodafone'; }

  function payMethodLabel(rec) {
    if (rec.method === 'other') return rec.method_note || PAY_METHODS.other;
    return PAY_METHODS[rec.method || 'cash'] + (hasPayRef(rec.method) && rec.method_note ? ' — ' + rec.method_note : '');
  }

  // الخانة التي تحت طريقة الدفع: رقم الدفع للإلكتروني، أو تحديد الطريقة عند «أخرى». method_note يحمل أيهما
  function payNoteInput(id, method, rec) {
    if (method !== 'other' && !hasPayRef(method)) return '';
    var ref = hasPayRef(method);
    return '<input type="text" class="mnote" data-mnote="' + id + '"' + (ref ? ' dir="ltr" inputmode="numeric" style="text-align:right"' : '') +
      ' placeholder="' + (ref ? 'رقم الدفع' : 'حدّد طريقة الدفع') + '" aria-label="' + (ref ? 'رقم الدفع' : 'طريقة الدفع الأخرى') + '" value="' + esc(rec.method_note || '') + '">';
  }

  // patch: ما تغيّر في دفعة الطالب لهذا الشهر (المبلغ أو طريقة الدفع)
  async function setPayment(studentId, patch) {
    var old = S.tPay[ui.tMonth][studentId] || {};
    var row = {
      student_id: studentId, month: ui.tMonth,
      amount: old.amount || 0, method: old.method || 'cash', method_note: old.method_note || '',
      paid_on: old.paid_on || todayISO(), updated_at: new Date().toISOString()
    };
    Object.assign(row, patch);
    row.amount = Math.max(0, Number(row.amount) || 0);
    // الملاحظة تخص طريقة الدفع التي كُتبت لها: تُمسح عند تغيير الطريقة، ولا ملاحظة للنقد
    if (row.method === 'cash' || ('method' in patch && !('method_note' in patch) && patch.method !== (old.method || 'cash'))) row.method_note = '';
    if ('amount' in patch) row.paid_on = todayISO();
    var r = await sb.from('transport_payments').upsert(row, { onConflict: 'student_id,month' }).select().single();
    if (r.error) return fail(r.error);
    row.receipt_no = r.data ? r.data.receipt_no : old.receipt_no;
    S.tPay[ui.tMonth][studentId] = row;
    refreshPay();
    toast('تم الحفظ');
  }

      setPayment(el.getAttribute('data-mpaid'), { amount: el.value });
    } else if (el.hasAttribute('data-mmethod')) {
      setPayment(el.getAttribute('data-mmethod'), { method: el.value });
    } else if (el.hasAttribute('data-mnote')) {
      setPayment(el.getAttribute('data-mnote'), { method_note: el.value.trim() });
    } else if (g && el.hasAttribute('data-mshare')) {
      var sid = el.getAttribute('data-mshare');
      var share = el.value === '' ? null : Math.max(0, Number(el.value) || 0);
      var r = await sb.from('transport_members').update({ share: share }).eq('student_id', sid);
      if (r.error) return fail(r.error);
      S.tMembers.forEach(function (m) { if (m.student_id === sid) m.share = share; });
      document.getElementById('t-members').innerHTML = membersTableHtml(g);
      toast('تم الحفظ');
    }
  });

  app.addEventListener('keydown', function (e) {
    if (!isAdmin() || location.hash !== '#/transport/receipt' || e.key !== 'Enter') return;
    if (e.target.id === 'rc-id') { e.preventDefault(); deskSearch(); }
    else if (e.target.id === 'rc-amount' || e.target.id === 'rc-note') { e.preventDefault(); deskSave(true); }
  });

  app.addEventListener('input', function (e) {
    var g = currentGroup();
    if (e.target.id === 'tp-search' && isAdmin()) {
      ui.tpSearch = e.target.value;
      return refreshPay();
    }
    if (e.target.id !== 't-search' || !g) return;
    ui.tSearch = e.target.value;
    document.getElementById('t-cands').innerHTML = candidatesHtml(g);
  });

  /* ----- اقتراح نقاط التجمع من عناوين السكن ----- */

  // الطلاب الذين لهم عنوان وليسوا في أي مجموعة مواصلات (ولم يُسجَّل أنهم لا يريدون مواصلات)
  function clusterPool(includePending) {
    var inGroup = transportGroupOf();
    return S.students.filter(function (x) {
      return !inGroup[x.id] && x.wants_transport !== false && String(x.address || '').trim() && (includePending || stStatus(x) === 'final');
    });
  }

  // لا يُرسَل إلا رقم تسلسلي ونص العنوان: بلا أسماء ولا أرقام هوية ولا هواتف
  function clusterPayload(pool) {
    return {
      addresses: pool.map(function (x, i) { return { n: i + 1, a: String(x.address).replace(/\s+/g, ' ').trim() }; }),
      existing: S.tGroups.map(function (g) { return g.assembly_point; })
    };
  }

  // نص جاهز للصق في محادثة مع Claude عند عدم توفر الخدمة الآلية
  function clusterPromptText(payload) {
    return 'أمامك عناوين سكن طلاب مدرسة كتبها أولياء الأمور نصًّا حرًّا. اجمعها في «نقاط تجمع» للمواصلات.\n' +
      '- كل اسم مكان يرد في العناوين (حي، كمبوند، مَعلم، منطقة فرعية) هو نقطة تجمع، وكل عنوان يذكره ينضم إليها مهما اختلفت طريقة كتابته. مثال: «حي السفارات» نقطة تجمع، وكل عنوان فيه «السفارات» ينضم إليها.\n' +
      '- أنشئ المجموعة ولو كان فيها طالب واحد. اختر لكل عنوان أدق مكان مذكور فيه (الحي أو الكمبوند لا المدينة كلها).\n' +
      '- سمِّ كل مجموعة بالاسم كما ورد في العناوين دون اختراع أماكن، واكتب في area المنطقة الأوسع.\n' +
      '- لا تضع في unclear إلا العنوان الذي لا يذكر أي مكان. كل رقم يظهر مرة واحدة فقط.' +
      (payload.existing.length ? '\nنقاط تجمع موجودة (استخدم الاسم نفسه إن انطبق): ' + payload.existing.join('، ') : '') +
      '\n\nأجب بـ JSON فقط بهذا الشكل دون أي شرح:\n{"clusters":[{"name":"اسم نقطة التجمع","area":"المنطقة الأوسع","members":[1,2]}],"unclear":[3]}' +
      '\n\nالعناوين (الرقم: النص):\n' + payload.addresses.map(function (x) { return x.n + ': ' + x.a; }).join('\n');
  }

  /* --- مطابقة العناوين بأسماء الأماكن دون ذكاء اصطناعي --- */

  // صيغة للمقارنة تتجاهل المسافات والهمزات: «جاردينيا سيتي» = «جاردينياسيتي»
  function compact(text) { return norm(text).replace(/[\s\/,،\-–.()؛:]+/g, ''); }

  // كلمات لا تدل على مكان بذاتها، يُقطع عندها العنوان
  var ADDR_BREAK = ['شارع', 'ش', 'عماره', 'عمارات', 'شقه', 'برج', 'رقم', 'بجوار', 'امام', 'خلف', 'الدور', 'دور', 'منزل', 'بيت', 'متفرع', 'من', 'في', 'علي', 'عند', 'بلوك', 'قطعه', 'مدخل', 'قرب', 'مقابل', 'بعد', 'قبل', 'و'];
  var ADDR_GENERIC = ['حي', 'الحي', 'مدينه', 'منطقه', 'كمبوند', 'مساكن', 'ابراج', 'مفترق', 'ميدان', 'محطه'];

  // كلمات العنوان بصيغتيها: كما كُتبت (o) وموحّدة للمقارنة (n)، مقسّمة إلى مقاطع عند الفواصل والأرقام
  function addrSegments(address) {
    return String(address).replace(/[0-9٠-٩]+/g, ' | ').split(/[\/,،\-–.|()؛:]+/).map(function (seg) {
      return seg.trim().split(/\s+/).filter(Boolean).map(function (word) { return { o: word, n: norm(word) }; })
        .filter(function (t) { return t.n; });
    });
  }

  // تجميع محلي دون ذكاء اصطناعي: كل اسم مكان يتكرر في عنوانين فأكثر يصير نقطة تجمع، وكل عنوان يذكره ينضم إليها.
  // - الكلمات التي ترد في أكثر من خُمس العناوين (كاسم المدينة) تُعدّ منطقة عامة لا نقطة تجمع.
  // - «حي السفارات» و«السفارات» مكان واحد: الكلمات العامة (حي، كمبوند…) لا تدخل في المقارنة.
  // - يُلحق العنوان بأدق مكان يذكره ما دام يجمع ثلاثة فأكثر، وإلا فبأكبر مكان يذكره.
  function localClusters(pool) {
    var segs = pool.map(function (x) { return addrSegments(x.address); });
    var limit = Math.max(3, pool.length * 0.2);
    var best = function (obj) { return Object.keys(obj).sort(function (a, b) { return obj[b] - obj[a]; })[0]; };

    var tokenDf = {};
    segs.forEach(function (list) {
      var seen = {};
      list.forEach(function (seg) { seg.forEach(function (t) { seen[t.n] = true; }); });
      Object.keys(seen).forEach(function (n) { tokenDf[n] = (tokenDf[n] || 0) + 1; });
    });
    var broad = function (n) { return tokenDf[n] > limit && ADDR_GENERIC.indexOf(n) < 0 && ADDR_BREAK.indexOf(n) < 0; };

    // لكل عنوان: أسماء الأماكن فيه { المفتاح: النص كما كُتب }، واسم منطقته العامة
    var places = [], areaOf = [];
    segs.forEach(function (list) {
      var out = {}, areas = [];
      list.forEach(function (seg) {
        var run = [], area = [];
        var flush = function () {
          for (var i = 0; i < run.length; i++) {
            for (var n = 1; n <= 3 && i + n <= run.length; n++) {
              var part = run.slice(i, i + n);
              if (ADDR_GENERIC.indexOf(part[n - 1].n) > -1) continue; // لا ينتهي اسم المكان بكلمة عامة
              var key = part.filter(function (t) { return ADDR_GENERIC.indexOf(t.n) < 0; }).map(function (t) { return t.n; }).join('');
              if (key.length < 3) continue;
              var text = part.map(function (t) { return t.o; }).join(' ');
              // يُفضَّل النص الأطول للمفتاح نفسه: «حي السفارات» على «السفارات»
              if (!out[key] || text.length > out[key].length) out[key] = text;
            }
          }
          run = [];
        };
        var flushArea = function () { if (area.length) areas.push(area.join(' ')); area = []; };
        for (var j = 0; j < seg.length; j++) {
          var t = seg[j];
          // «مدينة» قبل «نصر»: الكلمة العامة تتبع اسم المنطقة الذي يليها
          var next = seg[j + 1];
          if (broad(t.n) || (ADDR_GENERIC.indexOf(t.n) > -1 && next && broad(next.n))) { flush(); area.push(t.o); continue; }
          flushArea();
          if (ADDR_BREAK.indexOf(t.n) > -1) flush(); else run.push(t);
        }
        flush(); flushArea();
      });
      places.push(out);
      areaOf.push(areas.sort(function (a, b) { return b.length - a.length; })[0] || '');
    });

    var df = {}, surface = {};
    places.forEach(function (set) {
      Object.keys(set).forEach(function (k) {
        df[k] = (df[k] || 0) + 1;
        var sf = surface[k] || (surface[k] = {});
        sf[set[k]] = (sf[set[k]] || 0) + 1;
      });
    });

    var groups = {}, unclear = [];
    pool.forEach(function (x, i) {
      var cands = Object.keys(places[i]).filter(function (k) { return df[k] >= 2; });
      if (!cands.length) return unclear.push(x.id);
      var solid = cands.filter(function (k) { return df[k] >= 3; });
      var pick = solid.length
        ? solid.sort(function (a, b) { return df[a] - df[b] || b.length - a.length; })[0]
        : cands.sort(function (a, b) { return df[b] - df[a] || b.length - a.length; })[0];
      var g = groups[pick] || (groups[pick] = { key: pick, ids: [], areaVotes: {} });
      g.ids.push(x.id);
      if (areaOf[i]) g.areaVotes[areaOf[i]] = (g.areaVotes[areaOf[i]] || 0) + 1;
    });

    // «جاردينيا» و«جاردينيا سيتي» مكان واحد: تُدمج المجموعة التي يبدأ مفتاحها بمفتاح أخرى
    var keys = Object.keys(groups).sort(function (a, b) { return a.length - b.length; });
    keys.forEach(function (shortKey) {
      keys.forEach(function (longKey) {
        var a = groups[shortKey], b = groups[longKey];
        if (!a || !b || a === b || longKey.indexOf(shortKey) !== 0) return;
        var keep = b.ids.length >= a.ids.length ? b : a, drop = keep === a ? b : a;
        keep.ids = keep.ids.concat(drop.ids);
        Object.keys(drop.areaVotes).forEach(function (v) { keep.areaVotes[v] = (keep.areaVotes[v] || 0) + drop.areaVotes[v]; });
        delete groups[drop.key];
      });
    });

    var clusters = Object.keys(groups).map(function (k) {
      return { name: best(surface[k]), area: best(groups[k].areaVotes) || '', ids: groups[k].ids, on: true };
    });
    clusters.sort(function (a, b) { return a.area.localeCompare(b.area, 'ar') || b.ids.length - a.ids.length; });
    return { clusters: clusters, unclear: unclear };
  }

  // يضم إلى مجموعة كل طالب «بدون مجموعة» يذكر عنوانه اسمها. تُتجاهل أجزاء الاسم العامة (كاسم المدينة)
  function absorbByName(cl, onlyCluster) {
    var addr = {}, moved = 0;
    cl.pool.forEach(function (x) { addr[x.id] = compact(x.address); });
    var broad = function (key) {
      var n = 0;
      cl.pool.forEach(function (x) { if (addr[x.id].indexOf(key) > -1) n++; });
      return n > Math.max(3, cl.pool.length * 0.34);
    };
    var keysOf = function (c) {
      var parts = [];
      [c.name].concat(c.aliases || []).forEach(function (name) {
        String(name).split(/[\/,،\-–()]+/).map(compact).concat([compact(name)]).forEach(function (k) {
          if (k.length >= 4 && parts.indexOf(k) < 0) parts.push(k);
        });
      });
      return parts.filter(function (k) { return !broad(k); });
    };
    var targets = (onlyCluster ? [onlyCluster] : cl.clusters).map(function (c) { return { c: c, keys: keysOf(c) }; });
    cl.unclear = cl.unclear.filter(function (id) {
      var hit = null, len = 0;
      targets.forEach(function (t) {
        t.keys.forEach(function (k) { if (k.length > len && addr[id].indexOf(k) > -1) { hit = t.c; len = k.length; } });
      });
      if (!hit) return true;
      hit.ids.push(id);
      moved++;
      return false;
    });
    return moved;
  }

  // يحوّل إجابة النموذج إلى مجموعات من الطلاب، ويضمن أن كل طالب في مكان واحد فقط
  function readClusterResult(result, pool) {
    if (!result || !Array.isArray(result.clusters)) throw new Error('الإجابة ليست بالشكل المتوقع');
    var seen = {}, clusters = [];
    result.clusters.forEach(function (c) {
      var ids = [];
      (Array.isArray(c.members) ? c.members : []).forEach(function (n) {
        var st = pool[Number(n) - 1];
        if (st && !seen[st.id]) { seen[st.id] = true; ids.push(st.id); }
      });
      var name = String(c.name || '').replace(/\s+/g, ' ').trim();
      if (ids.length && name) clusters.push({ name: name, area: String(c.area || '').trim(), ids: ids, on: true });
      else ids.forEach(function (id) { delete seen[id]; });
    });
    clusters.sort(function (a, b) { return a.area.localeCompare(b.area, 'ar') || b.ids.length - a.ids.length; });
    return { clusters: clusters, unclear: pool.filter(function (x) { return !seen[x.id]; }).map(function (x) { return x.id; }) };
  }

  // بعد أي نتيجة: من بقي بلا مجموعة ويذكر عنوانه اسم مجموعة مقترحة أو موجودة يُضم إليها
  function finishClusters(cl, result) {
    Object.assign(cl, result, { step: 'review', notSame: {} });
    // المجموعات الموجودة تدخل بأسمائها وتسمياتها البديلة: ما طابقها من المقترحات يُدمج فيها مباشرة
    S.tGroups.forEach(function (g) {
      var names = [g.assembly_point].concat(Array.isArray(g.aliases) ? g.aliases : []).map(compact);
      var mine = { name: g.assembly_point, area: '', ids: [], on: true, aliases: (g.aliases || []).slice() };
      cl.clusters = cl.clusters.filter(function (c) {
        if (names.indexOf(compact(c.name)) < 0) return true;
        mine.ids = mine.ids.concat(c.ids);
        if (!mine.area) mine.area = c.area;
        return false;
      });
      cl.clusters.push(mine);
    });
    absorbByName(cl);
    cl.clusters = cl.clusters.filter(function (c) { return c.ids.length; });
    cl.clusters.sort(function (a, b) { return a.area.localeCompare(b.area, 'ar') || b.ids.length - a.ids.length; });
  }

  /* --- حسم الأماكن المتشابهة: هل هي مكان واحد؟ --- */

  // عدد التعديلات (حذف/إضافة/تبديل حرف) بين نصّين
  function editDistance(a, b) {
    var prev = [], i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      var cur = [i];
      for (j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      }
      prev = cur;
    }
    return prev[b.length];
  }

  function placeWords(name) {
    return norm(name).split(/[\s\/,،\-–()]+/).filter(function (w) { return w.length >= 4 && ADDR_GENERIC.indexOf(w) < 0; });
  }

  // اسمان يُحتمل أنهما مكان واحد: أحدهما جزء من الآخر، أو يختلفان بحرف أو حرفين، أو يشتركان في كلمة مميزة
  function looksSamePlace(a, b) {
    // تُقارن الأسماء دون الكلمات العامة: «الحي السابع» و«الحي التاسع» لا يتشابهان لمجرد اشتراكهما في «الحي»
    var bare = function (name) {
      return norm(name).split(/[\s\/,،\-–()]+/).filter(function (w) { return w && ADDR_GENERIC.indexOf(w) < 0; }).join('');
    };
    var ka = bare(a), kb = bare(b);
    if (ka.length < 3 || kb.length < 3) return false;
    if (ka.indexOf(kb) > -1 || kb.indexOf(ka) > -1) return true;
    if (editDistance(ka, kb) <= (Math.min(ka.length, kb.length) >= 8 ? 2 : 1)) return true;
    var wa = placeWords(a), wb = placeWords(b);
    return wa.some(function (x) { return wb.some(function (y) { return x === y || (x.length >= 6 && y.length >= 6 && editDistance(x, y) <= 1); }); });
  }

  function pairKey(a, b) { return [norm(a), norm(b)].sort().join('|'); }

  // مجموعات من الأسماء المتشابهة التي لم يُحسم أمرها بعد: [[فهرس، فهرس…]، …]
  function similarSets(cl) {
    var n = cl.clusters.length, parent = [], i, j;
    var find = function (x) { while (parent[x] !== x) x = parent[x] = parent[parent[x]]; return x; };
    for (i = 0; i < n; i++) parent[i] = i;
    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        var a = cl.clusters[i].name, b = cl.clusters[j].name;
        if (!cl.notSame[pairKey(a, b)] && looksSamePlace(a, b)) parent[find(i)] = find(j);
      }
    }
    var sets = {};
    for (i = 0; i < n; i++) (sets[find(i)] || (sets[find(i)] = [])).push(i);
    return Object.keys(sets).map(function (k) { return sets[k]; }).filter(function (s) { return s.length > 1; });
  }

  // يدمج المجموعات المذكورة في واحدة تحمل الاسم المختار، وتُحفظ الأسماء الأخرى كتسميات بديلة لها
  function mergeClusters(cl, indices, keepIndex) {
    var keep = cl.clusters[keepIndex], names = {};
    (keep.aliases || []).forEach(function (a) { names[a] = true; });
    indices.forEach(function (i) {
      if (i === keepIndex) return;
      var c = cl.clusters[i];
      keep.ids = keep.ids.concat(c.ids);
      names[c.name] = true;
      (c.aliases || []).forEach(function (a) { names[a] = true; });
      if (!keep.area) keep.area = c.area;
    });
    delete names[keep.name];
    keep.aliases = Object.keys(names);
    keep.on = true;
    cl.clusters = cl.clusters.filter(function (c, i) { return i === keepIndex || indices.indexOf(i) < 0; });
  }

  function similarCardHtml(cl) {
    var sets = similarSets(cl);
    if (!sets.length) return '';
    return '<div class="card" style="border-color:var(--amber)"><h2>أسماء متشابهة: هل هي مكان واحد؟ (' + sets.length + ')</h2>' +
      '<p class="hint">اختر الاسم الذي يبقى ثم «دمج»، أو «أماكن مختلفة» إن لم تكن مكانًا واحدًا. الأسماء المدموجة تُحفظ كتسميات بديلة، فيُعرف المكان بها في المرات القادمة.</p>' +
      sets.map(function (set, si) {
        // الاسم المقترح للبقاء: الأكثر طلابًا
        var top = set.slice().sort(function (a, b) { return cl.clusters[b].ids.length - cl.clusters[a].ids.length; })[0];
        return '<div class="simset">' + set.map(function (i) {
          var c = cl.clusters[i];
          return '<label class="check"><input type="radio" name="clm-' + si + '" value="' + i + '"' + (i === top ? ' checked' : '') + '>' +
            '<b>' + esc(c.name) + '</b> <span style="color:var(--muted)">(' + c.ids.length + ')</span></label>';
        }).join('') +
          '<div class="actions" style="margin-top:6px"><button type="button" class="btn primary" data-clmerge="' + set.join(',') + '" data-set="' + si + '">دمج في الاسم المختار</button>' +
          '<button type="button" class="btn" data-clnotsame="' + set.join(',') + '">أماكن مختلفة</button></div></div>';
      }).join('') +
      (sets.length > 1 ? '<div class="actions"><button type="button" class="btn" data-clmergeall>دمج كل المقترحات (الاسم الأكثر طلابًا)</button></div>' : '') +
      '</div>';
  }

  async function runClustering() {
    var cl = ui.cl, pool = clusterPool(cl.includePending);
    if (!pool.length) return toast('لا يوجد طلاب بعناوين خارج مجموعات المواصلات.', true);
    cl.pool = pool; cl.step = 'busy'; cl.error = '';
    render();
    var r;
    try {
      r = await sb.functions.invoke('cluster-addresses', { body: clusterPayload(pool) });
    } catch (err) {
      r = { error: err };
    }
    if (ui.cl !== cl) return; // أُلغي أثناء الانتظار
    if (r.error || !r.data || r.data.error) {
      // الخدمة الآلية غير مفعّلة أو تعذّرت: يُعرض النص ليُنسخ يدويًا
      cl.step = 'manual';
      cl.error = (r.data && r.data.error) || '';
      return render();
    }
    try {
      finishClusters(cl, readClusterResult(r.data, pool));
    } catch (err) {
      cl.step = 'manual'; cl.error = err.message;
    }
    render();
  }

  function clusterMoveSelect(id, current) {
    var cl = ui.cl;
    return '<select data-clmove="' + id + '" aria-label="نقل إلى مجموعة">' +
      cl.clusters.map(function (c, i) { return '<option value="' + i + '"' + (i === current ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') +
      '<option value="-1"' + (current === -1 ? ' selected' : '') + '>بدون مجموعة</option></select>';
  }

  function clusterMemberRow(id, current) {
    var x = findStudent(id);

        '<label class="check"><input type="checkbox" id="cl-pending"' + (cl.includePending ? ' checked' : '') + (busy ? ' disabled' : '') + '>تضمين الطلاب ذوي التسجيل المبدئي</label>' +
        '<p class="st-count" style="margin-top:8px">عدد العناوين التي ستُحلَّل: ' + n + '</p>' +

          '<button type="button" class="btn" data-clrun' + (busy || !n ? ' disabled' : '') + '>' + (busy ? 'جارٍ التحليل بالذكاء الاصطناعي… قد يستغرق دقيقة' : 'تحليل بالذكاء الاصطناعي') + '</button></div>' +
        '<p class="hint" style="margin:12px 0 0"><b>الأماكن المتكررة:</b> فوري ويعمل داخل الصفحة؛ كل اسم مكان يتكرر في عنوانين فأكثر يصير نقطة تجمع، وكل عنوان يذكره ينضم إليها.<br>' +
        '<b>الذكاء الاصطناعي:</b> يفهم اختلاف التهجئة والأماكن المتجاورة؛ يُرسَل نص العنوان فقط مع رقم تسلسلي، بلا أسماء ولا أرقام هوية ولا هواتف.</p></div>';
      return;
    }

    if (cl.step === 'manual') {
      app.innerHTML = head + '<div class="card"><h2>التحليل اليدوي عبر محادثة Claude</h2>' +
        '<p class="hint">الخدمة الآلية غير مفعّلة بعد' + (cl.error ? ' (' + esc(cl.error) + ')' : '') + '. يمكنك إتمام العمل يدويًا في ثلاث خطوات:</p>' +
        '<ol style="margin:0 0 10px;padding-inline-start:20px"><li>انسخ النص التالي.</li><li>الصقه في محادثة جديدة على claude.ai وأرسله.</li><li>انسخ إجابة Claude كاملة والصقها في المربع الثاني ثم اضغط «قراءة الإجابة».</li></ol>' +
        '<textarea id="cl-prompt" readonly style="min-height:150px" dir="rtl">' + esc(clusterPromptText(clusterPayload(cl.pool))) + '</textarea>' +
        '<div class="actions" style="margin-top:8px"><button type="button" class="btn" data-clcopy>نسخ النص</button></div>' +
        '<label class="field" for="cl-answer" style="margin-top:16px">إجابة Claude</label>' +
        '<textarea id="cl-answer" style="min-height:120px" dir="ltr" placeholder=\'{"clusters":[...],"unclear":[...]}\'></textarea>' +
        '<div class="actions" style="margin-top:8px"><button type="button" class="btn primary" data-clparse>قراءة الإجابة</button>' +
        '<button type="button" class="btn" data-cllocal>أو: تجميع حسب الأماكن المتكررة</button></div></div>';
      return;
    }

    // مراجعة الاقتراح
    var known = {};
    S.tGroups.forEach(function (g) { known[norm(g.assembly_point)] = true; });
    var chosen = cl.clusters.filter(function (c) { return c.on && c.ids.length; });
    var placed = cl.clusters.reduce(function (a, c) { return a + c.ids.length; }, 0);
    var area = null;
    app.innerHTML = head +
      '<div class="page-head"><div><h1 style="font-size:1.2rem">نقاط التجمع المقترحة</h1>' +
        '<p>المجموعات: ' + cl.clusters.length + ' · طلاب في مجموعات: ' + placed + ' · بدون مجموعة: ' + cl.unclear.length + '</p>' +
        '<p>عدّل الأسماء، انقل الطلاب بين المجموعات، وأزل العلامة عمّا لا تريده. لا يُحفظ شيء قبل الضغط على «إنشاء المجموعات».</p></div></div>' +
      similarCardHtml(cl) +
      '<div class="card"><label class="field" for="cl-newname">إضافة نقطة تجمع باسم مكان</label>' +
        '<div class="addstmt" style="margin-top:0"><input type="text" id="cl-newname" placeholder="مثال: حي السفارات">' +
        '<button type="button" class="btn" data-clnew>إنشاء وضم من يذكرونه</button></div>' +
        '<p class="hint" style="margin:6px 0 0">يُضم إليها كل طالب «بدون مجموعة» يرد هذا الاسم في عنوانه.</p></div>' +
      cl.clusters.map(function (c, i) {
        var title = c.area !== area ? '<h2 style="margin:18px 0 8px;font-size:1rem;color:var(--muted)">' + esc(c.area || 'منطقة غير محددة') + '</h2>' : '';
        area = c.area;
        return title + '<div class="card" style="margin-top:8px"><div class="toolbar" style="align-items:center;margin:0">' +
          '<input type="checkbox" data-clon="' + i + '"' + (c.on ? ' checked' : '') + ' aria-label="إنشاء هذه المجموعة" style="width:18px;height:18px;accent-color:var(--primary)">' +
          '<input type="text" data-clname="' + i + '" aria-label="اسم نقطة التجمع" style="flex:1;min-width:160px;font-weight:700" value="' + esc(c.name) + '">' +
          '<span class="badge ' + (known[norm(c.name)] ? 'review' : 'approved') + '">' + c.ids.length + ' ' + (known[norm(c.name)] ? '· يُضافون إلى مجموعة موجودة' : '· مجموعة جديدة') + '</span>' +
          '<select data-clinto="' + i + '" aria-label="دمج هذه المجموعة في مجموعة أخرى"><option value="">دمج في…</option>' +
            cl.clusters.map(function (o, k) { return k === i ? '' : '<option value="' + k + '">' + esc(o.name) + '</option>'; }).join('') + '</select></div>' +
          (c.aliases && c.aliases.length ? '<p class="hint" style="margin:6px 0 0">تسميات بديلة: ' + esc(c.aliases.join('، ')) + '</p>' : '') +
          '<details class="bank"><summary>الطلاب (' + c.ids.length + ')</summary>' + c.ids.map(function (id) { return clusterMemberRow(id, i); }).join('') + '</details></div>';
      }).join('') +
      (cl.unclear.length
        ? '<div class="card"><h2>بدون مجموعة (' + cl.unclear.length + ')</h2><p class="hint">عناوين لم يُعثر فيها على مكان مشترك. اختر لكل طالب مجموعة، أو أنشئ نقطة تجمع باسم المكان من الأعلى، أو اتركه ليُضاف لاحقًا.</p>' +
          cl.unclear.map(function (id) { return clusterMemberRow(id, -1); }).join('') + '</div>'
        : '') +
      '<div class="actions"><button type="button" class="btn primary" data-clapply' + (chosen.length ? '' : ' disabled') + '>إنشاء المجموعات (' + chosen.length + ') وإضافة الطلاب (' +
        chosen.reduce(function (a, c) { return a + c.ids.length; }, 0) + ')</button>' +
      '<button type="button" class="btn" data-clcancel>إلغاء</button></div>';
  }

  async function applyClusters() {
    var cl = ui.cl, chosen = cl.clusters.filter(function (c) { return c.on && c.ids.length && c.name.trim(); });
    for (var i = 0; i < chosen.length; i++) {
      var c = chosen[i], name = c.name.trim();
      var g = S.tGroups.filter(function (x) { return norm(x.assembly_point) === norm(name); })[0];
      if (!g) {
        var fresh = { assembly_point: name, notes: c.area || '' };
        if (!S.aliasMissing) fresh.aliases = c.aliases || [];
        var ins = await sb.from('transport_groups').insert(fresh).select().single();
        if (ins.error) { render(); return fail(ins.error); }
        g = ins.data;
        S.tGroups.push(g);
      } else if (!S.aliasMissing && c.aliases && c.aliases.length) {
        var merged = (Array.isArray(g.aliases) ? g.aliases : []).concat(c.aliases.filter(function (a) { return (g.aliases || []).indexOf(a) < 0; }));
        var al = await sb.from('transport_groups').update({ aliases: merged }).eq('id', g.id);
        if (al.error) { render(); return fail(al.error); }
        g.aliases = merged;
      }
      var rows = c.ids.map(function (id) { return { student_id: id, group_id: g.id, share: null }; });
      var up = await sb.from('transport_members').upsert(rows, { onConflict: 'student_id' });
      if (up.error) { render(); return fail(up.error); }
      S.tMembers = S.tMembers.filter(function (m) { return c.ids.indexOf(m.student_id) < 0; }).concat(rows);
      c.on = false; // لا تُكرَّر إن أُعيد الضغط بعد خطأ لاحق
    }
    S.tGroups.sort(function (a, b) { return a.assembly_point.localeCompare(b.assembly_point, 'ar'); });
    ui.cl = null;
    render();
    toast('تم إنشاء المجموعات وإضافة الطلاب');
  }

  // نقطة تجمع جديدة باسم مكان يكتبه المستخدم، يُضم إليها من يذكره من غير المجمَّعين
  function addClusterByName() {
    var cl = ui.cl, box = document.getElementById('cl-newname'), name = box.value.replace(/\s+/g, ' ').trim();
    if (compact(name).length < 3) return box.focus();
    var c = cl.clusters.filter(function (x) { return norm(x.name) === norm(name); })[0];
    var fresh = !c;
    if (fresh) { c = { name: name, area: '', ids: [], on: true }; cl.clusters.unshift(c); }
    var moved = absorbByName(cl, c);
    if (!moved && fresh) {
      cl.clusters.shift();
      return toast('لا يوجد طالب «بدون مجموعة» يرد «' + name + '» في عنوانه.', true);
    }
    render();
    toast('انضم ' + moved + ' إلى «' + name + '»');
  }

  document.addEventListener('click', async function (e) {
    if (!isAdmin() || location.hash !== '#/transport') return;
    var cl = ui.cl;
    if (e.target.closest('[data-clopen]')) {
      ui.cl = { step: 'setup', includePending: true, pool: [], clusters: [], unclear: [], notSame: {}, error: '' };
      render();
    } else if (!cl) {
      return;
    } else if (e.target.closest('[data-clcancel]')) {
      if (cl.step === 'review' && !confirm('إلغاء الاقتراح الحالي دون إنشاء المجموعات؟')) return;
      ui.cl = null;
      render();
    } else if (e.target.closest('[data-clrun]')) {
      runClustering();
    } else if (e.target.closest('[data-cllocal]')) {
      if (!cl.pool.length) cl.pool = clusterPool(cl.includePending);
      if (!cl.pool.length) return toast('لا يوجد طلاب بعناوين خارج مجموعات المواصلات.', true);
      finishClusters(cl, localClusters(cl.pool));
      render();
    } else if (e.target.closest('[data-clnew]')) {
      addClusterByName();
    } else if (e.target.closest('[data-clmerge]')) {
      var mb = e.target.closest('[data-clmerge]');
      var picked = app.querySelector('[name="clm-' + mb.getAttribute('data-set') + '"]:checked');
      mergeClusters(cl, mb.getAttribute('data-clmerge').split(',').map(Number), Number(picked.value));
      render();
    } else if (e.target.closest('[data-clnotsame]')) {
      var idx = e.target.closest('[data-clnotsame]').getAttribute('data-clnotsame').split(',').map(Number);
      idx.forEach(function (a) { idx.forEach(function (b) { if (a < b) cl.notSame[pairKey(cl.clusters[a].name, cl.clusters[b].name)] = true; }); });
      render();
    } else if (e.target.closest('[data-clmergeall]')) {
      // تُعاد قراءة المقترحات بعد كل دمج لأن الفهارس تتغير
      for (var sets = similarSets(cl); sets.length; sets = similarSets(cl)) {
        var set = sets[0];
        mergeClusters(cl, set, set.slice().sort(function (a, b) { return cl.clusters[b].ids.length - cl.clusters[a].ids.length; })[0]);
      }
      render();
    } else if (e.target.closest('[data-clcopy]')) {
      var box = document.getElementById('cl-prompt');
      try { await navigator.clipboard.writeText(box.value); toast('تم نسخ النص'); }
      catch (err) { box.focus(); box.select(); toast('حدِّد النص وانسخه يدويًا (Ctrl+C).', true); }
    } else if (e.target.closest('[data-clparse]')) {
      // الإجابة قد تأتي محاطة بشرح أو بعلامات تنسيق: يُؤخذ منها كائن JSON فقط
      var text = document.getElementById('cl-answer').value, a = text.indexOf('{'), b = text.lastIndexOf('}');
      try {
        if (a < 0 || b <= a) throw new Error('لا تحتوي على JSON');
        finishClusters(cl, readClusterResult(JSON.parse(text.slice(a, b + 1)), cl.pool));
        render();
      } catch (err) {
        toast('تعذرت قراءة الإجابة: ' + err.message, true);
      }
    } else if (e.target.closest('[data-clapply]')) {
      e.target.closest('[data-clapply]').disabled = true;
      applyClusters();
    }
  });

  app.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'cl-newname' && ui.cl) { e.preventDefault(); addClusterByName(); }
  });

  app.addEventListener('change', function (e) {
    var cl = ui.cl, el = e.target;
    if (!cl || !isAdmin() || location.hash !== '#/transport') return;
    if (el.id === 'cl-pending') {
      cl.includePending = el.checked;
      cl.pool = [];
      render();
    } else if (el.hasAttribute('data-clon')) {
      cl.clusters[Number(el.getAttribute('data-clon'))].on = el.checked;
      render();
    } else if (el.hasAttribute('data-clinto')) {
      if (el.value === '') return;
      mergeClusters(cl, [Number(el.getAttribute('data-clinto')), Number(el.value)], Number(el.value));
      render();
    } else if (el.hasAttribute('data-clname')) {
      cl.clusters[Number(el.getAttribute('data-clname'))].name = el.value.replace(/\s+/g, ' ').trim();
      render();
    } else if (el.hasAttribute('data-clmove')) {
      var id = el.getAttribute('data-clmove'), to = Number(el.value);
      cl.clusters.forEach(function (c) { c.ids = c.ids.filter(function (x) { return x !== id; }); });
      cl.unclear = cl.unclear.filter(function (x) { return x !== id; });
      if (to >= 0) cl.clusters[to].ids.push(id); else cl.unclear.push(id);
      // تبقى قوائم الطلاب المفتوحة مفتوحة بعد إعادة الرسم
      var open = Array.prototype.map.call(app.querySelectorAll('details.bank'), function (d) { return d.open; });
      render();
      Array.prototype.forEach.call(app.querySelectorAll('details.bank'), function (d, i) { d.open = !!open[i]; });
    }
  });

  /* ---------- قائمة المعلمين ---------- */

  function renderList() {
    var q = ui.search.trim();
    var shown = S.teachers.filter(function (t) {
      return !q || t.name.indexOf(q) > -1 || t.subject.indexOf(q) > -1;
    });

    var cards = shown.map(function (t) {
      var score = t.status === 'new' ? '' :
        '<span class="score">' + total(t) + ' / ' + MAX + '</span>';
      return '<button type="button" class="card teacher" data-open="' + t.id + '">' +
        '<span class="name">' + esc(t.name) + '</span>' +
        '<span class="subject">' + esc(t.subject || '—') + '</span>' +
        '<span class="foot"><span class="badge ' + t.status + '">' + STATUS[t.status] + '</span>' + score + '</span>' +
        '</button>';
    }).join('');

    app.innerHTML = tabs('teachers') +
      '<div class="toolbar">' +
        '<input type="search" id="search" placeholder="ابحث باسم المعلم أو التخصص" aria-label="بحث" value="' + esc(ui.search) + '">' +
        (isAdmin() ? '<a class="btn primary" href="#/staff" style="text-decoration:none">+ إضافة معلم</a>' : '') +
      '</div>' +
      (shown.length
        ? '<div class="teachers">' + cards + '</div>'
        : '<div class="card empty">' + (S.teachers.length ? 'لا توجد نتائج مطابقة.'
            : isAdmin() ? 'لا يوجد معلمون بعد. أضفهم من تبويب «بيانات المعلمين».' : 'لا يوجد معلمون بعد. يضيفهم مدير النظام.') + '</div>');
  }

  /* ---------- التقييم ---------- */

  function stepper(t) {
    var cur = stepIndex(t.status);
    var allDone = t.status === 'published';
    return '<ol class="stepper">' + STEPS.map(function (s, i) {
      var cls = allDone || i < cur ? 'done' : (i === cur ? 'current' : '');
      return '<li class="' + cls + '"' + (cls === 'current' ? ' aria-current="step"' : '') + '>' +
        '<span class="num">' + (cls === 'done' ? '✓' : i + 1) + '</span>' +
        '<span><span class="t">' + s.title + '</span><br><span class="d">' + s.desc + '</span></span></li>';
    }).join('') + '</ol>';
  }

  function summary(sum) {
    var pct = Math.round(sum / MAX * 100);
    return '<div class="summary">' +
      '<div class="box"><div class="k">المجموع</div><div class="v">' + sum + ' / ' + MAX + '</div></div>' +
      '<div class="box"><div class="k">النسبة</div><div class="v">' + pct + '%</div></div>' +
      '<div class="box"><div class="k">التقدير</div><div class="v">' + grade(pct) + '</div></div>' +
      '</div>';
  }

  function readOnlyTable(ratings) {
    return '<div class="table-wrap"><table class="criteria"><thead><tr><th>م</th><th>التقييم الأدائي والكفايات الشخصية</th><th>التقييم</th></tr></thead><tbody>' +
      CRITERIA.map(function (c, i) {
        return '<tr><td class="n">' + (i + 1) + '</td><td>' + c + '</td><td class="r"><span class="pill">' + (ratings[i] || '—') + '</span></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function notesBlock(title, text) {
    return text ? '<div class="notes-block"><h3>' + title + '</h3><p>' + esc(text) + '</p></div>' : '';
  }

  function editStep(t) {
    var done = ratedCount(t);
    var rows = CRITERIA.map(function (c, i) {
      var opts = SCALE.slice().reverse().map(function (s) {
        return '<label title="' + s.label + '"><input type="radio" name="c' + i + '" value="' + s.v + '"' +
          (t.ratings[i] === s.v ? ' checked' : '') + ' aria-label="' + s.v + ' - ' + s.label + '"><span>' + s.v + '</span></label>';
      }).join('');
      var missing = ui.error && !t.ratings[i] ? ' class="missing"' : '';
      return '<tr' + missing + '><td class="n">' + (i + 1) + '</td><td>' + c + '</td>' +
        '<td class="r"><span class="rate" role="radiogroup" aria-label="تقييم البند ' + (i + 1) + '">' + opts + '</span></td></tr>';
    }).join('');

    return '<div class="card">' +
      '<div class="progress-row"><span id="progress-text">تم تقييم ' + done + ' من ' + CRITERIA.length + ' بندًا</span>' +
      '<span class="save-state" id="save-state"></span></div>' +
      '<div class="progress"><div id="progress-bar" style="width:' + (done / CRITERIA.length * 100) + '%"></div></div>' +
      '<div class="legend">' + SCALE.map(function (s) { return '<span><b>' + s.v + '</b> = ' + s.label + '</span>'; }).join('') + '</div>' +
      '<div class="table-wrap"><table class="criteria edit"><thead><tr><th>م</th><th>التقييم الأدائي والكفايات الشخصية</th><th>التقييم</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="notes-block"><label class="field" for="notes">ملاحظات المشرف</label>' +
      '<textarea id="notes" placeholder="نقاط القوة، فرص التحسين، التوصيات...">' + esc(t.notes) + '</textarea></div>' +
      (ui.error ? '<div class="msg" role="alert">' + ui.error + '</div>' : '') +
      '<div class="actions">' +
        '<button type="button" class="btn primary" data-act="submit">إرسال للاعتماد</button>' +
        '<button type="button" class="btn" data-act="back">حفظ كمسودة</button>' +
      '</div></div>';
  }

  function reviewStep(t) {
    return '<div class="card">' + summary(total(t)) + readOnlyTable(t.ratings) +
      notesBlock('ملاحظات المشرف', t.notes) +
      '<div class="notes-block"><label class="field" for="approver-notes">ملاحظات الاعتماد</label>' +
      '<textarea id="approver-notes" placeholder="ملاحظات المعتمِد (اختياري)">' + esc(t.approver_notes) + '</textarea></div>' +
      '<div class="actions">' +
        '<button type="button" class="btn primary" data-act="approve">اعتماد التقييم</button>' +
        '<button type="button" class="btn" data-act="return">إعادة للتحرير</button>' +
      '</div></div>';
  }

  function publishStep(t) {
    var published = t.status === 'published';
    return '<div class="card">' +
      '<div class="info no-print">' + (published
        ? 'تم نشر التقييم بتاريخ ' + fmtDate(t.published_at) + (t.visible ? '' : ' (مخفي عن المشاهدين)')
        : 'تم اعتماد التقييم بتاريخ ' + fmtDate(t.approved_at) + ' وهو جاهز للنشر.') + '</div>' +
      summary(total(t)) + readOnlyTable(t.ratings) +
      notesBlock('ملاحظات المشرف', t.notes) +
      notesBlock('ملاحظات الاعتماد', t.approver_notes) +

  /* ---------- إعداد الفصول الدراسية (مدير النظام) ----------
     تُحفظ في settings.classes بهذا الشكل: { rooms: عدد الغرف, list: [{ name, gender, capacity, teacher }] } (teacher: مربي الصف).
     الصيغة القديمة (قائمة أسماء فقط) تُقرأ كما هي: شعب بلا جنس ولا سعة */

  var CLASS_GENDERS = { boys: 'ذكور', girls: 'إناث', mixed: 'مختلط' };
  var classCache = { src: null, cfg: null };

  function classConfig() {
    var c = S.settings ? S.settings.classes : null;
    if (classCache && classCache.cfg && classCache.src === c) return classCache.cfg;
    var list = Array.isArray(c) ? c : c && Array.isArray(c.list) ? c.list : [];
    var cfg = {
      rooms: c && !Array.isArray(c) ? Number(c.rooms) || 0 : 0,
      fees: c && !Array.isArray(c) && c.fees ? c.fees : null, // رسوم المواصلات للأسرة: { first, next }
      list: list.map(function (x) {
        if (typeof x === 'string') return { name: x, gender: '', capacity: null, teacher: '' };
        var cap = x.capacity == null || x.capacity === '' ? null : Number(x.capacity);
        return { name: String(x.name || ''), gender: CLASS_GENDERS[x.gender] ? x.gender : '', capacity: cap > 0 ? cap : null, teacher: String(x.teacher || '') };
      }).filter(function (x) { return x.name; })
    };
    // الترتيب بالصف ثم الشعبة أيًّا كان ترتيب الإدخال: الأول (أ)، الأول (ب)، الثاني (أ)… والروضة أولًا، وما لا يُعرف صفه آخرًا
    var rank = function (name) {
      if (/kg|روض|تمهيد/i.test(name)) return 0;
      return gradeOf(name) || 999;
    };
    cfg.list.sort(function (a, b) { return rank(a.name) - rank(b.name) || a.name.localeCompare(b.name, 'ar', { numeric: true }); });
    cfg.names = cfg.list.map(function (x) { return x.name; });
    classCache = { src: c, cfg: cfg };
    return cfg;
  }

  function schoolClasses() {
    return classConfig().names;
  }

  function classInfo(name) {
    var list = classConfig().list;
    for (var i = 0; i < list.length; i++) if (list[i].name === name) return list[i];
    return null;
  }

  // عدد المسجلين نهائيًا في كل شعبة { الاسم: العدد }
  function classCounts() {
    var counts = {};
    S.students.forEach(function (x) { if (stStatus(x) === 'final' && x.class_name) counts[x.class_name] = (counts[x.class_name] || 0) + 1; });
    return counts;
  }

  // حال الشعبة لو أُضيف إليها هذا الطالب: st الطالب إن كان مسجلًا (لا يُعدّ مرتين إن كان فيها أصلًا)، gender جنسه
  function classStatus(name, st, gender) {
    var info = classInfo(name), n = classCounts()[name] || 0;
    if (st && stStatus(st) === 'final' && st.class_name === name) n--;
    var cap = info ? info.capacity : null, warn = [];
    if (cap != null && n >= cap) warn.push('الشعبة «' + name + '» ممتلئة: المسجلون ' + n + ' والسعة القصوى ' + cap + '.');
    if (info && gender && ((info.gender === 'boys' && gender === 'أنثى') || (info.gender === 'girls' && gender === 'ذكر'))) {
      warn.push('الشعبة «' + name + '» لل' + CLASS_GENDERS[info.gender] + ' والطالب ' + gender + '.');
    }
    return { info: info, count: n, capacity: cap, left: cap == null ? null : cap - n, warn: warn };
  }

  // يُسأل المستخدم قبل وضع طالب في شعبة ممتلئة أو لجنس آخر؛ التجاوز مسموح بعد التأكيد
  function confirmClass(name, st, gender) {
    var warn = name ? classStatus(name, st, gender).warn : [];
    return !warn.length || confirm('تنبيه:\n' + warn.join('\n') + '\n\nهل تريد المتابعة مع ذلك؟');
  }

  // سطر تحت قائمة الشعبة في نموذج الطالب
  function classHintHtml(name, st, gender) {
    if (!schoolClasses().length) return 'عرّف الشعب أولًا من «إعداد الفصول».';
    if (!name) return 'تُحدَّد عند اعتماد التسجيل النهائي.';
    var s = classStatus(name, st, gender);
    var text = s.capacity == null ? 'المسجلون: ' + s.count + ' (لم تُحدَّد سعة)'
      : 'المسجلون ' + s.count + ' من ' + s.capacity + ' — ' + (s.left > 0 ? 'المتاح ' + s.left : 'لا مقاعد متاحة');
    return (s.info && s.info.gender ? CLASS_GENDERS[s.info.gender] + ' · ' : '') + text +
      s.warn.map(function (w) { return '<div class="formhint">' + esc(w) + ' يمكن المتابعة مع التجاوز.</div>'; }).join('');
  }

  // خيارات قائمة الشعبة في نموذج الطالب: الاسم ثم الجنس والمسجلون/السعة
  function classOptionsHtml(current) {
    var counts = classCounts(), names = schoolClasses().slice();
    if (current && names.indexOf(current) < 0) names.push(current);
    return '<option value="">— اختر —</option>' + names.map(function (name) {
      var info = classInfo(name), n = counts[name] || 0, extra = [];
      if (info && info.gender) extra.push(CLASS_GENDERS[info.gender]);
      extra.push(info && info.capacity != null ? n + '/' + info.capacity + (n >= info.capacity ? ' ممتلئة' : '') : String(n));
      return '<option value="' + esc(name) + '"' + (name === current ? ' selected' : '') + '>' + esc(name) + ' — ' + extra.join(' · ') + '</option>';
    }).join('');
  }

  async function saveClassConfig(cfg, focusId) {
    var value = { rooms: cfg.rooms, fees: cfg.fees || classConfig().fees || undefined, list: cfg.list.map(function (x) { return { name: x.name, gender: x.gender, capacity: x.capacity, teacher: x.teacher || '' }; }) };
    var r = await sb.from('settings').update({ classes: value }).eq('id', 1);
    if (r.error) { render(); return fail(r.error); }
    (S.settings || (S.settings = {})).classes = value;
    render();
    var box = focusId && document.getElementById(focusId);
    if (box) box.focus();
    toast('تم الحفظ');
  }

  /* ----- مربو الفصول: استيرادهم من كشف Word، وحسابات دخولهم ----- */

  // حرف الشعبة من اسمها: «السابع (ب)» → «ب». فارغ إن لم يكن للصف شعب
  function sectionOf(name) {
    var m = String(name).match(/[(（]\s*([^\s)）]+)\s*[)）]/) || String(name).trim().match(/\s([أ-ي])$/);
    return m ? norm(m[1]) : '';
  }

  // يقرأ جدول «الصف | الشعبة | مربي الصف» من ملف Word ويطابق كل سطر بشعبة معرّفة هنا
  async function readHomeroomFile(file) {
    try {
      await loadFflate();
      var files = fflate.unzipSync(new Uint8Array(await file.arrayBuffer()));
      if (!files['word/document.xml']) throw new Error('ليس ملف Word بصيغة docx');
      var doc = new DOMParser().parseFromString(fflate.strFromU8(files['word/document.xml']), 'application/xml');
      var W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
      var cellText = function (c) {
        return Array.prototype.map.call(c.getElementsByTagNameNS(W, 't'), function (t) { return t.textContent; }).join('').replace(/\s+/g, ' ').trim();
      };
      var found = [], missing = [], cfg = classConfig();
      Array.prototype.forEach.call(doc.getElementsByTagNameNS(W, 'tbl'), function (tbl) {
        var col = null;
        Array.prototype.forEach.call(tbl.getElementsByTagNameNS(W, 'tr'), function (tr) {
          var cells = Array.prototype.map.call(tr.getElementsByTagNameNS(W, 'tc'), cellText);
          if (!col) {
            // صف العناوين
            var c = { grade: -1, section: -1, teacher: -1 };
            cells.forEach(function (t, i) {
              var n = norm(t);
              if (/مرب/.test(n)) c.teacher = i; else if (/شعب/.test(n)) c.section = i; else if (/صف/.test(n) && c.grade < 0) c.grade = i;
            });
            if (c.grade > -1 && c.teacher > -1) col = c;
            return;
          }
          var teacher = (cells[col.teacher] || '').replace(/\s+/g, ' ').trim(), grade = gradeOf(cells[col.grade] || '');
          if (!teacher || !grade) return;
          var section = col.section > -1 ? norm(cells[col.section]).replace(/[—–\-ـ.]/g, '').trim() : '';
          var same = cfg.list.filter(function (k) { return !/kg|روض|تمهيد/i.test(k.name) && gradeOf(k.name) === grade; });
          // بلا شعبة في الكشف: الشعبة الوحيدة لهذا الصف. بشعبة: التي تحمل الحرف نفسه
          var hit = section ? same.filter(function (k) { return sectionOf(k.name) === section; }) : same.length === 1 ? same : [];
          var label = cells[col.grade] + (section ? ' (' + cells[col.section].trim() + ')' : '');
          if (hit.length === 1) found.push({ name: hit[0].name, teacher: teacher }); else missing.push(label + ': ' + teacher);
        });
      });
      if (!found.length && !missing.length) throw new Error('لم يُعثر في الملف على جدول فيه عمودا «الصف» و«مربي الصف»');
      if (!found.length) return alert('لم تُطابَق أي شعبة. عرّف الشعب أولًا بأسماء فيها الصف والشعبة مثل «السابع (أ)».\n\n' + missing.join('\n'));
      if (!confirm('سيُسجَّل مربو هذه الشعب:\n\n' + found.map(function (f) { return f.name + ' ← ' + f.teacher; }).join('\n') +
        (missing.length ? '\n\nلم تُطابَق بشعبة معرّفة (تُكتب يدويًا):\n' + missing.join('\n') : '') + '\n\nهل تريد المتابعة؟')) return;
      var byName = {};
      found.forEach(function (f) { byName[f.name] = f.teacher; });
      saveClassConfig({ rooms: cfg.rooms, list: cfg.list.map(function (k) { return byName[k.name] ? Object.assign({}, k, { teacher: byName[k.name] }) : k; }) });
    } catch (err) {
      toast('تعذر قراءة الملف: ' + err.message, true);
    }
  }

  // اسم مستخدم مقترح لمربي الشعبة: class7a ،class1…
  function homeroomLogin(name) {
    var letters = { 'ا': 'a', 'ب': 'b', 'ج': 'c', 'د': 'd', 'ه': 'e', 'و': 'f' }, sec = sectionOf(name);
    return 'class' + (gradeOf(name) || '') + (letters[sec] || '');
  }

  function hasAccount(fullName) {
    var n = norm(fullName);
    return S.users.some(function (u) { return norm(u.full_name) === n; });
  }

  // بطاقة في «إعداد الفصول»: مربو الفصول الذين لا حساب لهم، مع اسم مستخدم لكل واحد
  function homeroomAccountsHtml() {
    var list = classConfig().list.filter(function (k) { return k.teacher; });
    if (!list.length) return '';
    var todo = list.filter(function (k) { return !hasAccount(k.teacher); });
    return '<div class="card"><h2>حسابات مربي الفصول</h2>' +
      (todo.length
        ? '<p class="hint">يُنشأ لكل مربٍّ حساب بالصلاحية وكلمة المرور المؤقتة المحددتين، ويُطلب منه تغييرها عند أول دخول. يلزم تشغيل <code dir="ltr">supabase/registrar.sql</code> مرة واحدة.</p>' +
          '<div class="table-wrap"><table class="grid"><thead><tr><th>الشعبة</th><th>مربي الصف</th><th>اسم المستخدم</th></tr></thead><tbody>' +
          todo.map(function (k) {
            return '<tr><td>' + esc(k.name) + '</td><td>' + esc(k.teacher) + '</td>' +
              '<td><input type="text" dir="ltr" style="text-align:right" data-hlogin="' + esc(k.name) + '" value="' + esc(homeroomLogin(k.name)) + '" aria-label="اسم مستخدم ' + esc(k.teacher) + '"></td></tr>';
          }).join('') + '</tbody></table></div>' +

  async function createHomeroomAccounts(btn) {
    var pw = document.getElementById('h-pw').value, role = document.getElementById('h-role').value;
    if (pw.length < 6) return toast('كلمة المرور المؤقتة يجب ألا تقل عن 6 أحرف.', true);
    var jobs = [];
    classConfig().list.forEach(function (k) {
      var box = app.querySelector('[data-hlogin="' + k.name.replace(/"/g, '\\"') + '"]');
      if (box && box.value.trim()) jobs.push({ teacher: k.teacher, login: box.value.trim() });
    });
    if (!jobs.length) return;
    if (!confirm('إنشاء ' + jobs.length + ' حسابًا بصلاحية «' + ROLES[role] + '»؟\n\n' + jobs.map(function (j) { return j.teacher + ' ← ' + j.login; }).join('\n'))) return;
    btn.disabled = true;
    var done = 0, errors = [];
    for (var i = 0; i < jobs.length; i++) {
      var r = await sb.rpc('create_user_account', { p_name: jobs[i].teacher, p_login: toEmail(jobs[i].login), p_password: pw, p_role: role });
      if (r.error) {
        if (/could not find the function|schema cache|PGRST202/i.test((r.error.message || '') + (r.error.code || ''))) { btn.disabled = false; return accountRpcFail(r.error); }
        errors.push(jobs[i].teacher + ' (' + jobs[i].login + '): ' + r.error.message);
      } else done++;
    }
    var list = await sb.from('profiles').select('*').order('created_at');
    if (!list.error) S.users = list.data || [];
    render();
    if (errors.length) alert('لم تُنشأ هذه الحسابات:\n\n' + errors.join('\n'));
    toast('أُنشئت الحسابات: ' + done + (errors.length ? ' · تعذّر: ' + errors.length : ''), !!errors.length);
  }

  /* ---------- تصدير «كشوف تسجيل الطلاب» في ملف الأكاديمية الجاهز ----------
     القالب registration-template.xlsx (تعليمات، ملخص، وورقة لكل صف: الأول–السادس مختلطة، والسابع–التاسع بنات/ذكور)
     يُملأ ببيانات المسجلين نهائيًا مع بقاء تصميمه ومعادلاته كما هي: تُعدَّل ملفات XML داخل الملف مباشرة.
     في كل ورقة: الطلاب في الصفوف من 10، وعددها في القالب = القدرة الاستيعابية؛ إن زاد المسجلون تُضاف صفوف ويُزاح ما بعدها */

  function loadFflate() {
    if (window.fflate) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
      sc.onload = resolve;
      sc.onerror = function () { reject(new Error('تعذر تحميل مكتبة ضغط الملفات')); };
      document.head.appendChild(sc);
    });
  }

  function xmlEsc(v) {
    return String(v == null ? '' : v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f￾￿]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function reEsc(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // يغيّر القيمة المحفوظة لخلية (رقم أو ناتج معادلة) دون المساس بمعادلتها وتنسيقها
  function setCellValue(xml, ref, value) {
    return xml.replace(new RegExp('(<c r="' + ref + '"[^>]*>(?:<f[^>]*>[^<]*</f>)?<v>)[^<]*(</v>)'), function (all, a, b) { return a + value + b; });
  }

  // وسم فتح الصف وتنسيق كل عمود فيه، كما في القالب
  function rowPattern(xml, r) {
    var a = xml.indexOf('<row r="' + r + '"'), b = xml.indexOf('</row>', a);
    var text = xml.slice(a, b), styles = {};
    text.replace(/<c r="([A-Z]+)\d+" s="(\d+)"/g, function (all, col, s) { styles[col] = s; });
    return { open: text.slice(0, text.indexOf('>') + 1), styles: styles };
  }

  // رقم الهاتف بلا علامة «+» في أوله
  function plainPhone(v) {
    return String(v == null ? '' : v).replace(/^[\s\u200e\u200f]*\+\s*/, '');
  }

  // تاريخ ISO إلى الرقم التسلسلي الذي يخزنه Excel
  function excelDate(iso) {
    var p = String(iso || '').slice(0, 10).split('-');
    return p.length === 3 ? Math.round(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])) / 864e5) + 25569 : null;
  }

  // list: طلاب الورقة. capacity: القدرة الاستيعابية من «إعداد الفصول» (null: تبقى قيمة القالب). note: دالة ملاحظة الطالب
  function fillRegistrationSheet(xml, list, capacity, note, teacher) {
    var m = xml.match(/COUNTA\(B10:B(\d+)\)/);
    if (!m) return null;
    var last = Number(m[1]), slots = last - 9, need = Math.max(slots, list.length), k = need - slots, newLast = last + k;
    var a = xml.indexOf('<row r="10"'), lastAt = xml.indexOf('<row r="' + last + '"'), b = xml.indexOf('</row>', lastAt) + 6;
    var patterns = [rowPattern(xml, 10), rowPattern(xml, 11)];
    var rows = '';
    for (var i = 0; i < need; i++) {
      var p = patterns[i % 2], r = 10 + i, x = list[i];
      var text = function (col, v) {
        return v === '' || v == null ? '<c r="' + col + r + '" s="' + p.styles[col] + '"/>'
          : '<c r="' + col + r + '" s="' + p.styles[col] + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
      };
      var birth = x ? excelDate(x.birth_date) : null;
      rows += p.open.replace(/r="\d+"/, 'r="' + r + '"') + '<c r="A' + r + '" s="' + p.styles.A + '" t="n"><v>' + (i + 1) + '</v></c>' +
        (x
          ? text('B', x.full_name) + text('C', x.gender === 'ذكر' || x.gender === 'أنثى' ? x.gender : '') +
            (birth == null ? text('D', '') : '<c r="D' + r + '" s="' + p.styles.D + '" t="n"><v>' + birth + '</v></c>') +
            text('E', x.national_id) + text('F', x.guardian_name) + text('G', x.guardian_relation) + text('H', plainPhone(x.phone)) + text('I', plainPhone(x.whatsapp)) +
            text('J', stVal(x, 'city') || stVal(x, 'address')) + text('K', note(x))
          : 'BCDEFGHIJK'.split('').map(function (col) { return text(col, ''); }).join('')) + '</row>';
    }
    var head = xml.slice(0, a), tail = xml.slice(b);
    if (k) {
      // ما بعد جدول الطلاب (إن وُجد) ينزل k صفًا، ومعه الدمج ونطاقات المعادلات والقوائم المنسدلة
      var cut = tail.indexOf('</sheetData>');
      var shifted = tail.slice(0, cut).replace(/<row r="(\d+)"/g, function (all, n) { return '<row r="' + (Number(n) + k) + '"'; })
        .replace(/<c r="([A-Z]+)(\d+)"/g, function (all, col, n) { return '<c r="' + col + (Number(n) + k) + '"'; });
      var rest = tail.slice(cut).replace(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"/g, function (all, c1, r1, c2, r2) {
        return Number(r1) > last ? '<mergeCell ref="' + c1 + (Number(r1) + k) + ':' + c2 + (Number(r2) + k) + '"' : all;
      });
      var range = new RegExp('([A-K])10:(?:\\1)' + last + '(?!\\d)', 'g'), grow = function (all, col) { return col + '10:' + col + newLast; };
      head = head.replace(range, grow).replace(/(<dimension ref="A1:K)(\d+)"/, function (all, pre, n) { return pre + (Number(n) + k) + '"'; });
      tail = shifted + rest.replace(range, grow);
    }
    var boys = list.filter(function (x) { return x.gender === 'ذكر'; }).length, girls = list.filter(function (x) { return x.gender === 'أنثى'; }).length;
    var cap = capacity == null ? slots : capacity;
    // خانة «اسم مربي الصف» (C5)
    if (teacher) head = head.replace(/<c r="C5" s="(\d+)"\/>/, function (all, sid) { return '<c r="C5" s="' + sid + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(teacher) + '</t></is></c>'; });
    head = setCellValue(setCellValue(setCellValue(setCellValue(setCellValue(head, 'F6', cap), 'C7', list.length), 'F7', cap - list.length), 'I6', boys), 'I7', girls);
    return { xml: head + rows + tail, added: k, capacity: cap, count: list.length };
  }

  async function exportRegistrationWorkbook(btn) {
    btn.disabled = true;
    try {
      await loadFflate();
      var res = await fetch('registration-template.xlsx');
      if (!res.ok) throw new Error('تعذر تحميل قالب الكشوف');
      var files = fflate.unzipSync(new Uint8Array(await res.arrayBuffer()));
      var read = function (name) { return fflate.strFromU8(files[name]); };
      var write = function (name, text) { files[name] = fflate.strToU8(text); };

      // اسم كل ورقة وملفها داخل القالب
      var parse = function (name) { return new DOMParser().parseFromString(read(name), 'application/xml'); };
      var target = {}, sheetFile = {};
      Array.prototype.forEach.call(parse('xl/_rels/workbook.xml.rels').getElementsByTagName('Relationship'), function (r) { target[r.getAttribute('Id')] = r.getAttribute('Target'); });
      Array.prototype.forEach.call(parse('xl/workbook.xml').getElementsByTagName('sheet'), function (sh) {
        var id = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
        sheetFile[sh.getAttribute('name')] = 'xl/' + String(target[id]).replace(/^\/?xl\//, '');
      });

      var finals = S.students.filter(function (x) { return stStatus(x) === 'final' && x.class_name; });
      // صف الشعبة من اسمها؛ الروضة (KG2…) ليست صفًّا من صفوف الملف ولو كان في اسمها رقم
      var gradeIn = function (name) { return /kg|روض|تمهيد/i.test(name) ? 0 : gradeOf(name); };
      var placed = {}, stats = {}, workbook = read('xl/workbook.xml'), total = 0, extra = 0;
      Object.keys(sheetFile).forEach(function (name) {
        var grade = gradeIn(name), side = /بنات|إناث/.test(name) ? 'girls' : /ذكور|بنين/.test(name) ? 'boys' : '';
        if (!grade || !/COUNTA\(B10:B\d+\)/.test(read(sheetFile[name]))) return; // ليست ورقة صف
        // أين يقع الطالب في الأوراق المقسومة: جنس شعبته إن حُدِّد (ذكور/إناث)، وإلا جنسه هو
        var sideOf = function (x) {
          var info = classInfo(x.class_name);
          return info && (info.gender === 'boys' || info.gender === 'girls') ? info.gender : x.gender === 'ذكر' ? 'boys' : x.gender === 'أنثى' ? 'girls' : '';
        };
        var list = finals.filter(function (x) { return gradeIn(x.class_name) === grade && (!side || sideOf(x) === side); });
        var sections = {};
        list.forEach(function (x) { placed[x.id] = true; sections[x.class_name] = true; });
        // القدرة من «إعداد الفصول»: مجموع سعات شعب هذا الصف (وهذا الجنس)، إن حُدِّدت كلها
        var mine = classConfig().list.filter(function (c) { return gradeIn(c.name) === grade && (!side || c.gender === side); });
        var cap = mine.length && mine.every(function (c) { return c.capacity != null; }) ? mine.reduce(function (sum, c) { return sum + c.capacity; }, 0) : null;
        var many = Object.keys(sections).length > 1;
        // مربو شعب هذه الورقة: من «إعداد الفصول» (للشعب المقسومة: الشعبة التي جنسها جنس الورقة، أو التي فيها طلاب الورقة)
        var teachers = [];
        classConfig().list.forEach(function (c) {
          if (c.teacher && gradeIn(c.name) === grade && (!side || c.gender === side || sections[c.name]) && teachers.indexOf(c.teacher) < 0) teachers.push(c.teacher);
        });
        var out = fillRegistrationSheet(read(sheetFile[name]), list, cap, function (x) { return many ? x.class_name : ''; }, teachers.join(' / '));
        write(sheetFile[name], out.xml);
        stats[name] = out;
        total += out.count;
        if (out.added) {
          extra += out.added;
          workbook = workbook.replace(new RegExp('((?:&apos;|\')?' + reEsc(name) + '(?:&apos;|\')?!\\$A\\$1:\\$K\\$)(\\d+)'), function (all, pre, n) { return pre + (Number(n) + out.added); });
        }
      });
      if (!Object.keys(stats).length) throw new Error('القالب لا يحتوي على أوراق الصفوف المتوقعة');

      // ورقة الملخص: القيم المحفوظة لمعادلاتها، ليظهر الملف صحيحًا حتى في برامج لا تعيد الحساب
      var sumFile = sheetFile['الملخص'];
      if (sumFile) {
        var sum = read(sumFile), all = { cap: 0, n: 0 };
        sum.replace(/<c r="E(\d+)"[^>]*><f[^>]*>(?:&apos;|')?([^!<]+?)(?:&apos;|')?!F6<\/f>/g, function (m0, row, name) {
          var st = stats[name];
          if (!st) return m0;
          all.cap += st.capacity; all.n += st.count;
          sum = setCellValue(setCellValue(setCellValue(setCellValue(sum, 'E' + row, st.capacity), 'F' + row, st.count), 'G' + row, st.capacity - st.count),
            'H' + row, st.capacity ? st.count / st.capacity : 0);
          return m0;
        });
        var tot = sum.match(/<c r="E(\d+)"[^>]*><f[^>]*>SUM\(/);
        if (tot) {
          sum = setCellValue(setCellValue(setCellValue(setCellValue(sum, 'E' + tot[1], all.cap), 'F' + tot[1], all.n), 'G' + tot[1], all.cap - all.n),
            'H' + tot[1], all.cap ? all.n / all.cap : 0);
        }
        write(sumFile, sum);
      }
      // Excel يعيد حساب المعادلات كلها عند فتح الملف
      workbook = /<calcPr\b/.test(workbook)
        ? workbook.replace(/<calcPr\b(?![^>]*fullCalcOnLoad)/, '<calcPr fullCalcOnLoad="true"')
        : workbook.replace('</definedNames>', '</definedNames><calcPr fullCalcOnLoad="true"/>');
      write('xl/workbook.xml', workbook);

      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([fflate.zipSync(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      a.download = 'كشوف-تسجيل-الطلاب-' + todayISO() + '.xlsx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      var left = finals.filter(function (x) { return !placed[x.id]; }).length;
      toast('صُدّرت الكشوف — الطلاب المدرجون: ' + total + (extra ? ' · صفوف أُضيفت فوق القدرة: ' + extra : '') +
        (left ? ' · لم يُدرج: ' + left + ' (شعبتهم خارج صفوف الملف أو جنسهم غير محدد)' : ''), !!left);
    } catch (err) {
      toast(err.message, true);
    }
    btn.disabled = false;
  }

  /* ---------- النسخ الاحتياطي والاستعادة (مدير النظام) ----------
     النسخة ملف JSON واحد فيه جداول البرنامج كلها. الاستعادة تعيد كل سجل في الملف إلى ما كان عليه
     (تُرجع المحذوف وتُصحّح المعدَّل) ولا تحذف ما أُضيف بعد أخذ النسخة.
     الحسابات وكلمات المرور ليست في النسخة: تديرها خدمة الدخول */

  // بترتيب يحترم الارتباطات: المعلمون قبل زياراتهم، والطلاب والمجموعات قبل الاشتراكات والدفعات.
  // key: ما يُعرَف به السجل عند الاستعادة. insertOnly: جدول لا يُسمح بتعديل صفوفه، فتُضاف الناقصة فقط
  var BACKUP_TABLES = [
    { name: 'teachers', label: 'المعلمون', key: 'id' },
    { name: 'visits', label: 'الزيارات الإشرافية', key: 'id' },
    { name: 'statements', label: 'عبارات التقارير المضافة', key: 'id', insertOnly: true },
    { name: 'students', label: 'الطلاب', key: 'id' },
    { name: 'transport_groups', label: 'مجموعات المواصلات', key: 'id' },
    { name: 'transport_members', label: 'اشتراكات المواصلات', key: 'student_id' },
    { name: 'transport_payments', label: 'دفعات المواصلات', key: 'student_id,month', drop: ['id'] },
    { name: 'transport_voided', label: 'أرشيف الإيصالات المحذوفة', key: 'id' }
  ];
  var BACKUP_MARK = 'third-pillar-backup';

  function backupSummary(tables) {
    return BACKUP_TABLES.map(function (t) { return t.label + ': ' + ((tables[t.name] || []).length); }).join(' · ');
  }

  async function downloadBackup(btn) {
    btn.disabled = true;
    var tables = {};
    for (var i = 0; i < BACKUP_TABLES.length; i++) {
      var t = BACKUP_TABLES[i], rows = await fetchAll(function () { return sb.from(t.name).select('*').order(t.key.split(',')[0]); });
      // جدول لم يُنشأ بعد يُتخطى
      if (rows) tables[t.name] = rows;
    }
    var cfg = await sb.from('settings').select('*').eq('id', 1).maybeSingle();
    btn.disabled = false;
    if (!tables.students && !tables.teachers) return toast('تعذر قراءة البيانات؛ لم تُنشأ النسخة', true);
    var d = new Date(), two = function (n) { return ('0' + n).slice(-2); };
    var file = { app: BACKUP_MARK, version: 1, created_at: d.toISOString(), school: schoolName(), settings: cfg.data || null, tables: tables };
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(file)], { type: 'application/json' }));
    a.download = 'نسخة-احتياطية-' + todayISO() + '-' + two(d.getHours()) + two(d.getMinutes()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    try { localStorage.setItem('last-backup', d.toISOString()); } catch (err) { /* التخزين المحلي غير متاح */ }
    toast('نُزّلت النسخة الاحتياطية — ' + backupSummary(tables));
    render();
  }

  async function restoreBackup(fileObj) {
    var data;
    try { data = JSON.parse(await fileObj.text()); } catch (err) { data = null; }
    if (!data || data.app !== BACKUP_MARK || !data.tables) return toast('هذا الملف ليس نسخة احتياطية من البرنامج', true);
    var when = new Date(data.created_at).toLocaleString('ar-u-nu-latn', { dateStyle: 'long', timeStyle: 'short' });
    if (!confirm('استعادة النسخة المأخوذة في ' + when + '؟\n\n' + backupSummary(data.tables) +
      '\n\nكل سجل في النسخة يعود إلى ما كان عليه وقتها، فيضيع أي تعديل أُجري عليه بعدها. ما أُضيف بعد النسخة يبقى كما هو.')) return;
    if (!confirm('تأكيد أخير: يُنصح بتنزيل نسخة احتياطية من الوضع الحالي أولًا. هل تريد المتابعة بالاستعادة الآن؟')) return;

    app.innerHTML = tabs('admin') + '<div class="card empty" id="restore-progress">جارٍ الاستعادة…</div>';
    var box = document.getElementById('restore-progress'), errors = [], done = 0;
    for (var i = 0; i < BACKUP_TABLES.length; i++) {
      var t = BACKUP_TABLES[i], rows = data.tables[t.name] || [];
      if (t.drop) rows = rows.map(function (r) { var c = Object.assign({}, r); t.drop.forEach(function (k) { delete c[k]; }); return c; });
      for (var from = 0; from < rows.length; from += 200) {
        box.textContent = 'جارٍ الاستعادة… ' + t.label + ' (' + Math.min(from + 200, rows.length) + ' من ' + rows.length + ')';
        var opts = { onConflict: t.key };
        if (t.insertOnly) opts.ignoreDuplicates = true;
        var r = await sb.from(t.name).upsert(rows.slice(from, from + 200), opts);
        if (r.error) { errors.push(t.label + ': ' + r.error.message); break; }
        done += Math.min(200, rows.length - from);
      }
    }
    if (data.settings) {
      var cfg = Object.assign({}, data.settings);
      delete cfg.id;
      var up = await sb.from('settings').update(cfg).eq('id', 1);
      if (up.error) errors.push('الإعدادات: ' + up.error.message);
    }
    await loadAll();
    if (errors.length) alert('اكتملت الاستعادة مع أخطاء:\n\n' + errors.join('\n'));
    toast(errors.length ? 'اكتملت الاستعادة مع أخطاء' : 'تمت الاستعادة — سجلات: ' + done, !!errors.length);
  }

  function backupCardHtml() {
    var last = '';
    try { last = localStorage.getItem('last-backup') || ''; } catch (err) { /* التخزين المحلي غير متاح */ }
    var days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 864e5) : null;
    return '<div class="card"><h2>النسخ الاحتياطي</h2>' +
      '<p class="hint">تنزّل النسخة ملفًا واحدًا فيه كل بيانات البرنامج (الطلاب، المواصلات والدفعات، المعلمون، الزيارات، الإعدادات). احفظه في مكان آمن خارج هذا الجهاز؛ فيه بيانات شخصية.</p>' +
      '<div class="toolbar" style="align-items:center">' +
        '<button type="button" class="btn primary" data-backup>تنزيل نسخة احتياطية الآن</button>' +
        '<button type="button" class="btn" data-restore>استعادة من ملف…</button>' +
        '<input type="file" id="restore-file" accept=".json,application/json" hidden>' +
        '<span class="st-count" style="margin:0">' + (last
          ? 'آخر نسخة من هذا المتصفح: ' + dmy(last) + (days ? ' (منذ ' + days + ' يومًا)' : ' (اليوم)')
          : 'لم تؤخذ نسخة من هذا المتصفح بعد.') + '</span>' +
      '</div>' +
      '<p class="hint" style="margin:10px 0 0">الاستعادة تعيد كل سجل في الملف إلى ما كان عليه وقت النسخ (تُرجع المحذوف وتُصحّح المعدَّل)، ولا تحذف ما أُضيف بعدها. حسابات الدخول وكلمات المرور ليست ضمن النسخة.</p></div>';
  }

  document.addEventListener('click', function (e) {
    if (!isAdmin() || location.hash !== '#/admin') return;
    var el;
    if ((el = e.target.closest('[data-backup]'))) downloadBackup(el);

  document.addEventListener('change', function (e) {

  // دوال إنشاء الحسابات تأتي من supabase/registrar.sql: إن لم يُشغَّل بعدُ تُعرض رسالة واضحة
  function accountRpcFail(error) {
    if (/could not find the function|schema cache|PGRST202/i.test((error.message || '') + (error.code || ''))) {
      return toast('شغّل الملف supabase/registrar.sql في محرر SQL أولًا، ثم حدّث الصفحة', true);
    }
    fail(error);
  }

  document.addEventListener('click', async function (e) {
    var el = e.target.closest('[data-resetpw]');
    if (!el || !isAdmin() || location.hash !== '#/admin') return;
    var u = S.users.filter(function (x) { return x.id === el.getAttribute('data-resetpw'); })[0];
    var pw = prompt('كلمة مرور مؤقتة جديدة للحساب «' + (u.full_name || displayName(u.email)) + '» (6 أحرف على الأقل).\nسيُطلب منه تغييرها عند أول دخول.', S.defaultPw || '');
    if (pw == null) return;
    if (pw.length < 6) return toast('كلمة المرور يجب ألا تقل عن 6 أحرف.', true);
    var r = await sb.rpc('reset_user_password', { p_user: u.id, p_password: pw });
