<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم المعلمين</title>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --ink: #1c2733;
    --muted: #64748b;
    --line: #e2e8f0;
    --primary: #0f766e;
    --primary-dark: #0b5a54;
    --primary-soft: #e6f4f2;
    --amber: #b45309;
    --amber-soft: #fef3c7;
    --blue: #1d4ed8;
    --blue-soft: #dbeafe;
    --green: #15803d;
    --green-soft: #dcfce7;
    --red: #b91c1c;
    --red-soft: #fee2e2;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }
  header.app {
    background: var(--primary);
    color: #fff;
    padding: 16px;
  }
  header.app .inner, main {
    max-width: 1000px;
    margin: 0 auto;
  }
  header.app .inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header.app h1 { margin: 0; font-size: 1.3rem; }
  header.app p { margin: 2px 0 0; opacity: .85; font-size: .9rem; }
  .userbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .9rem; }
  .userbar .who { opacity: .9; }
  .userbar .btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); padding: 4px 12px; }
  .userbar .btn:hover { background: rgba(255,255,255,.15); }
  main { padding: 20px 16px 60px; }

  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
  nav.tabs a {
    padding: 8px 14px;
    text-decoration: none;
    color: var(--muted);
    font-weight: 700;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
  }
  nav.tabs a:hover { color: var(--ink); }
  nav.tabs a.on { color: var(--primary); border-bottom-color: var(--primary); }

  button, input, textarea, select { font: inherit; color: inherit; }
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:hover { background: #f8fafc; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn.danger { color: var(--red); border-color: #fecaca; }
  .btn.danger:hover { background: var(--red-soft); }
  .btn.link { border: 0; background: none; color: var(--primary); padding: 4px 0; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--primary); outline-offset: 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card + .card { margin-top: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .card .hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }
  input[type=text], input[type=search], input[type=email], input[type=password], textarea, select {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    background: #fff;
    width: 100%;
  }
  select { width: auto; }
  textarea { min-height: 90px; resize: vertical; }
  label.field { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 4px; }
  label.check { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; }
  label.check input { width: 18px; height: 18px; accent-color: var(--primary); }

  /* Auth */
  .auth { max-width: 420px; margin: 24px auto; }
  .auth .f { margin-bottom: 12px; }
  .auth .btn.primary { width: 100%; }
  .auth .switch { text-align: center; margin-top: 12px; }

  /* Teacher list */
  .teachers { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .teachers .card + .card { margin-top: 0; }
  .teacher {
    text-align: start;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  .teacher:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(15,118,110,.12); }
  .teacher .name { font-weight: 700; font-size: 1.05rem; }
  .teacher .subject { color: var(--muted); font-size: .9rem; }
  .teacher .foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .teacher .score { font-weight: 700; color: var(--primary); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: .8rem;
    font-weight: 700;
  }
  .badge.new, .badge.pending { background: #eef2f6; color: var(--muted); }
  .badge.edit { background: var(--amber-soft); color: var(--amber); }
  .badge.review { background: var(--blue-soft); color: var(--blue); }
  .badge.approved { background: var(--primary-soft); color: var(--primary); }
  .badge.published { background: var(--green-soft); color: var(--green); }

  .add-form { display: none; margin-bottom: 16px; }
  .add-form.open { display: block; }
  .add-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

  /* Evaluation view */
  .eval-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .eval-head h2 { margin: 0; font-size: 1.3rem; }
  .eval-head .sub { color: var(--muted); }

  .stepper { display: flex; list-style: none; padding: 0; margin: 0 0 16px; gap: 8px; }
  .stepper li {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
  }
  .stepper .num {
    width: 30px; height: 30px; flex: none;
    border-radius: 50%;
    background: #eef2f6;
    display: grid; place-items: center;
    font-weight: 700;
  }
  .stepper .t { font-weight: 700; }
  .stepper .d { font-size: .8rem; }
  .stepper li.current { border-color: var(--primary); color: var(--ink); background: var(--primary-soft); }
  .stepper li.current .num { background: var(--primary); color: #fff; }
  .stepper li.done { color: var(--ink); }
  .stepper li.done .num { background: var(--green); color: #fff; }

  .progress-row { display: flex; justify-content: space-between; gap: 12px; }
  .save-state { color: var(--muted); font-size: .85rem; }
  .progress { height: 8px; background: #eef2f6; border-radius: 999px; overflow: hidden; margin: 6px 0 14px; }
  .progress > div { height: 100%; background: var(--primary); transition: width .2s; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .85rem; margin-bottom: 8px; }

  table.criteria, table.grid { width: 100%; border-collapse: collapse; }
  table.criteria th, table.criteria td, table.grid th, table.grid td { border-bottom: 1px solid var(--line); padding: 10px 8px; vertical-align: middle; }
  table.criteria th, table.grid th { text-align: start; font-size: .85rem; color: var(--muted); background: #f8fafc; }
  table.criteria td.n { width: 36px; color: var(--muted); text-align: center; }
  table.criteria td.r { width: 1%; white-space: nowrap; }
  table.criteria tr.missing td { background: #fff7ed; }

  .rate { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .rate label { position: relative; cursor: pointer; }
  .rate input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .rate span {
    display: grid; place-items: center;
    width: 38px; height: 36px;
    font-weight: 700;
    border-inline-start: 1px solid var(--line);
    background: #fff;
  }
  .rate label:first-child span { border-inline-start: 0; }
  .rate label:hover span { background: var(--primary-soft); }
  .rate input:checked + span { background: var(--primary); color: #fff; }
  .rate input:focus-visible + span { outline: 2px solid var(--primary-dark); outline-offset: -2px; }

  .pill { display: inline-block; min-width: 34px; text-align: center; padding: 2px 8px; border-radius: 6px; font-weight: 700; background: var(--primary-soft); color: var(--primary); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .summary .box { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; }
  .summary .k { color: var(--muted); font-size: .85rem; }
  .summary .v { font-size: 1.5rem; font-weight: 800; color: var(--primary); }

  .notes-block { margin-top: 16px; }
  .notes-block h3 { font-size: 1rem; margin: 0 0 6px; }
  .notes-block p { margin: 0; white-space: pre-wrap; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-start; margin-top: 20px; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--red-soft); color: var(--red); font-weight: 600; }
  .info { padding: 10px 12px; border-radius: 8px; background: var(--green-soft); color: var(--green); font-weight: 600; margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; }

  #toast {
    position: fixed; bottom: 20px; inset-inline: 16px; margin: 0 auto; max-width: 480px;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10;
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--red); }

  @media (max-width: 640px) {
    .add-form .row { grid-template-columns: 1fr; }
    .stepper .d { display: none; }
    table.criteria td.r { white-space: normal; }
    .rate span { width: 32px; height: 34px; }
  }
  @media print {
    body { background: #fff; }
    header.app, .no-print, .stepper, nav.tabs, #toast { display: none !important; }
    main { padding: 0; max-width: none; }
    .card { border: 0; padding: 0; }
  }
</style>
</head>
<body>
<header class="app">
  <div class="inner">
    <div>
      <h1>تقييم المعلمين</h1>
      <p>نموذج التقييم الأدائي والكفايات الشخصية</p>
    </div>
    <div class="userbar" id="userbar"></div>
  </div>
</header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';

  // البنود مأخوذة من «نموذج تقييم معلم»
  var CRITERIA = [
    'المهارة في إعداد وتحضير وتنفيذ خطط الدروس الصفية',
    'يضع أهدافًا تعليمية محددة وقابلة للقياس',
    'يضع أنشطة متنوعة لتحديد الاحتياجات التعليمية لمختلف التلاميذ',
    'يراعي ما لدى الطلاب من معارف وخبرات سابقة في تخطيط الدروس',
    'يصمم أساليب مختلفة ومناسبة لتقويم أداء التلاميذ',
    'يدير وقت التدريس داخل الصف إدارة فعالة',
    'التمكن من المادة العلمية والقدرة على تحقيق الأهداف',
    'يظهر عمليًا امتلاكه لمهارات الإدارة الصفية',
    'يؤكد على ضمان مشاركة الطلاب في أنشطة التعلم بغض النظر عما بينهم من فروق من حيث النوع ومستوى التحصيل الدراسي والاحتياجات الخاصة وغير ذلك',
    'يشارك الطلاب في تصميم بيئة التعلم ويشجعهم على ذلك',
    'يستخدم الموارد التعليمية المختلفة استخدامًا فعالًا في شرح المفاهيم والمهارات المتعلقة بالمستوى التعليمي',
    'يوظف معطيات تكنولوجيا التعليم في زيادة فرص الاكتشاف ومعالجة المعلومات والتعلم بالممارسة',
    'يستخدم أسئلة كاشفة (عميقة) وأسئلة مفتوحة (غير محددة الإجابة) إلى الطلاب لتشجيعهم على التفكير',
    'يستخدم استراتيجيات تدريس متنوعة لزيادة المشاركة الطلابية النشطة في التعلم',
    'يؤكد في تدريسه على تنمية المهارات الاجتماعية ومهارات العمل التعاوني لدى الطلاب',
    'يتيح للطلاب فرصًا للربط بين محتوى المادة التعليمية والمجالات التطبيقية لها',
    'يتيح للطلاب فرصًا لربط مجالات المحتوى التعليمي بخبرات الحياة اليومية وتطبيق ما تعلموه واكتسبوه من أفكار ومهارات في التعامل مع المواقف والمشكلات اليومية',
    'يتيح للطلاب فرصًا لممارسة كل من مهارات التفكير العليا والتفكير الناقد',
    'يقدم قدرًا مناسبًا من التعزيز اللفظي البناء والدقيق ويساعد الطلاب على ذلك',
    'يتيح للطلاب فرصًا معدة سلفًا للتأمل في عملية تعلمهم بهدف تقييم وتعديل المسار',
    'يستخدم أساليب متنوعة ومناسبة لتقويم أداء التلاميذ',
    'تقبل التوجيهات بشكل إيجابي والالتزام بها'
  ];

  var SCALE = [
    { v: 5, label: 'ممتاز' },
    { v: 4, label: 'جيد جدًا' },
    { v: 3, label: 'جيد' },
    { v: 2, label: 'مقبول' },
    { v: 1, label: 'ضعيف' }
  ];
  var MAX = CRITERIA.length * 5;

  var STATUS = {
    new: 'لم يبدأ',
    edit: 'قيد التحرير',
    review: 'بانتظار الاعتماد',
    approved: 'معتمد',
    published: 'منشور'
  };

  var STEPS = [
    { title: 'التحرير', desc: 'إدخال الدرجات والملاحظات' },
    { title: 'الاعتماد', desc: 'مراجعة التقييم واعتماده' },
    { title: 'النشر', desc: 'نشر التقييم النهائي' }
  ];

  var ROLES = {
    pending: 'بانتظار التفعيل',
    viewer: 'مشاهد',
    supervisor: 'مشرف',
    superadmin: 'مدير النظام'
  };

  // ما يراه المشاهدون (يتحكم به مدير النظام)
  var VISIBILITY = [
    { key: 'show_totals', label: 'المجموع والنسبة والتقدير' },
    { key: 'show_items', label: 'درجات البنود التفصيلية' },
    { key: 'show_notes', label: 'ملاحظات المشرف' },
    { key: 'show_approver_notes', label: 'ملاحظات الاعتماد' }
  ];

  var cfg = window.APP_CONFIG || {};
  // حسابات اسم المستخدم (بدون بريد حقيقي) تُخزَّن بهذا النطاق
  var USER_SUFFIX = '@' + (cfg.USERNAME_DOMAIN || 'ahmedhmmad.github.io');
  function displayName(email) {
    email = email || '';
    return email.slice(-USER_SUFFIX.length) === USER_SUFFIX ? email.slice(0, -USER_SUFFIX.length) : email;
  }
  var app = document.getElementById('app');
  var userbar = document.getElementById('userbar');
  var toastEl = document.getElementById('toast');
  var sb = null;

  var S = { uid: null, email: '', profile: null, teachers: [], settings: null, users: [], results: null, ready: false };
  var ui = { search: '', addOpen: false, error: '', authMode: 'login', authMsg: '', authErr: '', busy: false };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var toastTimer;
  function toast(text, isErr) {
    toastEl.textContent = text;
    toastEl.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = ''; }, isErr ? 6000 : 2500);
  }

  function fail(error) {
    toast('تعذر تنفيذ العملية: ' + (error && error.message ? error.message : 'خطأ غير معروف'), true);
  }

  function role() { return S.profile ? S.profile.role : 'pending'; }
  function isAdmin() { return role() === 'superadmin'; }
  function isStaff() { return role() === 'supervisor' || isAdmin(); }

  function find(id) {
    for (var i = 0; i < S.teachers.length; i++) if (S.teachers[i].id === id) return S.teachers[i];
    return null;
  }

  function ratedCount(t) {
    var n = 0;
    for (var i = 0; i < CRITERIA.length; i++) if (t.ratings[i]) n++;
    return n;
  }

  function total(t) {
    var sum = 0;
    for (var i = 0; i < CRITERIA.length; i++) sum += t.ratings[i] || 0;
    return sum;
  }

  function grade(pct) {
    if (pct >= 90) return 'ممتاز';
    if (pct >= 80) return 'جيد جدًا';
    if (pct >= 70) return 'جيد';
    if (pct >= 60) return 'مقبول';
    return 'ضعيف';
  }

  function fmtDate(iso) {
    return iso ? new Date(iso).toLocaleDateString('ar', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
  }

  function stepIndex(status) {
    if (status === 'review') return 1;
    if (status === 'approved' || status === 'published') return 2;
    return 0;
  }

  /* ---------- البيانات ---------- */

  async function loadAll() {
    S.ready = false;
    render();
    var p = await sb.from('profiles').select('*').eq('id', S.uid).maybeSingle();
    if (p.error) fail(p.error);
    S.profile = p.data || null;
    S.teachers = []; S.users = []; S.settings = null; S.results = null;

    if (isStaff()) {
      var res = await Promise.all([
        sb.from('teachers').select('*').order('name'),
        sb.from('settings').select('*').eq('id', 1).maybeSingle(),
        isAdmin() ? sb.from('profiles').select('*').order('created_at') : Promise.resolve({ data: [] })
      ]);
      if (res[0].error) fail(res[0].error);
      S.teachers = res[0].data || [];
      S.settings = res[1].data || null;
      S.users = res[2].data || [];
    }
    S.ready = true;
    render();
  }

  var loadingResults = false;
  async function loadResults() {
    if (loadingResults) return;
    loadingResults = true;
    var r = await sb.rpc('get_results');
    loadingResults = false;
    if (r.error) fail(r.error);
    S.results = (r.data && r.data.results) || [];
    render();
  }

  // الحفظ التلقائي أثناء التحرير
  var saveTimer = null, dirty = null;

  function setSaveState(text) {
    var el = document.getElementById('save-state');
    if (el) el.textContent = text;
  }

  async function saveNow(t) {
    var r = await sb.from('teachers').update({
      status: t.status,
      ratings: t.ratings,
      notes: t.notes,
      approver_notes: t.approver_notes,
      approved_at: t.approved_at,
      published_at: t.published_at
    }).eq('id', t.id);
    if (r.error) { setSaveState('لم يتم الحفظ'); fail(r.error); return false; }
    setSaveState('تم الحفظ');
    return true;
  }

  function queueSave(t) {
    clearTimeout(saveTimer);
    dirty = t;
    setSaveState('جارٍ الحفظ…');
    saveTimer = setTimeout(function () { saveTimer = null; saveNow(t); }, 600);
  }

  function flush() {
    if (!saveTimer) return Promise.resolve(true);
    clearTimeout(saveTimer);
    saveTimer = null;
    return saveNow(dirty);
  }

  /* ---------- الشريط العلوي والتبويبات ---------- */

  function renderUserbar() {
    userbar.innerHTML = S.uid
      ? '<span class="who">' + esc(displayName(S.email)) + (S.ready ? ' · ' + ROLES[role()] : '') + '</span>' +
        '<button type="button" class="btn" data-act="signout">تسجيل الخروج</button>'
      : '';
  }

  function tabs(active) {
    if (!isStaff()) return '';
    var items = [['#/', 'teachers', 'المعلمون'], ['#/results', 'results', 'النتائج المنشورة']];
    if (isAdmin()) items.push(['#/admin', 'admin', 'الإدارة']);
    return '<nav class="tabs no-print">' + items.map(function (it) {
      return '<a href="' + it[0] + '"' + (it[1] === active ? ' class="on" aria-current="page"' : '') + '>' + it[2] + '</a>';
    }).join('') + '</nav>';
  }

  /* ---------- الدخول ---------- */

  function renderSetup() {
    app.innerHTML = '<div class="card empty">لم يتم ربط قاعدة البيانات بعد.<br>أضف عنوان المشروع والمفتاح العام في الملف <code dir="ltr">config.js</code>.</div>';
  }

  function renderAuth() {
    var signup = ui.authMode === 'signup';
    app.innerHTML =
      '<form class="card auth" id="auth-form">' +
        '<h2>' + (signup ? 'إنشاء حساب' : 'تسجيل الدخول') + '</h2>' +
        (signup ? '<p class="hint">بعد إنشاء الحساب يقوم مدير النظام بتفعيله وتحديد صلاحيته.</p>' : '') +
        (signup ? '<div class="f"><label class="field" for="au-name">الاسم</label><input type="text" id="au-name" required autocomplete="name"></div>' : '') +
        '<div class="f"><label class="field" for="au-email">' + (signup ? 'البريد الإلكتروني' : 'البريد الإلكتروني أو اسم المستخدم') + '</label>' +
          '<input type="' + (signup ? 'email' : 'text') + '" id="au-email" dir="ltr" required autocomplete="' + (signup ? 'email' : 'username') + '"></div>' +
        '<div class="f"><label class="field" for="au-pass">كلمة المرور</label><input type="password" id="au-pass" dir="ltr" required' + (signup ? ' minlength="6"' : '') + ' autocomplete="' + (signup ? 'new-password' : 'current-password') + '"></div>' +
        (ui.authErr ? '<div class="msg" role="alert" style="margin:0 0 12px">' + esc(ui.authErr) + '</div>' : '') +
        (ui.authMsg ? '<div class="info">' + esc(ui.authMsg) + '</div>' : '') +
        '<button type="submit" class="btn primary"' + (ui.busy ? ' disabled' : '') + '>' + (signup ? 'إنشاء الحساب' : 'دخول') + '</button>' +
        '<div class="switch"><button type="button" class="btn link" data-act="auth-mode">' +
          (signup ? 'لديك حساب؟ سجّل الدخول' : 'ليس لديك حساب؟ أنشئ حسابًا') + '</button></div>' +
      '</form>';
  }

  function renderPending() {
    app.innerHTML = '<div class="card empty">حسابك بانتظار التفعيل من مدير النظام.<br>' +
      '<button type="button" class="btn" data-act="reload" style="margin-top:12px">تحديث</button></div>';
  }

  /* ---------- قائمة المعلمين ---------- */

  function renderList() {
    var q = ui.search.trim();
    var shown = S.teachers.filter(function (t) {
      return !q || t.name.indexOf(q) > -1 || t.subject.indexOf(q) > -1;
    });

    var cards = shown.map(function (t) {
      var score = t.status === 'new' ? '' :
        '<span class="score">' + total(t) + ' / ' + MAX + '</span>';
      return '<button type="button" class="card teacher" data-open="' + t.id + '">' +
        '<span class="name">' + esc(t.name) + '</span>' +
        '<span class="subject">' + esc(t.subject || '—') + '</span>' +
        '<span class="foot"><span class="badge ' + t.status + '">' + STATUS[t.status] + '</span>' + score + '</span>' +
        '</button>';
    }).join('');

    app.innerHTML = tabs('teachers') +
      '<div class="toolbar">' +
        '<input type="search" id="search" placeholder="ابحث باسم المعلم أو التخصص" aria-label="بحث" value="' + esc(ui.search) + '">' +
        '<button type="button" class="btn primary" data-act="toggle-add">+ إضافة معلم</button>' +
      '</div>' +
      '<form class="card add-form' + (ui.addOpen ? ' open' : '') + '" id="add-form">' +
        '<div class="row">' +
          '<div><label class="field" for="add-name">اسم المعلم</label><input type="text" id="add-name" required></div>' +
          '<div><label class="field" for="add-subject">التخصص</label><input type="text" id="add-subject"></div>' +
        '</div>' +
        '<button type="submit" class="btn primary">حفظ</button> ' +
        '<button type="button" class="btn" data-act="toggle-add">إلغاء</button>' +
      '</form>' +
      (shown.length
        ? '<div class="teachers">' + cards + '</div>'
        : '<div class="card empty">' + (S.teachers.length ? 'لا توجد نتائج مطابقة.' : 'لا يوجد معلمون بعد. أضف معلمًا للبدء.') + '</div>');
  }

  /* ---------- التقييم ---------- */

  function stepper(t) {
    var cur = stepIndex(t.status);
    var allDone = t.status === 'published';
    return '<ol class="stepper">' + STEPS.map(function (s, i) {
      var cls = allDone || i < cur ? 'done' : (i === cur ? 'current' : '');
      return '<li class="' + cls + '"' + (cls === 'current' ? ' aria-current="step"' : '') + '>' +
        '<span class="num">' + (cls === 'done' ? '✓' : i + 1) + '</span>' +
        '<span><span class="t">' + s.title + '</span><br><span class="d">' + s.desc + '</span></span></li>';
    }).join('') + '</ol>';
  }

  function summary(sum) {
    var pct = Math.round(sum / MAX * 100);
    return '<div class="summary">' +
      '<div class="box"><div class="k">المجموع</div><div class="v">' + sum + ' / ' + MAX + '</div></div>' +
      '<div class="box"><div class="k">النسبة</div><div class="v">' + pct + '%</div></div>' +
      '<div class="box"><div class="k">التقدير</div><div class="v">' + grade(pct) + '</div></div>' +
      '</div>';
  }

  function readOnlyTable(ratings) {
    return '<div class="table-wrap"><table class="criteria"><thead><tr><th>م</th><th>التقييم الأدائي والكفايات الشخصية</th><th>التقييم</th></tr></thead><tbody>' +
      CRITERIA.map(function (c, i) {
        return '<tr><td class="n">' + (i + 1) + '</td><td>' + c + '</td><td class="r"><span class="pill">' + (ratings[i] || '—') + '</span></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function notesBlock(title, text) {
    return text ? '<div class="notes-block"><h3>' + title + '</h3><p>' + esc(text) + '</p></div>' : '';
  }

  function editStep(t) {
    var done = ratedCount(t);
    var rows = CRITERIA.map(function (c, i) {
      var opts = SCALE.slice().reverse().map(function (s) {
        return '<label title="' + s.label + '"><input type="radio" name="c' + i + '" value="' + s.v + '"' +
          (t.ratings[i] === s.v ? ' checked' : '') + ' aria-label="' + s.v + ' - ' + s.label + '"><span>' + s.v + '</span></label>';
      }).join('');
      var missing = ui.error && !t.ratings[i] ? ' class="missing"' : '';
      return '<tr' + missing + '><td class="n">' + (i + 1) + '</td><td>' + c + '</td>' +
        '<td class="r"><span class="rate" role="radiogroup" aria-label="تقييم البند ' + (i + 1) + '">' + opts + '</span></td></tr>';
    }).join('');

    return '<div class="card">' +
      '<div class="progress-row"><span id="progress-text">تم تقييم ' + done + ' من ' + CRITERIA.length + ' بندًا</span>' +
      '<span class="save-state" id="save-state"></span></div>' +
      '<div class="progress"><div id="progress-bar" style="width:' + (done / CRITERIA.length * 100) + '%"></div></div>' +
      '<div class="legend">' + SCALE.map(function (s) { return '<span><b>' + s.v + '</b> = ' + s.label + '</span>'; }).join('') + '</div>' +
      '<div class="table-wrap"><table class="criteria"><thead><tr><th>م</th><th>التقييم الأدائي والكفايات الشخصية</th><th>التقييم</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="notes-block"><label class="field" for="notes">ملاحظات المشرف</label>' +
      '<textarea id="notes" placeholder="نقاط القوة، فرص التحسين، التوصيات...">' + esc(t.notes) + '</textarea></div>' +
      (ui.error ? '<div class="msg" role="alert">' + ui.error + '</div>' : '') +
      '<div class="actions">' +
        '<button type="button" class="btn primary" data-act="submit">إرسال للاعتماد</button>' +
        '<button type="button" class="btn" data-act="back">حفظ كمسودة</button>' +
      '</div></div>';
  }

  function reviewStep(t) {
    return '<div class="card">' + summary(total(t)) + readOnlyTable(t.ratings) +
      notesBlock('ملاحظات المشرف', t.notes) +
      '<div class="notes-block"><label class="field" for="approver-notes">ملاحظات الاعتماد</label>' +
      '<textarea id="approver-notes" placeholder="ملاحظات المعتمِد (اختياري)">' + esc(t.approver_notes) + '</textarea></div>' +
      '<div class="actions">' +
        '<button type="button" class="btn primary" data-act="approve">اعتماد التقييم</button>' +
        '<button type="button" class="btn" data-act="return">إعادة للتحرير</button>' +
      '</div></div>';
  }

  function publishStep(t) {
    var published = t.status === 'published';
    return '<div class="card">' +
      '<div class="info no-print">' + (published
        ? 'تم نشر التقييم بتاريخ ' + fmtDate(t.published_at) + (t.visible ? '' : ' (مخفي عن المشاهدين)')
        : 'تم اعتماد التقييم بتاريخ ' + fmtDate(t.approved_at) + ' وهو جاهز للنشر.') + '</div>' +
      summary(total(t)) + readOnlyTable(t.ratings) +
      notesBlock('ملاحظات المشرف', t.notes) +
      notesBlock('ملاحظات الاعتماد', t.approver_notes) +
      '<div class="actions no-print">' +
        (published
          ? '<button type="button" class="btn primary" data-act="print">طباعة</button>' +
            '<button type="button" class="btn" data-act="reopen">إعادة فتح للتحرير</button>'
          : '<button type="button" class="btn primary" data-act="publish">نشر التقييم</button>' +
            '<button type="button" class="btn" data-act="return">إعادة للتحرير</button>') +
      '</div></div>';
  }

  function renderEval(t) {
    var body = t.status === 'review' ? reviewStep(t)
      : (t.status === 'approved' || t.status === 'published') ? publishStep(t)
      : editStep(t);

    app.innerHTML =
      '<button type="button" class="btn link no-print" data-act="back">→ العودة إلى قائمة المعلمين</button>' +
      '<div class="eval-head">' +
        '<div><h2>' + esc(t.name) + '</h2><div class="sub">التخصص: ' + esc(t.subject || '—') + '</div></div>' +
        '<div class="no-print"><span class="badge ' + t.status + '">' + STATUS[t.status] + '</span> ' +
        '<button type="button" class="btn danger" data-act="delete">حذف المعلم</button></div>' +
      '</div>' +
      stepper(t) + body;
  }

  /* ---------- النتائج المنشورة (ما يراه المشاهدون) ---------- */

  function renderResults(id) {
    if (S.results === null) {
      app.innerHTML = tabs('results') + '<div class="card empty">جارٍ التحميل…</div>';
      loadResults();
      return;
    }
    var r = null;
    if (id) S.results.forEach(function (x) { if (x.id === id) r = x; });

    if (r) {
      app.innerHTML =
        '<a class="btn link no-print" href="#/results">→ العودة إلى النتائج</a>' +
        '<div class="eval-head"><div><h2>' + esc(r.name) + '</h2><div class="sub">التخصص: ' + esc(r.subject || '—') +
        ' · تاريخ النشر: ' + fmtDate(r.published_at) + '</div></div>' +
        '<div class="no-print"><button type="button" class="btn" data-act="print">طباعة</button></div></div>' +
        '<div class="card">' +
          (r.total != null ? summary(r.total) : '') +
          (r.ratings ? readOnlyTable(r.ratings) : '') +
          notesBlock('ملاحظات المشرف', r.notes) +
          notesBlock('ملاحظات الاعتماد', r.approver_notes) +
          (r.total == null && !r.ratings && !r.notes && !r.approver_notes ? '<div class="empty">لا توجد تفاصيل متاحة للعرض.</div>' : '') +
        '</div>';
      return;
    }

    var cards = S.results.map(function (x) {
      return '<a class="card teacher" href="#/r/' + x.id + '" style="text-decoration:none;color:inherit">' +
        '<span class="name">' + esc(x.name) + '</span>' +
        '<span class="subject">' + esc(x.subject || '—') + '</span>' +
        '<span class="foot"><span class="badge published">' + fmtDate(x.published_at) + '</span>' +
        (x.total != null ? '<span class="score">' + x.total + ' / ' + MAX + '</span>' : '') + '</span></a>';
    }).join('');

    app.innerHTML = tabs('results') +
      (isStaff() ? '<p class="hint" style="color:var(--muted);margin-top:0">هذه الصفحة تعرض ما يراه أصحاب حسابات «مشاهد».</p>' : '') +
      (cards ? '<div class="teachers">' + cards + '</div>' : '<div class="card empty">لا توجد نتائج منشورة.</div>');
  }

  /* ---------- الإدارة (مدير النظام) ---------- */

  function renderAdmin() {
    var s = S.settings || {};
    var checks = VISIBILITY.map(function (v) {
      return '<label class="check"><input type="checkbox" data-setting="' + v.key + '"' + (s[v.key] ? ' checked' : '') + '>' + v.label + '</label>';
    }).join('');

    var published = S.teachers.filter(function (t) { return t.status === 'published'; });
    var vis = published.length ? published.map(function (t) {
      return '<label class="check"><input type="checkbox" data-visible="' + t.id + '"' + (t.visible ? ' checked' : '') + '>' +
        esc(t.name) + ' <span style="color:var(--muted)">— ' + esc(t.subject || '—') + '</span></label>';
    }).join('') : '<div class="hint">لا توجد تقييمات منشورة بعد.</div>';

    var users = S.users.map(function (u) {
      var self = u.id === S.uid;
      var opts = Object.keys(ROLES).map(function (k) {
        return '<option value="' + k + '"' + (u.role === k ? ' selected' : '') + '>' + ROLES[k] + '</option>';
      }).join('');
      return '<tr><td>' + esc(u.full_name || '—') + '</td><td dir="ltr" style="text-align:right">' + esc(displayName(u.email)) + '</td>' +
        '<td><select data-role="' + u.id + '" aria-label="صلاحية ' + esc(u.email) + '"' + (self ? ' disabled title="لا يمكنك تغيير صلاحيتك"' : '') + '>' + opts + '</select></td></tr>';
    }).join('');

    app.innerHTML = tabs('admin') +
      '<div class="card"><h2>ما يراه المشاهدون</h2>' +
        '<p class="hint">يُطبَّق على جميع حسابات «مشاهد» في التقييمات المنشورة.</p>' + checks + '</div>' +
      '<div class="card"><h2>التقييمات الظاهرة للمشاهدين</h2>' +
        '<p class="hint">أزل العلامة لإخفاء تقييم منشور عن المشاهدين.</p>' + vis + '</div>' +
      '<div class="card"><h2>المستخدمون والصلاحيات</h2>' +
        '<p class="hint">الحسابات الجديدة تبقى «بانتظار التفعيل» إلى أن تحدد صلاحيتها.</p>' +
        '<div class="table-wrap"><table class="grid"><thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الصلاحية</th></tr></thead><tbody>' + users + '</tbody></table></div></div>';
  }

  /* ---------- التوجيه ---------- */

  function currentTeacher() {
    if (!S.ready || !isStaff()) return null;
    var m = location.hash.match(/^#\/t\/(.+)$/);
    return m ? find(m[1]) : null;
  }

  function render() {
    renderUserbar();
    if (!sb) return renderSetup();
    if (!S.uid) return renderAuth();
    if (!S.ready) { app.innerHTML = '<div class="card empty">جارٍ التحميل…</div>'; return; }
    if (role() === 'pending') return renderPending();

    var h = location.hash;
    var r = h.match(/^#\/r\/(.+)$/);
    if (!isStaff()) return renderResults(r && r[1]);

    var t = currentTeacher();
    if (t) return renderEval(t);
    if (h === '#/admin' && isAdmin()) return renderAdmin();
    if (h === '#/results' || r) return renderResults(r && r[1]);
    renderList();
  }

  function go(hash) {
    ui.error = '';
    if (location.hash === hash) render(); else location.hash = hash;
  }

  async function setStatus(t, status) {
    var prev = { status: t.status, approved_at: t.approved_at, published_at: t.published_at };
    t.status = status;
    if (status === 'approved') t.approved_at = new Date().toISOString();
    if (status === 'published') t.published_at = new Date().toISOString();
    if (status === 'edit') { t.approved_at = null; t.published_at = null; }
    ui.error = '';
    await flush();
    if (!(await saveNow(t))) Object.assign(t, prev);
    render();
    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', function () {
    ui.error = '';
    flush();
    if (location.hash === '#/results') S.results = null;
    render();
    window.scrollTo(0, 0);
  });

  /* ---------- الأحداث ---------- */

  document.addEventListener('click', async function (e) {
    var open = e.target.closest('[data-open]');
    if (open) { go('#/t/' + open.getAttribute('data-open')); return; }

    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var t = currentTeacher();

    if (act === 'signout') {
      await flush();
      await sb.auth.signOut();
    } else if (act === 'auth-mode') {
      ui.authMode = ui.authMode === 'login' ? 'signup' : 'login';
      ui.authErr = ''; ui.authMsg = '';
      render();
    } else if (act === 'reload') {
      loadAll();
    } else if (act === 'print') {
      window.print();
    } else if (act === 'toggle-add') {
      ui.addOpen = !ui.addOpen;
      render();
      if (ui.addOpen) document.getElementById('add-name').focus();
    } else if (act === 'back') {
      await flush();
      go('#/');
    } else if (!t) {
      return;
    } else if (act === 'submit') {
      var left = CRITERIA.length - ratedCount(t);
      if (left > 0) {
        ui.error = 'يجب تقييم جميع البنود قبل الإرسال للاعتماد (متبقٍ ' + left + ').';
        render();
        var first = app.querySelector('tr.missing');
        if (first) first.scrollIntoView({ block: 'center' });
        return;
      }
      setStatus(t, 'review');
    } else if (act === 'approve') {
      setStatus(t, 'approved');
    } else if (act === 'return') {
      setStatus(t, 'edit');
    } else if (act === 'publish') {
      if (confirm('هل تريد نشر تقييم «' + t.name + '»؟')) setStatus(t, 'published');
    } else if (act === 'reopen') {
      if (confirm('سيتم إلغاء النشر والاعتماد وإعادة التقييم إلى مرحلة التحرير. هل تريد المتابعة؟')) setStatus(t, 'edit');
    } else if (act === 'delete') {
      if (!confirm('هل تريد حذف «' + t.name + '» وتقييمه نهائيًا؟')) return;
      clearTimeout(saveTimer); saveTimer = null;
      var d = await sb.from('teachers').delete().eq('id', t.id);
      if (d.error) return fail(d.error);
      S.teachers = S.teachers.filter(function (x) { return x.id !== t.id; });
      go('#/');
    }
  });

  app.addEventListener('change', async function (e) {
    var el = e.target, r;

    if (el.hasAttribute('data-setting') && isAdmin()) {
      var patch = {};
      patch[el.getAttribute('data-setting')] = el.checked;
      r = await sb.from('settings').update(patch).eq('id', 1);
      if (r.error) { el.checked = !el.checked; return fail(r.error); }
      Object.assign(S.settings || (S.settings = {}), patch);
      toast('تم الحفظ');
    } else if (el.hasAttribute('data-visible') && isAdmin()) {
      var vt = find(el.getAttribute('data-visible'));
      r = await sb.from('teachers').update({ visible: el.checked }).eq('id', vt.id);
      if (r.error) { el.checked = !el.checked; return fail(r.error); }
      vt.visible = el.checked;
      toast('تم الحفظ');
    } else if (el.hasAttribute('data-role') && isAdmin()) {
      var u = null, uidAttr = el.getAttribute('data-role');
      S.users.forEach(function (x) { if (x.id === uidAttr) u = x; });
      r = await sb.from('profiles').update({ role: el.value }).eq('id', u.id);
      if (r.error) { el.value = u.role; return fail(r.error); }
      u.role = el.value;
      toast('تم الحفظ');
    } else if (el.type === 'radio') {
      var t = currentTeacher();
      if (!t) return;
      t.ratings[Number(el.name.slice(1))] = Number(el.value);
      if (t.status === 'new') t.status = 'edit';
      queueSave(t);
      var done = ratedCount(t);
      document.getElementById('progress-text').textContent = 'تم تقييم ' + done + ' من ' + CRITERIA.length + ' بندًا';
      document.getElementById('progress-bar').style.width = (done / CRITERIA.length * 100) + '%';
      var row = el.closest('tr');
      if (row) row.classList.remove('missing');
    }
  });

  app.addEventListener('input', function (e) {
    var t = currentTeacher();
    if (e.target.id === 'search') {
      ui.search = e.target.value;
      render();
      var s = document.getElementById('search');
      s.focus();
      s.setSelectionRange(s.value.length, s.value.length);
    } else if (t && e.target.id === 'notes') {
      t.notes = e.target.value;
      if (t.status === 'new') t.status = 'edit';
      queueSave(t);
    } else if (t && e.target.id === 'approver-notes') {
      t.approver_notes = e.target.value;
      queueSave(t);
    }
  });

  app.addEventListener('submit', async function (e) {
    e.preventDefault();

    if (e.target.id === 'add-form') {
      var name = document.getElementById('add-name').value.trim();
      if (!name) return;
      var ins = await sb.from('teachers')
        .insert({ name: name, subject: document.getElementById('add-subject').value.trim() })
        .select().single();
      if (ins.error) return fail(ins.error);
      S.teachers.push(ins.data);
      ui.addOpen = false;
      render();
    } else if (e.target.id === 'auth-form') {
      var email = document.getElementById('au-email').value.trim();
      var pass = document.getElementById('au-pass').value;
      var signup = ui.authMode === 'signup';
      if (!signup && email.indexOf('@') < 0) email = email.toLowerCase() + USER_SUFFIX;
      var fullName = signup ? document.getElementById('au-name').value.trim() : '';
      ui.busy = true; ui.authErr = ''; ui.authMsg = '';
      render();
      var res = signup
        ? await sb.auth.signUp({
            email: email, password: pass,
            options: { data: { full_name: fullName }, emailRedirectTo: location.origin + location.pathname }
          })
        : await sb.auth.signInWithPassword({ email: email, password: pass });
      ui.busy = false;
      if (res.error) {
        ui.authErr = signup ? 'تعذر إنشاء الحساب: ' + res.error.message : 'بيانات الدخول غير صحيحة.';
      } else if (signup && !res.data.session) {
        ui.authMode = 'login';
        ui.authMsg = 'تم إنشاء الحساب. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.';
      }
      if (!S.uid) render();
    }
  });

  /* ---------- البدء ---------- */

  if (cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase) {
    sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    sb.auth.onAuthStateChange(function (event, session) {
      // لا تُستدعى دوال Supabase مباشرة داخل هذا المستمع
      setTimeout(function () {
        var uid = session && session.user ? session.user.id : null;
        if (uid && uid === S.uid) return; // تجديد الجلسة فقط
        S.uid = uid;
        S.email = uid ? session.user.email : '';
        S.profile = null;
        if (uid) loadAll(); else { S.ready = false; render(); }
      }, 0);
    });
  }
  render();
})();
</script>
</body>
</html>
