  /* ---------- تصدير «كشوف تسجيل الطلاب» في ملف الأكاديمية الجاهز ----------
     القالب registration-template.xlsx (تعليمات، ملخص، وورقة لكل صف: الأول–السادس مختلطة، والسابع–التاسع بنات/ذكور)
     يُملأ ببيانات المسجلين نهائيًا مع بقاء تصميمه ومعادلاته كما هي: تُعدَّل ملفات XML داخل الملف مباشرة.
     في كل ورقة: الطلاب في الصفوف من 10، وعددها في القالب = القدرة الاستيعابية؛ إن زاد المسجلون تُضاف صفوف ويُزاح ما بعدها */

  function loadFflate() {
    if (window.fflate) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js';
      sc.onload = resolve;
      sc.onerror = function () { reject(new Error('تعذر تحميل مكتبة ضغط الملفات')); };
      document.head.appendChild(sc);
    });
  }

  function xmlEsc(v) {
    return String(v == null ? '' : v).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f￾￿]/g, '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function reEsc(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  // يغيّر القيمة المحفوظة لخلية (رقم أو ناتج معادلة) دون المساس بمعادلتها وتنسيقها
  function setCellValue(xml, ref, value) {
    return xml.replace(new RegExp('(<c r="' + ref + '"[^>]*>(?:<f[^>]*>[^<]*</f>)?<v>)[^<]*(</v>)'), function (all, a, b) { return a + value + b; });
  }

  // وسم فتح الصف وتنسيق كل عمود فيه، كما في القالب
  function rowPattern(xml, r) {
    var a = xml.indexOf('<row r="' + r + '"'), b = xml.indexOf('</row>', a);
    var text = xml.slice(a, b), styles = {};
    text.replace(/<c r="([A-Z]+)\d+" s="(\d+)"/g, function (all, col, s) { styles[col] = s; });
    return { open: text.slice(0, text.indexOf('>') + 1), styles: styles };
  }

  // رقم الهاتف بلا علامة «+»
  function plainPhone(v) {
    return String(v == null ? '' : v).replace(/[+\uFF0B\u200e\u200f]/g, '').trim();
  }

  // تاريخ ISO إلى الرقم التسلسلي الذي يخزنه Excel
  function excelDate(iso) {
    var p = String(iso || '').slice(0, 10).split('-');
    return p.length === 3 ? Math.round(Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2])) / 864e5) + 25569 : null;
  }

  // list: طلاب الورقة. capacity: القدرة الاستيعابية من «إعداد الفصول» (null: تبقى قيمة القالب). note: دالة ما يُكتب في العمود الأخير
  // noteHead: عنوان العمود الأخير بدل «ملاحظات» (إن أُعطي)
  function fillRegistrationSheet(xml, list, capacity, note, teacher, noteHead) {
    var m = xml.match(/COUNTA\(B10:B(\d+)\)/);
    if (!m) return null;
    var last = Number(m[1]), slots = last - 9, need = Math.max(slots, list.length), k = need - slots, newLast = last + k;
    var a = xml.indexOf('<row r="10"'), lastAt = xml.indexOf('<row r="' + last + '"'), b = xml.indexOf('</row>', lastAt) + 6;
    var patterns = [rowPattern(xml, 10), rowPattern(xml, 11)];
    var rows = '';
    for (var i = 0; i < need; i++) {
      var p = patterns[i % 2], r = 10 + i, x = list[i];
      var text = function (col, v) {
        return v === '' || v == null ? '<c r="' + col + r + '" s="' + p.styles[col] + '"/>'
          : '<c r="' + col + r + '" s="' + p.styles[col] + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(v) + '</t></is></c>';
      };
      var birth = x ? excelDate(x.birth_date) : null;
      rows += p.open.replace(/r="\d+"/, 'r="' + r + '"') + '<c r="A' + r + '" s="' + p.styles.A + '" t="n"><v>' + (i + 1) + '</v></c>' +
        (x
          ? text('B', x.full_name + rsvText(x)) + text('C', x.gender === 'ذكر' || x.gender === 'أنثى' ? x.gender : '') +
            (birth == null ? text('D', '') : '<c r="D' + r + '" s="' + p.styles.D + '" t="n"><v>' + birth + '</v></c>') +
            text('E', x.national_id) + text('F', x.guardian_name) + text('G', x.guardian_relation) + text('H', plainPhone(x.phone)) + text('I', plainPhone(x.whatsapp)) +
            text('J', plainPhone(stVal(x, 'student_phone'))) + text('K', stVal(x, 'city') || stVal(x, 'address')) + text('L', note(x))
          : 'BCDEFGHIJKL'.split('').map(function (col) { return text(col, ''); }).join('')) + '</row>';
    }
    var head = xml.slice(0, a), tail = xml.slice(b);
    if (k) {
      // ما بعد جدول الطلاب (إن وُجد) ينزل k صفًا، ومعه الدمج ونطاقات المعادلات والقوائم المنسدلة
      var cut = tail.indexOf('</sheetData>');
      var shifted = tail.slice(0, cut).replace(/<row r="(\d+)"/g, function (all, n) { return '<row r="' + (Number(n) + k) + '"'; })
        .replace(/<c r="([A-Z]+)(\d+)"/g, function (all, col, n) { return '<c r="' + col + (Number(n) + k) + '"'; });
      var rest = tail.slice(cut).replace(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"/g, function (all, c1, r1, c2, r2) {
        return Number(r1) > last ? '<mergeCell ref="' + c1 + (Number(r1) + k) + ':' + c2 + (Number(r2) + k) + '"' : all;
      });
      var range = new RegExp('([A-L])10:(?:\\1)' + last + '(?!\\d)', 'g'), grow = function (all, col) { return col + '10:' + col + newLast; };
      head = head.replace(range, grow).replace(/(<dimension ref="A1:L)(\d+)"/, function (all, pre, n) { return pre + (Number(n) + k) + '"'; });
      tail = shifted + rest.replace(range, grow);
    }
    var boys = list.filter(function (x) { return x.gender === 'ذكر'; }).length, girls = list.filter(function (x) { return x.gender === 'أنثى'; }).length;
    var cap = capacity == null ? slots : capacity;
    if (noteHead) head = head.replace(/<c r="L9" s="(\d+)"[^>]*>.*?<\/c>/, function (all, sid) { return '<c r="L9" s="' + sid + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(noteHead) + '</t></is></c>'; });
    // خانة «اسم مربي الصف» (C5)
    if (teacher) head = head.replace(/<c r="C5" s="(\d+)"\/>/, function (all, sid) { return '<c r="C5" s="' + sid + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(teacher) + '</t></is></c>'; });
    head = setCellValue(setCellValue(setCellValue(setCellValue(setCellValue(head, 'F6', cap), 'C7', list.length), 'F7', cap - list.length), 'I6', boys), 'I7', girls);
    return { xml: head + rows + tail, added: k, capacity: cap, count: list.length };
  }

  async function exportRegistrationWorkbook(btn) {
    if (!(await syncData(true))) return;
    btn = document.querySelector('[data-regbook]') || btn; // الشاشة أُعيد رسمها بعد المزامنة
    btn.disabled = true;
    try {
      await loadFflate();
      var res = await fetch('registration-template.xlsx?v=2');
      if (!res.ok) throw new Error('تعذر تحميل قالب الكشوف');
      var files = fflate.unzipSync(new Uint8Array(await res.arrayBuffer()));
      var read = function (name) { return fflate.strFromU8(files[name]); };
      var write = function (name, text) { files[name] = fflate.strToU8(text); };

      // اسم كل ورقة وملفها داخل القالب
      var parse = function (name) { return new DOMParser().parseFromString(read(name), 'application/xml'); };
      var target = {}, sheetFile = {};
      Array.prototype.forEach.call(parse('xl/_rels/workbook.xml.rels').getElementsByTagName('Relationship'), function (r) { target[r.getAttribute('Id')] = r.getAttribute('Target'); });
      Array.prototype.forEach.call(parse('xl/workbook.xml').getElementsByTagName('sheet'), function (sh) {
        var id = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
        sheetFile[sh.getAttribute('name')] = 'xl/' + String(target[id]).replace(/^\/?xl\//, '');
      });

      var finals = S.students.filter(function (x) { return enrolled(x) && x.class_name; });

      // العمود الأخير: دفع المواصلات عن الشهر المعروض في شاشة المواصلات (أو الشهر الحالي).
      // الدفعات يقرؤها مدير النظام وحده؛ لغيره يبقى العمود «ملاحظات» كما في القالب
      var payHead = '', payNote = null;
      if (canView() && !S.transportMissing) {
        if (!ui.tMonth) ui.tMonth = thisMonth();
        var payMonth = ui.tMonth;
        var payRowsNow = await fetchAll(function () { return sb.from('transport_payments').select('*').eq('month', payMonth).order('student_id'); });
        if (!payRowsNow) throw new Error('تعذر جلب دفعات المواصلات');
        var payMap = {}, memberOf = {};
        payRowsNow.forEach(function (p) { p.amount = Number(p.amount) || 0; payMap[p.student_id] = p; });
        S.tPay[payMonth] = payMap;
        S.tMembers.forEach(function (m) { memberOf[m.student_id] = m; });
        payHead = 'دفع المواصلات (' + monthLabel(payMonth) + ')';
        payNote = function (x) {
          var m = memberOf[x.id], paid = (payMap[x.id] || {}).amount || 0;
          if (!m) return paid > 0 ? 'مدفوع ' + plainNum(paid) : '';
          if (!owesThisMonth(m)) return subscribedIn(m, payMonth) ? 'لم يبدأ الاشتراك' : 'اشتراك متوقف';
          var share = shareOf(m);
          return paid <= 0 ? 'لم يدفع (' + plainNum(share) + ')' : paid >= share ? 'مدفوع ' + plainNum(paid) : 'مدفوع ' + plainNum(paid) + ' من ' + plainNum(share);
        };
      }
      // صف الشعبة من اسمها؛ الروضة (KG2…) ليست صفًّا من صفوف الملف ولو كان في اسمها رقم
      var gradeIn = function (name) { return /kg|روض|تمهيد/i.test(name) ? 0 : gradeOf(name); };
      var placed = {}, stats = {}, workbook = read('xl/workbook.xml'), total = 0, extra = 0;
      Object.keys(sheetFile).forEach(function (name) {
        var grade = gradeIn(name), side = /بنات|إناث/.test(name) ? 'girls' : /ذكور|بنين/.test(name) ? 'boys' : '';
        if (!grade || !/COUNTA\(B10:B\d+\)/.test(read(sheetFile[name]))) return; // ليست ورقة صف
        // أين يقع الطالب في الأوراق المقسومة: جنس شعبته إن حُدِّد (ذكور/إناث)، وإلا جنسه هو
        var sideOf = function (x) {
          var info = classInfo(x.class_name);
          return info && (info.gender === 'boys' || info.gender === 'girls') ? info.gender : x.gender === 'ذكر' ? 'boys' : x.gender === 'أنثى' ? 'girls' : '';
        };
        var list = finals.filter(function (x) { return gradeIn(x.class_name) === grade && (!side || sideOf(x) === side); });
        var sections = {};
        list.forEach(function (x) { placed[x.id] = true; sections[x.class_name] = true; });
        // القدرة من «إعداد الفصول»: مجموع سعات شعب هذا الصف (وهذا الجنس)، إن حُدِّدت كلها
        var mine = classConfig().list.filter(function (c) { return gradeIn(c.name) === grade && (!side || c.gender === side); });
        var cap = mine.length && mine.every(function (c) { return c.capacity != null; }) ? mine.reduce(function (sum, c) { return sum + c.capacity; }, 0) : null;
        var many = Object.keys(sections).length > 1;
        // مربو شعب هذه الورقة: من «إعداد الفصول» (للشعب المقسومة: الشعبة التي جنسها جنس الورقة، أو التي فيها طلاب الورقة)
        var teachers = [];
        classConfig().list.forEach(function (c) {
          if (c.teacher && gradeIn(c.name) === grade && (!side || c.gender === side || sections[c.name]) && teachers.indexOf(c.teacher) < 0) teachers.push(c.teacher);
        });
        var out = fillRegistrationSheet(read(sheetFile[name]), list, cap, payNote || function (x) { return many ? x.class_name : ''; }, teachers.join(' / '), payHead);
        write(sheetFile[name], out.xml);
        stats[name] = out;
        total += out.count;
        if (out.added) {
          extra += out.added;
          workbook = workbook.replace(new RegExp('((?:&apos;|\')?' + reEsc(name) + '(?:&apos;|\')?!\\$A\\$1:\\$L\\$)(\\d+)'), function (all, pre, n) { return pre + (Number(n) + out.added); });
        }
      });
      if (!Object.keys(stats).length) throw new Error('القالب لا يحتوي على أوراق الصفوف المتوقعة');

      // ورقة الملخص: القيم المحفوظة لمعادلاتها، ليظهر الملف صحيحًا حتى في برامج لا تعيد الحساب
      var sumFile = sheetFile['الملخص'];
      if (sumFile) {
        var sum = read(sumFile), all = { cap: 0, n: 0 };
        sum.replace(/<c r="E(\d+)"[^>]*><f[^>]*>(?:&apos;|')?([^!<]+?)(?:&apos;|')?!F6<\/f>/g, function (m0, row, name) {
          var st = stats[name];
          if (!st) return m0;
          all.cap += st.capacity; all.n += st.count;
          sum = setCellValue(setCellValue(setCellValue(setCellValue(sum, 'E' + row, st.capacity), 'F' + row, st.count), 'G' + row, st.capacity - st.count),
            'H' + row, st.capacity ? st.count / st.capacity : 0);
          return m0;
        });
        var tot = sum.match(/<c r="E(\d+)"[^>]*><f[^>]*>SUM\(/);
        if (tot) {
          sum = setCellValue(setCellValue(setCellValue(setCellValue(sum, 'E' + tot[1], all.cap), 'F' + tot[1], all.n), 'G' + tot[1], all.cap - all.n),
            'H' + tot[1], all.cap ? all.n / all.cap : 0);
        }
        write(sumFile, sum);
      }
      // Excel يعيد حساب المعادلات كلها عند فتح الملف
      workbook = /<calcPr\b/.test(workbook)
        ? workbook.replace(/<calcPr\b(?![^>]*fullCalcOnLoad)/, '<calcPr fullCalcOnLoad="true"')
        : workbook.replace('</definedNames>', '</definedNames><calcPr fullCalcOnLoad="true"/>');
      write('xl/workbook.xml', workbook);

      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([fflate.zipSync(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      a.download = 'كشوف-تسجيل-الطلاب-' + todayISO() + '.xlsx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
      var left = finals.filter(function (x) { return !placed[x.id]; }).length;
      toast('صُدّرت الكشوف — الطلاب المدرجون: ' + total + (extra ? ' · صفوف أُضيفت فوق القدرة: ' + extra : '') +
        (left ? ' · لم يُدرج: ' + left + ' (شعبتهم خارج صفوف الملف أو جنسهم غير محدد)' : ''), !!left);
    } catch (err) {
      toast(err.message, true);
    }
    btn.disabled = false;
  }

  /* ---------- النسخ الاحتياطي والاستعادة (مدير النظام) ----------
     النسخة ملف JSON واحد فيه جداول البرنامج كلها. الاستعادة تعيد كل سجل في الملف إلى ما كان عليه
     (تُرجع المحذوف وتُصحّح المعدَّل) ولا تحذف ما أُضيف بعد أخذ النسخة.
     الحسابات وكلمات المرور ليست في النسخة: تديرها خدمة الدخول */

  // بترتيب يحترم الارتباطات: المعلمون قبل زياراتهم، والطلاب والمجموعات قبل الاشتراكات والدفعات.
  // key: ما يُعرَف به السجل عند الاستعادة. insertOnly: جدول لا يُسمح بتعديل صفوفه، فتُضاف الناقصة فقط
  var BACKUP_TABLES = [
    { name: 'teachers', label: 'المعلمون', key: 'id' },
    { name: 'visits', label: 'الزيارات الإشرافية', key: 'id' },
    { name: 'statements', label: 'عبارات التقارير المضافة', key: 'id', insertOnly: true },
    { name: 'students', label: 'الطلاب', key: 'id' },
    { name: 'transport_groups', label: 'مجموعات المواصلات', key: 'id' },
    { name: 'transport_members', label: 'اشتراكات المواصلات', key: 'student_id' },
    { name: 'transport_payments', label: 'دفعات المواصلات', key: 'student_id,month', drop: ['id'] },
    { name: 'transport_voided', label: 'أرشيف الإيصالات المحذوفة', key: 'id' },
    { name: 'transport_refunds', label: 'مستردات المواصلات', key: 'id' }
  ];
  var BACKUP_MARK = 'third-pillar-backup';

  function backupSummary(tables) {
    return BACKUP_TABLES.map(function (t) { return t.label + ': ' + ((tables[t.name] || []).length); }).join(' · ');
  }

  async function downloadBackup(btn) {
    btn.disabled = true;
    var tables = {};
    for (var i = 0; i < BACKUP_TABLES.length; i++) {
      var t = BACKUP_TABLES[i], rows = await fetchAll(function () { return sb.from(t.name).select('*').order(t.key.split(',')[0]); });
      // جدول لم يُنشأ بعد يُتخطى
      if (rows) tables[t.name] = rows;
    }
    var cfg = await sb.from('settings').select('*').eq('id', 1).maybeSingle();
    btn.disabled = false;
    if (!tables.students && !tables.teachers) return toast('تعذر قراءة البيانات؛ لم تُنشأ النسخة', true);
    var d = new Date(), two = function (n) { return ('0' + n).slice(-2); };
    var file = { app: BACKUP_MARK, version: 1, created_at: d.toISOString(), school: schoolName(), settings: cfg.data || null, tables: tables };
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(file)], { type: 'application/json' }));
    a.download = 'نسخة-احتياطية-' + todayISO() + '-' + two(d.getHours()) + two(d.getMinutes()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    try { localStorage.setItem('last-backup', d.toISOString()); } catch (err) { /* التخزين المحلي غير متاح */ }
    toast('نُزّلت النسخة الاحتياطية — ' + backupSummary(tables));
    render();
  }

  async function restoreBackup(fileObj) {
    var data;
    try { data = JSON.parse(await fileObj.text()); } catch (err) { data = null; }
    if (!data || data.app !== BACKUP_MARK || !data.tables) return toast('هذا الملف ليس نسخة احتياطية من البرنامج', true);
    var when = new Date(data.created_at).toLocaleString('ar-u-nu-latn', { dateStyle: 'long', timeStyle: 'short' });
    if (!confirm('استعادة النسخة المأخوذة في ' + when + '؟\n\n' + backupSummary(data.tables) +
      '\n\nكل سجل في النسخة يعود إلى ما كان عليه وقتها، فيضيع أي تعديل أُجري عليه بعدها. ما أُضيف بعد النسخة يبقى كما هو.')) return;
    if (!confirm('تأكيد أخير: يُنصح بتنزيل نسخة احتياطية من الوضع الحالي أولًا. هل تريد المتابعة بالاستعادة الآن؟')) return;

    app.innerHTML = tabs('admin') + '<div class="card empty" id="restore-progress">جارٍ الاستعادة…</div>';
    var box = document.getElementById('restore-progress'), errors = [], done = 0;
    for (var i = 0; i < BACKUP_TABLES.length; i++) {
      var t = BACKUP_TABLES[i], rows = data.tables[t.name] || [];
      if (t.drop) rows = rows.map(function (r) { var c = Object.assign({}, r); t.drop.forEach(function (k) { delete c[k]; }); return c; });
      for (var from = 0; from < rows.length; from += 200) {
        box.textContent = 'جارٍ الاستعادة… ' + t.label + ' (' + Math.min(from + 200, rows.length) + ' من ' + rows.length + ')';
        var opts = { onConflict: t.key };
        if (t.insertOnly) opts.ignoreDuplicates = true;
        var r = await sb.from(t.name).upsert(rows.slice(from, from + 200), opts);
        if (r.error) { errors.push(t.label + ': ' + r.error.message); break; }
        done += Math.min(200, rows.length - from);
      }
    }
    if (data.settings) {
      var cfg = Object.assign({}, data.settings);
      delete cfg.id;
      var up = await sb.from('settings').update(cfg).eq('id', 1);
      if (up.error) errors.push('الإعدادات: ' + up.error.message);
    }
    await loadAll();
    if (errors.length) alert('اكتملت الاستعادة مع أخطاء:\n\n' + errors.join('\n'));
    toast(errors.length ? 'اكتملت الاستعادة مع أخطاء' : 'تمت الاستعادة — سجلات: ' + done, !!errors.length);
  }

  function backupCardHtml() {
    var last = '';
    try { last = localStorage.getItem('last-backup') || ''; } catch (err) { /* التخزين المحلي غير متاح */ }
    var days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 864e5) : null;
    return '<div class="card"><h2>النسخ الاحتياطي</h2>' +
      '<p class="hint">تنزّل النسخة ملفًا واحدًا فيه كل بيانات البرنامج (الطلاب، المواصلات والدفعات، المعلمون، الزيارات، الإعدادات). احفظه في مكان آمن خارج هذا الجهاز؛ فيه بيانات شخصية.</p>' +
      '<div class="toolbar" style="align-items:center">' +
        '<button type="button" class="btn primary" data-backup>تنزيل نسخة احتياطية الآن</button>' +
        '<button type="button" class="btn" data-restore>استعادة من ملف…</button>' +
        '<input type="file" id="restore-file" accept=".json,application/json" hidden>' +
        '<span class="st-count" style="margin:0">' + (last
          ? 'آخر نسخة من هذا المتصفح: ' + dmy(last) + (days ? ' (منذ ' + days + ' يومًا)' : ' (اليوم)')
          : 'لم تؤخذ نسخة من هذا المتصفح بعد.') + '</span>' +
      '</div>' +
      '<p class="hint" style="margin:10px 0 0">الاستعادة تعيد كل سجل في الملف إلى ما كان عليه وقت النسخ (تُرجع المحذوف وتُصحّح المعدَّل)، ولا تحذف ما أُضيف بعدها. حسابات الدخول وكلمات المرور ليست ضمن النسخة.</p></div>';
  }

  document.addEventListener('click', function (e) {
    if (!isAdmin() || location.hash !== '#/admin') return;
    var el;
    if ((el = e.target.closest('[data-backup]'))) downloadBackup(el);
    else if (e.target.closest('[data-restore]')) document.getElementById('restore-file').click();
  });

  document.addEventListener('change', function (e) {
    if (!isAdmin() || location.hash !== '#/admin' || e.target.id !== 'restore-file' || !e.target.files[0]) return;
    restoreBackup(e.target.files[0]);
  });

  // دوال إنشاء الحسابات تأتي من supabase/registrar.sql: إن لم يُشغَّل بعدُ تُعرض رسالة واضحة
  function accountRpcFail(error) {
    if (/could not find the function|schema cache|PGRST202/i.test((error.message || '') + (error.code || ''))) {
      return toast('شغّل الملف supabase/registrar.sql في محرر SQL أولًا، ثم حدّث الصفحة', true);
    }
    fail(error);
  }

  document.addEventListener('click', async function (e) {
    var el = e.target.closest('[data-resetpw]');
    if (!el || !isAdmin() || location.hash !== '#/admin') return;
    var u = S.users.filter(function (x) { return x.id === el.getAttribute('data-resetpw'); })[0];
    var pw = prompt('كلمة مرور مؤقتة جديدة للحساب «' + (u.full_name || displayName(u.email)) + '» (6 أحرف على الأقل).\nسيُطلب منه تغييرها عند أول دخول.', S.defaultPw || '');
    if (pw == null) return;
    if (pw.length < 6) return toast('كلمة المرور يجب ألا تقل عن 6 أحرف.', true);
    var r = await sb.rpc('reset_user_password', { p_user: u.id, p_password: pw });
    if (r.error) return accountRpcFail(r.error);
    toast('تم تعيين كلمة المرور المؤقتة');
  });

  /* ---------- التوجيه ---------- */

  function currentTeacher() {
    if (!S.ready || !isStaff()) return null;
    var m = location.hash.match(/^#\/t\/(.+)$/);
    return m ? find(m[1]) : null;
  }

  function render() {
    document.getElementById('page-lh').innerHTML = letterhead();
    document.getElementById('page-css').textContent = pageCss() + '@media print{' + sheetPadCss('body.print-sheet ') +
      '#content{padding:' + REPORT.page.marginY + 'mm ' + REPORT.page.marginX + 'mm}}';
    renderSide();
    if (!sb) return renderSetup();
    if (!S.uid) return renderAuth();
    if (!S.ready) { app.innerHTML = '<div class="card empty">جارٍ التحميل…</div>'; return; }
    if (role() === 'pending') return renderPending();
    if (S.profile && S.profile.must_change_password) return renderChangePw();

    var h = location.hash;
    var r = h.match(/^#\/r\/(.+)$/);
    if (isRegistrar()) {
      if (/^#\/classes/.test(h)) return renderClasses();
      if (h === '#/attendance') return renderAttendance();
      if (h === '#/reports') return renderReports();
      if (h !== '#/students') return go('#/students');
      return renderStudents();
    }
    if (!isStaff()) return renderResults(r && r[1]);

    var t = currentTeacher();
    if (t) return renderEval(t);
    var v = currentVisit();
    if (v) return renderVisit(v);
    if (h === '#/visits' || /^#\/v\//.test(h)) return renderVisits();
    if (h === '#/staff' && canView()) return renderStaff();
    if (h === '#/students' && canView()) return renderStudents();
    if (/^#\/classes/.test(h) && canView()) return renderClasses();
    if (/^#\/transport/.test(h) && canView()) return renderTransport();
    if (h === '#/admin' && canView()) return renderAdmin();
    if (h === '#/rooms' && canView()) return renderRooms();
    if (h === '#/attendance' && canView()) return renderAttendance();
    if (h === '#/reports' && canView()) return renderReports();
    if (h === '#/results' || r) return renderResults(r && r[1]);
    if (h === '#/teachers') return renderList();

  /* ---------- الحضور والغياب ----------
     يُسجَّل لكل شعبة يومًا بيوم: صف لكل طالب في جدول attendance (supabase/attendance.sql).
     حالتان فقط: حاضر وغائب (السجلات القديمة: «متأخر» تُعدّ حاضرًا، و«بعذر» تُعدّ غائبًا).
     اليوم: تسجيل شعبة، أو ملخص المدرسة مع الغائبين. الفترة: نسب الحضور لكل طالب ولكل شعبة */

  var ATT = { present: 'حاضر', absent: 'غائب' };
  var ATT_BADGE = { present: 'paid', absent: 'unpaid' };
  S.attDay = {};          // { 'YYYY-MM-DD': { studentId: صف } }
  S.attMissing = false;

  function attNorm(status) { return status === 'late' ? 'present' : status === 'excused' ? 'absent' : status === 'absent' ? 'absent' : 'present'; }
  function attNormRows(rows) { (rows || []).forEach(function (r) { r.status = attNorm(r.status); }); return rows; }

  function attState() {
    if (!ui.att) ui.att = { view: 'day', day: todayISO(), cls: '', draft: {}, busy: false, from: todayISO().slice(0, 8) + '01', to: todayISO(), report: null, loading: false, dayNote: '' };
    return ui.att;
  }

  // المسجَّلون نهائيًا في الشعبة، بالاسم
  function classRoll(cls) {
    return S.students.filter(function (x) { return enrolled(x) && x.class_name === cls; })
      .sort(function (a, b) { return a.full_name.localeCompare(b.full_name, 'ar'); });
  }

  function attClasses() {
    var names = schoolClasses().slice();
    S.students.forEach(function (x) { if (enrolled(x) && x.class_name && names.indexOf(x.class_name) < 0) names.push(x.class_name); });
    return names;
  }

  // الاسم الأول واسم العائلة (للكشوف المختصرة)
  function shortName(x) {
    var nm = splitFamily(x.full_name), first = String(x.full_name || '').trim().split(/\s+/)[0] || '';
    return nm.family ? first + ' ' + nm.family : x.full_name;
  }

  async function loadAttDay(day) {
    var rows = await fetchAll(function () { return sb.from('attendance').select('*').eq('day', day).order('student_id'); });
    if (!rows) { S.attMissing = true; render(); return; }
    var map = {};
    attNormRows(rows).forEach(function (r) { map[r.student_id] = r; });
    S.attDay[day] = map;
    render();
  }

  async function loadAttReport() {
    var a = attState();
    if (!a.from || !a.to || a.from > a.to) return toast('اختر فترة صحيحة', true);
    a.loading = true;
    render();
    var rows = await fetchAttRange(a.from, a.to);
    a.loading = false;
    if (!rows) { toast('تعذر جلب سجلات الحضور', true); render(); return; }
    a.report = { from: a.from, to: a.to, rows: rows };
    render();
  }

  // حالة الطالب في اليوم المعروض: ما عُدِّل ولم يُحفظ، ثم المحفوظ، وإلا حاضر
  function attOf(sid) {
    var a = attState(), d = a.draft[sid], saved = (S.attDay[a.day] || {})[sid];
    return { status: d ? d.status : saved ? saved.status : 'present', note: d && d.note != null ? d.note : saved ? saved.note || '' : '', saved: saved };
  }

  function attCounts(list, get) {
    var n = { present: 0, absent: 0 };
    list.forEach(function (x) { n[attNorm(get(x))]++; });
    return n;
  }

  function attPct(n) {
    var total = n.present + n.absent;
    return total ? Math.round(n.present / total * 100) + '%' : '—';
  }

  function attStatsHtml(n, sub) {
    var card = function (lbl, num, color) { return '<div class="card stat"><span class="lbl">' + lbl + '</span><span class="num"' + (color ? ' style="color:' + color + '"' : '') + '>' + num + '</span><span class="sub">' + sub + '</span></div>'; };
    return '<div class="stats">' + card('حاضر', n.present) + card('غائب', n.absent, n.absent ? 'var(--red)' : '') + card('نسبة الحضور', attPct(n)) + '</div>';
  }

  function attClassHtml(cls) {
    var a = attState(), roll = classRoll(cls), saved = S.attDay[a.day] || {};
    if (!roll.length) return '<div class="card empty">لا يوجد مسجَّلون نهائيًا في هذه الشعبة.</div>';
    var taken = roll.filter(function (x) { return saved[x.id]; }), last = null;
    taken.forEach(function (x) { if (!last || String(saved[x.id].updated_at) > String(last.updated_at)) last = saved[x.id]; });
    var dirty = Object.keys(a.draft).length, future = a.day > todayISO();
    var n = attCounts(roll, function (x) { return attOf(x.id).status; });
    var rows = roll.map(function (x, i) {
      var st = attOf(x.id);
      return '<tr><td>' + (i + 1) + '</td><td class="who"><b>' + esc(x.full_name) + '</b>' + rsvMark(x) + '</td><td><div class="acts">' + Object.keys(ATT).map(function (k) {
          return '<button type="button" class="btn' + (st.status === k ? ' primary' : '') + '" data-attset="' + x.id + '" data-attv="' + k + '"' + (st.status === k ? ' aria-pressed="true"' : ' aria-pressed="false"') +
            (st.status === k && k === 'absent' ? ' style="background:var(--red);border-color:transparent"' : '') + '>' + ATT[k] + '</button>';
        }).join('') + '</div></td>' +
        '<td><input type="text" data-attnote="' + x.id + '" placeholder="ملاحظة (سبب الغياب…)" aria-label="ملاحظة ' + esc(x.full_name) + '" value="' + esc(st.note) + '" style="min-width:180px"></td>' +
        '<td dir="ltr" style="text-align:right;white-space:nowrap">' + esc(plainPhone(x.whatsapp || x.phone) || '—') + '</td></tr>';
    }).join('');
    return attStatsHtml(n, cls) +
      '<div class="card"><div class="toolbar" style="align-items:center"><h2 style="margin:0;flex:1">حضور ' + esc(cls) + ' — ' + dmy(a.day) + '</h2>' +
        '<button type="button" class="btn" data-attall>الكل حاضر</button>' +
        '<button type="button" class="btn primary" data-attsave' + (a.busy || future ? ' disabled' : '') + '>' + (a.busy ? 'جارٍ الحفظ…' : 'حفظ الحضور') + '</button></div>' +
        (attOff(a.day) ? '<p class="formhint" style="margin:0 0 10px">' + dayName(a.day) + ' ' + dmy(a.day) + (attHoliday(a.day) ? ' مسجَّل عطلة' : ' عطلة أسبوعية') + '؛ تأكد من اليوم قبل تسجيل الحضور.</p>' : '') +
        '<p class="hint" style="margin:0 0 10px">' + (future ? 'لا يُسجَّل الحضور ليوم لم يأتِ بعد.' :

  // سجلات فترة مجمّعة: لكل طالب ولكل شعبة، والغياب لكل شعبة في كل يوم
  function attCollect(rows) {
    var per = {}, byClass = {}, cell = {};
    rows.forEach(function (r) {
      var p = per[r.student_id] || (per[r.student_id] = { present: 0, absent: 0, notes: [], days: {} });
      p[r.status]++;
      p.days[r.day] = r.status;
      if (r.note && r.status === 'absent' && p.notes.indexOf(r.note) < 0) p.notes.push(r.note);
      var c = byClass[r.class_name] || (byClass[r.class_name] = { days: {}, n: { present: 0, absent: 0 } });
      c.days[r.day] = 1;
      c.n[r.status]++;
      var key = r.class_name + '|' + r.day, v = cell[key] || (cell[key] = { absent: 0, all: 0 });
      v.all++;
      if (r.status === 'absent') v.absent++;
    });
    return { per: per, byClass: byClass, cell: cell };
  }

      all.present += c.n.present; all.absent += c.n.absent;
      return '<tr><td><button type="button" class="btn link" data-attcls="' + esc(cls) + '">' + esc(cls) + '</button></td><td>' + Object.keys(c.days).length + '</td><td>' + c.n.absent + '</td><td><b>' + attPct(c.n) + '</b></td>' +

  /* ----- كشوف الحضور: Excel و PDF -----
     كشف شهري لكل شعبة بالأسماء وأيام الشهر، وتقارير المدرسة: يومي وأسبوعي (السبت إلى الجمعة) وشهري */

  var ATT_MARK = { present: '✓', absent: 'غـ' };

  // يوم لا دراسة فيه: الجمعة والسبت، وما أُضيف عطلةً
  function attOff(day) {
    var w = new Date(day + 'T00:00').getDay();
    return w === 5 || w === 6 || classConfig().holidays.indexOf(day) > -1;
  }

  function attHoliday(day) { return classConfig().holidays.indexOf(day) > -1; }

  function classTeacher(cls) { var info = classInfo(cls); return info && info.teacher ? info.teacher : ''; }

  async function setHoliday(day, on) {
    var cfg = classConfig(), list = cfg.holidays.filter(function (d) { return d !== day; });
    if (on) list.push(day);
    await saveClassConfig({ rooms: cfg.rooms, list: cfg.list, fees: cfg.fees, holidays: list.sort() });
  }
  var WEEKDAYS = ['أحد', 'إثنين', 'ثلاثاء', 'أربعاء', 'خميس', 'جمعة', 'سبت'];

  function isoOf(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function daysBetween(from, to) {
    var out = [], d = new Date(from + 'T00:00'), end = new Date(to + 'T00:00');
    while (d <= end) { out.push(isoOf(d)); d.setDate(d.getDate() + 1); }
    return out;
  }

  function monthRange(month) {
    var y = Number(month.slice(0, 4)), m = Number(month.slice(5, 7));
    return { from: month + '-01', to: isoOf(new Date(y, m, 0)) };
  }

  // الأسبوع الدراسي الذي فيه اليوم: من السبت إلى الجمعة
  function weekRange(day) {
    var d = new Date(day + 'T00:00');
    d.setDate(d.getDate() - (d.getDay() + 1) % 7);
    var from = isoOf(d);
    d.setDate(d.getDate() + 6);
    return { from: from, to: isoOf(d) };
  }

  async function fetchAttRange(from, to) {
    return attNormRows(await fetchAll(function () { return sb.from('attendance').select('student_id, day, status, note, class_name').gte('day', from).lte('day', to).order('day').order('student_id'); }));
  }

  function xlsxSheet(wb, used, name, aoa, widths) {
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = widths.map(function (w) { return { wch: w }; });
    var base = String(name).replace(/[\[\]:*?\/\\]/g, ' ').trim().slice(0, 28) || 'ورقة', nm = base, k = 2;
    while (used[nm]) nm = base + ' ' + k++;
    used[nm] = true;
    XLSX.utils.book_append_sheet(wb, ws, nm);
  }

  function schoolRange(kind, day) {
    var range = kind === 'day' ? { from: day, to: day } : kind === 'week' ? weekRange(day) : monthRange(day.slice(0, 7));
    range.label = kind === 'day' ? 'تقرير يومي — ' + dayName(day) + ' ' + dmy(day) : kind === 'week' ? 'تقرير أسبوعي — من ' + dmy(range.from) + ' إلى ' + dmy(range.to) : 'تقرير شهري — ' + monthLabel(day.slice(0, 7));
    return range;
  }

  // أسماء غائبي الشعبة في الفترة: في اليوم بلا عدد، وفي الأسبوع والشهر «الاسم (عدد الأيام)» الأكثر أولًا
  function absentNames(cls, per, kind) {
    return classRoll(cls).filter(function (x) { return (per[x.id] || {}).absent > 0; })
      .sort(function (p, q) { return per[q.id].absent - per[p.id].absent || p.full_name.localeCompare(q.full_name, 'ar'); })
      .map(function (x) { return shortName(x) + (kind === 'day' ? '' : ' (' + per[x.id].absent + ')'); });
  }

  // جلب سجلات المطلوب ثم تنفيذ الدالة عليها (للتصدير والطباعة)
  async function withAttRange(range, done) {
    if (!(await syncData(true))) return;
    var rows = await fetchAttRange(range.from, range.to);
    if (!rows) return toast('تعذر جلب سجلات الحضور', true);
    return done(rows);
  }

  function registerMonth() { var a = attState(); return a.expMonth || a.day.slice(0, 7); }
  function registerClasses() {
    var a = attState();
    return (a.cls ? [a.cls] : attClasses()).filter(function (c) { return classRoll(c).length; });
  }

  // كشف الشهر لكل شعبة (Excel): صف لكل طالب، وعمود لكل يوم من أيام الشهر
  function exportAttRegister() {
    var a = attState(), month = registerMonth(), range = monthRange(month);
    return withAttRange(range, async function (rows) {
      try {
        await loadXlsx();
        var d = attCollect(rows), days = daysBetween(range.from, range.to), wb = XLSX.utils.book_new(), used = {}, classes = registerClasses();
        wb.Workbook = { Views: [{ RTL: true }] };
        if (!classes.length) return toast('لا توجد شعب فيها مسجَّلون نهائيًا', true);
        classes.forEach(function (cls) {
          var roll = classRoll(cls), absentPerDay = days.map(function () { return 0; }), recorded = days.map(function (dd) { return !!((d.byClass[cls] || {}).days || {})[dd]; });
          var head = ['م', 'اسم الطالب'].concat(days.map(function (dd) { return Number(dd.slice(8)) + (attOff(dd) ? ' (' + (attHoliday(dd) ? 'عطلة' : WEEKDAYS[new Date(dd + 'T00:00').getDay()]) + ')' : ''); }), ['أيام الحضور', 'أيام الغياب']);
          var body = roll.map(function (x, i) {
            var p = d.per[x.id] || { present: 0, absent: 0, days: {} };
            var cells = days.map(function (dd, j) { var st = p.days[dd]; if (st === 'absent') absentPerDay[j]++; return st ? ATT_MARK[st] : ''; });
            return [i + 1, x.full_name + rsvText(x)].concat(cells, [p.present, p.absent]);
          });
          var foot = ['', 'عدد الغائبين في اليوم'].concat(absentPerDay.map(function (v, j) { return recorded[j] ? v : ''; }));
          xlsxSheet(wb, used, cls, [[schoolName()], ['كشف الحضور والغياب — ' + monthLabel(month)], ['الصف: ' + cls, '', 'مربي الصف: ' + (classTeacher(cls) || ''), '', '', '', '', '', 'عدد الطلاب: ' + roll.length], [], head].concat(body, [foot, [],
            ['', 'المفتاح: ✓ حاضر · غـ غائب · الجمعة والسبت والعطل مذكورة في رأس عمودها · فارغ: لم يُسجَّل حضور الشعبة ذلك اليوم']]),
            [4, 30].concat(days.map(function (dd) { return attOff(dd) ? 9 : 5; }), [10, 10]));
        });
        XLSX.writeFile(wb, ('كشف-الحضور-' + (a.cls || 'كل-الشعب') + '-' + month).replace(/\s+/g, '-') + '.xlsx');
      } catch (err) {
        toast(err.message, true);
      }
    });
  }

  // تقرير المدرسة (Excel): ملخص الشعب مع أسماء الغائبين، والغياب يومًا بيوم، وقائمة الغائبين
  function exportAttSchool(kind) {
    var a = attState(), day = a.expDay || a.day, range = schoolRange(kind, day);
    return withAttRange(range, async function (rows) {
      try {
        await loadXlsx();
        var wb = XLSX.utils.book_new(), used = {}, days = daysBetween(range.from, range.to), d = attCollect(rows);
        wb.Workbook = { Views: [{ RTL: true }] };
        var top = function () { return [[schoolName()], ['الحضور والغياب — ' + range.label], []]; };
        var all = { present: 0, absent: 0 }, classes = attClasses().filter(function (c) { return classRoll(c).length; });
        xlsxSheet(wb, used, 'ملخص الشعب', top().concat([['الشعبة', 'الطلاب', 'أيام التسجيل', kind === 'day' ? 'حاضر' : 'حضور (طالب×يوم)', kind === 'day' ? 'غائب' : 'غياب (طالب×يوم)', 'نسبة الحضور', 'أسماء الغائبين']], classes.map(function (cls) {
          var c = d.byClass[cls];
          if (!c) return [cls, classRoll(cls).length, 0, '', '', 'لم يُسجَّل', ''];
          all.present += c.n.present; all.absent += c.n.absent;
          return [cls, classRoll(cls).length, Object.keys(c.days).length, c.n.present, c.n.absent, attPct(c.n), absentNames(cls, d.per, kind).join('، ')];
        }), [['المدرسة', classes.reduce(function (t, c) { return t + classRoll(c).length; }, 0), '', all.present, all.absent, attPct(all), '']],
          a.dayNote ? [[], ['ملاحظات حول اليوم الدراسي:'], [a.dayNote]] : []), [18, 9, 12, 14, 14, 12, 70]);
        if (kind !== 'day') {
          xlsxSheet(wb, used, 'الغياب حسب اليوم', top().concat([['الشعبة'].concat(days.map(function (dd) { return Number(dd.slice(8)) + ' ' + WEEKDAYS[new Date(dd + 'T00:00').getDay()]; }), ['المجموع'])],
            classes.map(function (cls) {
              var sum = 0;
              return [cls].concat(days.map(function (dd) { var v = d.cell[cls + '|' + dd]; if (v) sum += v.absent; return v ? v.absent : ''; }), [sum]);
            }), [[], ['', 'العدد: الغائبون في الشعبة ذلك اليوم · فارغ: لم يُسجَّل حضور الشعبة']]),
            [18].concat(days.map(function () { return 8; }), [10]));
        }
        var list = S.students.filter(function (x) { return (d.per[x.id] || {}).absent > 0; })
          .sort(function (p, q) { return classRank(p.class_name) - classRank(q.class_name) || d.per[q.id].absent - d.per[p.id].absent || p.full_name.localeCompare(q.full_name, 'ar'); });
        xlsxSheet(wb, used, 'الغائبون', top().concat([['م', 'الطالب', 'الشعبة', 'أيام الغياب', 'ملاحظات', 'ولي الأمر', 'هاتف ولي الأمر', 'واتساب ولي الأمر']], list.map(function (x, i) {
          var p = d.per[x.id];
          return [i + 1, x.full_name, x.class_name || '', p.absent, p.notes.join(' · '), x.guardian_name || '', plainPhone(x.phone), plainPhone(x.whatsapp)];
        })), [5, 32, 14, 10, 30, 26, 16, 16]);
        XLSX.writeFile(wb, ('تقرير-الحضور-' + (kind === 'day' ? 'يومي-' + day : kind === 'week' ? 'أسبوعي-' + range.from : 'شهري-' + day.slice(0, 7))) + '.xlsx');
      } catch (err) {
        toast(err.message, true);
      }
    });
  }

  /* الطباعة (وحفظها PDF من نافذة الطباعة) */
  var pendingAtt = null;

  // teacher: نسخة المعلم: الأسماء وأيام الشهر فقط، خاناتها فارغة للكتابة، بلا أعداد الحضور والغياب
  function printAttRegister(teacher) {
    var month = registerMonth(), range = monthRange(month);
    return withAttRange(range, function (rows) {
      var classes = registerClasses();
      if (!classes.length) return toast('لا توجد شعب فيها مسجَّلون نهائيًا', true);
      pendingAtt = { kind: 'register', month: month, range: range, classes: classes, d: attCollect(rows), teacher: !!teacher };
      printNow();
    });
  }

  function printAttSchool(kind) {
    var a = attState(), day = a.expDay || a.day, range = schoolRange(kind, day);

  // كشف الشهر للشعب: صفحة أفقية لكل شعبة، صف لكل طالب وعمود لكل يوم
  function buildAttRegisterSheet(p) {
    var days = daysBetween(p.range.from, p.range.to), d = p.d;
    printLandscape = true;
    var pages = p.classes.map(function (cls) {
      var roll = classRoll(cls), recorded = {}, absentPerDay = {};
      days.forEach(function (dd) { recorded[dd] = !!((d.byClass[cls] || {}).days || {})[dd]; absentPerDay[dd] = 0; });
      var fri = attOff;
      var body = roll.map(function (x, i) {
        var q = d.per[x.id] || { present: 0, absent: 0, days: {} };
        if (p.teacher) return '<tr class="tc"><td class="c">' + (i + 1) + '</td><td class="nm">' + esc(x.full_name) + rsvMark(x) + '</td>' + days.map(function (dd) {
          return q.days[dd] === 'absent' ? '<td class="c ab">غـ</td>' : '<td class="c' + (fri(dd) ? ' fr' : '') + '"></td>';
        }).join('') + '</tr>';
        return '<tr><td class="c">' + (i + 1) + '</td><td class="nm">' + esc(x.full_name) + rsvMark(x) + '</td>' + days.map(function (dd) {
          var st = q.days[dd];
          if (st === 'absent') absentPerDay[dd]++;
          return '<td class="c' + (fri(dd) ? ' fr' : '') + (st === 'absent' ? ' ab' : '') + '">' + (st ? ATT_MARK[st] : '') + '</td>';
        }).join('') + '<td class="c">' + q.present + '</td><td class="c"><b>' + q.absent + '</b></td></tr>';
      }).join('');
      return '<section class="att-page">' +
        '<div class="att-title"><b>' + esc(schoolName()) + '</b><span>' + (p.teacher ? 'سجل الحضور والغياب (نسخة المعلم)' : 'كشف الحضور والغياب') + ' — ' + monthLabel(p.month) + '</span><span></span></div>' +
        '<div class="att-sub"><span>الصف: <b>' + esc(cls) + '</b></span><span>مربي الصف: <b>' + esc(classTeacher(cls) || '..................................') + '</b></span><span>عدد الطلاب: <b>' + roll.length + '</b></span></div>' +
        '<table class="rz att-reg"><thead><tr><th>م</th><th>اسم الطالب</th>' + days.map(function (dd) { return '<th class="' + (fri(dd) ? 'fr' : '') + '">' + Number(dd.slice(8)) + '</th>'; }).join('') +
          (p.teacher ? '' : '<th class="tot">حضور</th><th class="tot">غياب</th>') + '</tr></thead>' +
        '<tbody>' + body + (p.teacher ? '</tbody></table>' : '<tr class="total"><td colspan="2">عدد الغائبين في اليوم</td>' + days.map(function (dd) { return '<td class="c' + (fri(dd) ? ' fr' : '') + '">' + (recorded[dd] ? absentPerDay[dd] : attHoliday(dd) ? 'ع' : '') + '</td>'; }).join('') + '<td colspan="2"></td></tr></tbody></table>') +
        '<p class="att-key">' + (roll.some(isReserve) ? '* احتياط · ' : '') + (p.teacher ? 'الأعمدة المظلّلة: الجمعة والسبت والعطل' : 'المفتاح: ✓ حاضر · غـ غائب · الأعمدة المظلّلة: الجمعة والسبت والعطل' + (days.some(attHoliday) ? ' (ع: عطلة)' : '') + ' · الخانة الفارغة: لم يُسجَّل حضور الشعبة ذلك اليوم') + ' · تاريخ الإصدار: ' + dmy(todayISO()) + '</p></section>';
    }).join('');
    sheet.className = 'att-regs';
    sheet.removeAttribute('data-fit');
    sheet.style.width = '267mm';
    sheet.innerHTML = pages;
    fitRegisterPages(sheet);
  }

  // يُكبَّر خط كل شعبة في كشف الشهر إلى أكبر حجم تتسع به في صفحة A4 أفقية، دون أن يُقصّ اسم طالب.
  // لا يصغر عن 11pt: الشعبة الكبيرة تمتد على صفحة ثانية ويتكرر رأس الجدول فيها
  function fitRegisterPages(root) {
    var maxH = (REPORT.page.width - 2 * REPORT.page.marginY - 4) * 96 / 25.4;
    Array.prototype.forEach.call(root.querySelectorAll('.att-page'), function (pg) {
      var size = 14, names = pg.querySelectorAll('td.nm, thead th'); // الأسماء وأرقام الأيام لا تُقص ولا تنكسر
      var tooBig = function () {
        if (pg.offsetHeight > maxH) return true;
        for (var i = 0; i < names.length; i++) if (names[i].scrollWidth > names[i].clientWidth + 1) return true;
        return false;
      };
      pg.style.fontSize = size + 'pt';
      while (tooBig() && size > 11) {
        size -= 0.25;
        pg.style.fontSize = size + 'pt';
      }
      // شعبة قليلة العدد: تطول صفوفها لتملأ الصفحة (حتى 12mm للصف) فتتسع خانات الكتابة
      var rows = pg.querySelectorAll('tbody tr:not(.total)'), spare = maxH - pg.offsetHeight;
      if (rows.length && spare > 0) {
        var h = Math.min(rows[0].offsetHeight + spare / rows.length, 12 * 96 / 25.4);
        Array.prototype.forEach.call(rows, function (tr) { tr.firstElementChild.style.height = Math.floor(h) + 'px'; });
      }
    });
  }

  /* ----- روابط المعلمين لتسجيل الغياب، ومفتاح n8n (مدير النظام) -----
     كل معلم له رابط سري (absence.html?t=…) يسجّل منه الغياب بلا حساب، ويُعرف به في بوت الواتساب برقم جواله.
     الجداول من supabase/attendance_links.sql */
  S.attLinks = null;      // null: لم تُجلب بعد
  S.attBotKey = '';
  S.attLinksMissing = false;

  async function loadAttLinks() {
    var r = await sb.from('attendance_tokens').select('*').order('name');
    if (r.error) { S.attLinksMissing = true; S.attLinks = []; render(); return; }
    var k = await sb.from('attendance_settings').select('bot_key').eq('id', 1).maybeSingle();
    S.attLinks = r.data || [];
    S.attBotKey = (k.data && k.data.bot_key) || '';
    render();
  }

  function absenceLink(token) {
    return location.origin + location.pathname.replace(/[^\/]*$/, '') + 'absence.html?t=' + token;
  }

  function attLinksHtml() {
    if (!isAdmin()) return '';
    if (S.attLinks == null) { loadAttLinks(); return '<div class="card no-print"><h2>تسجيل الغياب من المعلمين</h2><div class="empty">جارٍ التحميل…</div></div>'; }
    if (S.attLinksMissing) {
      return '<div class="card no-print"><h2>تسجيل الغياب من المعلمين (رابط وواتساب)</h2><p class="formhint" style="margin:0">لتفعيلها شغّل الملف <code dir="ltr">supabase/attendance_links.sql</code> في محرر SQL ثم حدّث الصفحة.</p></div>';
    }
    var rows = S.attLinks.map(function (t) {
      var link = absenceLink(t.token), wa = plainPhone(t.phone).replace(/^0/, '20');
      return '<tr' + (t.active ? '' : ' style="color:var(--muted)"') + '><td><b>' + esc(t.name) + '</b>' + (t.active ? '' : ' <span class="badge pending">موقوف</span>') + '</td>' +
        '<td dir="ltr" style="text-align:right;white-space:nowrap">' + esc(t.phone || '—') + '</td>' +
        '<td><div class="acts"><button type="button" class="btn" data-alcopy="' + esc(t.token) + '">نسخ الرابط</button>' +
          (wa ? '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/' + esc(wa) + '?text=' + encodeURIComponent('رابط تسجيل الغياب الخاص بك:\n' + link) + '">إرسال واتساب</a>' : '') +
          '<button type="button" class="btn" data-altoggle="' + esc(t.token) + '">' + (t.active ? 'إيقاف' : 'تفعيل') + '</button>' +
          '<button type="button" class="btn danger" data-aldel="' + esc(t.token) + '">حذف</button></div></td></tr>';
    }).join('');
    return '<div class="card no-print"><h2>تسجيل الغياب من المعلمين (رابط وواتساب)</h2>' +
      '<p class="hint">لكل معلم رابط خاص يفتحه من جواله فيختار الشعبة ويلمس أسماء الغائبين، بلا حساب ولا كلمة مرور. ورقم جواله يعرّفه لبوت الواتساب: يرسل «غياب» إلى رقم المدرسة فيسجّل بالأرقام. لا يرى المعلم إلا أسماء طلاب الشعب، ولا يسجّل إلا ليوم اليوم. إيقاف المعلم يوقف رابطه والبوت معًا.</p>' +
      '<div class="toolbar" style="align-items:center">' +
        '<input type="text" id="al-name" placeholder="اسم المعلم" style="flex:1;min-width:160px">' +
        '<input type="text" id="al-phone" placeholder="جوال المعلم (واتساب)" dir="ltr" inputmode="tel" style="width:200px;text-align:right">' +
        '<button type="button" class="btn primary" data-aladd>إضافة معلم</button></div>' +
      (rows ? '<div class="table-wrap"><table class="grid"><thead><tr><th>المعلم</th><th>الجوال</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<div class="empty">لم يُضف معلمون بعد.</div>') +
      '<details style="margin-top:12px"><summary>مفتاح n8n (للرسائل الصباحية وبوت الواتساب)</summary>' +
        '<p class="hint" style="margin:8px 0">يوضع في workflows الـ n8n مكان <code dir="ltr">PUT_BOT_KEY_HERE</code>. من يملكه يستطيع تسجيل الغياب باسم أي معلم مسجَّل هنا، فلا تنشره. إن تسرّب فغيّره ثم حدّثه في n8n.</p>' +
        '<div class="toolbar" style="align-items:center"><code dir="ltr" style="flex:1;overflow-wrap:anywhere">' + esc(S.attBotKey ? S.attBotKey.slice(0, 6) + '…' + S.attBotKey.slice(-4) : '—') + '</code>' +
        '<button type="button" class="btn" data-alkeycopy>نسخ المفتاح</button><button type="button" class="btn danger" data-alkeynew>تغيير المفتاح</button></div></details></div>';
  }

  async function copyText(text, done) {
    try { await navigator.clipboard.writeText(text); toast(done); } catch (err) { prompt('انسخ:', text); }
  }

  app.addEventListener('click', async function (e) {
    if (location.hash !== '#/attendance' || !isAdmin()) return;
    var el, r;
    if (e.target.closest('[data-aladd]')) {
      var name = document.getElementById('al-name').value.replace(/\s+/g, ' ').trim(), phone = latinDigits(document.getElementById('al-phone').value).replace(/[^0-9+]/g, '');
      if (!name) return toast('اكتب اسم المعلم', true);
      if (phone && S.attLinks.some(function (t) { return t.phone && plainPhone(t.phone).slice(-10) === plainPhone(phone).slice(-10); })) return toast('هذا الجوال مسجَّل لمعلم آخر', true);
      r = await sb.from('attendance_tokens').insert({ name: name, phone: phone }).select().single();
      if (r.error) return fail(r.error);
      S.attLinks.push(r.data);
      S.attLinks.sort(function (a, b) { return a.name.localeCompare(b.name, 'ar'); });
      render();
      toast('أُضيف ' + name);
    } else if ((el = e.target.closest('[data-alcopy]'))) {
      copyText(absenceLink(el.getAttribute('data-alcopy')), 'نُسخ الرابط');
    } else if ((el = e.target.closest('[data-altoggle]'))) {
      var t = S.attLinks.filter(function (x) { return x.token === el.getAttribute('data-altoggle'); })[0];
      r = await sb.from('attendance_tokens').update({ active: !t.active }).eq('token', t.token);
      if (r.error) return fail(r.error);
      t.active = !t.active;
      render();
    } else if ((el = e.target.closest('[data-aldel]'))) {
      var d = S.attLinks.filter(function (x) { return x.token === el.getAttribute('data-aldel'); })[0];
      if (!confirm('حذف «' + d.name + '»؟ يتوقف رابطه نهائيًا، وما سجّله من غياب يبقى.')) return;
      r = await sb.from('attendance_tokens').delete().eq('token', d.token);
      if (r.error) return fail(r.error);
      S.attLinks = S.attLinks.filter(function (x) { return x !== d; });
      render();
    } else if (e.target.closest('[data-alkeycopy]')) {
      copyText(S.attBotKey, 'نُسخ المفتاح');
    } else if (e.target.closest('[data-alkeynew]')) {
      if (!confirm('تغيير مفتاح n8n؟ تتوقف الرسائل الصباحية والبوت حتى تضع المفتاح الجديد في n8n.')) return;
      var bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      var key = Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      r = await sb.from('attendance_settings').update({ bot_key: key }).eq('id', 1);
      if (r.error) return fail(r.error);
      S.attBotKey = key;
      render();
      toast('تغيّر المفتاح — ضعه في n8n');
    }
  });

  async function saveAttendance() {
    var a = attState(), roll = classRoll(a.cls), who = (S.profile && S.profile.full_name) || displayName(S.email), now = new Date().toISOString();
    if (!roll.length || a.day > todayISO()) return;
    var rows = roll.map(function (x) {
      var st = attOf(x.id);
      return { student_id: x.id, day: a.day, status: st.status, note: st.note.trim(), class_name: a.cls, recorded_by: who, updated_at: now };
    });
    a.busy = true;
    render();
    var r = await sb.from('attendance').upsert(rows, { onConflict: 'student_id,day' });
    a.busy = false;
    if (r.error) { render(); return fail(r.error); }
    var map = S.attDay[a.day] || (S.attDay[a.day] = {});
    rows.forEach(function (row) { map[row.student_id] = row; });

  /* ---------- التقارير: كشف وإحصائية حسب المتغيرات ----------
     يختار المستخدم من يشملهم التقرير، وشروطًا على أي حقل (الصف، الجنس، لديه كتب…)، ومتغيرًا أو اثنين للإحصائية،
     وأعمدة الكشف. يُطبع (PDF) ويُصدَّر (Excel) بما يظهر على الشاشة */

  var REP_SCOPES = { enrolled: 'المسجَّلون (نهائي واحتياط)', final: 'التسجيل النهائي', reserve: 'الاحتياط', pending: 'التسجيل المبدئي', all: 'كل الطلاب', bus: 'المضافون إلى باص' };

  // متغيرات دفع المواصلات تُحسب لشهر المواصلات المختار (ui.tMonth، المشترك مع شاشة المواصلات)
  var REP_TPAY = ['_tpay', '_tdue', '_tpaid', '_tleft', '_treceipt', '_tpaidon', '_tmethod', '_tref'];

  // وسيلة دفع الإيصال ورقم الدفع (للإلكتروني)، أو تحديد «أخرى»
  function repPayMethod(rec) { return PAY_METHODS[rec.method] ? rec.method : 'cash'; }
  function repPayRef(rec) { var k = repPayMethod(rec); return k === 'cash' ? '' : String(rec.method_note || '').trim(); }

  // تفصيل الدفعات حسب الرقم المحوَّل إليه («رقم الدفع» في الإيصال: محفظة/حساب الأكاديمية): لكل وسيلة ورقم عدد الدفعات ومجموعها وأسماء الطلاب، ثم مجموع كل وسيلة والمجموع الكلي.
  // يعيد صفوفًا (أولها العناوين) أو [] إن لم يكن في التقرير دفعات
  function repRefAoa(res) {
    if (!repUsesTpay()) return [];
    var groups = {}, byMethod = {}, total = 0, count = 0;
    res.list.forEach(function (x) {
      var t = repTpayOf(x);
      if (!t || !(t.paid > 0)) return;
      var k = repPayMethod(t.rec), ref = repPayRef(t.rec), key = k + '\u0001' + ref;
      var g = groups[key] || (groups[key] = { k: k, ref: ref, n: 0, sum: 0, names: [] });
      // الاسم الأول والعائلة: يكفي للتعرف ويُبقي الجدول قصيرًا
      var nm = splitFamily(x.full_name);
      g.n++; g.sum += t.paid; g.names.push(nm.family ? (nameParts(x.full_name)[0] || '') + ' ' + nm.family : x.full_name);
      byMethod[k] = byMethod[k] || { n: 0, sum: 0 };
      byMethod[k].n++; byMethod[k].sum += t.paid;
      total += t.paid; count++;
    });
    if (!count) return [];
    var order = Object.keys(PAY_METHODS);
    var rows = Object.keys(groups).map(function (key) { return groups[key]; }).sort(function (a, b) {
      return order.indexOf(a.k) - order.indexOf(b.k) || b.sum - a.sum || a.ref.localeCompare(b.ref);
    }).map(function (g) {
      var refText = g.k === 'cash' ? '—' : g.ref || (hasPayRef(g.k) ? '(بلا رقم)' : '—');
      return [PAY_METHODS[g.k], refText, g.n, plainNum(g.sum), g.names.join('، ')];
    });
    return [['وسيلة الدفع', 'الرقم المحوَّل إليه', 'عدد الدفعات', 'المجموع (ج.م)', 'الطلاب']].concat(rows, [['المجموع الكلي', '', count, plainNum(total), '']]);
  }

  // مجموع الدفعات حسب وسيلة الدفع: نقدًا، إنستاباي، فودافون كاش، أخرى (كلها تظهر ولو صفرًا) ثم المجموع
  function repMethodAoa(res) {
    if (!repUsesTpay()) return [];
    var by = {}, total = 0, count = 0;
    Object.keys(PAY_METHODS).forEach(function (k) { by[k] = { n: 0, sum: 0 }; });
    res.list.forEach(function (x) {
      var t = repTpayOf(x);
      if (!t || !(t.paid > 0)) return;
      var k = repPayMethod(t.rec);
      by[k].n++; by[k].sum += t.paid; total += t.paid; count++;
    });
    if (!count) return [];
    return [['وسيلة الدفع', 'عدد الدفعات', 'المجموع (ج.م)', 'النسبة']].concat(Object.keys(PAY_METHODS).map(function (k) {
      return [PAY_METHODS[k], by[k].n, plainNum(by[k].sum), repPct(by[k].sum, total)];
    }), [['المجموع', count, plainNum(total), '100%']]);
  }

  // جدول بسيط: الصف الأخير مجموع، والأعمدة بعد الأول أرقام في سطر واحد (forPrint: بتنسيق الورقة المطبوعة)
  function repSimpleTable(aoa, forPrint) {
    var nw = ' style="white-space:nowrap"', last = aoa.length - 1;
    return '<table class="' + (forPrint ? 'rz' : 'grid') + '"><thead><tr>' + aoa[0].map(function (h) { return '<th' + nw + '>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      aoa.slice(1).map(function (row, i) {
        return '<tr' + (i + 1 === last ? (forPrint ? ' class="total"' : ' style="font-weight:700"') : '') + '>' + row.map(function (v, j) { return '<td' + (j && forPrint ? ' class="c"' : '') + nw + '>' + esc(v) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table>';
  }
  var TPAY_ORDER = ['دفع', 'دفع جزئيًا', 'لم يدفع', 'معفى'];

  function repUsesTpay() {
    var r = repState(), used = [r.g1, r.g2].concat(r.cols, r.filters.map(function (f) { return f.k; }));
    return r.scope === 'bus' || used.some(function (k) { return REP_TPAY.indexOf(k) > -1; });
  }

  // حالة دفع طالب في باص عن شهر المواصلات: { state, due, paid, rec } أو null لغير المضاف إلى باص
  function repTpayOf(x) {
    var m = memberOf(x.id);
    if (!m || !findGroup(m.group_id)) return null;
    var rec = (S.tPay[ui.tMonth] || {})[x.id] || {}, paid = rec.amount || 0;
    if (exemptIn(m, ui.tMonth)) return { state: 'معفى', due: 0, paid: paid, rec: rec };
    var due = shareOf(m);
    return { state: paid > 0 && paid >= due ? 'دفع' : paid > 0 ? 'دفع جزئيًا' : 'لم يدفع', due: due, paid: paid, rec: rec };
  }

  function repState() {
    if (!ui.rep) ui.rep = { scope: 'enrolled', filters: [], g1: 'class_name', g2: 'gender', cols: ['full_name', 'national_id', 'class_name', 'gender'], title: '' };
    return ui.rep;
  }

  // كل المتغيرات: حقول ملف الطالب ومعها حقول محسوبة (الحالة، المواصلات، الباص، العمر)
  function repFields() {
    var groupOf = transportGroupOf(), start = schoolYearStart();
    var fmt = function (v, f) {
      if (v == null || v === '') return '';
      if (f && f.type === 'date') return dmy(v);
      if (v === true) return 'نعم';
      if (v === false) return 'لا';
      if (Array.isArray(v)) return v.join('، ');
      return String(v).trim();
    };
    var out = [
      { k: '_status', label: 'حالة التسجيل', cat: true, get: function (x) { return ST_STATUS[stStatus(x)]; } },
      { k: '_ride', label: 'المواصلات', cat: true, get: function (x) { return groupOf[x.id] || x.wants_transport === true ? 'يحتاج' : x.wants_transport === false ? 'لا يحتاج' : 'لم يُحدَّد'; } },
      { k: '_bus', label: 'الباص', cat: true, get: function (x) { var g = findGroup(groupOf[x.id]); return g ? g.assembly_point : ''; } },
      { k: '_tpay', label: 'دفع المواصلات', cat: true, order: TPAY_ORDER, get: function (x) { var t = repTpayOf(x); return t ? t.state : ''; } },
      { k: '_tdue', label: 'المطلوب', get: function (x) { var t = repTpayOf(x); return t ? (t.state === 'معفى' ? '—' : plainNum(t.due)) : ''; } },
      { k: '_tpaid', label: 'المدفوع', get: function (x) { var t = repTpayOf(x); return t ? plainNum(t.paid) : ''; } },
      { k: '_tleft', label: 'المتبقي', get: function (x) { var t = repTpayOf(x); return t ? (t.state === 'معفى' ? '—' : plainNum(Math.max(0, t.due - t.paid))) : ''; } },
      { k: '_treceipt', label: 'رقم الإيصال', get: function (x) { var t = repTpayOf(x); return t && t.paid > 0 && t.rec.receipt_no != null ? String(t.rec.receipt_no) : ''; } },
      { k: '_tpaidon', label: 'تاريخ الدفع', get: function (x) { var t = repTpayOf(x); return t && t.paid > 0 && t.rec.paid_on ? dmy(t.rec.paid_on) : ''; } },
      { k: '_tmethod', label: 'وسيلة الدفع', cat: true, get: function (x) { var t = repTpayOf(x); return t && t.paid > 0 ? PAY_METHODS[repPayMethod(t.rec)] : ''; } },
      { k: '_tref', label: 'الرقم المحوَّل إليه', get: function (x) { var t = repTpayOf(x); return t && t.paid > 0 ? repPayRef(t.rec) : ''; } },
      { k: '_age', label: 'العمر عند بداية العام', cat: true, get: function (x) {
        if (!x.birth_date) return '';
        var a = Math.floor((start - new Date(String(x.birth_date).slice(0, 10) + 'T00:00')) / (365.25 * 864e5));
        return a >= 0 && a < 40 ? a + ' سنوات' : '';
      } }
    ];
    ST_FIELDS.forEach(function (f) {
      out.push({ k: f.k, label: f.p || f.label, f: f, cat: !!(f.options || f.list || f.type === 'select' || f.type === 'class'), get: function (x) { return fmt(stVal(x, f.k), f); } });
    });
    return out;
  }

  function repField(k, fields) { for (var i = 0; i < fields.length; i++) if (fields[i].k === k) return fields[i]; return null; }

  function repScoped() {
    var r = repState();
    return S.students.filter(function (x) {
      var st = stStatus(x);
      if (r.scope === 'bus') {
        // كما في كشف الباص: المسجَّل (نهائي أو احتياط) المضاف إلى باص، ما لم يُوقَف اشتراكه قبل الشهر
        var m = memberOf(x.id);
        return !!m && !!findGroup(m.group_id) && enrolled(x) && (owesThisMonth(m) || subscribedIn(m, ui.tMonth));
      }
      return r.scope === 'all' || (r.scope === 'enrolled' ? enrolled(x) : st === r.scope);
    });
  }

  // القيم الموجودة لحقل بين الطلاب، مرتبة (الشعب بترتيب الصفوف)
  function repValues(fd, list) {
    var seen = {};
    list.forEach(function (x) { var v = fd.get(x); seen[v] = (seen[v] || 0) + 1; });
    var vals = Object.keys(seen);
    if (fd.k === 'class_name') vals.sort(function (a, b) { return classRank(a) - classRank(b) || a.localeCompare(b, 'ar'); });
    else if (fd.f && fd.f.options) vals.sort(function (a, b) { var i = fd.f.options.indexOf(a), j = fd.f.options.indexOf(b); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j) || a.localeCompare(b, 'ar'); });
    else if (fd.order) vals.sort(function (a, b) { return (fd.order.indexOf(a) + 1 || 99) - (fd.order.indexOf(b) + 1 || 99); });
    else if (fd.k === '_age') vals.sort(function (a, b) { return (parseInt(a, 10) || 999) - (parseInt(b, 10) || 999); });
    else vals.sort(function (a, b) { return seen[b] - seen[a] || a.localeCompare(b, 'ar'); });
    // الفارغ آخرًا
    var e = vals.indexOf('');
    if (e > -1) { vals.splice(e, 1); vals.push(''); }
    return vals;
  }

  // المتغيرات الصالحة للتصفية والإحصائية: ذات خيارات، أو قيمها المختلفة قليلة
  function repCatFields(fields, list) {
    return fields.filter(function (fd) {
      if (fd.cat) return true;
      var seen = {}, n = 0;
      for (var i = 0; i < list.length && n <= 25; i++) { var v = fd.get(list[i]); if (!seen[v]) { seen[v] = 1; n++; } }
      return n > 1 && n <= 25;
    });
  }

  function repResult() {
    var r = repState(), fields = repFields(), list = repScoped();
    r.filters.forEach(function (fl) {
      var fd = repField(fl.k, fields);
      if (fd && fl.v != null) list = list.filter(function (x) { return fd.get(x) === fl.v; });
    });
    list = list.slice().sort(function (a, b) { return classRank(a.class_name) - classRank(b.class_name) || String(a.class_name || '').localeCompare(String(b.class_name || ''), 'ar') || a.full_name.localeCompare(b.full_name, 'ar'); });
    var g1 = repField(r.g1, fields), g2 = r.g2 && r.g2 !== r.g1 ? repField(r.g2, fields) : null;
    var stats = null;
    if (g1) {
      var rows = repValues(g1, list), cols = g2 ? repValues(g2, list) : [], cell = {}, rowT = {}, colT = {};
      list.forEach(function (x) {
        var a = g1.get(x), b = g2 ? g2.get(x) : '';
        cell[a + '\u0001' + b] = (cell[a + '\u0001' + b] || 0) + 1;
        rowT[a] = (rowT[a] || 0) + 1;
        colT[b] = (colT[b] || 0) + 1;
      });
      stats = { g1: g1, g2: g2, rows: rows, cols: cols, cell: cell, rowT: rowT, colT: colT };
    }
    return { fields: fields, list: list, stats: stats };
  }

  function repDesc(res) {
    var r = repState(), parts = [['يشمل', REP_SCOPES[r.scope]]];
    if (repUsesTpay()) parts.push(['شهر المواصلات', monthLabel(ui.tMonth)]);
    r.filters.forEach(function (fl) {
      var fd = repField(fl.k, res.fields);
      if (fd && fl.v != null) parts.push([fd.label, fl.v === '' ? '(فارغ)' : fl.v]);
    });
    return parts;
  }

  // أعمدة أرقام لا تنقسم على سطرين
  function repNoWrap(k) {
    return ['national_id', 'guardian_id', 'phone', 'alt_phone', 'whatsapp', 'student_phone', 'birth_date', '_age', '_tdue', '_tpaid', '_tleft', '_treceipt', '_tpaidon', '_tmethod', '_tref'].indexOf(k) > -1;
  }

  function repStatHeadNw(h) { return h === 'العدد' || h === 'المجموع' || h === 'النسبة'; }

  function repPct(n, total) { return total ? Math.round(n / total * 1000) / 10 + '%' : '—'; }

  // جدول الإحصائية: صفوف المتغير الأول، وأعمدة الثاني (أو العدد والنسبة)
  function repStatsAoa(res) {
    var s = res.stats, total = res.list.length, show = function (v) { return v === '' ? '(فارغ)' : v; };
    if (!s) return [];
    if (!s.g2) {
      return [[s.g1.label, 'العدد', 'النسبة']].concat(s.rows.map(function (v) { return [show(v), s.rowT[v] || 0, repPct(s.rowT[v] || 0, total)]; }), [['المجموع', total, total ? '100%' : '']]);
    }
    return [[s.g1.label + ' × ' + s.g2.label].concat(s.cols.map(show), ['المجموع', 'النسبة'])].concat(s.rows.map(function (v) {
      return [show(v)].concat(s.cols.map(function (c) { return s.cell[v + '\u0001' + c] || 0; }), [s.rowT[v] || 0, repPct(s.rowT[v] || 0, total)]);
    }), [['المجموع'].concat(s.cols.map(function (c) { return s.colT[c] || 0; }), [total, total ? '100%' : ''])]);
  }

  function renderReports() {
    if (!ui.tMonth) ui.tMonth = thisMonth();
    // دفعات شهر المواصلات تُجلب أولًا إن كان التقرير يستعملها
    if (repUsesTpay() && !S.tPay[ui.tMonth]) {
      app.innerHTML = tabs('reports') + '<div class="card empty">جارٍ تحميل دفعات المواصلات…</div>';
      loadPayments(ui.tMonth);
      return;

    } else if (act === 'auth-mode') {
      ui.authMode = ui.authMode === 'login' ? 'signup' : 'login';
      ui.authErr = ''; ui.authMsg = '';
      render();
    } else if (act === 'reload') {
      loadAll();
    } else if (act === 'print') {
      printNow();
    } else if (act === 'back') {
      await flush();
      go('#/teachers');
    } else if (!t) {
      return;
    } else if (act === 'submit') {
      var left = CRITERIA.length - ratedCount(t);
      if (left > 0) {
        ui.error = 'يجب تقييم جميع البنود قبل الإرسال للاعتماد (متبقٍ ' + left + ').';
        render();
        var first = app.querySelector('tr.missing');
        if (first) first.scrollIntoView({ block: 'center' });
        return;
      }
      setStatus(t, 'review');
    } else if (act === 'approve') {
      setStatus(t, 'approved');
    } else if (act === 'return') {
      setStatus(t, 'edit');
    } else if (act === 'publish') {
      if (confirm('هل تريد نشر تقييم «' + t.name + '»؟')) setStatus(t, 'published');
    } else if (act === 'reopen') {
      if (confirm('سيتم إلغاء النشر والاعتماد وإعادة التقييم إلى مرحلة التحرير. هل تريد المتابعة؟')) setStatus(t, 'edit');
    } else if (act === 'delete') {
      if (!confirm('هل تريد حذف «' + t.name + '» وتقييمه نهائيًا؟')) return;
      clearTimeout(saveTimer); saveTimer = null;
      var d = await sb.from('teachers').delete().eq('id', t.id);
      if (d.error) return fail(d.error);
      S.teachers = S.teachers.filter(function (x) { return x.id !== t.id; });
      go('#/teachers');
    }
  });

  app.addEventListener('change', async function (e) {
    var el = e.target, r;

    if (el.hasAttribute('data-setting') && isAdmin()) {
      var patch = {};
      patch[el.getAttribute('data-setting')] = el.checked;
      r = await sb.from('settings').update(patch).eq('id', 1);
      if (r.error) { el.checked = !el.checked; return fail(r.error); }
      Object.assign(S.settings || (S.settings = {}), patch);
      toast('تم الحفظ');
    } else if (el.hasAttribute('data-settingtext') && isAdmin()) {
      var tp = {};
      tp[el.getAttribute('data-settingtext')] = el.value.trim();
      r = await sb.from('settings').update(tp).eq('id', 1);
      if (r.error) return fail(r.error);
      Object.assign(S.settings || (S.settings = {}), tp);
      toast('تم الحفظ');
    } else if (el.hasAttribute('data-visible') && isAdmin()) {
      var vt = find(el.getAttribute('data-visible'));
      r = await sb.from('teachers').update({ visible: el.checked }).eq('id', vt.id);
      if (r.error) { el.checked = !el.checked; return fail(r.error); }
      vt.visible = el.checked;
      toast('تم الحفظ');
    } else if (el.hasAttribute('data-role') && isAdmin()) {
      var u = null, uidAttr = el.getAttribute('data-role');
      S.users.forEach(function (x) { if (x.id === uidAttr) u = x; });
      r = await sb.from('profiles').update({ role: el.value }).eq('id', u.id);
      if (r.error) { el.value = u.role; return fail(r.error); }
      u.role = el.value;
      toast('تم الحفظ');
    } else if (el.type === 'radio') {
      var t = currentTeacher();
      if (!t) return;
      t.ratings[Number(el.name.slice(1))] = Number(el.value);
      if (t.status === 'new') t.status = 'edit';
      queueSave(t);
      var done = ratedCount(t);
      document.getElementById('progress-text').textContent = 'تم تقييم ' + done + ' من ' + CRITERIA.length + ' بندًا';
      document.getElementById('progress-bar').style.width = (done / CRITERIA.length * 100) + '%';
      var row = el.closest('tr');
      if (row) row.classList.remove('missing');
    }
  });

  app.addEventListener('input', function (e) {
    var t = currentTeacher();
    if (e.target.id === 'search') {
      ui.search = e.target.value;
      render();
      var s = document.getElementById('search');
      s.focus();
      s.setSelectionRange(s.value.length, s.value.length);
    } else if (t && e.target.id === 'notes') {
      t.notes = e.target.value;
      if (t.status === 'new') t.status = 'edit';
      queueSave(t);
    } else if (t && e.target.id === 'approver-notes') {
      t.approver_notes = e.target.value;
      queueSave(t);
    }
  });

  app.addEventListener('submit', async function (e) {
    e.preventDefault();

    if (e.target.id === 'teacher-form') {
      saveTeacherForm();
    } else if (e.target.id === 'student-form') {
      saveStudentForm(e.submitter ? e.submitter.getAttribute('data-mode') : 'save');
    } else if (e.target.id === 'room-form' && isAdmin()) {
      addRoomClass();
    } else if (e.target.id === 'group-form') {
      saveGroupForm();
    } else if (e.target.id === 'user-form' && isAdmin()) {
      var nu = function (id) { return document.getElementById(id).value.trim(); };
      // دالة إنشاء الحساب لا تقبل «مدير»: يُنشأ مشاهدًا ثم تُرفع صلاحيته
      var wantRole = nu('nu-role');
      var made = await sb.rpc('create_user_account', { p_name: nu('nu-name'), p_login: toEmail(nu('nu-login')), p_password: document.getElementById('nu-pw').value, p_role: wantRole === 'manager' ? 'viewer' : wantRole });
      if (made.error) return accountRpcFail(made.error);
      if (wantRole === 'manager') {
        var mr = await sb.from('profiles').update({ role: 'manager' }).eq('id', made.data);
        if (mr.error) toast('أُنشئ الحساب مشاهدًا؛ شغّل supabase/manager.sql ثم غيّر صلاحيته', true);
      }
      var list = await sb.from('profiles').select('*').order('created_at');
      if (!list.error) S.users = list.data || [];
      render();
      toast('أُنشئ الحساب — سلّم صاحبه اسم المستخدم وكلمة المرور المؤقتة');
    } else if (e.target.id === 'defaultpw-form') {
      var pw = document.getElementById('default-pw').value;
      if (pw.length < 6) return toast('كلمة المرور الافتراضية يجب ألا تقل عن 6 أحرف.', true);
      var up = await sb.from('private_settings').update({ default_password: pw }).eq('id', 1);
      if (up.error) return fail(up.error);
      S.defaultPw = pw;
      toast('تم الحفظ');
    } else if (e.target.id === 'pw-form') {
      var p1 = document.getElementById('pw-new').value, p2 = document.getElementById('pw-again').value;
      ui.authErr = p1.length < 6 ? 'كلمة المرور يجب ألا تقل عن 6 أحرف.' : p1 !== p2 ? 'كلمتا المرور غير متطابقتين.' : '';
      if (ui.authErr) return render();
      var ch = await sb.auth.updateUser({ password: p1 });
      if (ch.error) { ui.authErr = 'تعذر تغيير كلمة المرور: ' + ch.error.message; return render(); }
      var done = await sb.rpc('finish_password_change');
      if (done.error) return fail(done.error);
      S.profile.must_change_password = false;
      render();
      toast('تم تغيير كلمة المرور');
    } else if (e.target.id === 'auth-form') {
      var email = document.getElementById('au-email').value.trim();
      var pass = document.getElementById('au-pass').value;
      var signup = ui.authMode === 'signup';
      if (!signup && email.indexOf('@') < 0) email = email.toLowerCase() + USER_SUFFIX;
      var fullName = signup ? document.getElementById('au-name').value.trim() : '';
      ui.busy = true; ui.authErr = ''; ui.authMsg = '';
      render();
      var res = signup
        ? await sb.auth.signUp({
            email: email, password: pass,
            options: { data: { full_name: fullName }, emailRedirectTo: location.origin + location.pathname }
          })
        : await sb.auth.signInWithPassword({ email: email, password: pass });
      ui.busy = false;
      if (res.error) {
        ui.authErr = signup ? 'تعذر إنشاء الحساب: ' + res.error.message : 'بيانات الدخول غير صحيحة.';
      } else if (signup && !res.data.session) {
        ui.authMode = 'login';
        ui.authMsg = 'تم إنشاء الحساب. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.';
      }
      if (!S.uid) render();
    }
  });

  /* ---------- تقرير الزيارة الإشرافية ---------- */

  function findVisit(id) {
    for (var i = 0; i < S.visits.length; i++) if (S.visits[i].id === id) return S.visits[i];
    return null;
  }

  function currentVisit() {
    if (!S.ready || !isStaff()) return null;
    var m = location.hash.match(/^#\/v\/(.+)$/);
    return m ? findVisit(m[1]) : null;
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function dayName(iso) {
    return iso ? new Date(iso + 'T00:00').toLocaleDateString('ar-u-nu-latn', { weekday: 'long' }) : '';
  }

  // مفاتيح الحقول: d0..d6 لنقاط القوة في كل مجال، ثم development و recommendations
  function getField(v, key) {
    return (key.charAt(0) === 'd' && key.length === 2 ? v.strengths[key.slice(1)] : v[key]) || '';
  }

  function setField(v, key, val) {
    if (key.charAt(0) === 'd' && key.length === 2) v.strengths[key.slice(1)] = val; else v[key] = val;
  }

  function lines(text) {
    return text.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
  }

  function chipsHtml(v, key) {
    var have = lines(getField(v, key));
    var builtin = key.charAt(0) === 'd' && key.length === 2 ? DOMAINS[Number(key.slice(1))].bank : BANK[key];
    var chip = function (text) {
      var on = have.indexOf(text) > -1;
      return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-chip="' + key + '" data-text="' + esc(text) +
        '" aria-pressed="' + on + '">' + esc(text) + '</button>';
    };
    var custom = S.statements.filter(function (x) { return x.field === key; }).map(function (x) {
      return '<span class="chip-wrap">' + chip(x.body) +
        '<button type="button" class="chip-del" data-delstmt="' + x.id + '" data-key="' + key + '" title="حذف العبارة من القائمة" aria-label="حذف العبارة من القائمة">×</button></span>';
    }).join('');
    return '<div class="chips">' + builtin.map(chip).join('') + custom + '</div>' +
      '<div class="addstmt"><input type="text" data-newstmt="' + key + '" placeholder="اكتب عبارة جديدة لإضافتها إلى القائمة" aria-label="عبارة جديدة">' +
      '<button type="button" class="btn" data-addstmt="' + key + '">إضافة</button></div>';
  }

  function fieldBlock(v, key, label) {
    return '<label class="field" for="f-' + key + '">' + label + '</label>' +
      '<textarea id="f-' + key + '" data-vfield="' + key + '" placeholder="اختر من العبارات المقترحة أو اكتب مباشرة">' + esc(getField(v, key)) + '</textarea>' +
      '<details class="bank"><summary>عبارات مقترحة</summary><div id="chips-' + key + '">' + chipsHtml(v, key) + '</div></details>';
  }

  function refreshChips(v, key) {
    var box = document.getElementById('chips-' + key);
    if (box) box.innerHTML = chipsHtml(v, key);
  }

  function renderVisits() {
    if (S.visitsMissing) {
      app.innerHTML = tabs('visits') + '<div class="card empty">لم تُجهَّز قاعدة البيانات لتقارير الزيارات بعد.<br>' +
        'شغّل الملف <code dir="ltr">supabase/visits.sql</code> في محرر SQL ثم حدّث الصفحة.</div>';
      return;
    }
    var options = evalTeachers().map(function (t) {
      return '<option value="' + t.id + '">' + esc(t.name) + (t.subject ? ' — ' + esc(t.subject) : '') + '</option>';
    }).join('');

    var rows = S.visits.map(function (v) {
      var t = find(v.teacher_id);
      return '<button type="button" class="card visit-row" data-openv="' + v.id + '">' +
        '<span><span class="name">' + esc(t ? t.name : '—') + '</span><br>' +
        '<span class="meta">' + esc(v.lesson_title || 'بدون عنوان درس') + ' · ' + esc(v.subject || '—') + '</span></span>' +
        '<span class="meta" style="text-align:end">' + fmtDate(v.visit_date + 'T00:00') + '<br>الزيارة رقم ' + v.visit_number + '</span></button>';
    }).join('');

    app.innerHTML = tabs('visits') +
      (S.teachers.length
        ? '<div class="toolbar"><select id="visit-teacher" aria-label="المعلم" style="flex:1;min-width:180px">' + options + '</select>' +
          '<button type="button" class="btn primary" data-newvisit>+ تقرير زيارة جديد</button></div>'
        : '') +
      (rows || '<div class="card empty">' + (S.teachers.length ? 'لا توجد تقارير زيارات بعد.' : 'أضف معلمًا أولًا من تبويب «المعلمون».') + '</div>');
  }

    var basic = function (label, inner) { return '<div><label class="field">' + label + '</label>' + inner + '</div>'; };
    // صفوف المعلم إن حُدِّدت له، وإلا كل صفوف المدرسة
