# Deploys the Supabase Edge Functions that read scanned registration forms (read-registration-form) and
# photographed staff attendance sheets (read-staff-sheet), and hands them the DeepInfra API key,
# so the key is never typed into the Supabase dashboard or the website.
#
# Repository secrets used (Settings → Secrets and variables → Actions):
#   DEEPINFRA_API_KEY      - the DeepInfra key the function calls the model with
#   SUPABASE_ACCESS_TOKEN  - a Supabase personal access token (supabase.com/dashboard/account/tokens)
#
# Runs when the function's code changes, or by hand from the Actions tab ("Run workflow").
# Until SUPABASE_ACCESS_TOKEN is added it does nothing and says so.
name: Deploy Supabase functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/functions/read-registration-form/**
      - supabase/functions/read-staff-sheet/**
      - .github/workflows/deploy-functions.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      PROJECT_REF: wvklhyjtzqomiyhzsfuf
    steps:
      - uses: actions/checkout@v4

      - name: Check that the secrets are present
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$DEEPINFRA_API_KEY" ]; then
            echo "::warning::Nothing was deployed: add the repository secrets SUPABASE_ACCESS_TOKEN and DEEPINFRA_API_KEY, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Give the function its DeepInfra key
        if: steps.check.outputs.ready == 'true'
        run: supabase secrets set DEEPINFRA_API_KEY="$DEEPINFRA_API_KEY" --project-ref "$PROJECT_REF"

      - name: Deploy the function
        if: steps.check.outputs.ready == 'true'
        run: |
          supabase functions deploy read-registration-form --project-ref "$PROJECT_REF"
          supabase functions deploy read-staff-sheet --project-ref "$PROJECT_REF"

      - name: Confirm the functions are reachable
        if: steps.check.outputs.ready == 'true'
        run: |
          for fn in read-registration-form read-staff-sheet; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "https://$PROJECT_REF.supabase.co/functions/v1/$fn")
            echo "$fn answered with HTTP $code"
            if [ "$code" = "404" ]; then
              echo "::error::$fn was not found after deploying."
              exit 1
            fi
          done
