# Deploys the Supabase Edge Function that reads scanned registration forms, and hands it the
# DeepInfra API key, so the key is never typed into the Supabase dashboard or the website.
#
# Repository secrets used (Settings → Secrets and variables → Actions):
#   DEEPINFRA_API_KEY      - the DeepInfra key the function calls the model with
#   SUPABASE_ACCESS_TOKEN  - a Supabase personal access token (supabase.com/dashboard/account/tokens)
#
# Runs when the function's code changes, or by hand from the Actions tab ("Run workflow").
# Until SUPABASE_ACCESS_TOKEN is added it does nothing and says so.
name: Deploy Supabase functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - supabase/functions/read-registration-form/**
      - .github/workflows/deploy-functions.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
      PROJECT_REF: wvklhyjtzqomiyhzsfuf
    steps:
      - uses: actions/checkout@v4

      - name: Check that the secrets are present
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$DEEPINFRA_API_KEY" ]; then
            echo "::warning::Nothing was deployed: add the repository secrets SUPABASE_ACCESS_TOKEN and DEEPINFRA_API_KEY, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ready == 'true'
        with:
          version: latest

      - name: Give the function its DeepInfra key
        if: steps.check.outputs.ready == 'true'
        run: supabase secrets set DEEPINFRA_API_KEY="$DEEPINFRA_API_KEY" --project-ref "$PROJECT_REF"

      - name: Deploy the function
        if: steps.check.outputs.ready == 'true'
        run: supabase functions deploy read-registration-form --project-ref "$PROJECT_REF"
